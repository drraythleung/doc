<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Insurance Network Referral Forms</title>

  <style>
    /* =========================================================
       目錄
       ---------------------------------------------------------
       01. 全域設定
       02. 操作介面
       03. 共用檢查輸入
       04. A4 紙張及共用表格元件
       05. HSBC H01 / Bupa B04
       06. DA01 主表
       07. DA01 中心列表
       08. 檢查附加頁
       09. AIA HSNM5F01：見下方說明
       10. Blue Cross N4
       11. AIA Prior Auth
       12. 響應式介面及列印

       保留原稿的 mm / pt 尺寸。
       中心資料及表格文字沿用提供版本，不代表現行資料核實。
       ========================================================= */


    /* =========================================================
       01. 全域設定
       ========================================================= */

    :root {
      --navy: #183448;
      --teal: #087f8c;
      --font-ui: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e8edf2;
      color: #172f40;
      font-family: var(--font-ui);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      padding: 9px 13px;
      border: 1px solid #ccd6de;
      border-radius: 7px;
      background: #fff;
      color: #243c4c;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #68bfd5;
      outline-offset: 2px;
    }

    button.primary {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    button.danger {
      color: #ae3847;
    }

    .form-group[hidden],
    .plan-panel[hidden] {
      display: none !important;
    }


    /* =========================================================
       02. 操作介面
       ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 22px;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 2px 10px #122a4026;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 73px;
      max-height: calc(100vh - 73px);
      overflow: auto;
      padding: 18px;
      border-right: 1px solid #d4dde5;
      background: #f6f8fa;
    }

    .section {
      margin-bottom: 13px;
      overflow: hidden;
      border: 1px solid #dce4ea;
      border-radius: 10px;
      background: #fff;
    }

    .section h2 {
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid #e0e8ed;
      background: #eef4f7;
      font-size: 13px;
    }

    .section-body {
      padding: 12px;
    }

    .field {
      display: block;
      margin-bottom: 10px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field > span {
      display: block;
      margin-bottom: 5px;
      color: #415c6b;
      font-size: 12px;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 8px;
      border: 1px solid #cbd7df;
      border-radius: 6px;
      background: #fff;
      color: #152f40;
      font-size: 13px;
    }

    .field textarea {
      min-height: 66px;
      resize: vertical;
      line-height: 1.45;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .help {
      margin: 8px 0 0;
      color: #657a89;
      font-size: 11px;
      line-height: 1.6;
    }

    .notice {
      margin-bottom: 13px;
      padding: 11px 12px;
      border: 1px solid #e5d3a6;
      border-radius: 8px;
      background: #fff9eb;
      color: #745c28;
      font-size: 12px;
      line-height: 1.6;
    }

    .print-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0;
      font-size: 12px;
    }

    .preview-area {
      min-width: 0;
    }

    .preview-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 20px;
      border-bottom: 1px solid #d7e0e7;
      background: #f7f9fb;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 4px;
      border-radius: 9px;
      background: #e5ecf1;
    }

    .tabs button {
      padding: 9px 15px;
      border: 0;
      background: transparent;
    }

    .tabs button.active {
      background: #fff;
      color: var(--teal);
      font-weight: 700;
      box-shadow: 0 1px 4px #0001;
    }

    .preview-caption {
      color: #607483;
      font-size: 12px;
    }

    .preview-scroll {
      padding: 22px;
      overflow: auto;
    }

    .status {
      padding: 9px 20px;
      background: #edf3f7;
      color: #586e7e;
      font-size: 12px;
      line-height: 1.5;
    }

    .status.error {
      background: #ffeded;
      color: #a72535;
    }

    .ap-input-divider {
      margin: 15px 0 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #dce4ea;
      color: #244858;
      font-size: 13px;
    }


    /* =========================================================
       03. 共用檢查輸入
       ========================================================= */

    #shared-exams fieldset {
      min-width: 0;
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid #d7dde5;
      border-radius: 8px;
    }

    #shared-exams legend {
      max-width: 100%;
      padding: 0 6px;
      font-size: 13px;
      font-weight: 600;
    }

    #shared-exams .field {
      margin-bottom: 10px;
    }

    #shared-exams .sx-warning {
      padding: 10px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: #991b1b;
    }


    /* =========================================================
       04. A4 紙張及共用表格元件
       ========================================================= */

    .page {
      position: relative;
      width: 210mm;
      height: 297mm;
      margin: 0 auto 24px;
      padding: 10mm 12mm;
      background: #fff;
      color: #111;
      font-family: var(--font-ui);
      box-shadow: 0 4px 22px #20394d25;
    }

    .paper-content {
      width: 100%;
    }

    .paper-head {
      position: relative;
      height: 23mm;
    }

    .qlogo {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 1.5mm;
      color: #161616;
    }

    .qmark {
      font-family: Arial, sans-serif;
      font-size: 35pt;
      font-weight: 700;
      line-height: 1;
    }

    .qwords {
      font-size: 14pt;
      font-style: italic;
      font-weight: 700;
      line-height: .96;
    }

    .qwords small {
      font-size: 9pt;
      font-style: normal;
    }

    .qwords span {
      display: block;
    }

    .scheme-title,
    .scheme-subtitle {
      position: absolute;
      right: 0;
      left: 0;
      text-align: center;
      font-weight: 700;
    }

    .scheme-title {
      bottom: 5.5mm;
      font-size: 12pt;
    }

    .scheme-subtitle {
      bottom: 1.4mm;
      font-size: 10.6pt;
    }

    .date-top {
      position: absolute;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: baseline;
      gap: 1mm;
      font-size: 8pt;
    }

    .date-top .v {
      width: 27mm;
    }

    .v {
      min-width: 0;
      color: #111;
      font-weight: 400;
      font-style: normal;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .square {
      position: relative;
      display: inline-block;
      width: 2.1mm;
      height: 2.1mm;
      margin-right: 1mm;
      border: .22mm solid #222;
      vertical-align: -.25mm;
    }

    .square.checked::after {
      content: "✓";
      position: absolute;
      top: -1mm;
      left: -.1mm;
      font-size: 10pt;
      font-weight: 700;
    }

    .paper-check {
      appearance: none;
      -webkit-appearance: none;
      display: inline-grid;
      place-content: center;
      width: 2.2mm;
      height: 2.2mm;
      margin: 0 1mm 0 0;
      padding: 0;
      border: .22mm solid #222;
      border-radius: 0;
      background: #fff;
      vertical-align: -.3mm;
      cursor: pointer;
    }

    .paper-check:checked::after {
      content: "✓";
      color: #111;
      font: bold 9pt Arial;
      line-height: 1;
    }

    .signature-box {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      height: 18mm;
      margin-top: 3mm;
      border: .25mm solid #333;
      font-size: 8.2pt;
    }

    .signature-box > div {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5mm 1mm;
    }

    .signature-rule {
      height: 5mm;
      border-bottom: .2mm solid #444;
    }

    .blank-line {
      display: inline-block;
      width: 53mm;
      height: 4mm;
      border-bottom: .22mm solid #444;
    }

    .version {
      margin-top: 1mm;
      text-align: right;
      font-size: 7pt;
    }

    .over-limit {
      outline: 2px solid #df344b !important;
      background: #fff0f0;
    }


    /* =========================================================
       05. HSBC H01 / Bupa B04
       ========================================================= */

    .paper-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 34mm;
      border: .25mm solid #333;
      font-size: 8.2pt;
    }

    .info-half:first-child {
      border-right: .25mm solid #333;
    }

    .info-heading {
      height: 5mm;
      padding: .8mm 1mm;
      border-bottom: .2mm solid #444;
      background: #f0f0f0;
      font-size: 8.3pt;
      font-weight: 700;
    }

    .info-line {
      display: flex;
      align-items: center;
      gap: 1mm;
      height: 5.65mm;
      padding: .6mm 1mm;
      overflow: hidden;
      border-bottom: .15mm solid #777;
    }

    .info-line:last-child {
      border-bottom: 0;
    }

    .info-line .v {
      flex: 1;
      max-height: 100%;
      overflow: hidden;
    }

    .info-line .fixed {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .info-line .sex-out {
      flex: 0 0 39mm;
      font-size: 8pt;
      white-space: nowrap;
    }

    .info-line .short {
      flex: 0 0 15mm;
    }

    .info-line.diagnosis-line {
      align-items: flex-start;
      height: 8.3mm;
      font-size: 8pt;
    }

    .info-line.onset-line {
      height: 3mm;
      padding-top: 0;
      padding-bottom: 0;
    }

    .info-line.doctor-line {
      height: 5.9mm;
    }

    .route {
      border-right: .25mm solid #333;
      border-bottom: .25mm solid #333;
      border-left: .25mm solid #333;
      font-size: 9pt;
    }

    .route label {
      display: block;
      line-height: 1.22;
      cursor: pointer;
    }

    .h-route-block {
      height: 29mm;
      padding: 1.6mm 1mm;
      font-size: 10.5pt;
      font-weight: 700;
    }

    .h-route-block + .h-route-block {
      border-top: .55mm solid #333;
    }

    .h-route-block p {
      margin: .6mm 0 0;
    }

    .b-route {
      height: 20mm;
      padding: 1mm;
    }

    .b-route label:first-child {
      margin-bottom: 1mm;
      font-weight: 700;
    }

    .b-route .indent {
      padding-left: 3.4mm;
    }

    .directory {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: #111;
    }

    .directory th,
    .directory td {
      padding: .55mm .7mm;
      border: .2mm solid #333;
      vertical-align: middle;
      overflow-wrap: normal;
    }

    .directory th {
      text-align: left;
      font-weight: 700;
    }

    .directory .pick {
      padding: .3mm;
      text-align: center;
    }

    .directory .pick input {
      margin: 0;
    }

    .directory .district,
    .directory .centre-name {
      font-weight: 700;
    }

    .directory .cn {
      font-size: .92em;
    }

    .directory .tel,
    .directory .fax {
      text-align: center;
      white-space: pre-line;
    }

    .h-directory {
      font-size: 7.5pt;
      line-height: 1.1;
    }

    .h-directory thead tr { height: 4.8mm; }
    .h-directory .centre-name { font-size: 7.8pt; }
    .h-directory .service { font-size: 7.5pt; }

    .h-directory .tel,
    .h-directory .fax {
      font-size: 7.7pt;
    }

    .h-directory .r0 { height: 16mm; }
    .h-directory .r1 { height: 20mm; }
    .h-directory .r2 { height: 20mm; }
    .h-directory .r3 { height: 10mm; }
    .h-directory .r4 { height: 20mm; }
    .h-directory .r5 { height: 20mm; }
    .h-directory .r6 { height: 12mm; }
    .h-directory .r7 { height: 14mm; }
    .h-directory .r8 { height: 16mm; }

    .h-second .paper-head { height: 13mm; }
    .h-second .h-directory tr { height: 16mm; }
    .h-second .h-directory tr:first-child { height: 17mm; }

    .h-second .version {
      position: absolute;
      right: 12mm;
      bottom: 10mm;
    }

    .bupa {
      padding-top: 8mm;
      padding-bottom: 8mm;
    }

    .bupa .paper-head { height: 22mm; }

    .b-directory {
      font-size: 6.15pt;
      line-height: 1.04;
    }

    .b-directory th,
    .b-directory td {
      padding: .42mm .6mm;
    }

    .b-directory thead tr { height: 4mm; }
    .b-directory .centre-name { font-size: 6.35pt; }
    .b-directory .district { font-size: 6.35pt; }
    .b-directory .tel { font-size: 6.65pt; }
    .b-directory .other-row { height: 4.5mm; }

    .b-directory .paper-check {
      width: 1.65mm;
      height: 1.65mm;
    }

    .b-directory .paper-check:checked::after {
      font-size: 7pt;
    }

    .bupa .signature-box {
      height: 17mm;
      margin-top: 0;
    }

    .b-footer {
      display: flex;
      justify-content: space-between;
      gap: 2mm;
      margin-top: 2mm;
      font-size: 7pt;
      line-height: 1.2;
    }


    /* =========================================================
       06. DA01 主表
       ========================================================= */

    .da01 {
      padding: 10mm 12mm 12mm;
      font-size: 9pt;
    }

    .da-header {
      position: relative;
      height: 38.5mm;
    }

    .da-confidential {
      position: absolute;
      top: 3mm;
      left: 0;
      font-size: 10.5pt;
      font-weight: 700;
    }

    .da-header .qlogo {
      top: .5mm;
    }

    .da-heading {
      position: absolute;
      top: 16mm;
      right: 0;
      left: 0;
      text-align: center;
    }

    .da-heading h1 {
      margin: 0;
      font-size: 14pt;
      line-height: 1.1;
    }

    .da-heading h2 {
      margin: .8mm 0 0;
      font-size: 10.7pt;
      line-height: 1.12;
    }

    .da-intro {
      position: absolute;
      top: 25.5mm;
      right: 0;
      left: 0;
      margin: 0;
      font-size: 9pt;
      font-weight: 700;
      line-height: 1.28;
    }

    .da-date {
      position: absolute;
      right: 0;
      bottom: 1mm;
      display: flex;
      align-items: flex-end;
      gap: 1mm;
    }

    .da-date .v {
      width: 39mm;
      min-height: 3.5mm;
      border-bottom: .2mm solid #444;
    }

    .da-form {
      border: .22mm solid #646464;
    }

    .da-bar {
      height: 4.4mm;
      padding: .6mm .8mm;
      border-top: .22mm solid #646464;
      border-bottom: .22mm solid #646464;
      background: #c7c7c7;
      font-size: 9.6pt;
      font-weight: 700;
      line-height: 1;
    }

    .da-form > .da-bar:first-child {
      border-top: 0;
    }

    .da-doctor {
      display: grid;
      grid-template-columns: 59.5% 40.5%;
      height: 25.6mm;
    }

    .da-doctor-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1mm .8mm 1.2mm;
      border-right: .22mm solid #646464;
    }

    .da-inline {
      display: flex;
      align-items: flex-start;
      gap: 1mm;
    }

    .da-inline .v {
      flex: 1;
    }

    .da-doctor-right {
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    .da-doctor-right > div {
      padding: 1.1mm .8mm;
      overflow: hidden;
    }

    .da-doctor-right > div:first-child {
      border-bottom: .22mm solid #646464;
    }

    .da-doctor-right .v {
      max-height: 6mm;
      margin-top: 1mm;
      overflow: hidden;
    }

    .da-patient-top {
      display: grid;
      grid-template-columns: 56.8% 19% 24.2%;
      height: 9.8mm;
    }

    .da-patient-top > div {
      padding: .8mm;
      overflow: hidden;
      border-right: .22mm solid #646464;
    }

    .da-patient-top > div:last-child {
      border-right: 0;
    }

    .da-age {
      display: flex;
      gap: 1mm;
      height: 3.5mm;
    }

    .da-gender {
      margin-top: .65mm;
      font-size: 8.5pt;
      white-space: nowrap;
    }

    .da-contact .v {
      margin-top: .7mm;
    }

    .da-patient-second {
      display: grid;
      grid-template-columns: 34.2% 41.8% 24%;
      height: 9.8mm;
      border-top: .22mm solid #646464;
      border-bottom: .22mm solid #646464;
    }

    .da-patient-second > div {
      padding: .8mm;
      overflow: hidden;
      border-right: .22mm solid #646464;
    }

    .da-patient-second > div:last-child {
      border: 0;
    }

    .da-patient-second .v {
      max-height: 4.5mm;
      margin-top: .6mm;
      overflow: hidden;
    }

    .da-consent {
      height: 21.7mm;
      padding: .8mm;
    }

    .da-consent p {
      margin: 0;
      font-size: 9pt;
      line-height: 1.15;
    }

    .da-consent-sign {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 1mm;
      margin-top: 3mm;
    }

    .da-diagnosis {
      height: 11mm;
      padding: .75mm .8mm;
      border-bottom: .22mm solid #646464;
    }

    .da-diagnosis .v {
      height: 6mm;
      margin-top: .5mm;
      overflow: hidden;
    }

    .da-clinical-bottom {
      display: grid;
      grid-template-columns: 45.3% 54.7%;
      height: 13mm;
    }

    .da-onset {
      padding: .8mm;
      border-right: .22mm solid #646464;
    }

    .da-onset .v {
      max-height: 7mm;
      margin-top: 1mm;
      overflow: hidden;
    }

    .da-questions {
      padding: .5mm .8mm;
    }

    .da-question {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 1.4mm;
      height: 3.8mm;
      font-size: 8.5pt;
    }

    .da-question > span {
      white-space: nowrap;
    }

    .da-question .square {
      width: 1.9mm;
      height: 1.9mm;
      margin-right: .6mm;
    }

    .da-lab {
      height: 18mm;
      padding: 1mm;
    }

    .da-lab .v {
      height: 15.5mm;
      overflow: hidden;
    }

    .da-imaging-head {
      display: grid;
      grid-template-columns: 45.3% 54.7%;
      height: 8mm;
      border-top: .22mm solid #646464;
      border-bottom: .22mm solid #646464;
      background: #c7c7c7;
    }

    .da-imaging-head > div {
      padding: .75mm .8mm;
      font-size: 9.2pt;
      line-height: 1.12;
    }

    .da-imaging-head > div:first-child,
    .da-imaging-body > div:first-child {
      border-right: .22mm solid #646464;
    }

    .da-imaging-body {
      display: grid;
      grid-template-columns: 45.3% 54.7%;
      height: 17mm;
    }

    .da-imaging-body > div {
      padding: .6mm .8mm;
    }

    .da-booking {
      margin-bottom: 1mm;
      font-size: 9pt;
      text-decoration: underline;
    }

    .da-imaging-body .v {
      height: 10.5mm;
      overflow: hidden;
    }

    .da-other {
      height: 17.7mm;
      padding: 1mm;
    }

    .da-other .v {
      height: 15mm;
      overflow: hidden;
    }

    .da-qhms {
      margin-top: 2.2mm;
      border: .22mm solid #646464;
    }

    .da-qhms-title {
      height: 4mm;
      padding: .6mm .8mm;

      line-height: 1.25;
    }


    /* =========================================================
       11. AIA Prior Auth
       ---------------------------------------------------------
       已合併提供版本中多段 .ap-* CSS 的有效設定。
       保留頁首原有 absolute 定位，不另行重畫。
       ========================================================= */

    .page.ap-page {
      width: 210mm;
      height: 297mm;
      padding: 8mm 10mm;
      background: #fff;
      color: #111;
      font-family: var(--font-ui);
      font-size: 8.5pt;
      line-height: 1.12;
    }

    .ap-page > .paper-content {
      display: flow-root;
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 0;
    }

    /* 頁首 */

    .ap-page .ap-header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "wordmark company"
        "title title";
      align-items: start;
      column-gap: 4mm;
      row-gap: 1mm;
      height: auto;
      min-height: 24mm;
      margin: 0 0 1mm;
      padding: 0 0 1mm;
      border: 0;
    }

    .ap-page .ap-header > div {
      min-width: 0;
    }

.ap-page .ap-wordmark {
  /* 使用頁首 Grid 排位，不再用 absolute 定位 */
  position: static;
  grid-area: wordmark;
  justify-self: start;
  align-self: start;
  margin: 0;

  color: #d31145;
  font-family: Arial, sans-serif;
  font-size: 34pt;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -1.5pt;
}

    .ap-page .ap-title {
      position: absolute;
      bottom: 4mm;
      left: 0;
      width: 101mm;
      margin: 0;
      text-align: left;
      font-size: 10pt;
      font-weight: 700;
      line-height: 1.1;
    }

    .ap-page .ap-company {
      position: absolute;
      top: 7mm;
      right: 0;
      width: 78mm;
      padding: .5mm 0 0;
      text-align: center;
      font-size: 7.3pt;
      line-height: 1.12;
    }

    .ap-page .ap-company strong {
      font-size: 8.6pt;
    }

    .ap-page .ap-hotline {
      margin-top: 1.2mm;
      font-size: 7.5pt;
      font-weight: 700;
      line-height: 1.15;
    }

    /* 共用填寫欄 */

    .ap-page .ap-inline {
      display: flex;
      align-items: baseline;
      gap: .8mm;
      min-width: 0;
    }

    .ap-page .ap-label {
      flex: 0 0 auto;
    }

    .ap-page .ap-line,
    .ap-page .ap-block {
      display: block;
      min-width: 0;
      min-height: 4mm;
      margin: 0;
      padding: .15mm .35mm;
      overflow: hidden;
      color: #111;
      font-size: 8.5pt;
      font-weight: 400;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ap-page .ap-line {
      flex: 1 1 0%;
      height: 3.8mm;
      border: 0;
      border-bottom: .2mm solid #333;
      line-height: 1.1;
    }

    .ap-page .ap-block {
      width: 100%;
      height: auto;
      line-height: 1.08;
    }

    .ap-page .ap-sign-rule {
      display: inline-block;
      width: 56mm;
      height: 5mm;
      border-bottom: .2mm solid #333;
    }

    /* 醫生資料及申請類別 */

    .ap-page .ap-provider {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 4mm;
      row-gap: .5mm;
      margin: .5mm 0 1mm;
    }

    .ap-page .ap-provider-contact {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2mm;
      min-width: 0;
    }

    .ap-page .ap-purpose {
      display: grid;
      grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr);
      align-items: start;
      gap: 3mm;
      margin: 0 0 .8mm;
      font-size: 8.5pt;
      line-height: 1.12;
    }

    .ap-page .ap-purpose > div {
      min-width: 0;
    }

    .ap-page .ap-purpose > div:last-child {
      padding-top: 4mm;
    }

    .ap-page .ap-purpose p {
      margin: 0 0 .5mm;
      font-weight: 700;
    }

    .ap-page .ap-purpose label {
      display: block;
      margin: 0 0 .4mm;
      cursor: pointer;
    }

    .ap-page .paper-check {
      width: 2.3mm;
      height: 2.3mm;
      margin-right: 1mm;
      border: .2mm solid #222;
      vertical-align: -.35mm;
    }

    .ap-page .paper-check:checked::after {
      font: bold 9pt/1 Arial, sans-serif;
    }

    .ap-page .ap-purpose .paper-check {
      width: 1.9mm;
      height: 1.9mm;
      margin: 0 .6mm 0 0;
      vertical-align: -.25mm;
    }

    .ap-page .ap-purpose .paper-check:checked::after {
      font: bold 8pt/1 Arial, sans-serif;
    }

    .ap-page .ap-remarks {
      margin: 0 0 1mm;
      font-size: 8.2pt;
      line-height: 1.12;
    }

    .ap-page .ap-part {
      margin: 1mm 0 .6mm;
      font-size: 8.8pt;
      font-weight: 700;
      line-height: 1.12;
      text-decoration: underline;
    }

    /* Part 1 */

    .ap-page .ap-member {
      padding: .8mm 1mm;
      border: .5mm double #222;
    }

    .ap-page .ap-member-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 27mm;
      gap: 3mm;
      min-height: 6mm;
    }

    .ap-page .ap-member-bottom {
      display: grid;
      grid-template-columns:
        minmax(0, 1.4fr)
        minmax(0, 1fr)
        minmax(0, 1fr);
      gap: 2mm;
      min-height: 6mm;
      margin-top: .5mm;
    }

    .ap-page .ap-consent {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      align-items: start;
      gap: 3mm;
      margin-top: 1mm;
    }

    .ap-page .ap-consent p {
      min-width: 0;
      margin: 0;
      font-size: 8pt;
      line-height: 1.12;
    }

    .ap-page .ap-consent .ap-cn {
      font-size: 8.2pt;
      line-height: 1.15;
    }

    .ap-page .ap-member-sign {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 1.5mm;
      min-height: 6mm;
      margin-top: .7mm;
      font-size: 8.2pt;
    }

    .ap-page .ap-member-sign .ap-sign-rule {
      flex: 0 0 56mm;
      height: 4.5mm;
    }

    /* Note 使用全寬；中文由 HTML 的 <br> 另起一行。 */

    .ap-page .ap-note {
      display: block;
      margin: 1mm 0;
      font-size: 8.3pt;
      font-weight: 700;
      font-style: italic;
      line-height: 1.12;
    }

    .ap-page .ap-note > span {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: none;
      text-decoration: underline;
    }

    /* Part 2 */

    .ap-page .ap-clinical {
      display: block;
      border: .25mm solid #222;
      font-size: 8.5pt;
      line-height: 1.1;
    }

    .ap-page .ap-row {
      min-width: 0;
      padding: .65mm 1mm;
      border-bottom: .2mm solid #333;
    }

    .ap-page .ap-question {
      margin: 0 0 .45mm;
    }

    .ap-page .ap-symptoms {
      min-height: 8.5mm;
    }

    .ap-page .ap-symptoms .ap-block {
      height: 6.2mm;
      min-height: 3.5mm;
    }

    .ap-page .ap-diagnosis,
    .ap-page .ap-onset,
    .ap-page .ap-hospital-reason {
      display: flex;
      align-items: baseline;
      gap: 1mm;
      min-height: 7mm;
    }

    .ap-page .ap-diagnosis > .ap-question,
    .ap-page .ap-onset > .ap-question,
    .ap-page .ap-hospital-reason > div:first-child {
      flex: 0 0 auto;
      margin: 0;
    }

    .ap-page .ap-diagnosis > .ap-block,
    .ap-page .ap-onset > .ap-block,
    .ap-page .ap-hospital-reason > .ap-block {
      flex: 1 1 0%;
      width: auto;
      min-width: 0;
      height: auto;
      min-height: 4mm;
      margin: 0;
      padding: .2mm .35mm;
      overflow: visible;
    }

    .ap-page .ap-hospital-reason {
      margin: .7mm 0;
    }

    .ap-page .ap-hospital-reason > .ap-block {
      border-bottom: .2mm solid #333;
    }

    .ap-page .ap-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-height: 12mm;
      border-bottom: .2mm solid #333;
    }

    .ap-page .ap-split > div {
      min-width: 0;
      padding: .7mm 1mm;
    }

    .ap-page .ap-split > div:first-child {
      border-right: .2mm solid #333;
    }

    .ap-page .ap-first-date {
      width: 48mm;
      max-width: 100%;
      min-height: 4mm;
    }

    .ap-page .ap-date-hint {
      margin-top: .25mm;
      font-size: 7.5pt;
      line-height: 1;
    }

    .ap-page .ap-referral-details {
      margin-top: .5mm;
    }

    .ap-page .ap-referral-details .ap-block {
      height: 6.2mm;
      min-height: 3.5mm;
      margin-top: .35mm;
    }

    .ap-page .ap-history {
      min-height: 10mm;
    }

    .ap-page .ap-history > .ap-question {
      margin-bottom: .4mm;
    }

    .ap-page .ap-history > .ap-block {
      height: auto;
      min-height: 3.5mm;
      padding: .15mm .35mm;
      overflow: visible;
    }

    .ap-page .ap-answer {
      display: inline-block;
      margin-left: 1.3mm;
      white-space: nowrap;
    }

    .ap-page .square {
      position: relative;
      display: inline-block;
      width: 1.9mm;
      height: 1.9mm;
      margin-right: .6mm;
      border: .2mm solid #222;
      vertical-align: -.25mm;
    }

    .ap-page .square.checked::after {
      top: -.8mm;
      left: -.1mm;
      color: #111;
      font: bold 9pt/1 Arial, sans-serif;
    }

    .ap-page .ap-yesno-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .5mm 1.3mm;
      min-height: 5.5mm;
    }

    .ap-page .ap-yesno-line > span:first-child {
      flex: 0 0 60mm;
    }

    .ap-page .ap-yesno-line + .ap-yesno-line {
      margin-top: .5mm;
    }

    .ap-page .ap-lmp {
      display: inline-flex;
      flex: 1 1 auto;
      align-items: baseline;
      gap: .7mm;
      min-width: 42mm;
    }

    .ap-page .ap-lmp .ap-line {
      height: 3.5mm;
      min-height: 3.5mm;
    }

    /* 第 9–14 項 */

    .ap-page .ap-planning {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows:
        repeat(5, minmax(6mm, auto))
        minmax(5mm, auto)
        minmax(5.5mm, auto)
        minmax(7mm, auto);
      align-content: start;
      row-gap: 0;
      min-width: 0;
      padding: .7mm 1mm;
    }

    .ap-page .ap-planning > * {
      min-width: 0;
    }

    .ap-page .ap-two {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: baseline;
      gap: 3mm;
      margin: 0 0 .6mm;
    }

    .ap-page .ap-treatment-code {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      align-items: start;
      gap: 2mm;
      margin: .8mm 0;
    }

    .ap-page .ap-treatment-code > .ap-treatment {
      display: flex;
      align-items: baseline;
      gap: 1mm;
      min-width: 0;
      min-height: 5mm;
      margin: 0;
    }

    .ap-page .ap-treatment-label {
      flex: 0 0 auto;
    }

    .ap-page .ap-treatment-code .ap-treatment > .ap-block {
      flex: 1 1 0%;
      width: auto;
      min-width: 0;
      height: auto;
      min-height: 3.8mm;
      margin: 0;
      padding: .15mm .35mm;
      overflow: visible;
      border-bottom: .2mm solid #333;
    }

    .ap-page .ap-treatment-code > .ap-code-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 1.2mm;
      min-width: 0;
      min-height: 5mm;
      margin: 0;
    }

    .ap-page .ap-treatment-code .ap-code-row > .ap-inline {
      flex: 1 1 0%;
      min-width: 0;
    }

    .ap-page .ap-treatment-code .ap-code-row > span {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .ap-page .ap-two .ap-line,
    .ap-page .ap-treatment-code .ap-line,
    .ap-page .ap-before-reason .ap-line {
      height: auto;
      min-height: 3.8mm;
      overflow: visible;
    }

    .ap-page .ap-room {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: .6mm 2mm;
      margin: .8mm 0;
    }

    .ap-page .ap-room > span {
      white-space: nowrap;
    }

    .ap-page .ap-before-surgery {
      margin: .7mm 0 0;
      padding-top: .6mm;
    }

    .ap-page .ap-before-reason {
      display: flex;
      align-items: baseline;
      gap: .7mm;
      min-width: 0;
      margin: .4mm 0 0;
    }

    .ap-page .ap-before-reason > span:first-child {
      flex: 0 0 auto;
    }

    .ap-page .ap-doctor-sign {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 49mm;
      align-items: end;
      gap: 5mm;
      margin: 1mm 0 0;
      padding-bottom: .5mm;
    }

    .ap-page .ap-doctor-sign .ap-sign-rule {
      flex: 1 1 0%;
      width: auto;
      min-width: 0;
      height: 5mm;
    }

    /* Part 3 */

    .ap-page .ap-office {
      padding: .8mm 1mm;
      border: .25mm solid #222;
      font-size: 8.2pt;
      line-height: 1.12;
    }

    .ap-page .ap-office-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .6mm 1.5mm;
      min-height: 7mm;
      padding-bottom: 1mm;
      border-bottom: .2mm solid #555;
    }

    .ap-page .ap-office-line .ap-sign-rule {
      flex: 1 1 35mm;
      width: 37mm;
      height: 3.5mm;
    }

    .ap-page .ap-office-note {
      margin: .8mm 0;
    }

    .ap-page .ap-office-bottom {
      display: grid;
      grid-template-columns:
        minmax(0, 1.2fr)
        minmax(0, 1fr)
        minmax(0, .65fr);
      align-items: end;
      gap: 2mm;
      min-height: 6mm;
    }

    .ap-page .ap-office-bottom .ap-sign-rule {
      flex: 1 1 0%;
      width: auto;
      min-width: 0;
      height: 4mm;
    }

    .ap-page .ap-footer {
      position: static;
      margin-top: 1mm;
      font-size: 6pt;
      line-height: 1.1;
    }

    .ap-page .ap-footer p {
      margin: 0 0 .5mm;
    }


    /* =========================================================
       12. 響應式介面及列印
       ========================================================= */

    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .sidebar {
        padding: 12px;
      }

      .topbar {
        padding: 10px 14px;
      }
    }

    @media (max-width: 720px) {
      .layout {
        display: block;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .topbar {
        position: static;
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
      }

      body {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .topbar,
      .sidebar,
      .preview-tools,
      .status {
        display: none !important;
      }

      .layout,
      .preview-area,
      .preview-scroll {
        display: block;
        margin: 0;
        padding: 0;
        overflow: visible;
      }

      .page {
        margin: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      .page.last-print {
        break-after: auto;
        page-break-after: auto;
      }

      .over-limit {
        outline: 0 !important;
        background: transparent;
      }

      .da-centres-table tr,
      .bc-page .bc-member-grid,
      .bc-page .bc-clinical,
      .bc-page .bc-exam-grid,
      .bc-page .bc-notice,
      .bc-page .bc-signatures,
      .ap-page .ap-header,
      .ap-page .ap-member,
      .ap-page .ap-clinical,
      .ap-page .ap-row,
      .ap-page .ap-split,
      .ap-page .ap-planning > *,
      .ap-page .ap-office,
      .ap-page .ap-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
/* =========================================================
   13. 統一輸入介面
   只修改操作介面，不修改任何紙張樣式。
   ========================================================= */

@media screen {
  .layout {
    grid-template-columns: 400px minmax(0, 1fr);
  }

  .sidebar {
    padding: 16px;
    background: #f2f6f9;
    scrollbar-gutter: stable;
  }
}

.sidebar [hidden] {
  display: none !important;
}

/* 目前表格 */

.sidebar .editor-heading {
  margin-bottom: 14px;
  padding: 15px;
  border: 1px solid #cbdfe5;
  border-radius: 12px;
  background: #eaf5f5;
}

.sidebar .editor-eyebrow {
  display: block;
  margin-bottom: 5px;
  color: #567681;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
}

.sidebar .editor-current {
  display: block;
  color: #125766;
  font-size: 18px;
  line-height: 1.3;
}

.sidebar .editor-heading p {
  margin: 7px 0 0;
  color: #526c78;
  font-size: 12px;
  line-height: 1.6;
}

/* 可摺疊區塊 */

.sidebar .editor-section {
  margin-bottom: 12px;
  overflow: hidden;
  border: 1px solid #d8e2e9;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 2px 6px #19394c05;
}

.sidebar .editor-section > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  list-style: none;
  cursor: pointer;
}

.sidebar .editor-section > summary::-webkit-details-marker {
  display: none;
}

.sidebar .editor-section > summary::after {
  content: "+";
  margin-left: auto;
  color: #62818f;
  font-size: 19px;
}

.sidebar .editor-section[open] > summary {
  border-bottom: 1px solid #e5edf2;
  background: #f8fbfc;
}

.sidebar .editor-section[open] > summary::after {
  content: "−";
}

.sidebar .editor-section > summary:focus-visible {
  outline: 3px solid #68bfd5;
  outline-offset: -3px;
}

.sidebar .editor-step {
  display: grid;
  flex: 0 0 28px;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #e7f1f4;
  color: #236576;
  font-size: 12px;
  font-weight: 700;
}

.sidebar .editor-section-title {
  color: #203f50;
  font-size: 14px;
  font-weight: 700;
}

.sidebar .editor-count {
  display: block;
  margin-top: 3px;
  color: #6f8490;
  font-size: 11px;
  font-weight: 400;
}

.sidebar .section-body {
  padding: 15px;
}

/* 中英文標籤及輸入框 */

.sidebar .field {
  margin-bottom: 14px;
}

.sidebar .field > .editor-label {
  margin-bottom: 7px;
  color: #294858;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}

.sidebar .editor-label small,
.sidebar .editor-choice legend small {
  display: block;
  margin-top: 3px;
  color: #748894;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.35;
}

.sidebar .field input,
.sidebar .field select,
.sidebar .field textarea {
  min-height: 40px;
  padding: 10px;
  border-color: #cbd9e2;
  border-radius: 8px;
  background: #fcfdff;
  font-size: 14px;
  line-height: 1.4;
}

.sidebar .field textarea {
  min-height: 78px;
}

.sidebar .field input:hover,
.sidebar .field select:hover,
.sidebar .field textarea:hover {
  border-color: #92afbd;
}

.sidebar .field input:focus,
.sidebar .field select:focus,
.sidebar .field textarea:focus {
  border-color: #087f8c;
  background: #fff;
}

.sidebar .two {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px;
}

.sidebar .editor-subheading {
  margin: 17px 0 12px;
  padding-top: 13px;
  border-top: 1px solid #e5edf2;
  color: #416474;
  font-size: 12px;
  font-weight: 700;
}

.sidebar .editor-hint {
  margin: 0 0 13px;
  color: #687f8c;
  font-size: 12px;
  line-height: 1.6;
}

/* 原生 radio，外觀呈現為分段選擇按鈕 */

.sidebar fieldset.editor-choice {
  min-width: 0;
  margin: 0 0 15px;
  padding: 0;
  border: 0;
}

.sidebar .editor-choice legend {
  width: 100%;
  margin-bottom: 8px;
  padding: 0;
  color: #294858;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
}

.sidebar .editor-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.sidebar .editor-option {
  position: relative;
  display: block;
  min-width: 0;
  cursor: pointer;
}

.sidebar .editor-option input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  overflow: hidden;
  clip-path: inset(50%);
}

.sidebar .editor-option span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 39px;
  padding: 8px 5px;
  border: 1px solid #d3dfe7;
  border-radius: 8px;
  background: #fff;
  color: #647a87;
  text-align: center;
  font-size: 12px;
  line-height: 1.4;
}

.sidebar .editor-option input:checked + span {
  border-color: #087f8c;
  background: #e8f5f4;
  color: #096774;
  font-weight: 700;
}

.sidebar .editor-option input:focus-visible + span {
  outline: 3px solid #68bfd5;
  outline-offset: 2px;
}

/* 條件式補充問題 */

.sidebar .editor-followup {
  margin: -3px 0 16px;
  padding: 12px;
  border-left: 3px solid #9fcbd1;
  border-radius: 0 8px 8px 0;
  background: #f2f8fa;
}

.sidebar .editor-followup .field:last-of-type {
  margin-bottom: 0;
}

.sidebar .editor-followup.has-conflict {
  border-left-color: #d89532;
  background: #fff8e9;
}

.sidebar .editor-conflict {
  margin: 9px 0 0;
  color: #865519;
  font-size: 12px;
  line-height: 1.5;
}

/* 檢查項目：保留現有分類，只改善輸入外觀 */

.sidebar #shared-exams > fieldset {
  margin-bottom: 14px;
  padding: 13px;
  border: 1px solid #dce6ec;
  border-radius: 10px;
  background: #fbfdfe;
}

.sidebar #shared-exams > fieldset > legend {
  padding: 0 6px;
  color: #315566;
  font-size: 12px;
  font-weight: 700;
}

.sidebar .editor-bc-routing {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid #c8dde7;
  border-radius: 8px;
  background: #edf6fa;
}

/* 批次列印 */

.sidebar .print-picks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sidebar .print-picks label {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 8px;
  border: 1px solid #dce5eb;
  border-radius: 8px;
  background: #fbfdfe;
  cursor: pointer;
}

.sidebar .print-picks input {
  accent-color: #087f8c;
}

.sidebar .editor-versions {
  margin-top: 14px;
  color: #758894;
  font-size: 11px;
  line-height: 1.6;
}

.sidebar .editor-versions > summary {
  cursor: pointer;
}

@media screen and (max-width: 1050px) {
  .layout {
    grid-template-columns: 350px minmax(0, 1fr);
  }

  .sidebar {
    padding: 12px;
  }
}

@media screen and (max-width: 720px) {
  .layout {
    display: block;
  }
}

@media screen and (max-width: 380px) {
  .sidebar .two {
    grid-template-columns: minmax(0, 1fr);
  }
}
/* AIA HSNM5F01：只調整底部預留空間 */
.page.aia-page {
  padding-bottom: 7mm;
}

<body>
  <!-- =======================================================

本頁沒有外部資源、沒有上傳功能；資料亦不會留於瀏覽器內，重新整理或關閉頁面後會清除。

            H01：2026 Jan<br>

        <!-- 六份表格按 FORMS 次序建立於此。 -->
        <div id="group-appendix" class="form-group" hidden></div>
      </div>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      /* =====================================================
         JavaScript 目錄
         -----------------------------------------------------
         01. 設定、工具及狀態
         02. 輸入欄位
         03. 中心資料：HSBC / Bupa
         04. 中心資料：DA01
         05. 共用表格元件
         06. 表格：HSBC / Bupa
         07. 表格：DA01
         08. 表格：AIA HSNM5F01
         09. 表格：Blue Cross
         10. 表格：AIA Prior Auth
         11. 衍生資料及畫面更新
         12. 檢查附加頁
         13. 驗證及列印
         14. 清空、示例及初始化

         原則：
         - state 只儲存使用者輸入。
         - getData() 統一產生所有衍生輸出。
         - 不覆寫既有函式，不使用後加補丁。
         - 中心及轉介 checkbox 保留在 DOM，不因輸入而重建。
         - 無 fetch、外部字型、localStorage 或上傳。
         ===================================================== */


      /* =====================================================
         01. 設定、工具及狀態
         ===================================================== */

      const $ = selector => document.querySelector(selector);
      const $$ = selector => [...document.querySelectorAll(selector)];

      const FORMS = [
        {
          id: "da",
          title: "DA01",
          tab: "DA01",
          printLabel: "DA01",
          build: buildDA01
        },
        {
          id: "h",
          title: "HSBC H01",
          tab: "HSBC · H01",
          printLabel: "HSBC",
          build: buildHSBC
        },
        {
          id: "b",
          title: "Bupa B04",
          tab: "Bupa · B04",
          printLabel: "Bupa",
          build: buildBupa
        },
        {
          id: "aia",
          title: "AIA HSNM5F01",
          tab: "AIA · HSNM5F01",
          printLabel: "AIA HSNM5F01",
          build: buildAIA
        },
        {
          id: "aiaPA",
          title: "AIA Prior Auth",
          tab: "AIA · Prior Auth",
          printLabel: "AIA Prior Auth",
          build: buildAIAPriorAuth
        },
        {
          id: "bc",
          title: "Blue Cross N4",
          tab: "Blue Cross · N4",
          printLabel: "Blue Cross",
          build: buildBlueCross
        }
      ];

      const FORM_BY_ID = Object.fromEntries(
        FORMS.map(form => [form.id, form])
      );

      const TEST_DEFINITIONS = [
        ["testLab", "Laboratory tests / X-ray / ECG"],
        ["testAdvanced", "CT / MRI / PET"],
        [
          "testImaging",
          "Ultrasound / Mammography / DEXA / Treadmill / 24-hour Holter / Audiology"
        ],
        ["testOther", "Other tests"]
      ];

      const DEFAULT_FORM = "aiaPA";
      const state = {};

      let activeForm = DEFAULT_FORM;
      let visiblePlans = [DEFAULT_FORM];
      let printing = false;
      let preparingPrint = false;

      function escapeHTML(value) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return String(value ?? "").replace(
          /[&<>"']/g,
          character => entities[character]
        );
      }

      function localDate() {
        const date = new Date();

        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function displayDate(value) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);

        return match
          ? `${match[3]}/${match[2]}/${match[1]}`
          : value;
      }

      function text(key) {
        return String(state[key] ?? "").trim();
      }

      function joinText(items, separator = "\n") {
        return items
          .map(value => String(value ?? "").trim())
          .filter(Boolean)
          .join(separator);
      }

      function setStatus(message, isError = false) {
        $("#status").textContent = message;
        $("#status").classList.toggle("error", isError);
      }

      function clearHighlights() {
        $$(".over-limit").forEach(element => {
          element.classList.remove("over-limit");
        });
      }


      /* =====================================================
         02. 輸入欄位
         -----------------------------------------------------
         所有欄位先建立，再統一初始化 state 及事件。
         同一 data-key 可出現於不同計劃，資料會同步。
         ===================================================== */

/* =====================================================
         02. 統一輸入介面
         -----------------------------------------------------
         - 每個 data-key 只建立一個輸入位置。
         - 共用資料保留原有 key，不改右邊表格綁定。
         - 左欄只在初始化時建立一次。
         - 切換表格只更新 hidden，不重建輸入及摺疊區塊。
         ===================================================== */

      function editorLabel(label, english = "") {
        return `
          ${escapeHTML(label)}
          ${english ? `<small>${escapeHTML(english)}</small>` : ""}
        `;
      }

      function inputField(key, label, options = {}) {
        const {
          type = "text",
          english = "",
          inputmode = "",
          placeholder = ""
        } = options;

        return `
          <label class="field">
            <span class="editor-label">
              ${editorLabel(label, english)}
            </span>

            <input
              id="field-${escapeHTML(key)}"
              type="${escapeHTML(type)}"
              data-key="${escapeHTML(key)}"
              autocomplete="off"
              ${inputmode ? `inputmode="${escapeHTML(inputmode)}"` : ""}
              ${placeholder ? `placeholder="${escapeHTML(placeholder)}"` : ""}
            >
          </label>
        `;
      }

      function textField(key, label, english = "", rows = 2) {
        return `
          <label class="field">
            <span class="editor-label">
              ${editorLabel(label, english)}
            </span>

            <textarea
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
              rows="${rows}"
              autocomplete="off"
            ></textarea>
          </label>
        `;
      }

      function selectField(
        key,
        label,
        options,
        english = "",
        emptyLabel = "未填寫"
      ) {
        return `
          <label class="field">
            <span class="editor-label">
              ${editorLabel(label, english)}
            </span>

            <select
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
            >
              <option value="">${escapeHTML(emptyLabel)}</option>

              ${options.map(([value, caption]) => `
                <option value="${escapeHTML(value)}">
                  ${escapeHTML(caption)}
                </option>
              `).join("")}
            </select>
          </label>
        `;
      }

      function yesNoField(key, label, english = "") {
        const choices = [
          ["", "未回答"],
          ["N", "否 No"],
          ["Y", "是 Yes"]
        ];

        return `
          <fieldset class="editor-choice">
            <legend>${editorLabel(label, english)}</legend>

            <div class="editor-options">
              ${choices.map(([value, caption], index) => `
                <label class="editor-option">
                  <input
                    type="radio"
                    name="answer-${escapeHTML(key)}"
                    data-key="${escapeHTML(key)}"
                    value="${escapeHTML(value)}"
                    ${index === 0 ? "checked" : ""}
                  >
                  <span>${escapeHTML(caption)}</span>
                </label>
              `).join("")}
            </div>
          </fieldset>
        `;
      }

      function forPlans(plans, content) {
        return `
          <div data-editor-plans="${escapeHTML(plans)}" hidden>
            ${content}
          </div>
        `;
      }

      function followup(answerKey, detailKey, content) {
        return `
          <div
            class="editor-followup"
            data-answer-key="${escapeHTML(answerKey)}"
            data-detail-key="${escapeHTML(detailKey)}"
            hidden
          >
            ${content}

            <p class="editor-conflict" role="status" hidden></p>
          </div>
        `;
      }

      function editorSection(
        id,
        step,
        title,
        content,
        { open = true, plans = "" } = {}
      ) {
        return `
          <details
            id="${id}"
            class="editor-section"
            ${open ? "open" : ""}
            ${plans ? `data-editor-plans="${escapeHTML(plans)}" hidden` : ""}
          >
            <summary>
              <span class="editor-step">${step}</span>

              <span>
                <span class="editor-section-title">${title}</span>
                <span class="editor-count" data-editor-count></span>
              </span>
            </summary>

            <div class="section-body">${content}</div>
          </details>
        `;
      }

      function buildInputPanels() {
        const sidebar = $(".sidebar");

        // 保留原本私隱提示及版本文字。
        const noticeHTML = sidebar.querySelector(".notice").outerHTML;
        const versionsHTML = $("#print-picks")
          .parentElement
          .querySelector(".help")
          .outerHTML;

        const patientFields = `
          ${inputField("date", "轉介日期", {
            type: "date",
            english: "Referral date"
          })}

          ${inputField("name", "病人姓名", {
            english: "Patient name"
          })}

          <div class="two">
            ${forPlans("da h b aiaPA", inputField("age", "年齡", {
              inputmode: "numeric",

            }))}

            ${forPlans("da h b aia", selectField(
              "sex",

          ${inputField("contact", "聯絡電話", {

          })}

          ${forPlans("da", `
            ${inputField("daCompany", "公司名稱", {

            })}

            })}
            ${inputField("daChit", "DA01 Chit 號碼", {
              english: "Chit Number"
            })}
          `)}

          ${forPlans("h", `
            ${inputField("hCard", "HSBC 醫療卡號碼", {

            })}
            ${inputField("hChit", "HSBC Chit 號碼", {

          ${forPlans("b", `

          ${forPlans("bc", inputField("bcPolicyNo", "Blue Cross 保單號碼", {

          }))}
        `;

        const doctorFields = `
          ${inputField("doctor", "自己醫生姓名", {

          })}

          <div class="two">
            ${inputField("clinicTel", "自己診所電話", {
              type: "tel",

            })}

            ${forPlans("da h b aia aiaPA", inputField(
              "clinicFax",
              "自己診所傳真",
              { type: "tel", english: "Own Clinic fax" }
            ))}
          </div>

          ${forPlans("h b", inputField("clinicCode", "自己診所編號", {
            english: "Own Clinic Code — H01 / B04"
          }))}

          ${forPlans("aiaPA", inputField(
            "apProviderId",

          ))}

          ${forPlans("bc", textField(

          ))}

          ${forPlans("aia", `
            <div class="editor-subheading">接收醫生／中心</div>

            ${inputField("aiaProvider", "對方醫生或中心名稱", {

        const clinicalFields = `
          ${textField(

          )}

          ${forPlans("aia", textField(

          ))}

          ${textField(

          )}

          ${inputField("onset", "發病日期／持續時間", {
            english: "Onset date or duration",
            placeholder: "例如：01/10/2026 或 2 weeks"
          })}

          ${forPlans("aia", `
            ${inputField("aiaFrequency", "症狀頻率", {
              english: "Frequency"
            })}

            ${textField(
              "aiaManagement",
              "醫療處理",
              "Medical Management"
            )}

            ${textField(
              "aiaProcedure",

            )}
          `)}

          ${forPlans("aiaPA", `
            <div class="editor-subheading">首次求診及過往檢查</div>

            ${inputField("apFirstConsult", "因本病況首次求診日期", {
              type: "date",
              english: "Prior Auth · Question 3"
            })}

            ${yesNoField(

            )}

            ${followup(
              "apReferred",
              "apReferringDetails",

            ${followup(

          ${forPlans("aiaPA", followup(

            })
          ))}

          ${forPlans("da", yesNoField(

          ))}
        `;

        const examFields = `
          <p class="editor-hint">
            以下填寫「今次要求」的檢查；共用內容會按原有方式填入各份表格。
          </p>

          <div id="shared-exams">
            <fieldset>
              <legend>1．化驗</legend>
              ${textField("sxLab", "化驗項目", "Laboratory Tests")}
            </fieldset>

            <fieldset>
              <legend>2．影像及其他檢查</legend>

              ${textField("sxXrayEcg", "X 光／心電圖", "X-ray / ECG")}

              ${textField(

        return (

      function updateSidebar() {
        $("#editor-current").textContent =
          FORM_BY_ID[activeForm].title;

        // 按目前表格顯示適用欄位，不移除資料、不停用輸入。
        $$(".sidebar [data-editor-plans]").forEach(element => {
          const plans = element.dataset.editorPlans.split(/\s+/);
          element.hidden = !plans.includes(activeForm);
        });

        // 選 Yes 或已有補充內容，就保持補充欄可見。
        $$(".sidebar [data-answer-key]").forEach(element => {
          const answer = text(element.dataset.answerKey);
          const hasDetails = Boolean(text(element.dataset.detailKey));
          const needsReview = hasDetails && answer !== "Y";

          element.hidden = answer !== "Y" && !hasDetails;
          element.classList.toggle("has-conflict", needsReview);

          const warning = element.querySelector(".editor-conflict");

          warning.hidden = !needsReview;
          warning.textContent = !needsReview
            ? ""
            : answer === "N"
              ? "已選「否」，但仍有補充內容。資料未被刪除，請核對；原有列印檢查仍會檢查此矛盾。"
              : "已有補充內容，但主問題未回答。請核對，內容不會自動刪除。";
        });

        $("#bc-other-routing").hidden = !(
          text("sxOther") && blueCrossInContext()
        );

        // 同一行只有一個適用欄位時，讓該欄佔全寬。
        $$(".sidebar .two").forEach(row => {
          const visibleChildren = [...row.children]
            .filter(child => !child.hidden);

          row.hidden = visibleChildren.length === 0;

          row.style.gridTemplateColumns = visibleChildren.length === 1
            ? "minmax(0, 1fr)"
            : "";
        });

        // 摺疊摘要只顯示已填數量，不當作必填完成率。
        $$(".sidebar .editor-section").forEach(section => {
          const summary = section.querySelector("[data-editor-count]");

          if (section.id === "editor-print") {
            const count = $$(".print-pick:checked").length;
            summary.textContent = `批次已選 ${count} 份`;
            return;
          }

          const keys = new Set(
            [...section.querySelectorAll("[data-key]")]
              .filter(control => !control.closest("[hidden]"))
              .map(control => control.dataset.key)
          );

          const filled = [...keys].filter(key => text(key)).length;

          summary.textContent = filled
            ? `目前適用欄位：${filled} 項已填`
            : "展開填寫／核對";
        });
      }

      /* =====================================================
         05. 共用表格元件
         ===================================================== */

      function logo() {
        return `
          <div class="qlogo" aria-label="Quality HealthCare 卓健，文字近似排版">
            <div class="qmark">Q</div>
            <div class="qwords">
              <span>Quality <small>卓健</small></span>
              <span>HealthCare</span>
            </div>
          </div>
        `;
      }

      function bind(key, className = "") {
        return `
          <span class="v ${className}" data-bind="${key}"></span>
        `;
      }

      function valueBlock(key, className = "") {
        return `<div class="v ${className}" data-bind="${key}"></div>`;
      }

      function mark(key, value) {
        return `
          <i
            class="square"
            data-mark="${key}"
            data-equals="${value}"
            aria-hidden="true"
          ></i>
        `;
      }

      /*
       * labelHTML 只接受程式內固定的表格文字。
       * 使用者輸入不會經此函式插入 HTML。
       */
      function routeCheck(id, labelHTML) {
        return `
          <label>
            <input
              class="paper-check"
              type="checkbox"
              data-route="${id}"
            >
            ${labelHTML}
          </label>
        `;
      }

      function paperHead(scheme, form) {
        return `
          <header class="paper-head">
            ${logo()}
            <div class="scheme-title">${scheme}</div>
            <div class="scheme-subtitle">
              X-Ray, Laboratory Investigation Referral Form (Form ${form})
            </div>
            <div class="date-top">
              Date: ${bind("dateDisplay")}
            </div>
          </header>
        `;
      }

      function patientBlock(prefix) {
        return `
          <div class="paper-info">
            <div class="info-half">
              <div class="info-heading">PATIENT'S INFORMATION</div>

              <div class="info-line">
                <span class="fixed">Name:</span>
                ${bind("name")}
              </div>

              <div class="info-line">
                <span class="fixed">Age:</span>
                ${bind("age", "short")}
                <span class="sex-out">
                  ${mark("sex", "M")} Male&nbsp;&nbsp;
                  ${mark("sex", "F")} Female
                </span>
              </div>

              <div class="info-line">
                <span class="fixed">Chit No.:</span>
                ${bind(prefix + "Chit")}
              </div>

              <div class="info-line">
                <span class="fixed">Medical Card No.:</span>
                ${bind(prefix + "Card")}
              </div>

              <div class="info-line">
                <span class="fixed">Contact No.:</span>
                ${bind("contact")}
              </div>
            </div>

            <div class="info-half">
              <div class="info-heading">REFFERING DOCTOR'S INFORMATION</div>

              <div class="info-line doctor-line">
                <span class="fixed">Doctor:</span>
                ${bind("doctor")}
              </div>

              <div class="info-line doctor-line">
                <span class="fixed">Clinic Code:</span>
                ${bind("clinicCode")}
              </div>

              <div class="info-line doctor-line">
                <span class="fixed">Tel:</span>
                ${bind("clinicTel")}
                <span class="fixed">Fax No:</span>
                ${bind("clinicFax")}
              </div>

              <div class="info-line diagnosis-line">
                <span class="fixed">Diagnosis / Signs and Symptoms:</span>
                ${bind("clinical")}

              </div>
            </div>

        `;
      }

      function signatureBox() {
        return `
          <div class="signature-box">
            <div>
              <span>Doctor's Name, Signature &amp; Clinic Chop:</span>
              <span class="signature-rule">${bind("doctor")}</span>
            </div>

            <div>
              <span>Patient's Signature:</span>
              <span class="signature-rule"></span>
            </div>
          </div>
        `;
      }

      function directory(rows, plan, options = {}) {
        const isBupa = plan === "b";
        const widths = isBupa
          ? [4, 16, 104, 40, 22]
          : [4, 15, 85, 33, 25, 24];

        const header = options.noHeader
          ? ""
          : `
            <thead>
              <tr>
                <th></th>
                <th>District</th>
                <th>Centre</th>
                <th>Service</th>
                <th>Tel</th>
                ${isBupa ? "" : "<th>Fax</th>"}
              </tr>
            </thead>
          `;

        const body = rows.map((row, index) => {
          const label = `選擇 ${row.name} ${row.district} ${row.address}`;

          return `
            <tr class="r${index}">
              <td class="pick">
                <input
                  type="checkbox"
                  class="paper-check"
                  data-centre="${plan}-${options.offset || 0}-${index}"
                  aria-label="${escapeHTML(label)}"
                >
              </td>

              <td class="district">
                ${escapeHTML(row.district)}<br>
                <span class="cn">${escapeHTML(row.districtCN)}</span>
              </td>

              <td>
                <div class="centre-name">
                  ${escapeHTML(row.name)}
                  <span class="cn">${escapeHTML(row.cn)}</span>
                  ${row.name === OTIC ? "" : " *"}
                </div>

                <div>${escapeHTML(row.address)}</div>
                <div class="cn">${escapeHTML(row.addressCN)}</div>
              </td>

              <td class="service">${escapeHTML(row.service)}</td>
              <td class="tel">${escapeHTML(row.tel)}</td>
              ${isBupa ? "" : `<td class="fax">${escapeHTML(row.fax)}</td>`}
            </tr>
          `;
        }).join("");

        const otherRow = isBupa
          ? `
            <tr class="other-row">
              <td class="pick">
                <input
                  type="checkbox"
                  class="paper-check"
                  data-centre="b-other"
                  aria-label="Other Bupa designated centre"
                >
              </td>

              <td colspan="4">
                Other Bupa designated centre
                (please remind patient to check with Bupa for updated centre details)
              </td>
            </tr>
          `
          : "";

        return `
          <table class="directory ${isBupa ? "b-directory" : "h-directory"}">
            <colgroup>
              ${widths.map(width => `<col style="width:${width}mm">`).join("")}
            </colgroup>
            ${header}
            <tbody>${body}${otherRow}</tbody>
          </table>
        `;
      }

      function buildDACentreTable(rows, pageNumber, showHeader) {
        let previousDistrict = null;

        const body = rows.map((row, index) => {
          if (row.region) {
            previousDistrict = null;

            return `
              <tr class="da-region">
                <th colspan="4">${escapeHTML(row.region)}</th>
              </tr>
            `;
          }

          const district = DA_DISTRICTS[row.district];
          let districtCell = "";

          if (row.district !== previousDistrict) {
            let rowspan = 1;

            for (let next = index + 1; next < rows.length; next++) {
              if (
                rows[next].region ||
                rows[next].district !== row.district
              ) {
                break;
              }

              rowspan++;
            }

            districtCell = `
              <td class="da-centres-district" rowspan="${rowspan}">
                ${escapeHTML(district[0])}
                <span>${escapeHTML(district[1])}</span>
              </td>
            `;
          }

          previousDistrict = row.district;

          const label = `選擇 ${row.name} — ${district[0]} — ${row.address}`;

          return `
            <tr>
              ${districtCell}

              <td>
                <label class="da-centres-name">
                  <input
                    type="checkbox"
                    class="paper-check"
                    data-centre="da-centre-${pageNumber}-${index}"
                    aria-label="${escapeHTML(label)}"
                  >
                  ${escapeHTML(row.name)}
                  ${row.starred ? " *" : ""}
                </label>

                <div class="da-centres-address">
                  ${escapeHTML(row.address)}
                </div>
              </td>

              <td class="da-centres-service">
                ${escapeHTML(row.service)}
              </td>

              <td class="da-centres-tel">${escapeHTML(row.tel)}${
                row.booking
                  ? '<div class="da-centres-booking">Booking Hotline:<br>8100 0501</div>'
                  : ""
              }</td>
            </tr>
          `;
        }).join("");

        return `
          <table class="da-centres-table">
            <colgroup>
              <col style="width:19mm">
              <col style="width:108mm">
              <col style="width:33mm">
              <col style="width:26mm">
            </colgroup>

            ${showHeader ? `
              <thead>
                <tr>
                  <th colspan="2">Centre</th>
                  <th>Service*</th>
                  <th>Tel</th>
                </tr>
              </thead>
            ` : ""}

            <tbody>${body}</tbody>
          </table>
        `;
      }

      function buildDACentrePage(rows, pageNumber) {
        const first = pageNumber === 2;

        return `
          <article
            class="page da-centres-page ${first ? "" : "continuation"}"
            aria-label="DA01 centre list page ${pageNumber} of 4"
          >
            <div class="paper-content">
              <header class="da-centres-head">
                ${logo()}
                <div class="da-centres-confidential">CONFIDENTIAL</div>

                ${first ? `
                  <div class="da-centres-note">
                    ** Booking for service of Lab test, ECG &amp;
                    X-ray are NOT required.
                  </div>
                ` : ""}
              </header>

              ${buildDACentreTable(rows, pageNumber, first)}
            </div>

            <footer class="da-centres-footer">
              <div></div>
              <div class="page-number">
                Page&nbsp; ${pageNumber}&nbsp; of&nbsp; 4
              </div>
              <div class="updated">Last update: 20260305</div>
            </footer>
          </article>
        `;
      }

      function getData() {
        const data = {
          ...state,
          dateDisplay: displayDate(text("date")),

          testLab: joinText([
            text("sxLab"),
            text("sxXrayEcg")
          ]),

          testAdvanced: text("sxMriCt"),
          testImaging: text("sxUltrasoundEtc"),
          testOther: text("sxOther"),

          clinical: joinText([
            text("diagnosis"),
            text("symptoms")
          ], "; ")
        };

        data.bcClinical = joinText([
          data.clinical,
          text("onset") ? `Onset / Duration: ${text("onset")}` : ""
        ]);

        const bcRows = [
          text("sxLab"),
          joinText([text("sxXrayEcg"), text("sxUltrasoundEtc")]),
          text("sxMriCt")
        ];

        if (
          text("sxOther") &&
          ["1", "2", "3"].includes(text("sxOtherRow"))
        ) {
          const index = Number(text("sxOtherRow")) - 1;
          bcRows[index] = joinText([bcRows[index], text("sxOther")]);
        }

        [
          data.bcLabTests,
          data.bcImagingTests,
          data.bcAdvancedTests
        ] = bcRows;

        data.aiaSymptoms = joinText([
          text("symptoms"),
          text("onset") ? `Onset / Duration: ${text("onset")}` : "",
          text("aiaFrequency") ? `Frequency: ${text("aiaFrequency")}` : ""
        ]);

        data.aiaServices = joinText([
          ...TEST_DEFINITIONS.map(([key]) => data[key]),
          text("aiaAdditionalServices")
        ]);

        const requestedTests = joinText(
          TEST_DEFINITIONS.map(([key]) => data[key]),
          "; "
        );

        data.apPlanned = joinText([
          requestedTests,
          text("apTreatment")
        ], "; ");

        const pastAnswer = text("apHadTests") === "Y"
          ? "Yes."
          : text("apHadTests") === "N"
            ? "No."
            : "";

        data.apPastDisplay = joinText([
          pastAnswer,
          text("apPastTests")
        ]);

        [
          "apFirstConsult",
          "apLmp",
          "apAdmission",
          "apDischarge"
        ].forEach(key => {
          data[key + "Display"] = displayDate(text(key));
        });

        return data;
      }

      function hasTests(data) {
        return TEST_DEFINITIONS.some(([key]) => {
          return String(data[key] ?? "").trim();
        });
      }

      function missingBlueCrossAssignment() {
        return Boolean(
          text("sxOther") &&
          !["1", "2", "3"].includes(text("sxOtherRow"))
        );
      }


function updateSharedTestWarning() {
        const warning = $("#shared-test-warning");

        const missing =
          blueCrossInContext() &&
          missingBlueCrossAssignment();

        warning.hidden = !missing;

        warning.textContent = missing
          ? "Other tests 尚未指定 Blue Cross 顯示行，暫時不會出現在 N4。請在上方選擇位置。"
          : "";
      }

      function syncInputs(force = false) {
        $$(".sidebar [data-key]").forEach(control => {
          const value = String(state[control.dataset.key] ?? "");

          if (control.type === "radio") {
            control.checked = control.value === value;
            return;
          }

          if (!force && control === document.activeElement) {
            return;
          }

          if (control.value !== value) {
            control.value = value;
          }
        });
      }



      function renderValues(data) {
        $$("[data-bind]").forEach(element => {
          element.textContent = String(data[element.dataset.bind] ?? "");
        });

        $$("[data-mark]").forEach(element => {
          element.classList.toggle(
            "checked",
            data[element.dataset.mark] === element.dataset.equals
          );
        });

        syncInputs();
        updateSharedTestWarning();
      }

      /* =====================================================
         13. 驗證及列印
         -----------------------------------------------------
         - 按鈕列印前檢查文字／頁面溢出及資料一致性。
         - 不自動縮字，不自行刪除病史。
         - Ctrl+P 不經本程式的按鈕驗證流程。
         - 驗證失敗時保留待印頁面及紅框，方便核對。
         ===================================================== */

      function visiblePages() {
        return $$(".form-group:not([hidden]) .page");
      }

      function checkOverflow() {
        clearHighlights();

        const problems = [];

        visiblePages().forEach((page, index) => {
          const pageNumber = index + 1;

          page.querySelectorAll(".v").forEach(element => {
            if (!element.textContent.trim()) return;

            const style = getComputedStyle(element);

            // 行內 span 沿用原版檢查方式，不以 clientHeight 判斷。
            if (style.display === "inline") return;

            let overflow =
              element.scrollHeight > element.clientHeight + 2 ||
              element.scrollWidth > element.clientWidth + 2;

            const parent = element.parentElement;

            if (parent && getComputedStyle(parent).overflow === "hidden") {
              const elementRect = element.getBoundingClientRect();
              const parentRect = parent.getBoundingClientRect();

              overflow = overflow ||
                elementRect.bottom > parentRect.bottom + 1 ||
                elementRect.right > parentRect.right + 1;
            }

            if (overflow) {
              element.classList.add("over-limit");

              problems.push(
                `第 ${pageNumber} 頁：${element.dataset.bind || "文字欄位"}`
              );
            }
          });

          const content = page.querySelector(".paper-content");

          if (!content) return;

          const pageRect = page.getBoundingClientRect();
          const contentBottom = content.getBoundingClientRect().bottom;
          const paddingBottom = parseFloat(
            getComputedStyle(page).paddingBottom
          );

          if (contentBottom > pageRect.bottom - paddingBottom + 2) {
            content.classList.add("over-limit");
const pxPerMm = pageRect.height / 297;

const excessMm = (
  (contentBottom - (pageRect.bottom - paddingBottom)) / pxPerMm
).toFixed(1);

const remainingMm = (
  (pageRect.bottom - contentBottom) / pxPerMm
).toFixed(1);

problems.push(
  `第 ${pageNumber} 頁：整頁內容超出預留高度` +
  `\n超出預留範圍：${excessMm} mm` +
  `\n內容底部距離紙張底部：${remainingMm} mm` +
  `（負數代表已超出紙張）`
);
          }
        });

        return problems;
      }

      function validatePlanData(plans) {
        const problems = [];

        if (plans.includes("bc") && missingBlueCrossAssignment()) {
          problems.push("Blue Cross：Other tests 尚未指定顯示行");
        }

        if (plans.includes("aiaPA")) {
          const checks = [
            [
              "apReferred",
              "apReferringDetails",
              "第 4 項選了 No，但仍有轉介醫生資料，請核對。"
            ],
            [
              "apHadTests",
              "apPastTests",
              "第 6 項選了 No，但仍有已完成檢查／結果，請核對。"
            ],
            [
              "pregnancy",
              "apLmp",
              "第 8 項選了 No，但仍填有「如是」的 LMP 日期，請核對。"
            ],
            [
              "apNightBefore",
              "apNightReason",
              "第 14 項選了 No，但仍填有手術前一晚入院原因，請核對。"
            ]
          ];

          checks.forEach(([answerKey, detailKey, message]) => {
            if (text(answerKey) === "N" && text(detailKey)) {
              problems.push("AIA Prior Auth：" + message);
            }
          });
        }

        return problems;
      }

      function markLastPrintPage() {
        $$(".last-print").forEach(page => {
          page.classList.remove("last-print");
        });

        const pages = visiblePages();

        if (pages.length) {
          pages[pages.length - 1].classList.add("last-print");
        }

        return pages.length;
      }

      function finishPrint() {
        if (!printing) return;

        printing = false;

        $$(".last-print").forEach(page => {
          page.classList.remove("last-print");
        });

        setActive(activeForm);
      }

      async function printPlans(requestedPlans) {
        if (printing || preparingPrint) return;

        const plans = [...new Set(requestedPlans)]
          .filter(plan => FORM_BY_ID[plan]);

        if (!plans.length) {
          alert("請先選擇至少一份表格。");
          return;
        }

        preparingPrint = true;

        try {
          showPlans(plans);
          refresh();

          if (document.fonts?.ready) {
            await document.fonts.ready;
          }

          await new Promise(resolve => requestAnimationFrame(resolve));

          const problems = [...new Set([
            ...checkOverflow(),
            ...validatePlanData(plans)
          ])];

          if (problems.length) {
            setStatus(
              "未列印：有文字／頁面超出空間，或資料需要核對。請檢查提示及紅框。",
              true
            );

            alert(
              "未列印，請先處理以下問題：\n\n" +
              problems.join("\n") +
              "\n\n請核對資料或縮短欄位內容。" +
              "\n如為整頁溢出，需校準表格字型或間距。" +
              "\n唔會自動截走文字或將表格縮細。"
            );

            return;
          }

          const pageCount = markLastPrintPage();

          printing = true;

          setStatus(
            `準備列印 ${pageCount} 頁。` +
            "請於預覽選 A4、100%、無邊界、關閉頁首／頁尾。"
          );

          window.print();
        } catch (error) {
          finishPrint();
          console.error("列印準備失敗：", error);
          setStatus("列印準備失敗，請重新檢查頁面。", true);
        } finally {
          preparingPrint = false;
        }
      }

      }

     function bindEvents() {
        const sidebar = $(".sidebar");

        function handleFieldChange(event) {
          const control = event.target;

          if (!control.matches("[data-key]")) return;

          // Radio 只處理已選中的選項。
          if (control.type === "radio" && !control.checked) {
            return;
          }

          const key = control.dataset.key;
          const value = control.value;

          // 同時監聽 input / change，避免同一值重複更新。
          if (state[key] === value) return;

          state[key] = value;

          clearHighlights();
          refresh();
          setStatus("");
        }

        sidebar.addEventListener("input", handleFieldChange);
        sidebar.addEventListener("change", handleFieldChange);

        sidebar.addEventListener("change", event => {
          if (!event.target.matches(".print-pick")) return;

          // 批次加入 Blue Cross 時，立即顯示需要的行位設定。
          updateSharedTestWarning();
          updateSidebar();
        });

        $("#tabs").addEventListener("click", event => {
          const button = event.target.closest("[data-tab]");

          if (button) {
            setActive(button.dataset.tab);
          }
        });

        $("#reset").addEventListener("click", () => {
          if (confirm(
            "清空病人、醫生、各計劃卡號、臨床資料及所有表格剔選？"
          )) {
            clearAll();
          }
        });

        $("#demo").addEventListener("click", loadDemo);

        $("#printCurrent").addEventListener("click", () => {
          printPlans([activeForm]);
        });

        $("#printSelected").addEventListener("click", () => {
          const plans = $$(".print-pick:checked")
            .map(checkbox => checkbox.value);

          printPlans(plans);
        });

        window.addEventListener("afterprint", finishPrint);
      }

      function init() {
        buildInputPanels();
        buildFormNavigation();
        buildFormPages();
        initialiseState();
        bindEvents();

        syncInputs(true);
        setActive(DEFAULT_FORM);
      }

      init();
    })();
  </script>
</body>
</html>
