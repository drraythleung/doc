 <!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dr Ray CMS｜診所管理系統</title>
<style>
:root{
 --bg:#edf2f4;--panel:#fff;--ink:#172a30;--muted:#5b6e76;
 --line:#d5e0e4;--accent:#235f54;--soft:#eaf4ef;
 --warn:#775516;--warnbg:#fff7df;--bad:#a32e35;--badbg:#fff0f1;
 font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{
 min-height:38px;
 padding:8px 12px;
 border:1px solid var(--line);
 border-radius:7px;
 background:#fff;
 font-weight:500;
 line-height:1.4;
 cursor:pointer;
}

button:hover:not(:disabled){
 background:var(--soft);
}

button.primary{
 background:var(--accent);
 border-color:var(--accent);
 color:#fff;
}

button.primary:hover:not(:disabled){
 background:#1c4e45;
 border-color:#1c4e45;
}

button.danger{
 color:var(--bad);
}

button.danger:hover:not(:disabled){
 background:var(--badbg);
 border-color:#e2b3b8;
}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px;border:1px solid #bfced5;border-radius:7px;background:#fff}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:86px;line-height:1.65;resize:vertical;overflow-y:hidden}
input[readonly],textarea[readonly],fieldset:disabled input,fieldset:disabled textarea{background:#f1f5f6}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{
 outline:3px solid #a5cbbd;outline-offset:2px
}
fieldset{border:0;padding:0;margin:0;min-width:0}
label{display:block;font-size:12px;color:#425d67;margin-bottom:5px;line-height:1.6}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px}
small,.small{font-size:12px;color:var(--muted);line-height:1.7}
.hidden,[hidden]{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{margin-bottom:13px;min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);margin:10px 0}
.check input{margin-top:4px;flex:none}
.card,.item{padding:15px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
.item{background:#fbfdfd;margin-top:10px}
.notice{padding:10px 14px;border:1px solid #dfd0a4;border-radius:8px;background:var(--warnbg);color:var(--warn);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.notice.error{background:var(--badbg);border-color:#e2b3b8;color:var(--bad)}
.pill{display:inline-block;padding:3px 8px;background:var(--soft);border-radius:20px;font-size:11px}
summary{cursor:pointer;line-height:1.7;font-weight:bold}
details[open]>summary{margin-bottom:12px}
.menu{position:relative}
.menu>summary{list-style:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;font-weight:normal}
.menu>summary::after{content:" ▾"}
.menu[open]>summary{margin:0}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:240px;max-height:65dvh;overflow:auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #172a3026}
.menu-panel button{display:block;width:100%;text-align:left;margin:3px 0}
#login{max-width:620px;margin:7vh auto;padding:20px}
#app:not(.hidden){height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header.appbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:15px;font-weight:bold}
.brand small{display:block;font-weight:normal}
#notice{
 flex:none;
 border-radius:0;
 padding:7px 16px;
 font-size:12px;
}

#notice.app-notice:not(.error){
 background:#f1f6f8;
 border-color:var(--line);
 color:var(--muted);
}
#workbar{flex:none;background:#f8fafb;padding:10px 16px;border-bottom:1px solid var(--line)}
#identity{
 font-size:18px;
 font-weight:bold;
 line-height:1.65;
 overflow-wrap:anywhere;
}
#visitState{line-height:1.8;white-space:pre-wrap}
#saveState{font-size:12px;line-height:1.7;font-weight:bold;overflow-wrap:anywhere}
#workActions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
 #workActions>.row{
 gap:8px;
}

#saveButton,
#issueButton,
#completeButton{
 min-width:104px;
}
#tabs{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

#tabs button{
 min-width:64px;
 min-height:58px;
 padding:9px 14px;
 font-size:15px;
 font-weight:bold;
 line-height:1.4;
}

#tabs button.active{
 background:var(--accent);
 color:#fff;
 border-color:var(--accent);
}

#tabs small{
 display:block;
 margin-top:3px;
 font-size:12px;
 color:inherit;
}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--edit-width,50%)) 10px minmax(0,1fr)}
.editor,.reference{min-height:0;min-width:0;overflow:auto;padding:14px;overscroll-behavior:contain;overflow-anchor:none}
.editor{background:#f8fafb}
#split{background:#dce6e9;cursor:col-resize;touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:3px;top:45%;width:4px;height:48px;background:#8fa7ae;border-radius:5px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h3{margin:0}
.soap-section{padding-top:13px;margin-top:10px;border-top:1px solid var(--line)}
.soap-section:first-of-type{margin-top:0}
.shared-context{padding:10px 13px;background:#f1f6f8;border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
.shared-context>summary{font-size:12px;font-weight:normal}
.shared-context[open]>summary{margin-bottom:12px}
#allergyPanel{margin-top:10px}
#allergyButton[data-state=known]{background:#b52e3a;color:#fff;border-color:#b52e3a}
#allergyButton[data-state=none]{background:#237348;color:#fff;border-color:#237348}
#allergyButton[data-state=unknown]{background:#e1e5e9}
#referenceTabs{position:sticky;top:-14px;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px}
#referenceTabs button{flex:1}
#referenceTabs button.active{background:var(--accent);color:#fff}
#pastBody{line-height:1.8}
.past-text{white-space:pre-wrap;overflow-wrap:anywhere}
#paperViewport{overflow:auto;padding:5px 0 20px}
#paperScale{position:relative;margin:auto}
#paper{transform-origin:top left}
#previewOptions{margin:12px 0}
#zoom{width:auto}
dialog{width:min(1000px,95vw);max-height:90dvh;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:12px;color:var(--ink)}
dialog::backdrop{background:#122b3688}
.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.dialoghead h2{margin:0}
#secretDialog,#leaveDialog{width:min(480px,95vw)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:14px;margin-top:15px;border-top:1px solid var(--line)}
table.ui{width:100%;border-collapse:collapse;font-size:12px}
table.ui th,table.ui td{padding:9px;border:1px solid var(--line);text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.scrolltable{overflow:auto}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7}
.diffOld{background:#fff0f1}.diffNew{background:#eaf5ec}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.profile-value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.signatureThumb{max-width:200px;max-height:80px}
.linked{background:var(--soft)}
#printRoot{display:none}
.paper{
 width:210mm;min-height:297mm;padding:17mm 18mm 18mm;background:#fff;color:#000;
 box-shadow:0 7px 28px #16333e18;overflow-wrap:anywhere;
 font-family:Arial,"DFKai-SB","BiauKai","標楷體",serif;font-size:11pt;line-height:1.45
}
.paper *{color:#000;border-color:#000}
.paper .letterhead{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:3mm}
.paper .doctor{font-size:14pt;font-weight:bold;line-height:1.25}
.paper .qual{font-size:9.8pt;white-space:pre-line;line-height:1.25}
.paper .contact{margin-top:5mm;padding-bottom:3mm;border-bottom:1px solid;font-size:10pt;white-space:pre-line}
.paper .title{text-align:center;font-size:14pt;font-weight:bold;margin:4mm 0;break-after:avoid}
.paper .state{border:2px solid;padding:3mm;white-space:pre-wrap;margin:3mm 0;break-inside:avoid}
.paper .patient{border-top:1px solid;border-bottom:1px solid;padding:3mm 0;margin-bottom:5mm;break-inside:avoid}
.paper .patientgrid{display:grid;grid-template-columns:30mm 1fr 21mm 1fr;gap:2mm}
.paper .full{grid-column:2/-1}
.paper .section{margin:5mm 0}
.paper h2,.paper h3{font-size:11pt;margin:0 0 2mm;break-after:avoid}
.paper .txt{white-space:pre-wrap;orphans:3;widows:3}
.paper p{margin:0 0 4mm;orphans:3;widows:3}
.paper .sub{margin:4mm 0;border-top:1px solid;padding-top:3mm}
.paper .recipient{white-space:pre-wrap;margin-bottom:5mm}
.paper .leave{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;border-top:1px solid;border-bottom:1px solid;padding:4mm 0;margin:5mm 0;break-inside:avoid}
.paper .leave strong,.paper .leave span{display:block}
.paper .allergy{border:2px solid;padding:3mm;white-space:pre-wrap;break-inside:avoid;margin-bottom:5mm}
.paper table{width:100%;table-layout:fixed;border-collapse:collapse;font:inherit;margin:4mm 0}
.paper th,.paper td{padding:3mm 2mm;border-bottom:1px solid;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.paper th{border-top:1px solid}
.paper thead{display:table-header-group}
.paper tr{break-inside:avoid;page-break-inside:avoid}
.paper .total{border-top:1px solid;padding-top:3mm;text-align:right;font-weight:bold;break-inside:avoid}
.paper .signature{width:78mm;margin:12mm 0 0 auto;break-inside:avoid}
.paper .signature .space{height:18mm;display:flex;align-items:flex-end;padding-bottom:2mm}
.paper .signature img{max-width:48mm;max-height:16mm;object-fit:contain}
.paper .signature .line{border-top:1px solid;padding-top:3mm}
.paper .footer{font-size:10pt;border-top:1px solid;padding-top:3mm;margin-top:8mm;break-inside:avoid}
.paper .end{text-align:center;margin-top:8mm}
@media(max-width:820px){
 #app:not(.hidden){height:auto;min-height:100dvh;overflow:visible}
 .layout{display:block}.editor,.reference{overflow:visible}
 #split{display:none}.grid,.profile-grid{grid-template-columns:1fr}
 #workActions{align-items:stretch}#workActions>.row{width:100%}
 #referenceTabs{position:relative;top:auto}
 .menu-panel{max-width:85vw}
}
@page{size:A4;margin:17mm 18mm 18mm}
@media print{
 body>*{display:none!important}
 body>#printRoot{display:block!important}
 #printRoot>.paper{width:auto;min-height:0;padding:0;margin:0;box-shadow:none;transform:none}
 #printRoot>.paper+.paper{break-before:page;page-break-before:always}
}
 /* 病人主檔：家人及診症清單使用緊湊表格，不影響其他表單 */
#modal table.ui.profile-compact{
 width:100%;
 font-size:12px;
}

#modal table.ui.profile-compact th,
#modal table.ui.profile-compact td{
 padding:6px 8px;
 line-height:1.45;
 white-space:normal;
 vertical-align:middle;
}

#modal table.ui.profile-compact th{
 background:#f5f8f9;
}

#modal table.ui.profile-compact button{
 min-height:28px;
 padding:3px 7px;
 border-radius:5px;
 font-size:12px;
 line-height:1.4;
}

#modal table.ui.profile-compact .nowrap{
 white-space:nowrap;
}

#modal table.ui.profile-compact .table-link{
 min-height:0;
 padding:0;
 border:0;
 border-radius:0;
 background:transparent;
 color:var(--accent);
 text-align:left;
}

#modal table.ui.profile-compact .table-link:hover:not(:disabled){
 background:transparent;
 text-decoration:underline;
}

#modal table.ui.profile-compact .inline-meta{
 margin-left:5px;
 font-size:11px;
 color:var(--muted);
}

#modal table.ui.profile-compact .current-mark{
 margin-left:4px;
 font-size:11px;
 color:var(--accent);
}

#modal table.ui.profile-compact.family-table{
 min-width:680px;
}

#modal table.ui.profile-compact.encounter-table{
 min-width:620px;
}
</style>
</head>
<body>
<section id="login">
 <div class="card">
  <h1>Dr Ray's Clinical Management System</h1>
  <p class="small">診所管理系統｜請登入以繼續</p>
  <form id="loginForm">
   <div class="field"><label for="email">電郵帳戶</label><input id="email" type="email" autocomplete="username" required></div>
   <div class="field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required></div>

<div hidden>
 <input id="projectUrl" type="url">
 <input id="projectKey" autocomplete="off">
 <input id="clinicId">
 <input id="doctorId">
</div>

   <button id="loginButton" class="primary" style="margin-top:12px">登入</button>
   <p id="loginMessage" class="small" role="status"></p>
  </form>
 </div>
</section>

<div id="app" class="hidden">
 <header class="appbar">
  <div class="brand">梁子恒醫生 CMS <small id="sessionLabel"></small></div>
  <nav class="row" aria-label="全診所功能">
   <button data-act="choosePatient" class="primary">開始診症</button>
   <button data-act="registerPatient">登記病人</button>
   <button data-act="registry">病人名單</button>
   <button data-act="followups">檢查跟進</button>
   <details class="menu">
    <summary>管理及設定</summary>
    <div class="menu-panel">
     <button data-act="history">診症及文件紀錄</button>
     <button data-act="catalogue">檢查目錄</button>
     <button data-act="templates">範本管理</button>
     <button data-act="backup">備份及還原</button>
     <button data-act="settings">設定</button>
     <button data-act="quality">系統狀態及檢查</button>
     <button data-act="logout" class="danger">登出</button>
    </div>
   </details>
  </nav>
 </header>
<div id="notice" class="notice app-notice" role="status">正在啟動系統…</div>
 <section id="workbar">
  <div class="row between">
   <div style="flex:1;min-width:0">
    <div id="identity"></div>
    <div id="visitState" class="small"></div>
    <div id="saveState" role="status" aria-live="polite"></div>
   </div>
   <div class="row">
    <button data-act="patientProfile" id="profileButton">本病人資料</button>
    <button data-act="allEncounters" id="allEncountersButton">所有診症</button>
    <button data-act="toggleAllergy" id="allergyButton" aria-expanded="false">？N/KDA</button>
    <button data-act="return" id="returnButton" hidden>返回本次診症</button>
   </div>
  </div>
  <div id="syncNotice" hidden class="row" style="margin-top:8px">
   <span class="small">主檔身份／聯絡資料與本次不同。</span>
   <button data-act="syncMaster">核對並同步至本次</button>
  </div>
  <section id="allergyPanel" class="card" hidden>
   <h3>藥物敏感及本次覆核</h3>
   <fieldset id="allergyFields"></fieldset>
   <p class="small">系統不進行藥物敏感、交互作用或劑量核對。修改敏感紀錄會取消本次覆核。</p>
  </section>
  <div id="workActions">
   <div id="tabs" aria-label="診症及文件"></div>
   <div class="row">
    <button data-act="save" id="saveButton">儲存草稿</button>
    <button data-act="issue" id="issueButton" class="primary">簽發文件</button>
    <button data-act="complete" id="completeButton">完成診症</button>
    <details class="menu">
     <summary>列印／更多操作</summary>
     <div class="menu-panel">
      <button data-act="print" id="printButton">列印目前文件／儲存 PDF</button>
      <button data-act="batch">選擇多份列印</button>
      <button data-act="diff" id="diffButton">比較版本</button>
      <button data-act="history">文件紀錄及交付</button>
     </div>
    </details>
   </div>
  </div>
 </section>

 <div class="layout" id="layout">
  <aside class="editor" id="editor">
   <div id="validation" class="notice error" role="alert" hidden></div>
   <div id="emptyEditor" class="card" hidden>
    <h2>尚未開啟診症</h2>
    <p>請先搜尋病人並開始診症，或從病人名單開啟既有紀錄。</p>
    <button data-act="choosePatient" class="primary">開始診症</button>
   </div>
   <fieldset id="editorFields"></fieldset>
  </aside>
  <div id="split" tabindex="0" role="separator" aria-label="調整左右欄闊度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75"></div>
  <main class="reference" id="reference">
   <div id="referenceTabs">
   <button data-act="pastPane" id="pastTab">所有診症</button>
   <button data-act="previewPane" id="previewTab">目前文件預覽</button>
   </div>
   <section id="pastPanel" hidden>
    <div class="row" style="margin-bottom:12px">
     <button data-act="older">← 較舊</button>
     <select id="pastPicker" style="flex:1;min-width:130px" aria-label="選擇診症紀錄"></select>
     <button data-act="newer">較新 →</button>
    </div>
    <p class="small">此處僅供參閱。切換日期不會更改左側正在處理的診症，亦不會更改儲存、完成診症或列印的對象。</p>
    <div id="pastBody"></div>
   </section>
   <section id="previewPanel">
    <p id="workflow" class="small"></p>
    <div id="previewOptions" class="row">
     <label for="zoom" style="margin:0">預覽比例</label>
     <select id="zoom"><option value="fit">適合寬度</option><option value=".75">75%</option><option value="1">100%</option><option value="1.25">125%</option></select>
    </div>
    <div id="paperViewport"><div id="paperScale"><article id="paper" class="paper"></article></div></div>
   </section>
  </main>
 </div>
</div>

<dialog id="modal">
 <div class="dialoghead"><h2 id="modalTitle"></h2><button id="modalClose" type="button">關閉</button></div>
 <div id="modalError" class="notice error" role="alert" hidden></div>
 <div id="modalBody"></div>
</dialog>
<dialog id="secretDialog">
 <form id="secretForm">
  <h2 id="secretTitle"></h2><p id="secretHint" class="small"></p>
  <div class="field"><label for="secret1">密碼</label><input id="secret1" type="password" autocomplete="off" required></div>
  <div class="field" id="secretSecond"><label for="secret2">再次輸入</label><input id="secret2" type="password" autocomplete="off"></div>
  <p id="secretError" class="small"></p>
  <div class="row"><button class="primary">確定</button><button id="secretCancel" type="button">取消</button></div>
 </form>
</dialog>
<dialog id="leaveDialog">
 <h2>表單尚未保存</h2>
 <p>此表單尚有未儲存的修改。請選擇繼續編輯、儲存後離開，或捨棄修改。如未能儲存，系統將保留原有表單及輸入內容。</p>
 <div class="row">
  <button id="leaveStay" type="button" class="primary">繼續編輯</button>
  <button id="leaveSave" type="button">儲存後離開</button>
  <button id="leaveDiscard" type="button" class="danger">捨棄修改</button>
 </div>
</dialog>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<div id="printRoot"></div>

<script>
"use strict";

/* Dr Ray CMS Stage 4
   Schema 5 與既有備份格式保留。
   雲端使用 ray-clinic-auth-workspace；下載備份使用 AES-GCM。
   未連接後端作實機驗收。
*/
const VERSION="5.0.0-stage4", SCHEMA=5, ITERATIONS=600000, MAXFILE=50*1024*1024;
const $=id=>document.getElementById(id);
const S=x=>String(x??""), T=x=>S(x).trim();
const O=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
const C=x=>JSON.parse(JSON.stringify(x));
const E=x=>S(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
const TYPES={
 note:["診症","PROGRESS NOTE","診症紀錄"],
 referral:["轉介","REFERRAL LETTER","轉介信"],

function uid(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("")}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateOK(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(S(s)))return false;
 const d=new Date(s+"T12:00:00");
 return Number.isFinite(d.getTime())&&d.getFullYear()===+s.slice(0,4)&&d.getMonth()+1===+s.slice(5,7)&&d.getDate()===+s.slice(8,10)
}
function fmt(s){return dateOK(s)?new Date(s+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):"—"}
function stamp(s){const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleString("en-GB",{hour12:false}):"—"}
function cnDate(s){return dateOK(s)?`${+s.slice(0,4)}年${+s.slice(5,7)}月${+s.slice(8,10)}日`:"—"}
function age(d,b){
 if(!dateOK(d)||!dateOK(b)||d>b)return "";
 let m=(+b.slice(0,4)-+d.slice(0,4))*12 + +b.slice(5,7)-+d.slice(5,7);
 if(+b.slice(8,10)<+d.slice(8,10))m--;
 return m<0?"":`${Math.floor(m/12)}y${m%12}m`
}

function normID(s){s=S(s).replace(/\s/g,"").toUpperCase();const m=s.match(/^([A-Z]{1,2}\d{6})([0-9A])$/);return m?m[1]+"("+m[2]+")":s}
function mask(s,mode="partial"){
 s=normID(s);if(!s)return "—";if(mode==="full")return s;
 const m=s.match(/^([A-Z]{1,2})(\d{6})(?:\([0-9A]\))?$/);
 return m?m[1]+m[2].slice(0,3)+"***":s.length<4?"***":s.slice(0,3)+"*".repeat(Math.min(12,s.length-3))
}

/* Supabase：同一 revision 寫入；不自動重送結果不明的寫入。 */
async function cloudHTTP(path,{method="GET",body,authorized=true}={}){
 if(authorized)await ensureSession();
 const headers={apikey:cloud.key,"Content-Type":"application/json"};
 if(authorized)headers.Authorization="Bearer "+cloud.session.access_token;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
 let response,text;
 try{
  response=await fetch(cloud.url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:"no-store",credentials:"omit"});
  text=await response.text()
 }catch(e){
  const error=new Error(e.name==="AbortError"?"雲端請求逾時；結果未確認。":"無法完成雲端請求；結果未確認。");
  error.unknownResult=true;throw error
 }finally{clearTimeout(timeout)}
 let data=null;
 if(text){try{data=JSON.parse(text)}catch{const e=new Error("雲端回應無法解析");e.unknownResult=method!=="GET";throw e}}
 if(!response.ok){
  const e=new Error(data?.message||data?.error_description||data?.msg||"雲端請求失敗："+response.status);
  e.code=data?.code;
  if(response.status>=500)e.unknownResult=method!=="GET";
  throw e
 }
 return data
}

  const value=await cloudHTTP("/auth/v1/token?grant_type=refresh_token",{method:"POST",authorized:false,body:{refresh_token:cloud.session.refresh_token}});

}

/* 備份格式與舊版一致。 */
function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
function unb64(s,max=MAXFILE*2){
 assert(typeof s==="string"&&s.length<=max&&/^[A-Za-z0-9+/]*={0,2}$/.test(s),"密文編碼無效");
 return Uint8Array.from(atob(s),c=>c.charCodeAt(0))
}
async function hash(x){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(typeof x==="string"?x:serial(x)))),b=>b.toString(16).padStart(2,"0")).join("")}
async function derive(password,salt){return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt,100),iterations:ITERATIONS,hash:"SHA-256"},await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function encryptionHeader(purpose,salt){return {format:"ray-clinic-encrypted",version:1,purpose,kdf:"PBKDF2-SHA256",iterations:ITERATIONS,salt,algorithm:"AES-256-GCM"}}
function checkEnvelope(v){
 assert(O(v)&&v.format==="ray-clinic-encrypted"&&v.version===1,"加密格式不支援");
 choice(v.purpose,["vault","backup","drill"],"加密用途");
 assert(v.kdf==="PBKDF2-SHA256"&&v.iterations===ITERATIONS&&v.algorithm==="AES-256-GCM","加密參數不支援");
 assert(unb64(v.salt,100).length===16&&unb64(v.iv,100).length===12,"Salt／IV 無效");
 assert(typeof v.ciphertext==="string"&&v.ciphertext.length<=MAXFILE*2,"密文過大")
}
async function seal(value,key,salt,purpose){
 const h=encryptionHeader(purpose,salt),iv=crypto.getRandomValues(new Uint8Array(12));
 const result=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:enc.encode(serial(h)),tagLength:128},key,enc.encode(JSON.stringify(value)));
 return {...h,iv:b64(iv),ciphertext:b64(new Uint8Array(result))}
}
async function unseal(v,key){
 checkEnvelope(v);
 try{
  const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.iv,100),additionalData:enc.encode(serial(encryptionHeader(v.purpose,v.salt))),tagLength:128},key,unb64(v.ciphertext));
  return parse(dec.decode(raw))
 }catch{throw new Error("密碼不符或密文損壞；沒有修改現有資料")}
}

  const cancel=event=>{event.preventDefault();done(null)};

function render(preserve=false){

 }else{$("editorFields").replaceChildren();$("allergyFields").replaceChildren()}
 refreshHeader();refreshTabs();syncPast();preview();updateButtons();restoreUI(state)
}

/* 中文組字：模型可接收暫存輸入，但組字完成前不儲存／重建畫面。 */
document.addEventListener("compositionstart",event=>{
 if(!event.target.matches("input,textarea"))return;
 composing=true;compositionTarget=event.target;clearTimeout(saveTimer);clearTimeout(previewTimer)
},true);
document.addEventListener("compositionend",event=>{
 composing=false;compositionTarget=null;
 if(event.target.matches("[data-path]")){try{editorInput(event.target)}catch(e){fail(e)}}
 if(db&&dirty!==saved){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save().catch(()=>{}),700)}
 grow(event.target);
 if(renderDeferred){renderDeferred=false;render(true)}
},true);
function half(d,p){return dateOK(d)&&["AM","PM"].includes(p)?Date.parse(d+"T00:00:00Z")/86400000*2+(p==="PM"?1:0):NaN}
function updateSick(path){
 const s=current().sick;
 if(["sick.from","sick.fromPeriod","sick.days"].includes(path)){
  const start=half(s.from,s.fromPeriod),days=Number(s.days);
  if(Number.isFinite(start)&&days>=.5&&days<=3660&&Number.isInteger(days*2)){
   const end=start+days*2-1;s.to=new Date(Math.floor(end/2)*86400000).toISOString().slice(0,10);s.toPeriod=end%2===0?"AM":"PM"
  }
 }else if(["sick.to","sick.toPeriod"].includes(path)){
  const n=(half(s.to,s.toPeriod)-half(s.from,s.fromPeriod)+1)/2;
  if(Number.isFinite(n)&&n>=.5)s.days=S(n)
 }
 ["days","to","toPeriod"].forEach(k=>{const i=$(fid("sick."+k));if(i&&i!==document.activeElement)i.value=s[k]})
}
function clearReview(i){i.reviewed=false;i.reviewedAt="";i.reviewedBy="";i.closed=false;i.closedAt="";i.closedBy="";i.closureReason=""}
function editorInput(input){
 const path=input.dataset.path;if(!path)return;
 assert(editable(),"目前不可修改；原有畫面仍保留");
 const e=current(),old=get(e,path),value=input.type==="checkbox"?input.checked:input.value;
 if(equal(old,value))return;
 if(path.startsWith("receipt.")){
  if(financialLocked(e)&&path!=="receipt.paymentStatus")throw new Error("財務內容已鎖定");
  if(path==="receipt.paymentStatus"){
   if(old==="paid"&&value!=="paid")throw new Error("不能直接將已收款改回未收款；本版不提供退款／沖銷");
   if(value==="paid"){
    assert(items(e).length&&items(e).every(i=>T(i.desc)&&Number.isFinite(cents(i.amount))),"請先填妥有效收費");
    if(!confirm("確認已實際收款？確認後財務內容會鎖定。")){input.value=old;return}
    audit(e,"確認實際收款","財務內容鎖定")
   }
  }
 }
 const match=path.match(/^(lab|imaging)\.items\.(\d+)\.(.+)$/);
 if(match){
  const[,type,n,key]=match,i=e[type].items[+n];
  if(["status","result","performedDate","resultDate"].includes(key)&&(i.reviewed||i.closed)){
   if(!confirm("修改報告內容會取消原覆核及結案，須重新覆核。繼續？")){input.value=S(old);grow(input);return}
   clearReview(i);audit(e,"修改報告並重設覆核","檢查 ID："+i.id)
  }
  if(key==="status"){choice(value,Object.keys(ISTATE),"檢查狀態");i.statusUpdatedAt=now()}
  if(key==="contacted"){i.contactAt=value?now():"";audit(e,value?"記錄聯絡病人":"取消聯絡標記","檢查 ID："+i.id)}
 }
 if(["patient.allergyStatus","patient.allergyDetails"].includes(path)){
  e.allergyReviewed=false;e.allergyReviewedAt="";e.allergyReviewedBy=""
 }
 if(path==="allergyReviewed"){
  e.allergyReviewedAt=value?now():"";e.allergyReviewedBy=value?actor:"";
  audit(e,value?"記錄本次敏感覆核":"取消本次敏感覆核")
 }
 put(e,path,value);
 if(path.startsWith("sick."))updateSick(path);
 const type=DOCS.find(t=>path.startsWith(t+"."));
 if(type)e.used[type]=true;
 changed();
 if($("feeTotal"))$("feeTotal").textContent=cash(total(e)/100);
 if($("compactDiagnosis"))$("compactDiagnosis").textContent=T(e.diagnosis)||"未填寫";
 if(match)syncOrderLabels(+match[2]);
 if(path==="receipt.paymentStatus")applyFinancialUI();
 refreshHeader()
}
function syncOrderLabels(n){
 const i=current()?.[tab]?.items[n];if(!i)return;
 const r=$("editorFields").querySelector(`[data-order-review="${n}"]`);
 if(r)r.textContent="覆核："+(i.reviewed?"已覆核 · "+(i.reviewedBy||"舊版未記錄"):"未覆核");
 const c=$("editorFields").querySelector(`[data-order-contact="${n}"]`);
 if(c)c.textContent="聯絡時間："+stamp(i.contactAt)+"\n結案："+(i.closed?i.closureReason:"未結案");
 const review=$("editorFields").querySelector(`[data-act="reviewOrder"][data-index="${n}"]`);
 const close=$("editorFields").querySelector(`[data-act="closeOrder"][data-index="${n}"]`);
 if(review)review.textContent=i.reviewed?"取消報告覆核":"記錄報告覆核";
 if(close)close.textContent=i.closed?"重新開啟跟進":"結案"
}
function handleEditorEvent(event){
 const i=event.target;if(!i.matches("[data-path]"))return;
 const choiceInput=i.type==="checkbox"||i.tagName==="SELECT";
 if(event.type==="input"&&choiceInput||event.type==="change"&&!choiceInput)return;
 try{editorInput(i)}
 catch(e){
  const value=get(current(),i.dataset.path);
  if(i.type==="checkbox")i.checked=!!value;else i.value=S(value);
  fail(e)
 }
}
["input","change"].forEach(type=>{
 $("editorFields").addEventListener(type,handleEditorEvent);
 $("allergyFields").addEventListener(type,handleEditorEvent)
});
$("editorFields").addEventListener("change",event=>{
 if(event.target.matches("[data-billing]"))orderBilling(+event.target.dataset.billing,event.target.value).catch(e=>{render(true);fail(e)})
});
async function addItem(list){

 const e=current();if(list==="receipt")assert(!financialLocked(e),"財務內容已鎖定");

 e.used[list]=true;
 $(list==="rx"?"rxItems":"receiptItems").insertAdjacentHTML("beforeend",itemHTML(list,n,e));
 fill($(list==="rx"?"rxItems":"receiptItems"),e);

async function removeItem(list,n){
 assert(editable(),"目前不能移除");choice(list,["rx","receipt"],"項目類別");
 const e=current(),i=e[list].items[n];assert(i,"找不到項目");
 if(list==="receipt")assert(!financialLocked(e)&&!i.investigationId,"此項目已鎖定或為檢查連動");
 if(!confirm("移除此項目？已簽發版本及完成快照不會改寫。"))return;
 const scroll=$("editor").scrollTop,rs=$("reference").scrollTop;
 e[list].items.splice(n,1);
 const host=$(list==="rx"?"rxItems":"receiptItems");
 host.innerHTML=e[list].items.map((i,n)=>itemHTML(list,n,e)).join("");fill(host,e);
 changed();refreshTabs();$("editor").scrollTop=scroll;$("reference").scrollTop=rs;
 if($("feeTotal"))$("feeTotal").textContent=cash(total(e)/100);
 if(e[list].items.length)focusPath(list+".items."+Math.min(n,e[list].items.length-1)+"."+(list==="rx"?"name":"desc"))
}

function allergy(p){return p?.allergyStatus==="none"?"No known drug allergies / 無已知藥物敏感":p?.allergyStatus==="known"?"有藥物敏感 / Known drug allergies\n"+(T(p.allergyDetails)||"詳情未記錄"):"未確認／未記錄 / Not confirmed or not recorded"}
function publicPatient(p,t){
 const r=Object.fromEntries(IDFIELDS.map(k=>[k,S(p[k])]));
 if(t==="rx"){r.allergyStatus=p.allergyStatus||"unknown";r.allergyDetails=S(p.allergyDetails)}
 return r
}
function doctor(s,mode){return Object.fromEntries([...["nameCn","nameEn","qualCn","qualEn","address","phone","email","reg"].map(k=>[k,S(s[k])]),["signature",mode==="image"?image(s.signature):""]])}
function publicContent(e,t){
 if(INVS.includes(t))return {centre:e[t].centre,indication:e[t].indication,remarks:e[t].remarks,items:e[t].items.map(i=>({name:i.name,details:i.details}))};
 if(t==="receipt"){const r=C(e.receipt);delete r.paymentStatus;r.items=r.items.map(i=>({desc:i.desc,amount:i.amount}));return r}
 return C(e[t])
}
function docDiagnosis(e,t){
 if(["sick","attendance","rx","receipt"].includes(t)&&!e[t].showDiagnosis)return "";
 if(INVS.includes(t)&&T(e[t].indication))return "";
 return e.diagnosis
}
function docData(e,t){return {id:e.id,patientId:e.patientId,created:e.created,updated:e.updated,date:e.date,status:e.status,diagnosis:docDiagnosis(e,t),patient:publicPatient(e.patient,t),masks:{[t]:e.masks[t]},signature:e.signature,timestamp:e.timestamp,[t]:publicContent(e,t)}}
function fingerprint(e,t,s){return {patient:publicPatient(e.patient,t),date:e.date,diagnosis:docDiagnosis(e,t),content:publicContent(e,t),mask:e.masks[t],signature:e.signature,timestamp:e.timestamp,doctor:doctor(s,e.signature)}}
function different(e,t,s=db.settings){const v=effective(e,t);return !!v&&!equal(fingerprint(e,t,s),fingerprint(v.data,t,v.settings))}
function source(){
 const e=current();assert(e,"沒有開啟診症");
 if(view?.kind==="document"){const v=e.versions.find(v=>v.id===view.id);assert(v,"版本不存在");return {kind:"document",entry:v,data:v.data,settings:v.settings,savedAt:v.savedAt}}
 if(view?.kind==="revision"){const r=e.revisions.find(r=>r.id===view.id);assert(r,"快照不存在");return {kind:"revision",entry:r,data:r.data,settings:r.settings,savedAt:r.savedAt}}
 if(e.status==="completed"){
  if(tab==="note"&&e.revisions.length){const r=e.revisions.at(-1);return {kind:"revision",entry:r,data:r.data,settings:r.settings,savedAt:r.savedAt}}
  const v=effective(e,tab);if(v)return {kind:"document",entry:v,data:v.data,settings:v.settings,savedAt:v.savedAt}
 }
 return {kind:"live",entry:null,data:e,settings:db.settings,savedAt:e.updated}
}
function pendingTypes(e,s=db?.settings){return e?DOCS.filter(t=>effective(e,t)?different(e,t,s):e.used[t]):[]}
function shortSummary(e,t){
 if(t==="sick")return `${e.sick.days} 日\n${fmt(e.sick.from)} ${e.sick.fromPeriod} → ${fmt(e.sick.to)} ${e.sick.toPeriod}\n${e.sick.remarks}`;
 if(t==="attendance")return `${fmt(e.attendance.date)} ${e.attendance.period}\n${e.attendance.remarks}`;
 if(t==="referral")return [e.referral.target,e.referral.institution,e.referral.to,e.referral.body].filter(Boolean).join("\n");
 if(t==="rx")return drugs(e).map((i,n)=>`${n+1}. ${i.name} | ${i.dose} | ${i.frequency} | ${i.route} | ${i.duration}`).join("\n")+(T(e.rx.remarks)?"\n"+e.rx.remarks:"");
 if(t==="receipt")return [e.receipt.no,...items(e).map(i=>i.desc+"：HKD "+cash(i.amount)),"收費總額 HKD "+cash(total(e)/100),"付款方式："+e.receipt.payment,e.receipt.paymentStatus?"付款狀態："+PAYMENT[e.receipt.paymentStatus]:""].filter(Boolean).join("\n");
 return [e[t].centre,...e[t].items.map(i=>i.name+(T(i.details)?" — "+i.details:""))].filter(Boolean).join("\n")
}
function summary(e,s=db.settings){return DOCS.map(t=>{const v=effective(e,t);return {type:t,issued:v?{id:v.id,savedAt:v.savedAt,text:shortSummary(v.data,t)}:null,draft:(v?different(e,t,s):e.used[t])?{text:shortSummary(e,t)}:null,legacyCount:e.versions.filter(v=>v.type===t&&v.state==="legacy").length,hadVoid:e.versions.some(v=>v.type===t&&v.state==="void")}})}
function warnings(e,t="note",s=db.settings){
 const errors=[];
 if(!pname(e.patient))errors.push("請填寫病人姓名");
 if(!dateOK(e.date))errors.push("診症日期無效");
 if(e.patient.dob&&(!dateOK(e.patient.dob)||e.patient.dob>e.date))errors.push("出生日期無效或遲於診症日期");
 if(e.patient.allergyStatus==="known"&&!T(e.patient.allergyDetails))errors.push("有敏感但缺少詳情");
 if(e.patient.allergyStatus&&e.patient.allergyStatus!=="known"&&T(e.patient.allergyDetails))errors.push("敏感狀態與詳情不一致");
 if(t==="note")return errors;
 if(e.signature==="image"&&!image(s.signature))errors.push("缺少有效簽名圖片");
 if(t==="referral"&&(!T(e.referral.body)||!T(e.referral.target+e.referral.institution+e.referral.to)))errors.push("轉介對象及正文須完整");
 if(t==="sick"){
  const n=(half(e.sick.to,e.sick.toPeriod)-half(e.sick.from,e.sick.fromPeriod)+1)/2;
  if(!Number.isFinite(n)||n<.5||n>3660||n!==Number(e.sick.days))errors.push("病假日期、時段與日數不一致")
 }
 if(t==="attendance"&&!dateOK(e.attendance.date))errors.push("到診日期無效");
 if(t==="receipt"){
  if(!T(e.receipt.no)||!T(e.receipt.payment)||!items(e).length)errors.push("收據編號、付款方式或收費項目未填");
  if(items(e).some(i=>!T(i.desc)||!Number.isFinite(cents(i.amount)))||!Number.isSafeInteger(total(e)))errors.push("收費名稱／金額無效")
 }
 if(t==="rx"){
  if(!T(s.reg))errors.push("請在設定填寫醫生註冊編號");
  if(!drugs(e).length||drugs(e).some(i=>["name","dose","frequency","route","duration"].some(k=>!T(i[k]))))errors.push("處方藥名、劑量、頻次、途徑及療程／數量須完整")
 }
 if(INVS.includes(t)&&!e[t].items.length)errors.push("未選擇檢查");
 return errors
}
function showErrors(errors){
 $("validation").hidden=!errors.length;$("validation").textContent=errors.length?"請先處理：\n• "+errors.join("\n• "):"";
 if(errors.length)$("validation").scrollIntoView({block:"nearest"});
 return !!errors.length
}
function issuedVersion(e,t,s,reason){
 const old=effective(e,t);if(old&&!different(e,t,s))return old;
 const v={id:uid(),type:t,state:"issued",savedAt:now(),actor,sessionId,reason,data:docData(e,t),settings:doctor(s,e.signature),deliveries:[]};
 if(old){old.state="superseded";old.replacedBy=v.id}
 e.versions.push(v);e.used[t]=true;audit(e,"保存文件版本",reason,v.id);return v
}
function openIssue(types=null,printTypes=null){
 const e=current();assert(e&&!conflict&&!uncertain,"目前不能簽發");
 if(!types)types=pendingTypes(e);
 assert(types.length,"沒有待簽發文件");
 assert(!view&&e.status==="draft","請先返回未完成診症");
 issueContext={id:e.id,types:C(types),printTypes:printTypes?C(printTypes):null,fingerprints:Object.fromEntries(types.map(t=>[t,C(fingerprint(e,t,db.settings))]))};
 openModal(printTypes?"核對簽發並列印":"核對並簽發文件",`
 <div class="notice">${E(pname(e.patient))} · ${E(master(e)?.mrn)} · ${E(e.date)}
簽發不代表完成診症、列印成功、交付或收款。取消不會更改已簽發文件。</div>
 ${types.map(t=>`<section class="item"><label class="check"><input type="checkbox" data-issue="${t}" checked ${printTypes?"disabled":""}><span><strong>${E(TYPES[t][0])}</strong><br><small>${effective(e,t)?"建立修訂版，原版保留":"建立首個有效版本"}</small></span></label>
 ${warnings(e,t).length?`<p style="color:var(--bad)">${warnings(e,t).map(E).join("<br>")}</p>`:""}
 <details><summary>內容摘要</summary><pre>${E(shortSummary(e,t))}</pre></details></section>`).join("")}
 <div class="field"><label for="issueReason">簽發備註／修訂原因（含修訂文件時必填）</label><textarea id="issueReason"></textarea></div>
 ${types.includes("rx")&&e.patient.allergyStatus==="unknown"?`<div class="notice"><label class="check"><input id="issueUnknown" type="checkbox"><span>我知悉處方敏感狀態仍未確認，仍決定簽發。此確認不會改成無敏感，亦不會完成敏感覆核。</span></label></div>`:""}
 <div class="modal-footer"><button data-act="closeModal">取消</button><button data-act="confirmIssue" class="primary">${printTypes?"確認簽發並開啟列印":"確認簽發"}</button></div>
 `,"issue");
}
async function confirmIssue(){

 const types=[...$("modalBody").querySelectorAll("[data-issue]:checked")].map(i=>i.dataset.issue);

  const e=d.encounters.find(e=>e.id===context.id);assert(e.status==="draft"&&!view&&selected===context.id,"診症狀態已改變");

  }

async function completeEncounter(){

  const reason=prompt("重新開啟診症原因（必填）：");if(!T(reason))return;

 await run(()=>commit(d=>{
  const x=d.encounters.find(x=>x.id===e.id),sum=summary(x,d.settings);
  x.status="completed";x.updated=now();x.revisions.push({id:uid(),savedAt:x.updated,actor,sessionId,data:core(x),settings:doctor(d.settings,"manual"),summary:sum});

 }));tab="note";render(false)
}

async function printDocuments(types,alreadyIssued=false){

  if(view){const x=source();data=x.data;s=x.settings}
  else if(e.status==="completed"&&t!=="note"){
   const v=effective(e,t);if(!v){errors.push(TYPES[t][0]+"：沒有有效版本，須重開製作");continue}

 if(showErrors(errors))return;

 if(types.includes("rx")&&!alreadyIssued){
  const p=view?source().data.patient:e.status==="completed"?effective(e,"rx").data.patient:e.patient;
  if(p.allergyStatus==="unknown"&&!confirm("此處方版本的敏感狀態未確認。仍然列印？此操作不會改寫原版本。"))return

 await ensureSession();
 await run(async()=>{
  await save();
  const pages=types.map(t=>{
   let s;
   if(view)s=source();
   else if(t==="note"){
    if(e.status==="completed"&&e.revisions.length){const r=e.revisions.at(-1);s={kind:"revision",entry:r,data:r.data,settings:r.settings,savedAt:r.savedAt}}
    else s={kind:"live",entry:null,data:current(),settings:db.settings,savedAt:current().updated}
   }else{const v=effective(current(),t);assert(v,"有效版本不存在");s={kind:"document",entry:v,data:v.data,settings:v.settings,savedAt:v.savedAt}}
   return `<article class="paper">${page(t,s)}</article>`
  });
  await commit(d=>audit(d.encounters.find(x=>x.id===selected),"要求開啟列印視窗",types.map(t=>TYPES[t][0]).join("、")+"；不代表成功列印或交付"));
  closeModalNow();$("printRoot").innerHTML=pages.join("");printing=true;updateButtons();
  await Promise.all([...$("printRoot").querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  try{window.print()}finally{finishPrinting()}
 },{redraw:false})

async function savePatient(){
 const id=$("editingPatient").value,old=id?db.patients.find(p=>p.id===id):null;
 const data=old?C(old.data):patient();
 $("modalBody").querySelectorAll("[data-patient-field]").forEach(i=>data[i.dataset.patientField]=T(i.value));
 data.hkid=normID(data.hkid);assert(pname(data),"請填寫中文或英文姓名");
 if(data.dob)assert(dateOK(data.dob)&&data.dob<=today(),"出生日期無效或遲於今日");
 assert(!$("p-email").value||$("p-email").validity.valid,"電郵格式無效");
 const reason=old?T($("patientReason").value):"首次登記主檔";assert(reason,"請填寫修改原因");
 const dup=duplicates(data,id);
 if(dup.length&&!confirm("發現可能重複病人：\n"+dup.map(p=>p.mrn+" · "+pname(p.data)).join("\n")+"\n不會自動合併。已核實仍要保存？"))return;
 const start=!id&&$("startVisit").checked,pid=id||uid();
 let encounterId="",oldSelected=selected;
 await run(()=>commit(d=>{
  if(old){
   const p=d.patients.find(p=>p.id===id);assert(equal(p.data,old.data),"主檔已變動");
   p.changes.push({at:now(),actor,sessionId,reason,before:C(p.data),after:C(data)});p.data=C(data);p.updated=now()
  }else{
   addMaster(d,pid,data);d.meta.security.push({at:now(),actor,sessionId,action:"登記病人",patientId:pid,startedEncounter:start});
   if(start)encounterId=addEncounter(d,pid).id
  }
 },{nextId:()=>encounterId||oldSelected}));
 if(encounterId){selected=encounterId;db.currentId=selected;tab="note";view=null;closeModalNow();render(false)}
 else patientProfile(pid);
 message(id?"主檔已保存；既有診症未自動覆寫。如需同步，請核對頂部差異提示。":start?"已登記並開始診症。請核對本次藥物敏感。":"已登記主檔；沒有建立診症。")

function flatten(x,p="",out={}){
 if(p.endsWith("signature")&&typeof x==="string"){out[p]=x?"[圖片簽名資料]":"";return out}
 if(Array.isArray(x)){if(!x.length)out[p]="[]";else x.forEach((v,i)=>flatten(v,p+"["+i+"]",out))}
 else if(O(x))Object.entries(x).forEach(([k,v])=>flatten(v,p?p+"."+k:k,out));
 else out[p]=S(x);
 return out
}
function diffTable(a,b){
 const x=flatten(a),y=flatten(b),keys=[...new Set([...Object.keys(x),...Object.keys(y)])].filter(k=>x[k]!==y[k]);
 return keys.length?`<div class="scrolltable"><table class="ui"><thead><tr><th>欄位</th><th>之前</th><th>之後</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${E(LABELS[k]||k)}</td><td class="diffOld">${E(x[k]??"（不存在）")}</td><td class="diffNew">${E(y[k]??"（不存在）")}</td></tr>`).join("")}</tbody></table></div>`:"<p>沒有文字／結構差異。</p>"
}

 if(!e){
  pastList=[];
  pastId="";
  pastSignature="";
  $("pastTab").textContent="所有診症";
  $("pastPicker").innerHTML='<option value="">沒有診症紀錄</option>';
  $("pastBody").replaceChildren();
  return;
 }

 const context=selected+"|"+(view?.id||"");
 const changedContext=pastContext!==context;

 pastList=referenceEncounters();

 if(changedContext){
  pastContext=context;
  pastId=e.id;
  pane=view?"preview":"past";
  paneScroll={past:0,preview:0};
  pastSignature="";
 }

 if(!pastList.some(x=>x.id===pastId)){
  pastId=e.id;
 }

 $("pastTab").textContent="所有診症（"+pastList.length+"）";

 const options=pastList.map(x=>{
  const currentLabel=x.id===selected?"本次 · ":"";
  const state=x.status==="completed"?"已完成":"未完成";
  const diagnosis=T(x.diagnosis).slice(0,60)||"未填寫診斷";

  return `<option value="${E(x.id)}">${E(currentLabel+x.date+" · "+state+" · "+diagnosis)}</option>`;
 }).join("")||'<option value="">沒有診症紀錄</option>';

 if($("pastPicker").innerHTML!==options){

function drawPast(){
 const e=pastList.find(x=>x.id===pastId);

 if(!e){
  $("pastBody").innerHTML='<div class="card">沒有可供參閱的診症紀錄。</div>';
  return;
 }

 const isCurrent=e.id===selected;

 const key=serial([
  e.id,
  e.updated,
  e.status,
  isCurrent,
  e.revisions.at(-1)?.id,
  e.versions.map(v=>[v.id,v.state])
 ]);

 if(key===pastSignature)return;
 pastSignature=key;

 // 本次未完成診症顯示目前內容；
 // 其他情況優先顯示最後一次完成時保存的紀錄。
 const r=isCurrent&&e.status==="draft"
  ?null
  :e.revisions.at(-1);

 const data=r?r.data:e;

 let rxdata=null;
 let rxlabel="";
 let version=null;

 if(r){
  const entry=r.summary.find(x=>x.type==="rx");

  if(entry?.issued){
   version=e.versions.find(v=>v.id===entry.issued.id);
   rxdata=version?.data;
   rxlabel="完成診症時記錄的處方";
  }else if(drugs(data).length){
   rxdata=data;
   rxlabel="完成診症時保存的處方草稿，尚未簽發";
  }
 }else if(isCurrent&&e.status==="draft"){
  rxdata=e;
  version=effective(e,"rx");

  rxlabel=version
   ?different(e,"rx")
    ?"目前處方草稿；內容與已簽發處方不同"
    :"目前處方內容；與已簽發處方相同"
   :"目前處方草稿，尚未簽發";
 }else{
  version=effective(e,"rx");
  rxdata=version?version.data:e;
  rxlabel=version
   ?"目前有效的處方"
   :"處方草稿，尚未簽發";
 }

async function loadSignature(file){
 assert(["image/png","image/jpeg"].includes(file.type)&&file.size<=3*1024*1024,"只接受3MB內 PNG／JPEG");
 const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(S(r.result));r.onerror=()=>reject(new Error("圖片讀取失敗"));r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("圖片無法解碼"));i.src=url});
 assert(img.naturalWidth*img.naturalHeight<=12000000,"圖片像素過大");
 const ratio=Math.min(1,1200/img.naturalWidth,500/img.naturalHeight),canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
 canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
 const result=canvas.toDataURL("image/png");assert(image(result),"處理後圖片過大");
 assert(modalState?.mode==="settings","設定表單已離開");
 signatureDraft=result;$("signaturePreview").innerHTML=`<img class="signatureThumb" src="${result}" alt="簽名預覽">`
}

async function stageBackup(file){
 assert(file&&file.size>0&&file.size<=MAXFILE,"只接受50MB內非空備份");
 let raw=parse(await file.text()),encrypted=false;
 if(O(raw.envelope)&&raw.envelope.format==="ray-clinic-encrypted")raw=raw.envelope;
 if(raw.format==="ray-clinic-encrypted"){
  checkEnvelope(raw);assert(raw.purpose!=="drill","不能匯入演練密文");
  const password=await secret(raw.purpose==="vault"?"輸入原工作區密碼":"輸入備份密碼");if(password===null)return;
  raw=await unseal(raw,await derive(password,raw.salt));encrypted=true
 }
 let data;
 if(raw.format==="ray-clinic-backup"){
  assert(raw.version===1&&O(raw.data)&&await hash(raw.data)===raw.digest,"備份摘要不符");data=raw.data
 }else data=raw;
 const sourceSchema=data.schema;data=migrate(data);
 pendingRestore={data,filename:file.name,digest:await hash(data),sourceSchema};
 openModal("還原預覽 · 尚未修改雲端",`<p>${E(file.name)} · ${encrypted?"已解密":"明文原檔"}</p>${countsHTML(data)}
 <div class="notice">結構驗證不代表病歷內容正確。確認還原前會要求下載現有工作區加密備份。必須自行確認檔案已保存。</div>

}

setInterval(()=>{
 if(!db||busy||printing||composing)return;
 if(Date.now()-lastActivity<db.settings.idleMinutes*60000)return;
 if(modalDirty()){
  message("已達閒置時間，但彈窗有未保存輸入。請先保存或明確捨棄，再登出；系統未清走輸入。",true);
  lastActivity=Date.now();return
 }
 lastActivity=Date.now();logout().catch(fail)
},15000);

/* 單次登入。空白工作區不自動建立空白病人／診症。 */
function validateConnection(){
 assert(/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cloud.url),"請使用原本 https://專案.supabase.co URL");
 assert(/^[0-9a-f-]{36}$/i.test(cloud.clinic)&&/^[0-9a-f-]{36}$/i.test(cloud.doctor),"Clinic／Doctor ID 格式無效");
 if(cloud.key.startsWith("sb_publishable_"))return;
 let role="";
 try{let p=cloud.key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");p=p.padEnd(Math.ceil(p.length/4)*4,"=");role=JSON.parse(atob(p)).role}catch{}
 assert(role==="anon","只接受 publishable／anon key；禁止 secret／service_role")
}
$("projectUrl").value=DEFAULT_CONNECTION.url;$("projectKey").value=DEFAULT_CONNECTION.key;
$("clinicId").value=DEFAULT_CONNECTION.clinic;$("doctorId").value=DEFAULT_CONNECTION.doctor;
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();if(busy)return;
 busy=true;$("loginButton").disabled=true;
 try{
  assert(crypto?.subtle&&typeof $("modal").showModal==="function","瀏覽器／開啟環境不支援所需功能");
  cloud.url=T($("projectUrl").value).replace(/\/+$/,"");cloud.key=T($("projectKey").value);cloud.clinic=T($("clinicId").value);cloud.doctor=T($("doctorId").value);
  validateConnection();$("loginMessage").textContent="正在登入…";
  rememberSession(await cloudHTTP("/auth/v1/token?grant_type=password",{method:"POST",authorized:false,body:{email:T($("email").value),password:$("password").value}}));
  assert(cloud.session.user?.id===cloud.doctor,"帳戶與指定醫生 ID 不符");
  const members=await cloudHTTP("/rest/v1/clinic_memberships?select=user_id,role,is_active&clinic_id=eq."+cloud.clinic+"&user_id=eq."+cloud.doctor);
  assert(Array.isArray(members)&&members.some(m=>m.role==="doctor"&&m.is_active===true),"醫生成員資格無效或已停用");
  actor=cloud.session.user.email||cloud.doctor;sessionId=uid();conflict=false;uncertain=false;
  $("loginMessage").textContent="正在載入工作區…";
  const record=await readRecord();
  let candidate;
  if(record){
   assert(record.envelope?.format==="ray-clinic-auth-workspace"&&record.envelope.version===1,"不是支援的帳戶式雲端工作區。舊密碼加密資料未被覆寫，請用原版匯出備份後移轉。");
   candidate=checkDB(C(record.envelope.data));rev=record.revision
  }else{
   rev=0;candidate=database();await persistSnapshot(candidate)
  }
  db=candidate;selected=db.encounters.some(e=>e.id===db.currentId)?db.currentId:db.encounters[0]?.id||"";
  tab="note";view=null;dirty=0;saved=0;pastContext="";recoveryCandidate=null;
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  $("sessionLabel").textContent="登入帳戶："+actor;
  attachChannel();busy=false;render(false);applyWidth();lastActivity=Date.now();
  status("資料已載入，參考編號："+rev);
  message("登入成功。請選擇病人，或繼續處理已開啟的診症。")
 }catch(e){
  if(!db){cloud.session=null;actor="";sessionId=""}
  $("loginMessage").textContent=e.message||"登入失敗"
 }finally{
  $("password").value="";busy=false;$("loginButton").disabled=false;if(db)updateButtons()
 }
});
</script>
</body>
</html>
