/* ---------- 15.7 列印前準備版本
   全部文件先驗證；批次保存以單一交易完成。
   不會把未勾選的文件一併出具。
   ---------- */

function simpleVersionSource(v) {
  return {
    kind:"document",
    entry:v,
    data:v.data,
    settings:v.settings,
    savedAt:v.savedAt
  };
}

function simpleNewVersion(type) {
  const savedAt = now();

  const snapshot = documentData(current, type);
  snapshot.updated = savedAt;

  return {
    id:uid(),
    type,
    savedAt,
    state:"issued",
    origin:"native",
    data:snapshot,
    settings:settingsSnapshot(
      db.settings,
      current.signature === "image"
    ),
    replacedBy:"",
    voidAt:"",
    voidReason:"",
    confirmedAt:""
  };
}

function simplePreparePrint(types, historicalSource = null) {
  if (historicalSource) {
    const s = clone(historicalSource);

    if (
      s.kind === "document" &&
      s.entry.state !== "issued"
    ) {
      if (!confirm(
        "這不是目前有效文件。\n\n" +
        "將列印帶狀態標示的歷史存檔副本，繼續？"
      )) {
        return null;
      }
    }

    return [{
      type:types[0],
      source:s,
      newVersion:null
    }];
  }

  if (types.length === 1 && types[0] === "note") {
    const s = clone(source());

    if (showWarnings(baseWarnings(s.data))) return null;

    return [{
      type:"note",
      source:s,
      newVersion:null
    }];
  }

  const warnings = [];

  for (const type of types) {
    if (current.status === "completed") {
      if (!effectiveVersion(current, type)) {
        warnings.push(
          TYPES[type][0] +
          "：沒有有效版本，請先重新開啟診症。"
        );
      }
    } else {
      for (const warning of documentWarnings(
        current, type, db.settings
      )) {
        warnings.push(TYPES[type][0] + "：" + warning);
      }
    }
  }

  if (showWarnings(warnings)) return null;

  /* 保留原程式對缺少註冊編號的提示。 */
  if (
    current.status === "draft" &&
    types.includes("rx") &&
    !trim(db.settings.reg)
  ) {
    if (!confirm(
      "未填寫醫生註冊編號。\n仍然製作此測試處方？"
    )) {
      return null;
    }
  }

  return types.map(type => {
    const existing = effectiveVersion(current, type);

    const reuse = existing && (
      current.status === "completed" ||
      !isDifferent(current, type)
    );

    if (reuse) {
      const v = clone(existing);

      return {
        type,
        source:simpleVersionSource(v),
        newVersion:null
      };
    }

    const v = simpleNewVersion(type);

    return {
      type,
      source:simpleVersionSource(v),
      newVersion:v
    };
  });
}

/* ---------- 15.8 字型及圖片準備 ---------- */

async function simpleWithTimeout(promise, milliseconds, message) {
  let timer;

  try {
    return await Promise.race([
      promise,
      new Promise((resolve, reject) => {
        timer = setTimeout(
          () => reject(new Error(message)),
          milliseconds
        );
      })
    ]);
  } finally {
    clearTimeout(timer);
  }
}

async function simpleWaitForPrintAssets(root) {
  if (document.fonts) {
    await simpleWithTimeout(
      document.fonts.ready,
      15000,
      "字型載入逾時，請稍後重試。"
    );
  }

  await Promise.all(
    [...root.querySelectorAll("img")].map(async img => {
      const load = async () => {
        if (typeof img.decode === "function") {
          await img.decode();
        } else if (!img.complete) {
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => {
              reject(new Error("簽名圖片載入失敗"));
            };
          });
        }

        if (!img.naturalWidth) {
          throw new Error("簽名圖片無效，已停止列印。");
        }
      };

      await simpleWithTimeout(
        load(),
        15000,
        "簽名圖片載入逾時，已停止列印。"
      );
    })
  );
}

/* ---------- 15.9 列印工作階段
   列印內容放在獨立容器。
   不會將編輯器切入歷史版本，亦不需要按「返回」。
   ---------- */

let simplePrintJob = null;

function simpleFinishPrint(job) {
  if (!job || simplePrintJob !== job) return;

  simplePrintJob = null;

  document.body.classList.remove("simple-printing");
  $("simplePrintRoot").replaceChildren();
  $("simplePrintRecovery").classList.add("hidden");

  busy = false;
  renderUI();

  if (!dirty && !loadFailed && !conflict) {
    status("資料已保存 · 可以繼續編輯");
  }
}

async function simplePrint(types, historicalSource = null) {
  if (busy || loadFailed || conflict) return;

  types = [...new Set(types)].filter(type =>
    Object.hasOwn(TYPES, type)
  );

  if (!types.length) {
    alert("請至少選擇一份文件。");
    return;
  }

  /* 內部 SOAP 不與對外文件混合列印。 */
  if (types.includes("note") && types.length > 1) {
    alert("診症紀錄請獨立列印，不會混入對外文件。");
    return;
  }

  const plans = simplePreparePrint(types, historicalSource);
  if (!plans) return;

  const job = {
    encounterId:current.id,
    phase:"preparing",
    saved:false
  };

  simplePrintJob = job;
  busy = true;
  renderUI();

  try {
    $("simplePrintRoot").innerHTML = plans.map(plan => `
      <article class="paper">
        ${simplePageHTML(plan.type, plan.source)}
      </article>
    `).join("");

    /*
      先確認圖片及字型可用。
      若此階段失敗，不會新增文件版本。
    */
    await simpleWaitForPrintAssets($("simplePrintRoot"));

    assert(
      simplePrintJob === job &&
      current.id === job.encounterId,
      "目前診症已改變，已停止列印。"
    );

    assert(
      !loadFailed && !conflict,
      "資料出現讀取或分頁衝突，已停止列印。"
    );

    /*
      所有新版本一次過保存。
      若儲存失敗，transaction 會回復；
      不會開啟列印視窗。
    */
    const saved = transaction(() => {
      let added = false;

      for (const plan of plans) {
        if (!plan.newVersion) continue;

        assert(
          current.status === "draft",
          "診症已完成，不能直接新增文件版本。"
        );

        const v = clone(plan.newVersion);
        const previous = effectiveVersion(current, plan.type);

        if (previous) {
          previous.state = "superseded";
          previous.replacedBy = v.id;
        }

        current.used[plan.type] = true;
        current.versions.push(v);

        addAudit(
          current,
          "列印前保存文件版本",
          TYPES[plan.type][0] +
            "；不代表已列印或交付病人",
          v.id
        );

        added = true;
      }

      if (added) current.updated = now();
    });

    if (!saved) {
      simpleFinishPrint(job);
      return;
    }

    job.saved = true;

    document.body.classList.add("simple-printing");

    await new Promise(resolve =>
      requestAnimationFrame(() =>
        requestAnimationFrame(resolve)
      )
    );

    assert(
      !loadFailed && !conflict &&
      current.id === job.encounterId,
      "資料狀態已改變，已停止開啟列印。"
    );

    job.phase = "printing";
    status("文件已保存 · 正在開啟列印／PDF");

    window.print();

    /*
      一般由 afterprint 自動解除鎖定。
      若瀏覽器沒有送出事件，提供手動返回，
      不會聲稱已成功印出。
    */
    if (simplePrintJob === job) {
      $("simplePrintRecovery").classList.remove("hidden");
    }
  } catch (error) {
    simpleFinishPrint(job);

    status("列印未完成：" + error.message, true);

    alert(
      "未能完成列印準備：" + error.message +
      (
        job.saved
          ? "\n\n已保存的版本仍保留。修正後可以直接重印。"
          : "\n\n這次沒有成功保存新的列印版本。"
      )
    );
  }
}

printDocument = async function() {
  if (busy || loadFailed || conflict) return;

  await simplePrint(
    [active],
    view ? source() : null
  );
};

/* ---------- 15.10 完成診症
   正常情況直接完成。
   只有草稿、缺漏 SOAP 或舊版待確認才提示。
   ---------- */

let simpleCompletionContext = null;

function simpleCommitCompletion() {
  if (
    busy ||
    view ||
    loadFailed ||
    conflict ||
    current.status !== "draft"
  ) {
    return false;
  }

  if (showWarnings(baseWarnings(current))) return false;

  const summary = buildSummary();

  const ok = transaction(() => {
    current.status = "completed";
    current.updated = now();

    current.revisions.push({
      id:uid(),
      savedAt:current.updated,
      data:encounterCore(current),
      settings:settingsSnapshot(db.settings, false),
      summary:clone(summary)
    });

    addAudit(
      current,
      "完成診症",
      "第 " + current.revisions.length + " 個完成快照"
    );
  });

  if (ok) {
    active = "note";
    view = null;
    renderUI();
    status("診症已完成並保存");
  } else {
    renderUI();
  }

  return ok;
}

completeEncounter = function() {
  if (busy || view || loadFailed || conflict) return;

  if (current.status === "completed") {
    const reason = prompt(
      "重新開啟診症的原因：\n舊完成紀錄及文件版本會保留。"
    );

    if (!trim(reason)) return;

    if (transaction(() => {
      current.status = "draft";
      current.updated = now();
      addAudit(current, "重新開啟診症", trim(reason));
    })) {
      active = "note";
      renderUI();
    }

    return;
  }

  if (showWarnings(baseWarnings(current))) return;

  const summary = buildSummary();
  const pending = summary.filter(item => item.draft);

  const missing = [
    !trim(current.soap.s) && "S",
    !trim(current.soap.o) && "O",
    !trim(current.diagnosis + current.soap.a) && "A",
    !trim(current.soap.p) && "P"
  ].filter(Boolean);

  const legacyCount = summary.reduce(
    (sum, item) => sum + item.legacyCount,
    0
  );

  /* 無異常：一按就完成，不再彈例行確認。 */
  if (!pending.length && !missing.length && !legacyCount) {
    simpleCommitCompletion();
    return;
  }

  simpleCompletionContext = {
    encounterId:current.id,
    firstPending:pending[0]?.type || null
  };

  const messages = [];

  if (pending.length) {
    messages.push(
      "以下文件尚未保存有效版本，或修改後未重新輸出：\n" +
      pending.map(item => "• " + TYPES[item.type][0]).join("\n") +
      "\n\n可以返回處理；亦可以完成診症，將未處理內容保留為草稿。"
    );
  }

  if (missing.length) {
    messages.push(
      "SOAP 未填寫：" + missing.join("、") +
      "。\n完成紀錄會保留「未填寫」，不會自動補寫。"
    );
  }

  if (legacyCount) {
    messages.push(
      "另有 " + legacyCount +
      " 個舊版文件待確認，不會自動當成有效文件。"
    );
  }

  $("simpleCompleteMessage").textContent =
    messages.join("\n\n");

  $("simpleCompleteBack").textContent =
    pending.length ? "返回處理文件" : "返回修改";

  $("simpleCompleteConfirm").textContent =
    pending.length
      ? "只完成診症，保留草稿"
      : "仍然完成診症";

  $("simpleCompleteDialog").showModal();
};

/* =========================================================
   16. Investigations
   LAB / Imaging、收費連動、Request Forms、Progress Note

   必須放在首次 loadDatabase() 呼叫之前。

const INV_V2_KEY = "clinic_documents_mvp_2";
const INV_TYPES = ["lab", "imaging"];

const INV_BILLING = {
  clinic: "診所收費",
  centre: "檢查中心直接收費"
};

const INV_STATUS = {
  ordered: "已申請／待完成",
  completed: "已完成檢查",
  results: "已收到報告"
};

TYPES.lab = [
  "化驗",
  "LABORATORY REQUEST FORM",
  "化驗檢查申請表"
];

TYPES.imaging = [
  "放射",
  "RADIOLOGY IMAGING REQUEST FORM",
  "放射及影像檢查申請表"
];

for (const type of INV_TYPES) {
  if (!DOC_TYPES.includes(type)) DOC_TYPES.push(type);
  DEFAULT_SETTINGS.masks[type] = "full";
}

function invBlankRequest() {
  return {
    centre: "",
    indication: "",
    remarks: "",
    items: []
  };
}

function invValidPrice(value) {
  const s = trim(value);

  return /^\d+(?:\.\d{1,2})?$/.test(s) &&
    Number.isSafeInteger(Math.round(Number(s) * 100));
}

function invPrice(value) {
  assert(invValidPrice(value), "價錢須為非負數，最多兩位小數");
  return (Math.round(Number(value) * 100) / 100).toFixed(2);
}

function invAllOrders(e) {
  return INV_TYPES.flatMap(type =>
    (e[type]?.items || []).map(item => ({ type, item }))
  );
}

function invOrder(e, type, id) {
  return e[type]?.items.find(item => item.id === id) || null;
}

/* ---------- 16.1 資料模型 ---------- */

const invOriginalEmptyData = emptyData;

emptyData = function(date = today(), settings = DEFAULT_SETTINGS) {
  const e = invOriginalEmptyData(date, settings);

  for (const type of INV_TYPES) {
    e[type] = invBlankRequest();
    e.masks[type] = settings.masks[type] || "full";
    e.used[type] = false;
  }

  return e;
};

const invOriginalBlankDatabase = blankDatabase;

blankDatabase = function() {
  const result = invOriginalBlankDatabase();
  result.catalogue = [];
  return result;
};

/* ---------- 16.2 匯入及舊資料相容 ---------- */

function invNormalizeCatalogue(raw) {
  assert(Array.isArray(raw), "檢查目錄格式錯誤");

  const ids = new Set();

  return raw.map(row => {
    checkStrings(
      row,
      ["id", "type", "name", "price", "billing"],
      "檢查目錄"
    );

    assert(row.id && !ids.has(row.id), "檢查目錄 ID 重複或空白");
    ids.add(row.id);

    assert(INV_TYPES.includes(row.type), "檢查目錄類別錯誤");
    assert(trim(row.name), "檢查項目名稱不可空白");
    assert(Object.hasOwn(INV_BILLING, row.billing), "檢查收費方式錯誤");
    assert(typeof row.enabled === "boolean", "檢查啟用設定錯誤");

    assert(
      !trim(row.price) || invValidPrice(row.price),
      "檢查價錢格式錯誤：" + row.name
    );

    return {
      id: row.id,
      type: row.type,
      name: trim(row.name),
      price: trim(row.price) ? invPrice(row.price) : "",
      billing: row.billing,
      enabled: row.enabled
    };
  });
}

function invNormalizeRequest(raw) {
  checkStrings(
    raw,
    ["centre", "indication", "remarks"],
    "檢查申請"
  );

  assert(Array.isArray(raw.items), "檢查項目列表格式錯誤");

  const ids = new Set();
  const catalogueIds = new Set();

  const items = raw.items.map(item => {
    const keys = [
      "id", "catalogueId", "name", "price", "billing",
      "details", "status", "result", "performedDate",
      "resultDate", "statusUpdatedAt"
    ];

    checkStrings(item, keys, "已選檢查");

    assert(item.id && !ids.has(item.id), "已選檢查 ID 重複或空白");
    ids.add(item.id);

    assert(
      item.catalogueId && !catalogueIds.has(item.catalogueId),
      "同一檢查項目重複"
    );
    catalogueIds.add(item.catalogueId);

    assert(trim(item.name), "已選檢查名稱不可空白");
    assert(Object.hasOwn(INV_BILLING, item.billing), "檢查收費方式錯誤");
    assert(Object.hasOwn(INV_STATUS, item.status), "檢查完成狀態錯誤");

    assert(
      !trim(item.price) || invValidPrice(item.price),
      "已選檢查價錢格式錯誤"
    );

    assert(
      item.billing !== "clinic" || invValidPrice(item.price),
      "診所收費的檢查必須有價錢"
    );

    for (const key of ["performedDate", "resultDate"]) {
      assert(
        !item[key] || validDate(item[key]),
        "檢查日期格式錯誤"
      );
    }

    const result = Object.fromEntries(keys.map(k => [k, item[k]]));
    result.price = trim(item.price) ? invPrice(item.price) : "";

    return result;
  });

  return {
    centre: raw.centre,
    indication: raw.indication,
    remarks: raw.remarks,
    items
  };
}

const invOriginalNormalizeData = normalizeData;

normalizeData = function(raw, legacy = false, onlyType = null) {
  assert(obj(raw), "診症資料格式錯誤");

  const prepared = clone(raw);

  /*
    舊資料沒有新增欄位，只補空容器及顯示設定；
    不推斷病人曾接受任何檢查。
  */
  if (obj(prepared.masks)) {
    for (const type of INV_TYPES) {
      if (prepared.masks[type] === undefined) {
        prepared.masks[type] = "full";
      }
    }
  }

  if (!onlyType && !legacy && obj(prepared.used)) {
    for (const type of INV_TYPES) {
      if (prepared.used[type] === undefined) {
        prepared.used[type] = false;
      }
    }
  }

  for (const type of INV_TYPES) {
    if ((!onlyType || onlyType === type) &&
        prepared[type] === undefined) {
      prepared[type] = invBlankRequest();
    }
  }

  const result = invOriginalNormalizeData(
    prepared, legacy, onlyType
  );

  for (const type of INV_TYPES) {
    if (!onlyType || onlyType === type) {
      result[type] = invNormalizeRequest(prepared[type]);
    }
  }

  /*
    原本收據 normalization 只保留 desc / amount。
    額外保留檢查連結，避免重新載入後失去對應。
  */
  if (!onlyType || onlyType === "receipt") {
    result.receipt.items = result.receipt.items.map((item, index) => {
      const original = prepared.receipt.items[index];

      if (original.investigationId !== undefined ||
          original.investigationType !== undefined) {
        checkStrings(
          original,
          ["investigationId", "investigationType"],
          "檢查收費連結"
        );

        assert(original.investigationId, "檢查收費連結不可空白");
        assert(
          INV_TYPES.includes(original.investigationType),
          "檢查收費類別錯誤"
        );

        item.investigationId = original.investigationId;
        item.investigationType = original.investigationType;
      }

      return item;
    });
  }

  if (!onlyType) {
    const ids = new Set();

    for (const { item } of invAllOrders(result)) {
      assert(!ids.has(item.id), "檢查訂單 ID 重複");
      ids.add(item.id);
    }
  }

  return result;
};

const invOriginalNormalizeSummary = normalizeSummary;

normalizeSummary = function(raw) {
  assert(Array.isArray(raw), "摘要格式錯誤");

  const originalTypes = new Set(raw.map(item => item?.type));
  const padded = clone(raw);

  /*
    舊完成快照只有五類摘要。
    先補空項目通過新版驗證，再移除補入項目，
    避免改寫舊快照的摘要內容。
  */
  for (const type of INV_TYPES) {
    if (!originalTypes.has(type)) {
      padded.push({
        type,
        issued: null,
        draft: null,
        legacyCount: 0,
        hadVoid: false
      });
    }
  }

  return invOriginalNormalizeSummary(padded)
    .filter(item => originalTypes.has(item.type));
};

const invOriginalDecodeDatabase = decodeDatabase;

decodeDatabase = function(value) {
  assert(
    obj(value) && [1, 2, 3].includes(value.schema),
    "不支援此備份版本"
  );

  const prepared = clone(value);

  /*
    v2 與 v3 共用原有診症／文件驗證。
    新增欄位由上方 normalizeData 處理。
  */
  if (prepared.schema === 2) prepared.schema = SCHEMA;

  const result = invOriginalDecodeDatabase(prepared);

  result.catalogue = invNormalizeCatalogue(
    value.catalogue === undefined ? [] : value.catalogue
  );

  result.schema = SCHEMA;

  return result;
};

/* ---------- 16.3 v3 獨立儲存及移轉 ---------- */

loadDatabase = function() {
  db = blankDatabase();

  try {
    lastRaw = localStorage.getItem(KEY);

    let raw = lastRaw;
    let migratedFrom = "";

    if (raw === null) {
      raw = localStorage.getItem(INV_V2_KEY);
      if (raw !== null) migratedFrom = "v2";
    }

    if (raw === null) {
      raw = localStorage.getItem(OLD_KEY);
      if (raw !== null) migratedFrom = "v1";
    }

    if (raw !== null) {
      db = decodeDatabase(parseJSON(raw));
    }

    if (migratedFrom) {
      globalNotice(
        "已由 " + migratedFrom +
        " 讀取資料，之後會儲存到獨立 v3 位置。" +
        "原有儲存原文不變；請先核對歷史紀錄並匯出新版備份。"
      );
    }
  } catch (error) {
    loadFailed = true;
    db = blankDatabase();

    globalNotice(
      "無法讀取資料，已停止編輯及寫入：" +
      error.message +
      "。請匯出儲存原文或匯入有效備份，勿清除瀏覽器資料。"
    );
  }

  current = db.encounters.find(e => e.id === db.currentId) ||
    db.encounters[0] ||
    newEncounter();
};

exportBackup = function() {
  if (loadFailed) {
    alert(
      "原資料未能讀取。請匯出 v3 儲存原文或 v2 原始資料，" +
      "不要將空白工作區當成備份。"
    );
    return;
  }

  if (!confirm(
    "備份包含未加密病人資料、檢查紀錄、價目表及簽名。\n" +
    (dirty || conflict
      ? "將匯出本頁記憶體內容，包括未成功儲存的變更。\n"
      : "") +
    "確定下載？"
  )) return;

  download(
    JSON.stringify(db, null, 2),
    "clinic-v3-backup-" + today() + ".json"
  );
};

/* ---------- 16.4 收費連動 ---------- */

function invGeneratedCharges(e) {
  return invAllOrders(e)
    .filter(({ item }) => item.billing === "clinic")
    .map(({ type, item }) => {
      assert(
        invValidPrice(item.price),
        "請先設定檢查價錢：" + item.name
      );

      return {
        desc: (type === "lab" ? "LAB: " : "Imaging: ") + item.name,
        amount: invPrice(item.price),
        investigationId: item.id,
        investigationType: type
      };
    });
}

function invBillingLocked(e = current) {
  return e.receipt.paymentStatus === "paid" ||
    !!effectiveVersion(e, "receipt");
}

function invSyncCharges(e) {
  const before = e.receipt.items
    .filter(item => item.investigationId);

  const after = invGeneratedCharges(e);

  /*
    不讓 tick / untick 靜默更改已出具或已收款單据。
    Request Form 及檢查結果仍可獨立處理。
  */
  if (!same(before, after) && invBillingLocked(e)) {
    throw new Error(
      "自動收費項目已鎖定：本次收據已出具或已標記收款。\n\n" +
      "未收款而需修訂的收據，請先到歷史紀錄作廢有效版本。" +
      "已收款的退款／補收，請另行處理，勿直接改動原單。\n\n" +
      "若這項檢查由檢查中心收費，可使用「檢查中心直接收費」。"
    );
  }

  const manualItems = e.receipt.items
    .filter(item => !item.investigationId);

  e.receipt.items = [...manualItems, ...after];

  if (!same(before, after)) {
    e.used.receipt = usedReceiptItems(e).length > 0;
  }
}

function invMutate(type, action, reason, mutation) {
  if (!editable()) return false;

  const ok = transaction(() => {
    mutation();

    invSyncCharges(current);

    current.used[type] = current[type].items.length > 0;
    current.updated = now();

    addAudit(current, action, reason);
  });

  renderUI();
  return ok;
}

function invSelect(type, catalogueId, selected) {
  if (!editable()) return;

  const existing = current[type].items.find(
    item => item.catalogueId === catalogueId
  );

  if (!selected) {
    if (existing) invRemove(type, existing.id);
    return;
  }

  if (existing) return;

  const entry = db.catalogue.find(
    row => row.id === catalogueId &&
      row.type === type &&
      row.enabled
  );

  assert(entry, "檢查目錄項目不存在或已停用");

  if (entry.billing === "clinic") {
    assert(
      invValidPrice(entry.price),
      "「" + entry.name + "」尚未設定價錢。\n" +
      "請先到檢查目錄填價，或將預設收費改為檢查中心直接收費。"
    );
  }

  invMutate(
    type,
    "加入檢查",
    entry.name + "；" + INV_BILLING[entry.billing],
    () => {
      current[type].items.push({
        id: uid(),
        catalogueId: entry.id,
        name: entry.name,
        price: entry.price,
        billing: entry.billing,
        details: "",
        status: "ordered",
        result: "",
        performedDate: "",
        resultDate: "",
        statusUpdatedAt: now()
      });
    }
  );
}

function invRemove(type, id) {
  const item = invOrder(current, type, id);
  if (!item || !editable()) return;

  if (item.status !== "ordered" || trim(item.result)) {
    throw new Error(
      "這項檢查已標記完成／收到報告，或已填寫結果，不能直接取消剔選。\n" +
      "請保留臨床紀錄；如屬輸入錯誤，先核對並修正狀態及結果。"
    );
  }

  if (effectiveVersion(current, type) && !confirm(
    "移除「" + item.name + "」？\n\n" +
    "已出具申請表不會自動撤回。" +
    "請重新列印修訂版；如已移除全部項目，請到歷史作廢舊申請表。"
  )) {
    renderUI();
    return;
  }

  invMutate(type, "移除待完成檢查", item.name, () => {
    current[type].items = current[type].items
      .filter(row => row.id !== id);
  });
}

function invChangeBilling(type, id, value) {
  assert(Object.hasOwn(INV_BILLING, value), "收費方式錯誤");

  const item = invOrder(current, type, id);
  assert(item, "找不到檢查項目");

  if (value === "clinic") {
    assert(
      invValidPrice(item.price),
      "這項已選檢查沒有保存價錢。\n" +
      "請先在目錄設定價錢，再取消並重新選取尚未完成的項目。"
    );
  }

  invMutate(
    type,
    "更改檢查收費方式",
    item.name + "；" + INV_BILLING[value],
    () => { item.billing = value; }
  );
}

function invChangeStatus(type, id, value) {
  assert(Object.hasOwn(INV_STATUS, value), "檢查狀態錯誤");

  const item = invOrder(current, type, id);
  assert(item, "找不到檢查項目");

  if (value === item.status) return;

  if (item.status !== "ordered" && value === "ordered") {
    if (!confirm(
      "將「" + item.name + "」改回待完成？\n" +
      "請確認這是更正狀態；已有結果及日期不會自動刪除。"
    )) {
      renderUI();
      return;
    }
  }

  invMutate(
    type,
    "更新檢查狀態",
    item.name + "：" +
      INV_STATUS[item.status] + " → " + INV_STATUS[value],
    () => {
      item.status = value;
      item.statusUpdatedAt = now();

      /*
        不自動填實際檢查日／收報告日。
        修改狀態的時間不等同檢查發生日期。
      */
    }
  );
}

/* ---------- 16.5 申請表的內容比較 ---------- */

const invOriginalFingerprint = fingerprint;

fingerprint = function(e, type, settings) {
  const result = invOriginalFingerprint(e, type, settings);

  if (INV_TYPES.includes(type)) {
    const request = e[type];

    /*
      結果、完成狀態、收費方式及價錢不印在申請表。
      更新上述資料不應單獨觸發申請表新版本。
    */
    result.content = {
      centre: request.centre,
      indication: request.indication,
      remarks: request.remarks,
      items: request.items.map(item => ({
        name: item.name,
        details: item.details
      }))
    };
  }

  return result;
};

DOCUMENT_RENDERERS.lab = e => invRequestHTML(e, "lab");
DOCUMENT_RENDERERS.imaging = e => invRequestHTML(e, "imaging");

const invOriginalDocumentWarnings = documentWarnings;

documentWarnings = function(e, type, settings) {
  const warnings = invOriginalDocumentWarnings(e, type, settings);

  if (INV_TYPES.includes(type)) {
    if (!e[type].items.length) {
      warnings.push("請至少選擇一項檢查");
    }

    if (e[type].items.some(item => !trim(item.name))) {
      warnings.push("檢查名稱不可空白");
    }
  }

  return warnings;
};

const invOriginalSummaryText = summaryText;

summaryText = function(e, type) {
  if (!INV_TYPES.includes(type)) {
    return invOriginalSummaryText(e, type);
  }

  const request = e[type];

  return [
    "檢查中心：" + (trim(request.centre) || "未指定"),
    ...request.items.map((item, index) =>
      `${index + 1}. ${item.name}` +
      (trim(item.details) ? " — " + item.details : "")
    ),
    trim(request.indication)
      ? "Clinical indication：" + request.indication
      : ""
  ].filter(Boolean).join("\n");
};

/* ---------- 16.7 Progress Note 檢查紀錄 ---------- */

function invNoteHTML(e) {
  const groups = INV_TYPES.filter(type => e[type]?.items.length);

  if (!groups.length) return "";

  return `
    <section class="note-section">
      <h2></h2>

      ${groups.map(type => {
        const request = e[type];

        const content = [
          trim(request.centre)
            ? "檢查中心：" + request.centre
            : "",

          trim(request.indication)
            ? "Clinical indication：" + request.indication
            : "",

          ...request.items.map((item, index) => [
            `${index + 1}. ${item.name}`,
            "狀態：" + INV_STATUS[item.status],
            trim(item.details) ? "詳情：" + item.details : "",
            item.performedDate
              ? "檢查日期：" + fmt(item.performedDate)
              : "",
            item.resultDate
              ? "報告日期：" + fmt(item.resultDate)
              : "",
            trim(item.result)
              ? "結果摘要：" + item.result
              : item.status === "results"
                ? "結果摘要：未填寫"
                : ""
          ].filter(Boolean).join("\n")),

          trim(request.remarks)
            ? "備註：" + request.remarks
            : ""
        ].filter(Boolean).join("\n\n");

        return `
          <div style="margin-top:4mm">
            <strong>${type === "lab"
              ? "Laboratory Tests 化驗"
              : "Radiology Imaging 影像檢查"
            }</strong>
            <div class="note-text" style="margin-top:2mm">${esc(content)}</div>
          </div>
        `;
      }).join("")}
    </section>
  `;
}

renderProgressNote = function(e, s) {
  const summary = s.kind === "revision"
    ? s.entry.summary
    : buildSummary(e, s.settings);

  const sections = [
    [
      "Chief Complaint & History of Present Illness 主訴及病史",
      e.soap.s
    ],
    [
      "Physical Examination & Investigations 檢查及化驗結果",
      e.soap.o
    ],
    [
      "Diagnosis 診斷",
      (trim(e.diagnosis) || "未填寫") +
        "\n\nOther Assessment 評估補充：" +
        (trim(e.soap.a) || "未填寫")
    ],
    [
      "Plan of Management 治療計劃",
      e.soap.p
    ]
  ];

  /*
    沒有使用的新增申請表類別不佔摘要空間。
    原有五類摘要維持原本顯示方式。
  */
  const visibleSummary = summary.filter(item =>
    !INV_TYPES.includes(item.type) ||
    item.issued ||
    item.draft ||
    item.legacyCount ||
    item.hadVoid
  );

  return `
    ${sections.map(([label, value]) => `
      <section class="note-section">
        <h2>${esc(label)}</h2>
        <div class="note-text">${esc(
          trim(value) ? value : "未填寫"
        )}</div>
      </section>
    `).join("")}

    ${invNoteHTML(e)}

    <section class="note-section">
    <b>Documents issued as follow 已發出以下文件</b>
      ${renderSummary(visibleSummary)}
    </section>

    <div class="document-footer">
      記錄醫生：
      ${esc(s.settings.nameCn)} / ${esc(s.settings.nameEn)}<br>
      ${s.kind === "revision" ? "完成時間" : "修改時間"}：
      ${esc(stamp(s.savedAt))}
    </div>
  `;
};

    ? invCatalogueWorking.map(row => `
      <div class="inv-catalogue-row" data-cat-row="${esc(row.id)}">
        <div class="inv-catalogue-grid">
          <div>
            <label>類別</label>
            <select data-cat-field="type">
              <option value="lab" ${row.type === "lab" ? "selected" : ""}>
                LAB
              </option>
              <option value="imaging" ${row.type === "imaging" ? "selected" : ""}>
                Imaging
              </option>
            </select>
          </div>

          <div>
            <label>檢查名稱</label>
            <input data-cat-field="name" value="${esc(row.name)}">
          </div>

          <div>
            <label>價錢 HKD</label>
            <input
              type="number"
              min="0"
              step=".01"
              data-cat-field="price"
              value="${esc(row.price)}"
              placeholder="未定價"
            >
          </div>

          <div>
            <label>預設收費方式</label>
            <select data-cat-field="billing">
              ${Object.entries(INV_BILLING).map(([value, label]) => `

              `).join("")}

          </button>
        </div>

}

function invOpenCatalogue() {
  if (busy || loadFailed || conflict) return;

  invCatalogueWorking = clone(db.catalogue);
  invRenderCatalogueEditor();

  $("invCatalogueDialog").showModal();
}

function invAddCatalogueRow(type) {
  invCatalogueWorking.push({
    id: uid(),
    type,
    name: "",
    price: "",
    billing: "clinic",
    enabled: true
  });

  invRenderCatalogueEditor();
}

function invSaveCatalogue() {
  if (busy || loadFailed || conflict) return;

  const normalized = invNormalizeCatalogue(invCatalogueWorking);

  if (transaction(() => {
    db.catalogue = normalized;
  })) {
    $("invCatalogueDialog").close();
    renderUI();
  }
}

/* ---------- 16.9 LAB / Imaging 編輯頁 ---------- */

const invOriginalRenderDocumentFields = renderDocumentFields;

renderDocumentFields = function() {
  if (!INV_TYPES.includes(active)) {
    invOriginalRenderDocumentFields();

    /*
      自動產生的收費列不可直接改名、改價或移除。
      必須回到檢查頁變更，以免失去連動。
    */
    if (active === "receipt") {
      const e = data();

      e.receipt.items.forEach((item, index) => {
        if (!item.investigationId) return;

        const input = $("documentFields").querySelector(
          `[data-path="receipt.items.${index}.desc"]`
        );

        const card = input?.closest(".item-card");
        if (!card) return;

        card.classList.add("inv-linked-charge");

        card.querySelectorAll("input").forEach(el => {
          el.readOnly = true;
        });

        const remove = card.querySelector("[data-remove]");
        if (remove) remove.disabled = true;

        const label = card.querySelector(".item-top span");
        if (label) {
          label.textContent =
            "檢查自動收費項目 · 請到 LAB／Imaging 修改";
        }
      });
    }

    return;
  }

  const e = data();
  const type = active;
  const request = e[type];
  const liveEditor = !view && current.status === "draft";

  const catalogue = liveEditor
    ? db.catalogue.filter(row =>
      row.type === type &&
      (
        row.enabled ||
        request.items.some(item => item.catalogueId === row.id)
      )
    )
    : [];

  $("documentFields").innerHTML = `
    <h3>${type === "lab"
      ? "Laboratory Tests / 化驗"
      : "Radiology / Imaging / 影像檢查"
    }</h3>

    <div class="small" style="margin-bottom:12px">
      剔選代表申請檢查，唔代表病人已完成。<br>
      已出具申請表不會因為修改選項而自動撤回；
      需要時重新列印修訂版，或到歷史作廢。
    </div>

    ${textField(
      "檢查中心／機構（可留空）",
      type + ".centre"
    )}

    ${area(
      "Clinical indication（留空則使用診斷）",
      type + ".indication"
    )}

    ${liveEditor ? `
      <div class="actions" style="margin-bottom:10px">
        <button type="button" data-inv-open-catalogue>
          管理檢查目錄／價目表
        </button>
      </div>

      ${invBillingLocked(current) ? `
        <div class="notice">
          收據已出具或標記收款，自動收費項目已鎖定。
          更改檢查狀態及結果不受影響。
        </div>
      ` : ""}

      <input
        id="invSearch"
        placeholder="搜尋檢查名稱"
        aria-label="搜尋檢查名稱"
      >

      <div class="inv-list">
        ${catalogue.length ? catalogue.map(row => {
          const selected = request.items.find(
            item => item.catalogueId === row.id
          );

          const displayPrice = selected ? selected.price : row.price;
          const displayBilling = selected ? selected.billing : row.billing;

          return `
            <label class="inv-choice" data-inv-choice
              data-inv-name="${esc(row.name.toLowerCase())}">
              <input
                type="checkbox"
                data-inv-select="${esc(row.id)}"
                data-inv-type="${type}"
                ${selected ? "checked" : ""}
              >

              <span>
                <strong>${esc(selected ? selected.name : row.name)}</strong>
                <small>
                  ${trim(displayPrice)
                    ? "HKD " + money(displayPrice)
                    : "未定價"
                  }
                  · ${esc(INV_BILLING[displayBilling])}
                  ${selected ? " · 已保留選取時資料" : ""}
                  ${!row.enabled ? " · 目錄已停用" : ""}
                </small>
              </span>
            </label>
          `;
        }).join("") : `
          <p class="small" style="padding:10px">
            此類別未有可選項目，請先在檢查目錄新增。
          </p>
        `}
      </div>
    ` : ""}

    <h3>已選檢查（${request.items.length}）</h3>

    ${request.items.map((item, index) => `
      <div class="item-card inv-selected">
        <div class="item-top">
          <strong>${index + 1}. ${esc(item.name)}</strong>

          ${liveEditor ? `
            <button
              type="button"
              data-inv-remove="${esc(item.id)}"
              data-inv-type="${type}">
              取消
            </button>
          ` : ""}
        </div>

        <div class="small" style="margin-bottom:10px">
          選取時價錢：
          ${trim(item.price) ? "HKD " + money(item.price) : "未定價"}
        </div>

        <div class="field">
          <label>收費方式</label>
          <select
            data-inv-billing="${esc(item.id)}"
            data-inv-type="${type}">
            ${Object.entries(INV_BILLING).map(([value, label]) => `
              <option value="${value}"
                ${item.billing === value ? "selected" : ""}>
                ${esc(label)}
              </option>
            `).join("")}
          </select>
        </div>

        ${area(
          "申請詳情／部位／左右側（會印在申請表）",
          `${type}.items.${index}.details`
        )}

        <div class="field">
          <label>實際檢查狀態（內部紀錄）</label>
          <select
            data-inv-status="${esc(item.id)}"
            data-inv-type="${type}">
            ${Object.entries(INV_STATUS).map(([value, label]) => `
              <option value="${value}"
                ${item.status === value ? "selected" : ""}>
                ${esc(label)}
              </option>
            `).join("")}
          </select>
        </div>

        <div class="grid2">
          ${textField(
            "實際檢查日期（如已知）",
            `${type}.items.${index}.performedDate`,
            "date"
          )}

          ${textField(
            "收報告日期（如已知）",
            `${type}.items.${index}.resultDate`,
            "date"
          )}
        </div>

        ${area(
          "結果／報告摘要（只入 Progress Note，不印在申請表）",
          `${type}.items.${index}.result`
        )}
      </div>
    `).join("")}

    ${!request.items.length ? `
      <p class="small">未選擇檢查。</p>
    ` : ""}

    ${area(
      "申請表其他備註",
      type + ".remarks"
    )}
  `;
};

/* ---------- 16.10 事件 ---------- */

const invOriginalBindEvents = bindEvents;

bindEvents = function() {
  invOriginalBindEvents();

  $("invCatalogueBtn").onclick = invOpenCatalogue;

  $("invExportV2Btn").onclick = run(() => {
    exportStored(INV_V2_KEY, "v2原始資料");
  });

  $("invAddLab").onclick = () => invAddCatalogueRow("lab");
  $("invAddImaging").onclick = () => invAddCatalogueRow("imaging");
  $("invSaveCatalogue").onclick = run(invSaveCatalogue);

  $("invCatalogueRows").addEventListener("input", event => {
    const field = event.target.dataset.catField;
    const rowElement = event.target.closest("[data-cat-row]");

    if (!field || !rowElement) return;

    const row = invCatalogueWorking.find(
      item => item.id === rowElement.dataset.catRow
    );

    if (!row) return;

    row[field] = field === "enabled"
      ? event.target.checked
      : event.target.value;
  });

  $("invCatalogueRows").addEventListener("click", event => {
    const button = event.target.closest("[data-cat-remove]");
    if (!button) return;

    invCatalogueWorking = invCatalogueWorking.filter(
      row => row.id !== button.dataset.catRemove
    );

    invRenderCatalogueEditor();
  });

  $("documentFields").addEventListener("input", event => {
    if (event.target.id !== "invSearch") return;

    const query = trim(event.target.value).toLowerCase();

    $("documentFields").querySelectorAll("[data-inv-choice]")
      .forEach(row => {
        row.classList.toggle(
          "hidden",
          !row.dataset.invName.includes(query)
        );
      });
  });

  $("documentFields").addEventListener("change", run(event => {
    const input = event.target;
    if (!editable()) return;

    const type = input.dataset.invType;
    if (!INV_TYPES.includes(type)) return;

    /*
      交易失敗或被收費鎖阻止時，還原 UI，
      避免 checkbox 看起來已成功變更。
    */
    try {
      if (input.dataset.invSelect) {
        invSelect(type, input.dataset.invSelect, input.checked);
      } else if (input.dataset.invBilling) {
        invChangeBilling(type, input.dataset.invBilling, input.value);
      } else if (input.dataset.invStatus) {
        invChangeStatus(type, input.dataset.invStatus, input.value);
      }
    } catch (error) {
      renderUI();
      throw error;
    }
  }));

  $("documentFields").addEventListener("click", run(event => {
    const manage = event.target.closest("[data-inv-open-catalogue]");

    if (manage) {
      invOpenCatalogue();
      return;
    }

    const remove = event.target.closest("[data-inv-remove]");
    if (!remove || !editable()) return;

    try {
      invRemove(
        remove.dataset.invType,
        remove.dataset.invRemove
      );
    } catch (error) {
      renderUI();
      throw error;
    }
  }));

  /*
    自動收費列的第二層保護。
    不依賴只讀樣式，亦阻止既有移除事件。
  */
  $("documentFields").addEventListener("click", event => {
    const button = event.target.closest(
      '[data-remove][data-list="receipt"]'
    );

    if (!button || !editable()) return;

    const item = current.receipt.items[
      Number(button.dataset.remove)
    ];

    if (!item?.investigationId) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    alert("這是檢查連動項目，請到 LAB／Imaging 修改。");
  }, true);

  $("formFields").addEventListener("input", event => {
    const path = event.target.dataset.path || "";
    const match = path.match(/^receipt\.items\.(\d+)\./);

    if (!match || !editable()) return;

    const item = current.receipt.items[Number(match[1])];
    if (!item?.investigationId) return;

    event.preventDefault();
    event.stopImmediatePropagation();
    fillFields();
  }, true);
};

/* ---------- 16.11 工具列狀態 ---------- */

const invOriginalRenderUI = renderUI;

renderUI = function() {
  invOriginalRenderUI();

  $("invCatalogueBtn").disabled =
    busy || loadFailed || conflict;
};

/* ================== Investigations 模組完 ================== */

/* ---------- 15.11 初始化與事件 ---------- */

loadDatabase();

/*
  先替换了 printDocument、completeEncounter 等函式，
  原有 bindEvents 會綁定到新的流程。
*/
bindEvents();

/* 舊按鈕已隱藏，亦移除原有點擊處理。 */
$("saveBtn").onclick = null;
$("issueBtn").onclick = null;

$("simpleBatchOpen").onclick = simpleOpenBatch;

$("simpleBatchPrint").onclick = run(async () => {
  if (busy || view || loadFailed || conflict) return;

  const types = [
    ...$("simpleBatchList").querySelectorAll(
      "[data-simple-print-type]:checked:not(:disabled)"
    )
  ].map(input => input.dataset.simplePrintType);

  if (!types.length) {
    alert("請至少勾選一份文件。");
    return;
  }

  $("simpleBatchDialog").close();
  await simplePrint(types);
});

$("simpleCompleteBack").onclick = () => {
  $("simpleCompleteDialog").close();

  if (
    simpleCompletionContext &&
    current.id === simpleCompletionContext.encounterId
  ) {
    active =
      simpleCompletionContext.firstPending || "note";
    view = null;
  }

  simpleCompletionContext = null;
  renderUI();
};

$("simpleCompleteConfirm").onclick = run(() => {
  if (
    !simpleCompletionContext ||
    current.id !== simpleCompletionContext.encounterId
  ) {
    $("simpleCompleteDialog").close();
    simpleCompletionContext = null;
    alert("目前診症已改變，請重新確認。");
    return;
  }

  if (simpleCommitCompletion()) {
    $("simpleCompleteDialog").close();
    simpleCompletionContext = null;
  }
});

$("simpleRetrySave").onclick = () => {
  if (busy || loadFailed || conflict) return;

  persist();
  renderUI();
};

$("simpleEmergencyExport").onclick = run(exportBackup);

$("simplePrintReturn").onclick = () => {
  const job = simplePrintJob;

  if (!job || job.phase !== "printing") return;

  simpleFinishPrint(job);
};

/*
  afterprint 只用來還原介面。
  不把它當成「已成功列印」或「已交付病人」證據。
*/
window.addEventListener("afterprint", () => {
  const job = simplePrintJob;

  if (!job || job.phase !== "printing") return;

  setTimeout(() => simpleFinishPrint(job), 0);
});

/* 列印準備期間避免意外離開。 */
window.addEventListener("beforeunload", event => {
  if (simplePrintJob) {
    event.preventDefault();
    event.returnValue = "";
  }
});

/* 點選選單外部時收起列印選單。 */
document.addEventListener("click", event => {
  const menu = $("simplePrintMenu");

  if (!menu.contains(event.target)) {
    menu.removeAttribute("open");
  }
});

renderUI();

if (!loadFailed) {
  persist();
}
</script>
