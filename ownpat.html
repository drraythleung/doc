<script>
(function installWidePatientHeader(){
 "use strict";

 const app = document.getElementById("app");
 if(!app || app.dataset.widePatientHeader === "1") return;

 /*
  計算診症當日已滿的年及月。
  出生日期缺失、無效或遲於診症日期時，不推算。
 */
 function ageYearsMonths(dob, referenceDate){
  if(!dateOK(dob) ||
     !dateOK(referenceDate) ||
     dob > referenceDate){
   return "未能計算";
  }

  const birthYear = Number(dob.slice(0,4));
  const birthMonth = Number(dob.slice(5,7));
  const birthDay = Number(dob.slice(8,10));

  const referenceYear = Number(referenceDate.slice(0,4));
  const referenceMonth = Number(referenceDate.slice(5,7));
  const referenceDay = Number(referenceDate.slice(8,10));

  let months =
   (referenceYear - birthYear) * 12 +
   referenceMonth - birthMonth;

  if(referenceDay < birthDay) months--;

  if(months < 0) return "未能計算";

  return Math.floor(months / 12) + "y" + (months % 12) + "m";
 }

 function fact(label, value, identifier = false){
  return `
   <span class="cms-patient-fact">
    <span class="cms-patient-fact-label">${E(label)}</span>
    <span class="cms-patient-fact-value ${
     identifier ? "cms-identifier" : ""
    }">${E(T(value) || "未填寫")}</span>
   </span>`;
 }

 function updateFullPatientHeader(){
  if(!db) return;

  const title = document.getElementById("previewTitle");
  if(!title) return;

  /*
   source() 會沿用目前畫面來源：
   本次診症、歷史文件或完成快照。
   不用目前主檔身份取代歷史身份。
  */
  const displayed = source();
  const encounterData = displayed.data;
  const patientData = encounterData.patient || {};

  const patientMaster = db.patients.find(
   item => item.id === encounterData.patientId
  );

  const englishName = [
   T(patientData.surname).toUpperCase(),
   T(patientData.given)
  ].filter(Boolean).join(" ");

  const documentName = TYPES[tab]?.[0] || "診症";

  title.classList.add("cms-full-patient");

 title.textContent = [
 T(patientData.cn) || "未填中文姓名",
 englishName || "未填英文姓名",
 ageYearsMonths(patientData.dob, encounterData.date),
 T(patientData.sex) || "未填性別",
  dateOK(patientData.dob) ? fmt(patientData.dob) : "未填出生日期",
 normID(patientData.hkid) || "未填證件",
 patientMaster?.mrn || "未填病人號碼"
].join(" · ");
 }

 /*
  原本 preview() 每次會重寫 previewTitle。
  所以在原有預覽完成後再更新病人欄，
  避免切換頁籤或輸入後變回舊標題。
 */
 const originalPreview = preview;

 preview = function(){
  const result = originalPreview.apply(this, arguments);
  updateFullPatientHeader();
  return result;
 };

 app.dataset.widePatientHeader = "1";

 if(db){
  updateFullPatientHeader();
  requestAnimationFrame(() => {
   window.dispatchEvent(new Event("resize"));
  });
 }
})();
</script>

<script>
(function installPatientRegistrationAndFamily(){
 "use strict";

 if(document.documentElement.dataset.patientFamily === "1") return;
 document.documentElement.dataset.patientFamily = "1";

 const labels = {
  cn:"中文姓名",
  surname:"英文姓氏",
  given:"英文名字",
  hkid:"HKID／證件號碼",
  dob:"出生日期",
  sex:"性別（例如 Male／Female）",
  phone:"電話",
  email:"電郵",
  address:"地址",
  contact1Name:"聯絡人 1 姓名",
  contact1Phone:"聯絡人 1 電話",
  contact2Name:"聯絡人 2 姓名",
  contact2Phone:"聯絡人 2 電話"
 };

 const fields = [
  "cn","surname","given","hkid","dob","sex",
  ...CONTACTS
 ];

 const findPatient = id => {
  const p = db?.patients.find(x => x.id === id);
  assert(p, "找不到病人主檔");
  return p;
 };

 function ageText(dob){
  const reference = today();
  if(!dateOK(dob) || dob > reference) return "—";

  let months =
   (+reference.slice(0,4) - +dob.slice(0,4)) * 12 +
   +reference.slice(5,7) - +dob.slice(5,7);

  if(+reference.slice(8,10) < +dob.slice(8,10)) months--;

  return months < 0
   ? "—"
   : Math.floor(months / 12) + "y" + (months % 12) + "m";
 }

 function relations(d = db){
  return d.patientRelations || [];
 }

 function relatives(id){
  return relations()
   .filter(r => r.active && (r.a === id || r.b === id))
   .map(r => ({
    relation:r,
    patient:findPatient(r.a === id ? r.b : r.a),
    label:r.a === id ? r.labelA : r.labelB
   }));
 }

 function auditFamily(d, actionName, detail){
  d.meta.security.push({
   at:now(),
   actor,
   sessionId,
   action:actionName,
   ...detail
  });
 }

 /*
  可選擴充欄位：
  舊工作區沒有 patientRelations 亦可正常載入。
  新關係會跟隨整個工作區儲存及備份。
 */
 const originalCheckDB = checkDB;

 checkDB = function(d){
  const result = originalCheckDB(d);

  if(d.patientRelations === undefined) return result;

  arr(d.patientRelations, "病人關係");
  unique(d.patientRelations.map(r => r.id), "病人關係 ID");

  const ids = new Set(d.patients.map(p => p.id));
  const activePairs = new Set();

  for(const r of d.patientRelations){
   assert(O(r), "病人關係格式無效");

   for(const k of [
    "id","a","b","labelA","labelB",
    "createdAt","createdBy","sessionId"
   ]) str(r[k], "病人關係." + k);

   bool(r.active, "病人關係狀態");

   assert(ids.has(r.a) && ids.has(r.b),
    "病人關係連結的主檔不存在");

   assert(r.a !== r.b, "不能將病人連結自己");

   assert(
    T(r.labelA) && T(r.labelB) &&
    r.labelA.length <= 100 && r.labelB.length <= 100,
    "雙向關係名稱須填寫，最多 100 字"
   );

   if(r.active){
    const pair = JSON.stringify([r.a,r.b].sort());
    assert(!activePairs.has(pair), "病人關係重複");
    activePairs.add(pair);
   }
  }

  return result;
 };

 function familyHTML(id, allowRemove = false){

   return '<div class="pf-empty">未連結其他已登記家人。</div>';

       <th>電話</th>
       ${allowRemove ? "<th></th>" : ""}
      </tr>
     </thead>

      ${list.map(({patient:p,label,relation:r}) => `

        <td>${E(fmt(p.data.dob))}</td>
        <td>${E(p.data.phone || "—")}</td>
        ${allowRemove ? `
         <td>
          <button type="button"
           class="danger"
           data-act="pfUnlink"
           data-patient="${E(id)}"
           data-relation="${E(r.id)}">解除</button>
         </td>` : ""}
       </tr>
      `).join("")}
     </tbody>
    </table>
   </div>`;
 }

 function drawSideFamily(){
  let card = $("pfSideFamily");

  if(!db || !current()){
   card?.remove();
   return;
  }

  if(!card){
   card = document.createElement("section");
   card.id = "pfSideFamily";
   card.className = "card pf-family-card";

   const patientCard = $("patientHeading").closest(".card");
   patientCard.after(card);
  }

  const id = current().patientId;

  card.innerHTML = `
   <div class="row between">
    <h3>已連結家人</h3>
    <button type="button"
     data-act="pfOpen"
     data-patient="${E(id)}">主檔／管理關係</button>
   </div>
   ${familyHTML(id)}
   <div class="small">
    顯示目前主檔資料；年紀按今日計算。
   </div>`;
 }

 const originalRender = render;

 render = function(){
  const result = originalRender.apply(this, arguments);
  drawSideFamily();
  return result;
 };

 /*
  沿用既有主檔畫面，加入主檔操作及家人清單。
  開啟家人只顯示對方主檔，不切換或建立診症。
 */
 const originalMasterHistory = masterHistory;

 masterHistory = function(id){
  const p = findPatient(id);
  originalMasterHistory(id);

  const count = db.encounters.filter(
   e => e.patientId === id
  ).length;

  const actions = document.createElement("section");
  actions.className = "item";

  actions.innerHTML = `
   <div class="pf-meta">
    診症紀錄：${count} 次 · 年紀：${E(ageText(p.data.dob))}
   </div>
   <div class="pf-tools">
    <button type="button"
     data-act="pfEdit"
     data-patient="${E(id)}">編輯病人主檔</button>

    <button type="button"
     data-act="pfLink"
     data-patient="${E(id)}">＋ 連結家人</button>

    <button type="button"
     data-act="newForPatient"
     data-patient="${E(id)}">建立新診症</button>

    <button type="button"
     data-act="pfRegistry">返回病人名單</button>
   </div>`;

  const family = document.createElement("section");
  family.className = "item";
  family.innerHTML = `
   <h3>已登記家人</h3>
   ${familyHTML(id, true)}
   <p class="small" style="margin-top:10px">
    只列出人手直接連結的家人。
    聯絡資料取自各自目前主檔；不會互相同步病歷。
   </p>`;

  $("modalBody").prepend(actions);
  $("modalBody").append(family);
 };

 function registry(query = ""){
  const q = T(query).toLowerCase();

  const list = db.patients.filter(p =>
   [
    p.mrn,
    pname(p.data),
    normID(p.data.hkid),
    p.data.phone
   ].join(" ").toLowerCase().includes(q)
  ).sort((a,b) => a.mrn.localeCompare(b.mrn));

  showModal("病人主檔", `
   <div class="pf-tools">
    <button type="button"
     class="primary"
     data-act="pfNew">＋ 只登記病人</button>
   </div>

   <label for="pfRegistryQuery">搜尋姓名、病歷編號、證件或電話</label>
   <div class="row">
    <input id="pfRegistryQuery"
     style="flex:1;min-width:180px"
     value="${E(query)}">
    <button type="button" data-act="pfSearch">搜尋</button>
   </div>

   <p class="small" style="margin-top:10px">
    登記主檔不會建立診症，亦不需要診斷。
    以下最多顯示 100 人。
   </p>

   ${list.slice(0,100).map(p => {
    const count = db.encounters.filter(
     e => e.patientId === p.id
    ).length;

    return `
     <section class="item">
      <button type="button"
       class="pf-name-button"
       data-act="pfOpen"
       data-patient="${E(p.id)}">
       ${E(p.mrn)} · ${E(pname(p.data) || "未填姓名")}
      </button>

      <div class="pf-meta">${E([
       ageText(p.data.dob),
       p.data.sex || "未填性別",
       fmt(p.data.dob),
       p.data.phone || "未填電話"
      ].join(" · "))}</div>

      <div class="small">
       診症紀錄：${count} 次 · 已連結家人：${relatives(p.id).length}
      </div>

      <div class="pf-tools">
       <button type="button"
        data-act="pfOpen"
        data-patient="${E(p.id)}">開啟主檔</button>

       <button type="button"
        data-act="newForPatient"
        data-patient="${E(p.id)}">建立新診症</button>
      </div>
     </section>`;
   }).join("") || '<div class="pf-empty">沒有符合的病人。</div>'}
  `, "pfRegistry");
 }

 function editPatient(id = ""){
  const p = id ? findPatient(id) : null;
  const data = p ? p.data : patient();

  showModal(p ? "編輯病人主檔" : "只登記病人", `
   <div class="notice">
    ${p
     ? "只更新目前主檔；不會改寫既有診症、歷史文件或完成快照。"
     : "只建立病人主檔。不建立診症，不需要填寫診斷，亦不產生收據。"}
   </div>

   <div class="grid" style="margin-top:15px">
    ${fields.map(k => `
     <div class="field" ${k === "address" ? 'style="grid-column:1/-1"' : ""}>
      <label for="pfField-${k}">${E(labels[k])}</label>
      <input id="pfField-${k}"
       data-pf-field="${k}"
       type="${k === "dob" ? "date" : "text"}"
       value="${E(data[k])}">
     </div>
    `).join("")}
   </div>

   ${p ? `
    <label for="pfEditReason">主檔修改原因（必填）</label>
    <textarea id="pfEditReason"></textarea>
   ` : ""}

   <div class="pf-tools">
    <button type="button"
     class="primary"
     data-act="pfSave"
     data-patient="${E(id)}">
     ${p ? "保存主檔" : "登記病人（不建立診症）"}
    </button>
    <button type="button" data-act="pfRegistry">返回名單</button>
   </div>
  `, "pfEdit");
 }

 async function savePatient(id){
  const old = id ? findPatient(id) : null;
  const data = old ? C(old.data) : patient();

  $("modalBody").querySelectorAll("[data-pf-field]").forEach(i => {
   data[i.dataset.pfField] = T(i.value);
  });

  data.hkid = normID(data.hkid);

  assert(pname(data), "請至少填寫中文或英文姓名");

  if(data.dob){
   assert(dateOK(data.dob) && data.dob <= today(),
    "出生日期無效或遲於今日");
  }

  const reason = old ? T($("pfEditReason").value) : "首次登記主檔";
  assert(reason, "請填寫主檔修改原因");

  const duplicates = duplicatePatients(data, id);

  if(duplicates.length && !confirm(
   "發現可能重複病人：\n" +
   duplicates.map(p => p.mrn + " · " + pname(p.data)).join("\n") +
   "\n\n不會自動合併。確認仍要保存？"
  )) return;

  let savedId = id;

  await run(() => commit(d => {
   if(id){
    const p = d.patients.find(x => x.id === id);
    assert(p, "主檔不存在");

    p.changes.push({
     at:now(),
     actor,
     sessionId,
     reason,
     before:C(p.data),
     after:C(data)
    });

    p.data = C(data);
    p.updated = now();
   }else{
    savedId = uid();
    addMaster(d, savedId, data);

    auditFamily(d, "只登記病人主檔", {
     patientId:savedId
    });
   }
  }));

  masterHistory(savedId);
 }

 function linkDialog(id){
  const p = findPatient(id);

  const linked = new Set(relatives(id).map(x => x.patient.id));

  const candidates = db.patients.filter(
   x => x.id !== id && !linked.has(x.id)
  ).sort((a,b) => a.mrn.localeCompare(b.mrn));

  showModal("連結家人 · " + pname(p.data), `
   <p class="small">
    只可連結診所已登記病人；請核實身份及關係。
    雙向名稱由你確認，不會按性別或姓名推斷。
   </p>

   <div class="field">
    <label for="pfRelative">選擇已登記家人</label>
    <select id="pfRelative">
     <option value="">請選擇</option>
     ${candidates.map(x => `
      <option value="${E(x.id)}">
       ${E(x.mrn)} · ${E(pname(x.data))} · ${E(fmt(x.data.dob))}
      </option>
     `).join("")}
    </select>
   </div>

   <div class="field">
    <label for="pfRelationA">對方係呢位病人嘅……</label>
    <input id="pfRelationA"
     maxlength="100"
     placeholder="例如：父親、母親、配偶、兒子、女兒">
   </div>

   <div class="field">
    <label for="pfRelationB">呢位病人係對方嘅……</label>
    <input id="pfRelationB"
     maxlength="100"
     placeholder="例如：女兒、兒子、配偶、父親、母親">
   </div>

   <p class="small">
    例：現時病人係陳小明，選擇佢爸爸陳大文：<br>
    第一格填「父親」，第二格填「兒子」。
   </p>

   ${!candidates.length ? `
    <div class="notice">
     暫時沒有其他可連結病人。請先登記家人。
    </div>` : ""}

   <div class="pf-tools">
    <button type="button"
     class="primary"
     data-act="pfSaveLink"
     data-patient="${E(id)}">確認雙向連結</button>

    <button type="button"
     data-act="pfOpen"
     data-patient="${E(id)}">返回主檔</button>
   </div>
  `, "pfLink");
 }

 async function saveLink(id){
  const target = $("pfRelative").value;
  const labelA = T($("pfRelationA").value);
  const labelB = T($("pfRelationB").value);

  findPatient(id);
  findPatient(target);

  assert(target !== id, "不能連結自己");
  assert(labelA && labelB, "請填寫雙向關係名稱");

  await run(() => commit(d => {
   d.patientRelations ??= [];

   assert(!d.patientRelations.some(r =>
    r.active &&
    (
     (r.a === id && r.b === target) ||
     (r.a === target && r.b === id)
    )
   ), "這兩位病人已經連結");

   const relationId = uid();

   d.patientRelations.push({
    id:relationId,
    a:id,
    b:target,
    labelA,
    labelB,
    active:true,
    createdAt:now(),
    createdBy:actor,
    sessionId
   });

   auditFamily(d, "建立家人關係", {
    relationId,
    patientIds:[id,target]
   });
  }));

  masterHistory(id);
 }

 async function unlink(id, relationId){
  const reason = prompt(
   "解除關係原因（必填）：\n只解除連結，不刪除任何病人或病歷。"
  );

  if(!T(reason)) return;

  await run(() => commit(d => {
   const r = relations(d).find(x => x.id === relationId);

   assert(r?.active && (r.a === id || r.b === id),
    "找不到有效關係");

   r.active = false;
   r.removedAt = now();
   r.removedBy = actor;
   r.removalReason = T(reason);

   auditFamily(d, "解除家人關係", {
    relationId,
    reason:T(reason)
   });
  }));

  masterHistory(id);
 }

 /*
  沿用原本統一事件處理。
  新操作只更新主檔或關係，不呼叫 addEncounter()。
 */
 const originalAction = action;

 action = async function(button){
  const a = button.dataset.act;

  if(!a.startsWith("pf")) {
   return originalAction(button);
  }

  if(busy || printing) return;

  assert(db, "請先登入工作區");

  const id = button.dataset.patient || "";

  switch(a){
   case "pfNew":
    editPatient();
    break;
   case "pfRegistry":
    registry();
    break;
   case "pfSearch":
    registry($("pfRegistryQuery").value);
    break;
   case "pfOpen":
    masterHistory(id);
    break;
   case "pfEdit":
    editPatient(id);
    break;
   case "pfSave":
    await savePatient(id);
    break;
   case "pfLink":
    linkDialog(id);
    break;
   case "pfSaveLink":
    await saveLink(id);
    break;
   case "pfUnlink":
    await unlink(id, button.dataset.relation);
    break;
   default:
    throw new Error("未支援的病人主檔操作");
  }
 };

 /* 頂部新增獨立登記按鈕 */
 const newVisit = document.querySelector(
  '#app button[data-act="new"]'
 );

 if(newVisit){
  const register = document.createElement("button");
  register.type = "button";
  register.className = "pf-register";
  register.dataset.act = "pfNew";
  register.textContent = "＋ 登記病人";
  newVisit.before(register);
 }

 /* 頂部病人主檔改用同一個主檔名單 */
 const patientsButton = document.querySelector(
  '#app button[data-act="patients"]'
 );

 if(patientsButton){
  patientsButton.dataset.act = "pfRegistry";
 }

 /*
  新增側欄也要在登出時清除。
  原登出成功會重新載入；此處在明文 db 已清除時移除側欄。
 */
 const originalLock = lockWorkspace;

 lockWorkspace = async function(){
  const result = await originalLock.apply(this, arguments);
  if(!db) $("pfSideFamily")?.remove();
  return result;
 };

 if(db) render();
})();
</script>

<script>
(function installCompactPatientInterface(){
 "use strict";

 const app = $("app");
 if(!app || app.dataset.compactPatientUI === "1") return;

 const heading = $("patientHeading");
 const bannerNode = $("patientBanner");
 const patientCard = heading?.closest(".card");
 const contactFields = $("contactFields");

 if(!patientCard || !bannerNode || !contactFields) return;

 app.dataset.compactPatientUI = "1";
 patientCard.id = "cmsPatientCard";

 /*
  只整理畫面。
  不呼叫 commit()、不更改 db、不建立診症。
 */

 function numericDOB(value){
  return dateOK(value)
   ? value.slice(8,10) + "-" +
     value.slice(5,7) + "-" +
     value.slice(0,4)
   : "—";
 }

 function ageAt(dob, reference){
  if(!dateOK(dob) || !dateOK(reference) || dob > reference){
   return "—";
  }

  let months =
   (+reference.slice(0,4) - +dob.slice(0,4)) * 12 +
   +reference.slice(5,7) - +dob.slice(5,7);

  if(+reference.slice(8,10) < +dob.slice(8,10)){
   months--;
  }

  return months < 0
   ? "—"
   : Math.floor(months / 12) + "y" + (months % 12) + "m";
 }

 function makeDetails(id, title){
  const details = document.createElement("details");
  details.id = id;
  details.className = "cms-patient-fold";

  const summary = document.createElement("summary");
  summary.textContent = title;

  details.append(summary);
  return details;
 }

 /* 1. 搬移現有身份操作，保留原本按鈕 */
 const identityButton = app.querySelector(
  'button[data-act="identity"]'
 );

 const publishButton = app.querySelector(
  'button[data-act="publishMaster"]'
 );

 const oldActionRow = identityButton?.parentElement;

 const cardHead = document.createElement("div");
 cardHead.className = "cms-patient-card-head";

 const titleBox = document.createElement("div");

 const caption = document.createElement("div");
 caption.className = "cms-card-caption";
 caption.textContent = "病人資料 · 本次顯示快照";

 titleBox.append(caption, heading);
 cardHead.append(titleBox);

 const allergyBox = document.createElement("div");
 allergyBox.id = "cmsPatientAllergy";

 const manageFold = makeDetails(
  "cmsPatientManage",
  "管理資料"
 );

 const actionList = document.createElement("div");
 actionList.className = "cms-patient-actions";

 function addExistingAction(button, description){
  if(!button) return;

  const item = document.createElement("div");
  const note = document.createElement("div");
  note.className = "cms-action-description";
  note.textContent = description;

  item.append(button, note);
  actionList.append(item);
 }

 addExistingAction(
  identityButton,
  "只更正本次診症身份；不改寫舊文件或完成快照。"
 );

 addExistingAction(
  publishButton,
  "將本次病人資料更新至主檔；不會改寫其他診症。"
 );

 const openMasterButton = document.createElement("button");
 openMasterButton.type = "button";
 openMasterButton.dataset.act = "pfOpen";
 openMasterButton.textContent = "開啟病人主檔／管理家人";

 addExistingAction(
  openMasterButton,
  "查看或編輯目前主檔，以及新增／解除家人關係。"
 );

 manageFold.append(actionList);

 const familyFold = makeDetails(
  "cmsPatientFamily",
  "已連結家人（0）"
 );

 const familyHost = document.createElement("div");
 familyHost.id = "cmsPatientFamilyHost";
 familyFold.append(familyHost);

 /* 2. 本次聯絡資料搬入同一張卡 */
 const oldContactCard = contactFields.closest(".card");

 const contactFold = makeDetails(
  "cmsPatientContact",
  "本次聯絡資料"
 );

 const contactHelp = document.createElement("p");
 contactHelp.className = "cms-fold-help";
 contactHelp.textContent =
  "只編輯本次診症的聯絡資料，不印於對外文件。" +
  "如需沿用至之後診症，請另外更新病人主檔。";

 const contactEditor = document.createElement("fieldset");
 contactEditor.id = "cmsContactEditor";
 contactEditor.append(contactFields);

 contactFold.append(contactEditor, contactHelp);

 patientCard.replaceChildren(
  cardHead,
  bannerNode,
  allergyBox,
  manageFold,
  familyFold,
  contactFold
 );

 if(oldActionRow && oldActionRow !== patientCard){
  oldActionRow.remove();
 }

 if(oldContactCard && oldContactCard !== patientCard){
  oldContactCard.remove();
 }

 /*
  聯絡欄位已搬離 editorFields，
  所以補回原本的輸入事件及唯讀控制。
 */
 function processContactInput(event){
  const input = event.target;
  if(!input.matches("[data-path]")) return;

  const isChoice =
   input.type === "checkbox" ||
   input.tagName === "SELECT";

  if(event.type === "input" && isChoice) return;
  if(event.type === "change" && !isChoice) return;

  try{
   editorInput(input);
  }catch(error){
   if(db && current()){
    fill(contactEditor, source().data);
   }
   fail(error);
  }
 }

 contactEditor.addEventListener("input", processContactInput);
 contactEditor.addEventListener("change", processContactInput);

 const previousUpdateButtons = updateButtons;

 updateButtons = function(){
  const result = previousUpdateButtons.apply(this, arguments);
  contactEditor.disabled = !editable();
  return result;
 };

 /*
  只修改家人表格中的出生日期欄。
  不改全域 fmt()，避免影響對外文件格式。
 */
 function formatFamilyDates(root){
  if(!db || !root) return;

  root.querySelectorAll(".pf-family-table tbody tr").forEach(row=>{
   const nameButton = row.querySelector(
    'button[data-act="pfOpen"][data-patient]'
   );

   const patient = db.patients.find(
    p => p.id === nameButton?.dataset.patient
   );

   if(patient && row.cells.length >= 4){
    row.cells[3].textContent = numericDOB(patient.data.dob);
   }
  });
 }

 /* 3. 左欄摘要：使用畫面正在顯示的資料來源 */
 function drawCompactSummary(){
  if(!db || !current()) return;

  const displayed = source();
  const e = displayed.data;
  const p = e.patient || {};

  const patientMaster = db.patients.find(
   item => item.id === e.patientId
  );

  heading.textContent = pname(p) || "未填病人";
  openMasterButton.dataset.patient = e.patientId;

  const referenceAge = ageAt(p.dob, e.date);

  const identityLine = [
   patientMaster?.mrn || "",
   p.sex || "未填性別",
   referenceAge === "—" ? "" : referenceAge,
   dateOK(p.dob) ? numericDOB(p.dob) : ""
  ].filter(Boolean).join(" · ");

  const context = displayed.kind === "document"
   ? "文件版本快照"
   : displayed.kind === "revision"
    ? "完成時快照"
    : "本次診症";

  const lines = [
   identityLine,
   context + "：" + (e.date || "—") +
    " · " +
    (current().status === "completed" ? "已完成" : "未完成")
  ];

  /*
   對外文件快照沒有聯絡資料：
   不以目前主檔電話冒充歷史電話。
  */
  if(displayed.kind !== "document"){
   lines.push("本次電話：" + (T(p.phone) || "未填寫"));
  }else{
   lines.push("此文件快照不包含聯絡資料。");
  }

  if(
   patientMaster &&
   !equal(patientMaster.data, current().patient)
  ){
   lines.push("主檔與本次資料不同；不會自動互相覆蓋。");
  }

  bannerNode.textContent = lines.filter(Boolean).join("\n");

  /*
   文件快照未必包含敏感紀錄，
   缺少資料時不誤顯示成「無敏感」。
  */
  if(p.allergyStatus){
   allergyBox.textContent =
    "本次顯示資料的藥物敏感：\n" +
    allergy(p) +
    (displayed.kind === "document"
     ? ""
     : "\n本次覆核：" + (e.allergyReviewed ? "已覆核" : "未記錄"));
  }else{
   allergyBox.textContent =
    "此文件快照不包含藥物敏感紀錄；" +
    "請返回診症查看及覆核。";
  }

  allergyBox.classList.toggle(
   "is-known",
   p.allergyStatus === "known"
  );
 }

 /*
  原程式輸入後會直接呼叫 banner()，
  因此一併接駁，避免摘要變回舊版。
 */
 const previousBanner = banner;

 banner = function(){
  const result = previousBanner.apply(this, arguments);
  drawCompactSummary();
  return result;
 };

 let lastContext = "";

 function syncPatientCard(){
  if(!db || !current()) return;

  const displayed = source();

  const contextKey = [
   selected,
   view?.kind || "",
   view?.id || "",
   displayed.kind
  ].join("|");

  /*
   切換診症／歷史快照後重新收起；
   同一診症內正常輸入或切換頁籤則保留展開狀態。
  */
  if(contextKey !== lastContext){
   manageFold.open = false;
   familyFold.open = false;
   contactFold.open = false;
   lastContext = contextKey;
  }

  drawCompactSummary();

  /* 補回已搬移聯絡欄位的表單值及唯讀狀態 */
  fill(contactEditor, displayed.data);
  contactEditor.disabled = !editable();

  /*
   原家人補丁每次 render() 會更新 pfSideFamily。
   將同一個現有元素搬入收合區，不另建一份清單。
  */
  const familyCard = $("pfSideFamily");

  if(familyCard){
   if(familyCard.parentElement !== familyHost){
    familyHost.append(familyCard);
   }

   formatFamilyDates(familyCard);
  }

  const count = (db.patientRelations || []).filter(r =>
   r.active &&
   (r.a === current().patientId || r.b === current().patientId)
  ).length;

  familyFold.querySelector("summary").textContent =
   "已連結家人（" + count + "）";
 }

 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);
  syncPatientCard();
  return result;
 };

 /* 4. 主檔：家人前移，更正紀錄置底及收起 */
 const previousMasterHistory = masterHistory;

 masterHistory = function(id){
  const result = previousMasterHistory.apply(this, arguments);

  const body = $("modalBody");
  const profile = body.querySelector(".patient-profile");

  if(!profile) return result;

  const sections = [...profile.children].filter(
   node => node.classList.contains("profile-section")
  );

  const sectionTitle = section =>
   T(section.querySelector(
    ".profile-section-head h3"
   )?.textContent);

  const contactSection = sections.find(
   section => sectionTitle(section) === "最新聯絡資料"
  );

  const historySection = sections.find(
   section => sectionTitle(section) === "主檔更正紀錄"
  );

  /*
   找出原家人補丁加在 modalBody 最底的家人區。
  */
  const oldFamilySection = [...body.children].find(node =>
   node.matches("section.item") &&
   T(node.querySelector("h3")?.textContent) === "已登記家人"
  );

  if(oldFamilySection){
   const familySection = document.createElement("section");
   familySection.className =
    "profile-section cms-profile-family";

   const head = document.createElement("div");
   head.className = "profile-section-head";

   const title = document.createElement("h3");
   title.textContent = "已登記家人";

   const linkButton = document.createElement("button");
   linkButton.type = "button";
   linkButton.dataset.act = "pfLink";
   linkButton.dataset.patient = id;
   linkButton.textContent = "＋ 連結家人";

   head.append(title, linkButton);

   const content = document.createElement("div");
   content.className = "profile-section-body";

   const oldTitle = oldFamilySection.querySelector("h3");
   oldTitle?.remove();

   while(oldFamilySection.firstChild){
    content.append(oldFamilySection.firstChild);
   }

   familySection.append(head, content);

   if(contactSection){
    contactSection.after(familySection);
   }else{
    profile.append(familySection);
   }

   oldFamilySection.remove();
  }

  if(historySection){
   const fold = document.createElement("details");
   fold.className =
    "profile-section cms-profile-history";

   const summary = document.createElement("summary");

   const title = document.createElement("strong");
   title.textContent = "主檔更正紀錄";

   const count = document.createElement("span");
   count.className = "pill";

   const p = db.patients.find(item => item.id === id);
   count.textContent = (p?.changes?.length || 0) + " 次修改";

   summary.append(title, count);
   fold.append(summary);

   const historyContent = historySection.querySelector(
    ".profile-section-body"
   );

   if(historyContent){
    /*
     外層及每筆紀錄均預設收起。
     保留所有原有內容，不刪除更正紀錄。
    */
    historyContent.querySelectorAll("details").forEach(item=>{
     item.open = false;
    });

    fold.append(historyContent);
   }

   historySection.remove();
   profile.append(fold);
  }

  formatFamilyDates(profile);

  return result;
 };

 if(db){
  render();
 }

})();
</script>

<script>
(function installAllergyStatusButton(){
 "use strict";

 const app = $("app");
 const card = $("cmsPatientCard");
 const oldSummary = $("cmsPatientAllergy");
 const allergyFields = $("allergyFields");

 if(
  !app ||
  !card ||
  !oldSummary ||
  !allergyFields ||
  app.dataset.allergyStatusButton === "1"
 ){
  return;
 }

 app.dataset.allergyStatusButton = "1";

 /*
  搬移同一份 allergyFields。
  不建立第二份表單，也不修改病歷資料結構。
 */
 const oldAllergyCard = allergyFields.closest("section.card");

 const button = document.createElement("button");
 button.id = "cmsAllergyToggle";
 button.type = "button";
 button.dataset.status = "unknown";
 button.textContent = "？N/KDA";
 button.setAttribute("aria-expanded", "false");
 button.setAttribute("aria-controls", "cmsAllergyPanel");

 const panel = document.createElement("section");
 panel.id = "cmsAllergyPanel";
 panel.hidden = true;
 panel.setAttribute("role", "region");
 panel.setAttribute("aria-labelledby", "cmsAllergyPanelTitle");

 const title = document.createElement("h3");
 title.id = "cmsAllergyPanelTitle";
 title.textContent = "藥物敏感及覆核";

 const readonlyNote = document.createElement("p");
 readonlyNote.className = "cms-allergy-readonly";
 readonlyNote.hidden = true;

 const editor = document.createElement("fieldset");
 editor.id = "cmsAllergyEditor";
 editor.append(allergyFields);

 panel.append(title, readonlyNote, editor);

 /*
  原有摘要程式仍持有 oldSummary 的引用。
  將它移離畫面，但不破壞其引用，避免舊補丁出錯。
 */
 oldSummary.replaceWith(button, panel);

 /*
  allergyFields 已搬走，可移除原本空咗嘅獨立卡片。
 */
 if(oldAllergyCard && oldAllergyCard !== card){
  oldAllergyCard.remove();
 }

 function setExpanded(expanded){
  panel.hidden = !expanded;
  button.setAttribute("aria-expanded", String(expanded));
 }

 button.addEventListener("click", ()=>{
  if(!db || busy || printing) return;
  setExpanded(panel.hidden);
 });

 const states = {
  none:{
   text:"NKDA",
   description:"無已知藥物敏感"
  },
  known:{
   text:"Alert",
   description:"有藥物敏感"
  },
  unknown:{
   text:"？N/KDA",
   description:"未確認／未記錄藥物敏感狀態"
  }
 };

 let lastContext = "";

 function syncAllergyButton(){
  if(!db || !current()) return;

  const displayed = source();
  const e = displayed.data;
  const p = e.patient || {};

  const state = Object.hasOwn(states, p.allergyStatus)
   ? p.allergyStatus
   : "unknown";

  const config = states[state];

  button.dataset.status = state;
  button.textContent = config.text;

  const reviewText = displayed.kind === "document"
   ? "此文件快照未保存本次敏感覆核狀態。"
   : "本次覆核：" + (e.allergyReviewed ? "已覆核" : "未記錄");

  const missingRecord = !Object.hasOwn(states, p.allergyStatus);

  const description = missingRecord
   ? "此快照不包含藥物敏感狀態；請返回診症查看。"
   : config.description;

  button.title = description + "；" + reviewText;

  button.setAttribute(
   "aria-label",
   config.text + "：" + description +
   "。" + reviewText + "。展開或收起藥物敏感及覆核。"
  );

  /*
   正常重新繪製／輸入時保留展開狀態；
   切換診症或歷史快照時收起。
  */
  const context = [
   selected,
   view?.kind || "",
   view?.id || "",
   displayed.kind
  ].join("|");

  if(context !== lastContext){
   setExpanded(false);
   lastContext = context;
  }

  /*
   修改敏感詳情會重設覆核。
   即使文字輸入沒有觸發 render()，
   亦同步取消畫面上的覆核勾選。
  */
  const reviewCheckbox = editor.querySelector(
   '[data-path="allergyReviewed"]'
  );

  if(reviewCheckbox){
   reviewCheckbox.checked = !!e.allergyReviewed;
  }

  const readOnly = !editable();

  readonlyNote.hidden = !readOnly;
  readonlyNote.textContent = missingRecord
   ? "此快照沒有藥物敏感紀錄。以下欄位不可編輯；請返回診症查看及覆核。"
   : "目前為唯讀。若要修改，請返回本次診症，並確認診症處於未完成狀態。";

  editor.disabled = readOnly;
  button.disabled = busy || printing;
 }

 /*
  allergyFields 已搬離 editorFields，
  補回原有輸入事件；繼續使用 editorInput()，
  沿用自動儲存、覆核重設及操作紀錄。
 */
 function handleAllergyInput(event){
  const input = event.target;

  if(!input.matches("[data-path]")) return;

  const isChoice =
   input.type === "checkbox" ||
   input.tagName === "SELECT";

  if(event.type === "input" && isChoice) return;
  if(event.type === "change" && !isChoice) return;

  try{
   editorInput(input);
  }catch(error){
   if(db && current()){
    fill(editor, source().data);
   }
   fail(error);
  }finally{
   syncAllergyButton();
  }
 }

 editor.addEventListener("input", handleAllergyInput);
 editor.addEventListener("change", handleAllergyInput);

 /*
  原本 render() 會重新產生 allergyFields 內容。
  完成後填入搬移後的欄位值。
 */
 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);

  if(db && current()){
   fill(editor, source().data);
   syncAllergyButton();
  }

  return result;
 };

 /*
  原程式部分輸入只更新 banner()，
  因此同時接駁按鈕狀態更新。
 */
 const previousBanner = banner;

 banner = function(){
  const result = previousBanner.apply(this, arguments);
  syncAllergyButton();
  return result;
 };

 /*
  按鈕可於唯讀模式展開查看，
  但表單仍跟隨 editable() 鎖定。
 */
 const previousUpdateButtons = updateButtons;

 updateButtons = function(){
  const result = previousUpdateButtons.apply(this, arguments);

  editor.disabled = !editable();
  button.disabled = !db || busy || printing;

  return result;
 };

 if(db){
  render();
 }
})();
</script>

  !allergyButton ||
  !head ||
  app.dataset.patientSummaryRelocated === "1"
 ){
  return;
 }

 const masterButton = manage?.querySelector(
  'button[data-act="pfOpen"]'
 );

 if(!masterButton) return;

 app.dataset.patientSummaryRelocated = "1";

 /*
  搬移原有按鈕，保留 data-act 及事件處理。
  排列：病人主檔 → NKDA／Alert。
 */
 const actions = document.createElement("div");
 actions.id = "cmsPatientHeaderActions";

 masterButton.textContent = "病人主檔";

 actions.append(masterButton, allergyButton);
 head.append(actions);

 /*
  主檔按鈕已搬出，可隱藏原管理收合區。
  不刪除原表單或舊程式持有引用的元素。
 */
 if(manage){
  manage.open = false;
  manage.hidden = true;
 }

 /*
  新增右上診症摘要。
  原 previewTitle 及 saveState 保留原位及功能。
 */
 const context = document.createElement("div");
 context.id = "cmsVisitContext";
 context.hidden = true;

 title.after(context);

 function updateVisitContext(){
  if(!db || !current()){
   context.textContent = "";
   context.hidden = true;
   return;
  }

  const displayed = source();
  const e = displayed.data;
  const p = e.patient || {};

  /* 主檔入口跟隨畫面正在顯示的病人 */
  masterButton.dataset.patient = e.patientId;

  /*
   使用來源快照當時保存的狀態，
   不以目前診症狀態冒充歷史狀態。
  */
  const state = e.status === "completed"
   ? "已完成"
   : "未完成";

  const label = displayed.kind === "document"
   ? "文件版本診症"
   : displayed.kind === "revision"
    ? "完成快照診症"
    : "本次診症";

  const lines = [
   label + "：" + (e.date || "—") + " · " + state
  ];

  /*
   文件快照沒有電話時，不拿目前主檔電話補上，
   避免將目前電話顯示成歷史電話。
  */
  if(displayed.kind === "document"){
   lines.push("本次電話：此文件快照未保存聯絡資料");
  }else{
   lines.push("本次電話：" + (T(p.phone) || "未填寫"));
  }

  context.textContent = lines.join("\n");
  context.hidden = false;
 }

 /*
  原有輸入流程可能只呼叫 banner()，
  因此在原摘要更新後同步右上資料。
 */
 const previousBanner = banner;

 banner = function(){
  const result = previousBanner.apply(this, arguments);
  updateVisitContext();
  return result;
 };

 /*
  切換頁籤、診症或歷史版本時，
  原 preview() 完成後再更新右上摘要。
 */
 const previousPreview = preview;

 preview = function(){
  const result = previousPreview.apply(this, arguments);
  updateVisitContext();
  return result;
 };

 if(db){
  updateVisitContext();
 }

})();
</script>

<script>
(function installProfileLayoutV2(){
 "use strict";

 const modal = $("modal");

 if(!modal ||
    document.documentElement.dataset.profileLayoutV2 === "1"){
  return;
 }

 document.documentElement.dataset.profileLayoutV2 = "1";

 /*
  彈窗切換至其他功能時，移除專用樣式。
  不影響診症紀錄、設定或其他彈窗標題。
 */
 const previousShowModal = showModal;

 showModal = function(title, html, mode = ""){
  const result = previousShowModal.apply(this, arguments);

  modal.classList.toggle(
   "cms-profile-layout-v2",
   mode === "masterHistory"
  );

  if(mode === "masterHistory"){
   $("modalTitle").textContent = "";
  }

  return result;
 };

 function ageYearsMonths(dob, referenceDate){
  if(!dateOK(dob) ||
     !dateOK(referenceDate) ||
     dob > referenceDate){
   return "";
  }

  let months =
   (+referenceDate.slice(0,4) - +dob.slice(0,4)) * 12 +
   +referenceDate.slice(5,7) - +dob.slice(5,7);

  if(+referenceDate.slice(8,10) < +dob.slice(8,10)){
   months--;
  }

  if(months < 0) return "";

  return Math.floor(months / 12) +
   "y" + (months % 12) + "m";
 }

 function timestampValue(value){
  const n = Date.parse(value || "");
  return Number.isFinite(n) ? n : 0;
 }

 /*
  優先顯示目前有效收據的總額。
  沒有有效收據時，顯示目前收費草稿並清楚標示。

  不以「有收據」推定已付款。
  不把已作廢或已取代的收據當成目前有效收費。
 */
 function feeHTML(encounter){
  const issued = effective(encounter, "receipt");
  const feeSource = issued ? issued.data : encounter;

  const rows = items(feeSource);

  if(!rows.length){
   return `
    <span>未記錄</span>
    <small class="cms-profile-visit-status">${
     issued ? "有效收據沒有收費項目" : "沒有有效收據或收費項目"
    }</small>`;
  }

  const valid = rows.every(row =>
   T(row.desc) && Number.isFinite(cents(row.amount))
  );

  const amount = total(feeSource);

  if(!valid || !Number.isSafeInteger(amount)){
   return `
    <span>金額未完整</span>
    <small class="cms-profile-visit-status">${
     issued ? "請核對有效收據" : "收費草稿未完整"
    }</small>`;
  }

  return `
   <strong>HKD ${E(cash(amount / 100))}</strong>
   <small class="cms-profile-visit-status">${
    issued ? "有效收據總額" : "收費草稿 · 未出具"
   }</small>`;
 }

 function visitsSection(patientId){
  /*
   同一 patientId 的所有診症。
   先按診症日期倒序；同日再按建立時間倒序。
   不按 updated 排序，避免修改舊病歷後跳到最上。
  */
  const encounters = db.encounters
   .filter(e => e.patientId === patientId)
   .slice()
   .sort((a,b) =>
    S(b.date).localeCompare(S(a.date)) ||
    timestampValue(b.created) - timestampValue(a.created)
   );

  const section = document.createElement("section");
  section.className = "profile-section cms-profile-visits";

  section.innerHTML = `
   <div class="profile-section-head">
    <h3>診症紀錄</h3>
    <span class="pill">${encounters.length} 次診症</span>
   </div>

   <div class="profile-section-body">
    <p class="cms-profile-visits-note">
     最新求診日期排最上；按日期可開啟該次診症。
     診金顯示收據總額，可能包含其他收費，並不代表已收款。
    </p>

    ${encounters.length ? `
     <div class="cms-profile-visits-scroll">
      <table class="cms-profile-visits-table">
       <thead>
        <tr>
         <th>求診日期</th>
         <th>診斷</th>
         <th>診金</th>
        </tr>
       </thead>

       <tbody>
        ${encounters.map(e => `
         <tr>
          <td class="cms-profile-visit-date">
           <button
            type="button"
            class="cms-profile-visit-open"
            data-act="open"
            data-id="${E(e.id)}"
           >${E(e.date || "未填日期")}</button>

           <small class="cms-profile-visit-status">
            ${e.status === "completed" ? "已完成" : "未完成"}
           </small>
          </td>

          <td class="cms-profile-visit-diagnosis">${
           E(T(e.diagnosis) || "未填寫")
          }</td>

          <td class="cms-profile-visit-fee">
           ${feeHTML(e)}
          </td>
         </tr>
        `).join("")}
       </tbody>
      </table>
     </div>
    ` : `
     <div class="cms-profile-visits-empty">
      暫時未有診症紀錄。
     </div>
    `}
   </div>
  `;

  return section;
 }

 const previousMasterHistory = masterHistory;

 masterHistory = function(id){
  const result = previousMasterHistory.apply(this, arguments);

  const body = $("modalBody");
  const profile = body.querySelector(".patient-profile");
  const patientMaster = db.patients.find(p => p.id === id);

  if(!profile || !patientMaster) return result;

  modal.classList.add("cms-profile-layout-v2");
  $("modalTitle").textContent = "";

  /*
   1. 找出原本放在姓名卡上面的操作 box。
   2. 刪去該 box 的「診症紀錄／年紀」摘要。
   3. 把同一個 box 搬到姓名卡下方。
  */
  const actionBox = [...body.children].find(node =>
   node.matches("section.item") &&
   node.querySelector('button[data-act="pfEdit"]')
  );

  if(actionBox){
   actionBox.querySelectorAll(".pf-meta").forEach(node => {
    node.remove();
   });

   actionBox.classList.add("cms-profile-actions");

   const hero = profile.querySelector(".profile-hero");

   if(hero){
    hero.after(actionBox);
   }else{
    profile.prepend(actionBox);
   }
  }

  /*
   只改「目前主檔」的出生日期欄，
   不改聯絡人、家人或對外文件日期格式。
   主檔年齡按今日計算。
  */
  const currentProfile = [...profile.children].find(node =>
   node.classList.contains("profile-section") &&
   T(node.querySelector(".profile-section-head h3")?.textContent)
    === "目前主檔"
  );

  if(currentProfile){
   const dobField = [...currentProfile.querySelectorAll(
    ".profile-field"
   )].find(node => {
    const label = T(node.querySelector(".profile-label")?.textContent);
    return label === "出生日期" || label === "出生日期／年齡";
   });

   if(dobField){
    const label = dobField.querySelector(".profile-label");
    const value = dobField.querySelector(".profile-value");
    const dob = patientMaster.data.dob;
    const ageText = ageYearsMonths(dob, today());

    if(label){
     label.textContent = "出生日期／年齡";
    }

    if(value){
     value.textContent = dateOK(dob)
      ? fmt(dob) + (ageText ? " ／ " + ageText : "")
      : "未填寫";

     value.classList.toggle("profile-empty", !dateOK(dob));
    }
   }
  }

  /*
   診症紀錄放在：
   已登記家人之下、主檔更正紀錄之上。
  */
  profile.querySelector(".cms-profile-visits")?.remove();

  const visits = visitsSection(id);
  const history = profile.querySelector(
   "details.cms-profile-history"
  );

  const family = profile.querySelector(
   ".cms-profile-family"
  );

  if(history){
   history.before(visits);
  }else if(family){
   family.after(visits);
  }else{
   profile.append(visits);
  }

  return result;
 };
})();
</script>

  border-top:1px solid var(--line);
 }

 #cmsReferenceTabs{
  position:relative;
  margin:0 -12px 12px;
  padding:11px 12px;
 }

 .cms-past-nav{
  grid-template-columns:1fr 1fr;
 }

 .cms-past-nav .field{
  grid-column:1 / -1;
  grid-row:1;
 }
}

@media print{
 #cmsVisitWorkbar,
 #cmsReferenceTabs,
 #cmsSplitHandle,
 #cmsPastPanel{
  display:none !important;
 }
}
</style>

<script>
(function installConsultationSplitView(){
 "use strict";

 const app = $("app");
 const layout = app?.querySelector(":scope > .layout");
 const editor = layout?.querySelector(":scope > .editor");
 const reference = layout?.querySelector(":scope > .preview");
 const toolbar = reference?.querySelector(":scope > .toolbar");
 const workflow = $("workflow");
 const paperViewport = $("paperViewport");

 if(
  !app || !layout || !editor || !reference ||
  !toolbar || !workflow || !paperViewport ||
  app.dataset.consultationSplit === "1"
 ){
  return;
 }

 app.dataset.consultationSplit = "1";
 layout.classList.add("cms-consultation-split");

 /*
  只新增獨立的參閱狀態。
  不使用 selected、tab、view 作為過往紀錄選擇器。
 */
 const state = {
  context:"",
  pane:"preview",
  pastId:"",
  list:[],
  scroll:{past:0,preview:0},
  renderedEncounter:null,
  renderedKey:"",
  ratio:0.5,
  drag:null
 };

 const WIDTH_KEY = "ray-cms-consultation-split-width-v1";

 try{
  const value = Number(localStorage.getItem(WIDTH_KEY));
  if(Number.isFinite(value) && value >= 0.25 && value <= 0.75){
   state.ratio = value;
  }
 }catch{}

 function make(tag, className = "", text = ""){
  const node = document.createElement(tag);
  if(className) node.className = className;
  if(text) node.textContent = text;
  return node;
 }

 /* 1. 共用工具列放在左右欄上方 */
 toolbar.id = "cmsVisitWorkbar";
 layout.before(toolbar);

 const target = make("p", "", "");
 target.id = "cmsOperationTarget";
 toolbar.append(target);

 /*
  避免用戶以為列印會輸出右邊正翻閱的舊紀錄。
  原 data-act 及事件處理保留。
 */
 const printButton = toolbar.querySelector(
  'button[data-act="print"]'
 );

 const batchButton = toolbar.querySelector(
  'button[data-act="batch"]'
 );

 if(printButton) printButton.textContent = "本次列印／PDF";
 if(batchButton) batchButton.textContent = "本次多份列印";

 /* 2. 中間可調闊度分隔線 */
 const handle = make("div");
 handle.id = "cmsSplitHandle";
 handle.tabIndex = 0;
 handle.setAttribute("role", "separator");
 handle.setAttribute("aria-orientation", "vertical");
 handle.setAttribute("aria-label", "調整診症編輯與參閱區闊度");
 handle.setAttribute("aria-controls", "editorFields cmsReferenceArea");
 handle.setAttribute("aria-valuemin", "25");
 handle.setAttribute("aria-valuemax", "75");
 handle.title = "拖拉調整闊度；方向鍵微調；雙擊還原";

 reference.id = "cmsReferenceArea";
 editor.after(handle);

 /* 3. 右側兩個分頁 */
 const tabs = make("div");
 tabs.id = "cmsReferenceTabs";
 tabs.setAttribute("role", "tablist");
 tabs.setAttribute("aria-label", "診症參閱資料");

 function paneButton(id, label, panelId){
  const button = make("button", "", label);
  button.id = id;
  button.type = "button";
  button.setAttribute("role", "tab");
  button.setAttribute("aria-controls", panelId);
  button.setAttribute("aria-selected", "false");
  return button;
 }

 const pastTab = paneButton(
  "cmsPastTab", "過往診症", "cmsPastPanel"
 );

 const previewTab = paneButton(
  "cmsCurrentPreviewTab",
  "本次文件預覽",
  "cmsCurrentPreviewPanel"
 );

 tabs.append(pastTab, previewTab);

 const pastPanel = make("section");
 pastPanel.id = "cmsPastPanel";
 pastPanel.setAttribute("role", "tabpanel");
 pastPanel.setAttribute("aria-labelledby", pastTab.id);

 const previewPanel = make("section");
 previewPanel.id = "cmsCurrentPreviewPanel";
 previewPanel.setAttribute("role", "tabpanel");
 previewPanel.setAttribute("aria-labelledby", previewTab.id);

 /*
  搬移同一個預覽容器，不另建 paper 或重複 id。
  列印仍由原有 printDocuments() 處理。
 */
 previewPanel.append(workflow, paperViewport);
 reference.prepend(tabs, pastPanel, previewPanel);

 /* 4. 過往診症的獨立日期選擇器 */
 const navigation = make("div", "cms-past-nav");

 const olderButton = make("button", "", "← 較舊");
 olderButton.type = "button";

 const newerButton = make("button", "", "較新 →");
 newerButton.type = "button";

 const pickerField = make("div", "field");
 const pickerLabel = make("label", "", "過往求診日期");
 pickerLabel.htmlFor = "cmsPastEncounterPicker";

 const picker = make("select");
 picker.id = "cmsPastEncounterPicker";

 pickerField.append(pickerLabel, picker);
 navigation.append(olderButton, pickerField, newerButton);

 const help = make(
  "p",
  "cms-past-help",
  "唯讀參閱：只顯示同一 patientId 的較早診症。" +
  "切換日期不會改變左邊診症，亦不會改變儲存、完成或列印目標。"
 );

 const pastContent = make("div");
 pastContent.id = "cmsPastContent";

 pastPanel.append(navigation, help, pastContent);

 function timeValue(value){
  const n = Date.parse(value || "");
  return Number.isFinite(n) ? n : 0;
 }

 /*
  日期由新至舊；同日按建立時間由新至舊。
  不按 updated 排序，避免修改舊病歷後改變求診順序。
 */
 function previousEncounters(){
  const active = current();
  if(!active || !dateOK(active.date)) return [];

  return db.encounters.filter(e => {
   if(
    e.id === active.id ||
    e.patientId !== active.patientId ||
    !dateOK(e.date)
   ){
    return false;
   }

   if(e.date < active.date) return true;
   if(e.date > active.date) return false;

   return timeValue(e.created) <= timeValue(active.created);
  }).slice().sort((a,b) =>
   b.date.localeCompare(a.date) ||
   timeValue(b.created) - timeValue(a.created) ||
   a.id.localeCompare(b.id)
  );
 }

 function block(label, value){
  return `
   <section class="cms-past-block">
    <h4>${E(label)}</h4>
    <div class="cms-past-text ${
     T(value) ? "" : "cms-past-muted"
    }">${E(T(value) ? value : "未填寫")}</div>
   </section>`;
 }

 /*
  有完成快照時，病歷優先顯示最後一次完成快照，
  不把重開後尚未完成的修改當作完成紀錄。
 */
 function historySource(e){
  const revision = e.revisions?.at(-1);

  return revision
   ? {
      data:revision.data,
      revision,
      label:"最後一次完成快照",
      at:revision.savedAt
     }
   : {
      data:e,
      revision:null,
      label:e.status === "completed"
       ? "現存已完成紀錄（沒有完成快照）"
       : "未完成診症草稿",
      at:e.updated
     };
 }

 /*
  完成快照的處方：
  依該快照 summary 記錄的版本 ID 取回，
  不用其後出具的新版本冒充當時處方。
 */
 function prescriptionSource(e, history){
  if(history.revision){
   const entry = history.revision.summary?.find(
    row => row.type === "rx"
   );

   if(entry?.issued){
    const version = e.versions.find(
     v => v.id === entry.issued.id && v.type === "rx"
    );

    if(version){
     return {
      data:version.data,
      label:"完成時記錄的處方版本",
      version
     };
    }

    return {
     data:null,
     label:"完成摘要所引用的處方版本不存在，請核對備份。"
    };
   }

   if(entry?.draft || drugs(history.data).length){
    return {
     data:history.data,
     label:"完成時保存的處方草稿 · 不代表已出具"
    };
   }

   return {
    data:null,
    label:"此完成快照未記錄已出具處方。"
   };
  }

  const issued = effective(e, "rx");

  if(issued){
   return {
    data:issued.data,
    label:"目前有效處方版本",
    version:issued
   };
  }

  if(drugs(e).length){
   return {
    data:e,
    label:"現存處方草稿 · 未出具"
   };
  }

  return {
   data:null,
   label:"未記錄處方。"
  };
 }

 function prescriptionHTML(e, history){
  const rx = prescriptionSource(e, history);
  const rows = rx.data ? drugs(rx.data) : [];

  let meta = rx.label;

  if(rx.version){
   meta += "\n版本時間：" + stamp(rx.version.savedAt);
   meta += "\n此版本目前狀態：" +
    (VSTATE[rx.version.state] || rx.version.state);

   if(rx.version.voidReason){
    meta += "\n作廢原因：" + rx.version.voidReason;
   }
  }

  return `
   <section class="cms-past-card">
    <h3>處方</h3>
    <p class="cms-past-meta" style="margin-bottom:12px">${
     E(meta)
    }</p>

    ${rows.length ? `
     <div class="cms-past-rx-scroll">
      <table class="cms-past-rx">
       <thead>
        <tr>
         <th>藥物／強度</th>
         <th>劑量</th>
         <th>頻次</th>
         <th>途徑</th>
         <th>療程／數量</th>
        </tr>
       </thead>
       <tbody>
        ${rows.map((i,n) => `
         <tr>
          <td>${E((n+1) + ". " + i.name)}</td>
          <td>${E(i.dose || "—")}</td>
          <td>${E(i.frequency || "—")}</td>
          <td>${E(i.route || "—")}</td>
          <td>${E(i.duration || "—")}</td>
         </tr>
        `).join("")}
       </tbody>
      </table>
     </div>
    ` : `
     <p class="cms-past-text cms-past-muted">
      沒有可顯示的藥物項目。
     </p>
    `}

    ${rx.data && T(rx.data.rx.remarks)
     ? `<div style="margin-top:14px">${
        block("注意事項／備註", rx.data.rx.remarks)
       }</div>`
     : ""
    }
   </section>`;
 }

 function investigationsHTML(data){
  return INVS.filter(t => data[t]?.items?.length)
   .map(t => `
    <section class="cms-past-card">
     <h3>${E(TYPES[t][0])}及跟進紀錄</h3>

     ${data[t].items.map(i => {
      const text = [
       T(i.details) ? "申請詳情：" + i.details : "",
       ISTATE[i.status]
        ? "檢查狀態：" + ISTATE[i.status]
        : "",
       i.performedDate
        ? "檢查日期：" + i.performedDate
        : "",
       i.resultDate
        ? "收報告日期：" + i.resultDate
        : "",
       T(i.result) ? "結果摘要：\n" + i.result : "",
       "報告覆核：" + (i.reviewed ? "已覆核" : "未覆核"),
       i.reviewedBy ? "覆核人：" + i.reviewedBy : "",
       i.due ? "跟進日期：" + i.due : "",
       i.owner ? "負責人：" + i.owner : "",
       T(i.next) ? "下一步安排：\n" + i.next : "",
       i.contacted
        ? "已記錄聯絡：" + stamp(i.contactAt)
        : "",
       T(i.contactNote)
        ? "聯絡摘要：\n" + i.contactNote
        : "",
       i.closed
        ? "結案：" + (i.closureReason || "已結案")
        : "未結案"
      ].filter(Boolean).join("\n");

      return block(i.name || "未填檢查名稱", text);
     }).join("")}
    </section>
   `).join("");
 }

 function renderPastRecord(){
  const e = state.list.find(item => item.id === state.pastId);

  if(!e){
   state.renderedEncounter = null;
   state.renderedKey = "";

   pastContent.innerHTML = `
    <div class="cms-past-empty">
     沒有較早的同一病人診症紀錄。<br>
     新病人或本次係最早一次診症時，預設顯示本次文件預覽。
    </div>`;

   return;
  }

  const history = historySource(e);

  const key = [
   e.id,
   e.updated,
   e.status,
   history.revision?.id || "",
   e.versions.map(v => v.id + ":" + v.state).join(",")
  ].join("|");

  if(
   state.renderedEncounter === e &&
   state.renderedKey === key
  ){
   return;
  }

  state.renderedEncounter = e;
  state.renderedKey = key;

  const data = history.data;
  const patientData = data.patient || {};
  const patientMaster = db.patients.find(
   p => p.id === e.patientId
  );

  const warning = history.revision && e.status === "draft"
   ? `
    <div class="notice" style="margin-bottom:13px">
     呢次舊診症目前已重開。以下顯示最後一次完成快照，
     不包含重開後尚未完成的修改。
    </div>`
   : !history.revision && e.status === "draft"
    ? `
     <div class="notice" style="margin-bottom:13px">
      以下係未完成草稿，不代表已完成病歷或已出具文件。
     </div>`
    : "";

  pastContent.innerHTML = `
   ${warning}

   <section class="cms-past-card">
    <h2 class="cms-past-heading">
     ${E(e.date)} · ${E(pname(patientData) || "未填姓名")}
    </h2>

    <p class="cms-past-meta">${E([
     patientMaster?.mrn || "",
     history.label,
     "保存時間：" + stamp(history.at),
     "舊診症目前狀態：" +
      (e.status === "completed" ? "已完成" : "未完成／已重開")
    ].filter(Boolean).join("\n"))}</p>

    <div class="cms-past-allergy ${
     patientData.allergyStatus === "known" ? "is-known" : ""
    }">${E(
     "當時藥物敏感：\n" +
     allergy(patientData) +
     "\n當次覆核：" +
     (data.allergyReviewed ? "已覆核" : "未記錄")
    )}</div>
   </section>

   <section class="cms-past-card">
    <h3>病歷</h3>
    ${block("Diagnosis 診斷", data.diagnosis)}
    ${block("S · 主訴及病史", data.soap?.s)}
    ${block("O · 檢查及結果", data.soap?.o)}
    ${block("A · 評估補充", data.soap?.a)}
    ${block("P · 治療計劃", data.soap?.p)}
   </section>

   ${prescriptionHTML(e, history)}
   ${investigationsHTML(data)}
  `;
 }

 function updateControls(){
  const index = state.list.findIndex(
   e => e.id === state.pastId
  );

  const blocked = !db || busy || printing;

  pastTab.disabled = blocked;
  previewTab.disabled = blocked;
  picker.disabled = blocked || !state.list.length;

  olderButton.disabled =
   blocked || index < 0 || index >= state.list.length - 1;

  newerButton.disabled = blocked || index <= 0;

  handle.setAttribute("aria-disabled", String(blocked));
 }

 function applyPane(){
  const isPast = state.pane === "past";

  pastPanel.hidden = !isPast;
  previewPanel.hidden = isPast;

  pastTab.setAttribute("aria-selected", String(isPast));
  previewTab.setAttribute("aria-selected", String(!isPast));

  pastTab.tabIndex = isPast ? 0 : -1;
  previewTab.tabIndex = isPast ? -1 : 0;
 }

 function switchPane(pane, focus = false){
  if(!db || busy || printing) return;

  if(pane !== state.pane){
   state.scroll[state.pane] = reference.scrollTop;
   state.pane = pane;
   applyPane();
   reference.scrollTop = state.scroll[pane] || 0;
  }

  if(focus){
   (pane === "past" ? pastTab : previewTab).focus();
  }

  if(pane === "preview"){
   requestAnimationFrame(scale);
  }
 }

 function choosePast(id){
  if(!db || busy || printing) return;
  if(!state.list.some(e => e.id === id)) return;

  state.pastId = id;
  picker.value = id;
  state.renderedEncounter = null;

  renderPastRecord();
  updateControls();

  reference.scrollTop = 0;
  state.scroll.past = 0;
 }

 function sync(){
  if(!db || !current()) return;

  /*
   正常開啟診症：預設最近一次過往診症。
   明確開啟歷史文件／完成版本：保留原本預覽用途，
   避免點「查看版本」卻先看到另一份病歷。
   */
  const context = [
   selected,
   view?.kind || "",
   view?.id || ""
  ].join("|");

  const changedContext = context !== state.context;
  const previousScroll = reference.scrollTop;

  state.list = previousEncounters();

  if(changedContext){
   state.context = context;
   state.pastId = state.list[0]?.id || "";
   state.pane = !view && state.list.length ? "past" : "preview";
   state.scroll = {past:0,preview:0};
   state.renderedEncounter = null;
  }else if(!state.list.some(e => e.id === state.pastId)){
   state.pastId = state.list[0]?.id || "";
   state.renderedEncounter = null;

   if(!state.list.length){
    state.pane = "preview";
   }
  }

  const optionsKey = state.list.map(e =>
   [e.id,e.date,e.created,e.status,e.diagnosis].join("|")
  ).join("\n");

  if(picker.dataset.optionsKey !== optionsKey){
   picker.replaceChildren();

   if(!state.list.length){
    const option = make("option", "", "沒有過往診症");
    option.value = "";
    picker.append(option);
   }else{
    for(const e of state.list){
     const option = make("option");

     option.value = e.id;
     option.textContent = [
      e.date,
      e.created ? stamp(e.created) : "",
      e.status === "completed" ? "已完成" : "未完成／已重開",
      T(e.diagnosis).replace(/\s+/g," ").slice(0,70)
     ].filter(Boolean).join(" · ");

     picker.append(option);
    }
   }

   picker.dataset.optionsKey = optionsKey;
  }

  picker.value = state.pastId;

  pastTab.textContent = "過往診症（" + state.list.length + "）";

  target.textContent = view
   ? "目前正開啟歷史快照／版本；上方操作沿用原有歷史查看模式。"
   : "操作目標：左邊本次診症 " +
      (current().date || "—") +
      "。右邊過往紀錄只供參閱。";

  applyPane();
  renderPastRecord();
  updateControls();

  reference.scrollTop = changedContext ? 0 : previousScroll;

  if(state.pane === "preview"){
   requestAnimationFrame(scale);
  }
 }

 pastTab.addEventListener("click", () => switchPane("past"));
 previewTab.addEventListener("click", () => switchPane("preview"));

 tabs.addEventListener("keydown", event => {
  if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)){
   return;
  }

  event.preventDefault();

  const pane = event.key === "Home" ? "past"
   : event.key === "End" ? "preview"
   : state.pane === "past" ? "preview" : "past";

  switchPane(pane, true);
 });

 picker.addEventListener("change", () => choosePast(picker.value));

 olderButton.addEventListener("click", () => {
  const index = state.list.findIndex(e => e.id === state.pastId);
  const next = state.list[index + 1];
  if(next) choosePast(next.id);
 });

 newerButton.addEventListener("click", () => {
  const index = state.list.findIndex(e => e.id === state.pastId);
  const next = state.list[index - 1];
  if(next) choosePast(next.id);
 });

 /* 5. 拖拉／鍵盤調整闊度，只保存比例，不保存病歷 */
 function applyWidth(){
  if(window.innerWidth <= 820) return;

  const usable = layout.clientWidth - 10;
  if(usable <= 0) return;

  const minimum = Math.min(320, usable * 0.4);
  const width = Math.max(
   minimum,
   Math.min(usable - minimum, usable * state.ratio)
  );

  layout.style.setProperty(
   "--cms-edit-width",
   Math.round(width) + "px"
  );

  handle.setAttribute(
   "aria-valuenow",
   String(Math.round(width / usable * 100))
  );

  requestAnimationFrame(scale);
 }

 function saveWidth(){
  try{
   localStorage.setItem(WIDTH_KEY, String(state.ratio));
  }catch{}
 }

 handle.addEventListener("pointerdown", event => {
  if(
   !db || busy || printing ||
   event.button !== 0 ||
   window.innerWidth <= 820
  ){
   return;
  }

  event.preventDefault();

  state.drag = event.pointerId;
  handle.setPointerCapture(event.pointerId);
  document.body.classList.add("cms-split-dragging");
 });

 handle.addEventListener("pointermove", event => {
  if(state.drag !== event.pointerId) return;

  const rect = layout.getBoundingClientRect();
  const usable = rect.width - 10;
  if(usable <= 0) return;

  state.ratio = Math.max(
   0.25,
   Math.min(0.75, (event.clientX - rect.left) / usable)
  );

  applyWidth();
 });

 function endDrag(event){
  if(state.drag === null) return;
  if(event && event.pointerId !== state.drag) return;

  state.drag = null;
  document.body.classList.remove("cms-split-dragging");
  saveWidth();
 }

 handle.addEventListener("pointerup", endDrag);
 handle.addEventListener("pointercancel", endDrag);
 handle.addEventListener("lostpointercapture", endDrag);

 handle.addEventListener("keydown", event => {
  if(!db || busy || printing) return;

  if(!["ArrowLeft","ArrowRight","Home"].includes(event.key)){
   return;
  }

  event.preventDefault();

  state.ratio = event.key === "Home" ? 0.5 : Math.max(
   0.25,
   Math.min(
    0.75,
    state.ratio + (event.key === "ArrowLeft" ? -0.025 : 0.025)
   )
  );

  applyWidth();
  saveWidth();
 });

 handle.addEventListener("dblclick", () => {
  if(!db || busy || printing) return;
  state.ratio = 0.5;
  applyWidth();
  saveWidth();
 });

 window.addEventListener("resize", applyWidth);

 /* 6. 接在所有既有畫面補丁之後 */
 const previousPreview = preview;

 preview = function(){
  const result = previousPreview.apply(this, arguments);
  sync();
  return result;
 };

 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);
  sync();
  applyWidth();
  return result;
 };

 const previousUpdateButtons = updateButtons;

 updateButtons = function(){
  const result = previousUpdateButtons.apply(this, arguments);
  updateControls();
  return result;
 };

 /*
  成功登出後清除新增的歷史明文畫面。
  登出失敗而 db 仍保留時，不清走待儲存內容。
 */
 const previousLock = lockWorkspace;

 lockWorkspace = async function(){
  const result = await previousLock.apply(this, arguments);

  if(!db){
   pastContent.replaceChildren();
   picker.replaceChildren();
   target.textContent = "";

   state.list = [];
   state.context = "";
   state.pastId = "";
   state.renderedEncounter = null;
   state.renderedKey = "";

   document.body.classList.remove("cms-split-dragging");
  }

  return result;
 };

 applyPane();
 applyWidth();

 if(db){
  sync();
 }
})();

<script>
(function installTopTabsAndImmediateIssue(){
 "use strict";

 const app = $("app");
 const workbar = $("cmsVisitWorkbar");
 const actionBar = workbar?.querySelector(".cms-workbar-actions");
 const heading = workbar?.querySelector(".cms-workbar-heading");
 const tabs = $("tabs");
 const patientActions = $("cmsPatientHeaderActions");
 const allergyPanel = $("cmsAllergyPanel");

 if(
  !app || !workbar || !actionBar || !heading ||
  !tabs || !patientActions
 ){
  console.warn("請先保留雙欄及病人摘要位置補丁。");
  return;
 }

 if(app.dataset.topTabsImmediateIssue === "1") return;
 app.dataset.topTabsImmediateIssue = "1";

 /*
  1. 搬移同一個 tabs。
  原 renderTabs()、data-act 及目前分頁狀態不變。
 */
 const tabGroup = document.createElement("div");
 tabGroup.className = "cms-action-group cms-document-tab-group";

 const tabLabel = document.createElement("div");
 tabLabel.className = "cms-action-label";
 tabLabel.textContent = "診症／文件";

 tabGroup.append(tabLabel, tabs);
 actionBar.prepend(tabGroup);

 /*
  2. 搬移同一組主檔／敏感按鈕。
  不複製按鈕，不重建事件。
 */
 heading.append(patientActions);

 /*
  敏感編輯區跟隨按鈕搬到頂部，
  保留原有事件、欄位引用及唯讀控制。
 */
 if(allergyPanel){
  heading.after(allergyPanel);
 }

 const saveButton = workbar.querySelector(
  'button[data-act="save"]'
 );

 if(saveButton){
  saveButton.title =
   "儲存本次診症，並出具本次已選用或已修改、且通過檢查的對外文件。" +
   "SOAP 完成快照仍須按「完成診症」。";
 }

 /*
  3. 只攔截手動「立即儲存」。
  不改 save()，避免自動儲存時出具文件。
 */
 const previousAction = action;

 /*
  本次需要出具的文件：
  - 已選用，但沒有有效版本；
  - 已有有效版本，但目前內容有修改。

  沒有使用的空白表格不會被出具。
  已作廢且沒有重新選用的文件不會自動恢復。
 */
 function pendingDocumentTypes(e, settings){
  return DOCS.filter(t => {
   const version = effective(e, t);

   if(version){
    return different(e, t, settings);
   }

   return e.used[t] === true;
  });
 }

 function errorsForDocuments(e, types, settings){
  return types.flatMap(t =>
   warnings(e, t, settings).map(
    text => TYPES[t][0] + "：" + text
   )
  );
 }

 async function saveAndIssueCurrent(){
  assert(db && cloud.session, "請先登入");
  assert(!conflict, "目前有版本衝突，請先建立本頁加密備份");
  assert(!view, "目前正在查看歷史快照／版本，請先返回本次診症");

  const original = current();
  assert(original, "找不到本次診症");

  /*
   已完成診症不在此處偷偷重開或建立新版。
   要修改文件，先使用「重新開啟診症」。
 */
  if(original.status !== "draft"){
   await run(() => save());

   message(
    "本次診症已完成，沒有出具新版本。" +
    "如需修改文件，請先按「重新開啟診症」。"
   );
   return;
  }

  const encounterId = original.id;
  const types = pendingDocumentTypes(original, db.settings);

  if(!types.length){
   await run(() => save());

   status("已儲存至 Supabase · 沒有待出具的文件修改");
   message(
    "本次診症已儲存，沒有待出具的對外文件修改。" +
    "SOAP 完成快照仍須按「完成診症」。"
   );
   return;
  }

  /*
   一次檢查全部待出具文件。
   任何一份有問題，整批不出具。
   正常自動儲存仍可保存其草稿。
 */
  const errors = errorsForDocuments(
   original, types, db.settings
  );

  if(showErrors(errors)){
   message(
    "尚未出具任何新版本：請先處理列出的文件問題，" +
    "再按「立即儲存」。草稿仍沿用原有自動儲存。",
    true
   );
   return;
  }

  const revised = types.filter(t => effective(original, t));
  let reason = "使用立即儲存出具文件";

  if(revised.length){
   const entered = prompt(
    "以下有效文件將保存修訂版本：\n" +
    revised.map(t => "• " + TYPES[t][0]).join("\n") +
    "\n\n請填寫修訂原因（必填）："
   );

   if(!T(entered)){
    message(
     "已取消出具修訂版本；現有有效版本不變。" +
     "草稿仍沿用原有自動儲存。"
    );
    return;
   }

   reason = T(entered);
  }

  /*
   沿用原版處方的未確認敏感狀態提示。
   不把儲存文件視為已完成臨床核實。
 */
  if(
   types.includes("rx") &&
   (
    !original.patient.allergyStatus ||
    original.patient.allergyStatus === "unknown"
   )
  ){
   if(!confirm(
    "處方的藥物敏感狀態尚未確認。\n" +
    "請先作臨床核實；仍要保存為有效處方版本？"
   )){
    return;
   }
  }

  /*
   清楚確認：這次操作會出具版本，但不代表列印或交付。
 */
  if(!confirm(
   "立即儲存會將以下文件保存為有效版本：\n" +
   types.map(t => "• " + TYPES[t][0]).join("\n") +
   "\n\n舊版本保留；不會自動列印或記錄交付。" +
   "\nSOAP 不會自動標記完成。\n\n確認繼續？"
  )){
   return;
  }

  /*
   沿用現有敏感操作檢查。
   單次登入版本的 reauth() 只驗證 session，
   不會額外要求工作區密碼。
 */
  if(original.signature === "image"){
   if(!await reauth()) return;
  }

  await run(async () => {
   await commit(d => {
    assert(
     selected === encounterId,
     "目前診症已切換，已停止出具"
    );

    const e = d.encounters.find(
     item => item.id === encounterId
    );

    assert(e && e.status === "draft", "診症狀態已改變");

    /*
     真正寫入前再核對一次：
     候選資料整批建立版本，再由 commit() 一次寫入。
    */
    const actualTypes = pendingDocumentTypes(e, d.settings);

    assert(
     equal(actualTypes, types),
     "待出具文件已改變，請重新按「立即儲存」核對"
    );

    const finalErrors = errorsForDocuments(
     e, actualTypes, d.settings
    );

    assert(!finalErrors.length, finalErrors.join("\n"));

    e.updated = now();

    for(const t of actualTypes){
     issuedVersion(e, t, d.settings, reason);
    }

    audit(
     e,
     "立即儲存並出具文件",
     actualTypes.map(t => TYPES[t][0]).join("、") +
     "；不代表成功列印或交付"
    );
   });
  });

  showErrors([]);

  status(
   "已儲存至 Supabase · " +
   types.length + " 份文件已成為有效版本"
  );

  message(
   "本次已保存有效版本：" +
   types.map(t => TYPES[t][0]).join("、") +
   "。舊版本保留；尚未自動列印或確認交付。" +
   "SOAP 完成快照仍須按「完成診症」。"
  );
 }

 action = async function(button){
  if(button.dataset.act !== "save"){
   return previousAction.apply(this, arguments);
  }

  if(busy || printing) return;

  return saveAndIssueCurrent();
 };

 /*
  只重新計算版面，不儲存或出具任何文件。
 */
 requestAnimationFrame(() => {
  window.dispatchEvent(new Event("resize"));
 });
})();
</script>

<script>
(function installCurrentPatientMasterSync(){
 "use strict";

 const app = $("app");
 const workbar = $("cmsVisitWorkbar");

 if(
  !app ||
  !workbar ||
  app.dataset.currentPatientMasterSync === "1"
 ){
  return;
 }

 app.dataset.currentPatientMasterSync = "1";

 /*
  只同步人口身份及聯絡資料。
  不同步藥物敏感，避免覆蓋本次臨床覆核。
 */
 const keys = [...IDFIELDS, ...CONTACTS];

 const labels = {
  surname:"英文姓氏",
  given:"英文名字",
  cn:"中文姓名",
  hkid:"HKID／證件",
  dob:"出生日期",
  sex:"性別",
  phone:"電話",
  email:"電郵",
  address:"地址",
  contact1Name:"聯絡人 1 姓名",
  contact1Phone:"聯絡人 1 電話",
  contact2Name:"聯絡人 2 姓名",
  contact2Phone:"聯絡人 2 電話"
 };

 function values(data, fields = keys){
  return Object.fromEntries(
   fields.map(key => [key, S(data?.[key])])
  );
 }

 function changedKeys(e, p){
  return keys.filter(
   key => S(e.patient[key]) !== S(p.data[key])
  );
 }

 /* 已有問題的診症可用此按鈕修復 */
 const button = document.createElement("button");
 button.type = "button";
 button.dataset.act = "cmsSyncPatientMaster";
 button.textContent = "同步主檔至本次診症";
 button.title =
  "確認後，將目前主檔的身份及聯絡資料同步至本次未完成診症。" +
  "不改寫歷史快照、文件或藥物敏感。";

 button.style.cssText =
  "margin-top:8px;font-size:12px;color:var(--accent)";

 const target = $("cmsOperationTarget");

 if(target){
  target.before(button);
 }else{
  workbar.append(button);
 }

 function updateSyncButton(){
  const e = db && current();
  const p = e && master(e);
  const differs = !!(e && p && changedKeys(e, p).length);

  button.hidden = !differs;

  button.disabled =
   !differs ||
   !editable();

  if(differs && (view || e.status !== "draft")){
   button.title =
    "歷史快照及已完成診症不可直接同步。" +
    "請先返回本次診症；如已完成，先重新開啟診症。";
  }else{
   button.title =
    "同步身份及聯絡資料至本次未完成診症；" +
    "不更改藥物敏感、舊文件或完成快照。";
  }
 }

 async function syncCurrentPatientMaster(){
  assert(
   editable(),
   "請先返回本次診症；如診症已完成，先按「重新開啟診症」"
  );

  const e = current();
  const p = master(e);

  assert(p, "找不到本次診症所連結的病人主檔");
  assert(pname(p.data), "病人主檔仍未填寫姓名");

  const changes = changedKeys(e, p);

  if(!changes.length){
   message("病人主檔與本次診症的身份及聯絡資料已一致。");
   return;
  }

  if(p.data.dob){
   assert(
    dateOK(p.data.dob) &&
    dateOK(e.date) &&
    p.data.dob <= e.date,
    "主檔出生日期無效，或遲於本次診症日期，請先核對"
   );
  }

  const encounterId = e.id;
  const patientId = e.patientId;
  const before = values(e.patient);
  const after = values(p.data);

  const display = value =>
   T(value) ? S(value) : "（空白）";

  const detail = changes.map(key =>
   labels[key] + "：\n" +
   display(before[key]) + "\n→ " +
   display(after[key])
  ).join("\n\n");

  if(!confirm(
   "請核實以下主檔確實屬於本次診症病人：\n" +
   p.mrn + " · " + pname(p.data) +
   "\n\n將同步以下資料：\n\n" +
   detail +
   "\n\n注意：主檔中的空白值亦會同步。" +
   "\n只更新本次未完成診症；" +
   "不改寫已出具文件、完成快照或藥物敏感。" +
   "\n\n確認同步？"
  )){
   return;
  }

  const reason = "經使用者確認，同步病人主檔至本次診症";

  await run(() => commit(d => {
   assert(
    selected === encounterId && !view,
    "目前診症已切換，已停止同步"
   );

   const encounter = d.encounters.find(
    item => item.id === encounterId
   );

   const patientMaster = d.patients.find(
    item => item.id === patientId
   );

   assert(
    encounter &&
    encounter.patientId === patientId &&
    encounter.status === "draft",
    "診症狀態或病人連結已改變，已停止同步"
   );

   assert(
    patientMaster &&
    equal(values(patientMaster.data), after),
    "病人主檔已改變，請重新核對後同步"
   );

   assert(
    equal(values(encounter.patient), before),
    "本次病人資料已改變，請重新核對後同步"
   );

   const identityBefore = values(
    encounter.patient, IDFIELDS
   );

   for(const key of keys){
    encounter.patient[key] = after[key];
   }

   const identityAfter = values(
    encounter.patient, IDFIELDS
   );

   if(!equal(identityBefore, identityAfter)){
    encounter.identityChanges.push({
     at:now(),
     actor,
     sessionId,
     reason,
     before:identityBefore,
     after:identityAfter
    });
   }

   encounter.updated = now();

   audit(
    encounter,
    "同步主檔至本次診症",
    reason + "；欄位：" +
    changes.map(key => labels[key]).join("、") +
    "；已出具文件及完成快照未改寫"
   );
  }));

  showErrors([]);

  message(
   "已將主檔身份及聯絡資料同步至本次診症，並儲存。" +
   "藥物敏感、舊文件及完成快照維持原狀。" +
   "如需更新已出具文件，請另外保存修訂版本。"
  );
 }

 /* 畫面重繪後更新按鈕 */
 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);
  updateSyncButton();
  return result;
 };

 const previousUpdateButtons = updateButtons;

 updateButtons = function(){
  const result = previousUpdateButtons.apply(this, arguments);
  updateSyncButton();
  return result;
 };

 /*
  沿用現有主檔保存流程。
  主檔確實保存並改變後，才提示同步目前未完成診症。
  不攔截或重寫原本 savePatient() 的內部實作。
 */
 const previousAction = action;

 action = async function(node){
  const act = node.dataset.act;

  if(act === "cmsSyncPatientMaster"){
   if(busy || printing) return;
   return syncCurrentPatientMaster();
  }

  const patientId = node.dataset.patient || "";

  const watchMasterSave =
   act === "pfSave" &&
   !!patientId &&
   !!db;

  const oldMaster = watchMasterSave
   ? db.patients.find(item => item.id === patientId)
   : null;

  const oldValues = oldMaster
   ? values(oldMaster.data)
   : null;

  const encounterId = db && current()?.id;

  const result = await previousAction.apply(this, arguments);

  if(
   watchMasterSave &&
   oldValues &&
   db &&
   !busy &&
   !printing &&
   !conflict &&
   !view &&
   current()?.id === encounterId &&
   current()?.patientId === patientId &&
   current()?.status === "draft"
  ){
   const updatedMaster = db.patients.find(
    item => item.id === patientId
   );

   if(
    updatedMaster &&
    !equal(oldValues, values(updatedMaster.data)) &&
    changedKeys(current(), updatedMaster).length
   ){
    await syncCurrentPatientMaster();
   }
  }

  updateSyncButton();

  return result;
 };

 updateSyncButton();
})();
</script>
