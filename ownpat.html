<script>
(function installStage1Workflow(){
 "use strict";

 const app = $("app");

 if(
  !app ||
  app.dataset.stage1Workflow === "1"
 ){
  return;
 }

 const workbar = $("cmsVisitWorkbar");

 const saveButton = workbar?.querySelector(
  'button[data-act="save"]'
 );

 const printButton = workbar?.querySelector(
  'button[data-act="print"]'
 );

 const batchButton = workbar?.querySelector(
  'button[data-act="batch"]'
 );

 if(!workbar || !saveButton || !printButton){
  console.warn(
   "第 1 階段未安裝：找不到現有診症操作列。"
  );
  return;
 }

 app.dataset.stage1Workflow = "1";

 const ACTION_OPEN = "cmsS1OpenIssue";
 const ACTION_CONFIRM = "cmsS1ConfirmIssue";
 const ACTION_CANCEL = "cmsS1CancelIssue";

 let issueContext = null;

 /*
  只新增出具入口。

  原本的儲存按鈕由 action() 攔截，
  唔再進入上一版「立即儲存並出具」流程。
 */
 const issueButton = document.createElement("button");

 issueButton.id = "cmsStage1IssueButton";
 issueButton.type = "button";
 issueButton.dataset.act = ACTION_OPEN;
 issueButton.textContent = "出具文件";

 saveButton.after(issueButton);

 function pendingTypes(e, settings = db.settings){
  return DOCS.filter(type => {
   const version = effective(e, type);

   if(version){
    return different(e, type, settings);
   }

   return e.used[type] === true;
  });
 }

 function validCurrent(){
  return !!(
   db &&
   current()
  );
 }

 function canIssue(){
  return !!(
   validCurrent() &&
   !busy &&
   !printing &&
   !conflict &&
   !view &&
   current().status === "draft"
  );
 }

 function selectedIssueTypes(){
  return [
   ...$("modalBody").querySelectorAll(
    '[data-cms-s1-document]:checked'
   )
  ].map(input => input.dataset.cmsS1Document);
 }

 function setIssueErrors(errors){
  const node = $("cmsStage1IssueErrors");

  if(!node) return;

  node.hidden = errors.length === 0;

  node.textContent = errors.length
   ? "未有出具任何文件，請先處理：\n• " +
     errors.join("\n• ")
   : "";

  if(errors.length){
   node.scrollIntoView({
    block:"nearest"
   });
  }
 }

 /*
  同步現有工具列文字及狀態。
  唔改動資料，亦唔建立文件版本。
 */
 function syncControls(){
  if(!validCurrent()){
   issueButton.disabled = true;
   return;
  }

  const e = current();
  const types = pendingTypes(e);

  const blocked = !!(
   busy ||
   printing ||
   conflict
  );

  saveButton.textContent = "儲存草稿";

  saveButton.title =
   "只保存目前工作區資料；" +
   "不出具文件、不建立完成快照，也不列印。";

  saveButton.disabled =
   blocked ||
   !!view ||
   e.status !== "draft";

  issueButton.textContent =
   "出具文件" +
   (types.length ? "（" + types.length + "）" : "");

  issueButton.disabled =
   !canIssue() ||
   types.length === 0;

  issueButton.title = types.length
   ? "核對並選擇要出具的文件。" +
     "未選文件保持草稿；不會自動列印或記錄交付。"
   : "目前沒有待出具或待修訂的文件。";

  if(view?.kind === "document"){
   printButton.textContent = "重印歷史版本／PDF";

   printButton.title =
    "列印目前正在查看的文件版本。" +
    "歷史版本會保留原有狀態標示。";

  }else if(view?.kind === "revision"){
   printButton.textContent = "列印完成快照／PDF";

   printButton.title =
    "列印目前正在查看的診症完成快照。";

  }else if(tab === "note"){
   printButton.textContent =
    e.status === "completed"
     ? "列印診症紀錄／PDF"
     : "列印草稿／PDF";

   printButton.title =
    e.status === "completed"
     ? "列印診症紀錄；有完成快照時使用完成快照。"
     : "列印未完成診症草稿，不會將診症標記完成。";

  }else if(e.status === "draft"){
   const version = effective(e, tab);

   const requiresIssue =
    !version ||
    different(e, tab);

   printButton.textContent = requiresIssue
    ? "出具並列印／PDF"
    : "列印／PDF";

   printButton.title = requiresIssue
    ? "原有列印流程會先驗證並確認出具目前文件，" +
      "然後開啟列印。取消列印不會撤銷已出具版本。"
    : "重用目前有效版本列印，不建立相同的新版本。";

  }else{
   printButton.textContent = "列印／PDF";

   printButton.title =
    "使用目前有效文件版本列印。" +
    "如未有有效版本，須先重開診症製作。";
  }

  if(batchButton){
   batchButton.textContent = "選擇多份列印";

   batchButton.title =
    "選擇多份文件；如包含未出具或有修改的文件，" +
    "會先確認出具，再開啟列印。";
  }

  /*
   單次登入版本不再要求工作區密碼。
   避免輸出選項仍顯示過時承諾。
  */
  document.querySelectorAll(
   '[data-path="signature"] option[value="image"]'
  ).forEach(option => {
   option.textContent =
    "圖片簽名（使用目前登入狀態）";
  });
 }

 /*
  單純保存草稿。

  直接呼叫目前的 save()，
  唔呼叫上一版 saveAndIssueCurrent()。
 */
 async function saveDraftOnly(){
  assert(db, "請先登入");

  assert(
   !conflict,
   "目前有版本衝突，請先建立本頁加密備份"
  );

  assert(
   !view,
   "目前正在查看歷史版本，請先返回本次診症"
  );

  assert(
   current()?.status === "draft",
   "診症已完成；如要修改，請先重新開啟診症"
  );

  await run(async () => {
   await save();
  });

  status(
   "草稿已儲存至 Supabase · " +
   new Date().toLocaleTimeString()
  );

  message(
   "草稿已儲存；沒有出具文件、" +
   "沒有建立完成快照，也沒有列印。"
  );
 }

 function issueRow(e, type){
  const version = effective(e, type);

  const errors = warnings(
   e,
   type,
   db.settings
  );

  const stateText = version
   ? "有修改：確認後建立修訂版本，原版本保留"
   : "未出具：確認後建立首個有效版本";

  const summaryText = shortSummary(e, type);

  return `
   <section class="cms-s1-document">
    <label class="cms-s1-document-label">
     <input
      type="checkbox"
      data-cms-s1-document="${E(type)}"
      checked
     >

     <span>
      <span class="cms-s1-document-title">
       ${E(TYPES[type][0])}
      </span>

      <span class="cms-s1-document-state">
       ${E(stateText)}
      </span>
     </span>
    </label>

    ${errors.length ? `
     <div class="cms-s1-document-errors">
      ${errors.map(error =>
       "• " + E(error)
      ).join("<br>")}
     </div>
    ` : ""}

    <details class="cms-s1-document-details">
     <summary>查看內容摘要</summary>
     <pre>${E(
      T(summaryText) || "尚未有內容摘要"
     )}</pre>
    </details>
   </section>
  `;
 }

 function refreshIssueSelection(){
  if(
   !issueContext ||
   modalMode !== "cmsStage1Issue" ||
   !validCurrent()
  ){
   return;
  }

  const e = current();
  const types = selectedIssueTypes();

  const revised = types.filter(
   type => !!effective(e, type)
  );

  const reasonLabel = $("cmsStage1ReasonLabel");
  const reason = $("cmsStage1IssueReason");

  if(reasonLabel){
   reasonLabel.textContent = revised.length
    ? "修訂原因（已選文件包含修訂版本，必填）"
    : "出具備註（選填）";
  }

  if(reason){
   reason.required = revised.length > 0;
  }

  const allergyBox = $("cmsStage1AllergyBox");

  const unknownAllergy = !!(
   types.includes("rx") &&
   (
    !e.patient.allergyStatus ||
    e.patient.allergyStatus === "unknown"
   )
  );

  if(allergyBox){
   allergyBox.hidden = !unknownAllergy;
  }

  const confirmButton = $("cmsStage1ConfirmIssue");

  if(confirmButton){
   confirmButton.textContent =
    "確認出具" +
    (types.length ? " " + types.length + " 份文件" : "");

   confirmButton.disabled =
    !types.length ||
    busy ||
    printing ||
    conflict;
  }
 }

 function openIssueDialog(){
  assert(
   canIssue(),
   "請先返回未完成的本次診症，並確認沒有儲存衝突"
  );

  const e = current();
  const types = pendingTypes(e);

  if(!types.length){
   message("目前沒有待出具或待修訂的文件。");
   return;
  }

  /*
   記住核對時各文件的完整比較內容，
   寫入前再驗證，避免核對後內容已改變。
  */
  issueContext = {
   encounterId:e.id,
   patientId:e.patientId,
   types:C(types),

   fingerprints:Object.fromEntries(
    types.map(type => [
     type,
     C(fingerprint(e, type, db.settings))
    ])
   )
  };

  const p = master(e);

  showModal(
   "核對並出具文件",
   `
    <div class="cms-s1-summary">
     <strong>${E(pname(e.patient) || "未填姓名")}</strong>
     ${E(p?.mrn || "")}
     · 診症日期：${E(e.date)}

     <div class="small">
      只出具以下有勾選的文件。
      未選文件維持草稿或保留原有效版本。
     </div>
    </div>

    ${types.map(type =>
     issueRow(e, type)
    ).join("")}

    <div class="cms-s1-reason">
     <label
      id="cmsStage1ReasonLabel"
      for="cmsStage1IssueReason"
     >出具備註</label>

     <textarea
      id="cmsStage1IssueReason"
      placeholder="如修訂既有文件，請說明修訂原因。"
     ></textarea>
    </div>

    <div
     id="cmsStage1AllergyBox"
     class="cms-s1-allergy"
     hidden
    >
     <strong>處方的藥物敏感狀態尚未確認</strong>

     <p class="small" style="margin:6px 0">
      建議先返回本次診症核對及記錄。
      如仍要繼續，須明確確認以下選項。
     </p>

     <label class="check">
      <input
       id="cmsStage1UnknownAllergyAcknowledged"
       type="checkbox"
      >
      <span>
       我知悉敏感狀態仍未確認，仍決定出具此處方。
       此確認不會將敏感狀態改成「無敏感」，
       亦不代表已完成敏感覆核。
      </span>
     </label>
    </div>

    <div
     id="cmsStage1IssueErrors"
     class="notice error"
     role="alert"
     hidden
    ></div>

    <p class="cms-s1-footnote">
     出具會保存有效文件版本；舊版本保留。
     此操作不會自動完成診症、列印、記錄交付或標記收款。
     內容摘要不代替完整文件預覽。
    </p>

    <div class="cms-s1-footer">
     <button
      type="button"
      data-act="${ACTION_CANCEL}"
     >取消出具</button>

     <button
      id="cmsStage1ConfirmIssue"
      type="button"
      class="primary"
      data-act="${ACTION_CONFIRM}"
     >確認出具</button>
    </div>
   `,
   "cmsStage1Issue"
  );

  refreshIssueSelection();
 }

 async function confirmIssue(){
  assert(
   issueContext &&
   modalMode === "cmsStage1Issue",
   "沒有等待確認的文件"
  );

  assert(
   canIssue(),
   "目前不能出具文件；請確認診症及儲存狀態"
  );

  const context = issueContext;
  const e = current();

  assert(
   e.id === context.encounterId &&
   e.patientId === context.patientId,
   "目前診症已切換，請重新核對"
  );

  const types = selectedIssueTypes();

  const reasonText = T(
   $("cmsStage1IssueReason")?.value
  );

  const acknowledged = !!$(
   "cmsStage1UnknownAllergyAcknowledged"
  )?.checked;

  const errors = [];

  if(!types.length){
   errors.push("請至少選擇一份文件");
  }

  for(const type of types){
   assert(
    context.types.includes(type),
    "文件選擇無效"
   );

   errors.push(
    ...warnings(e, type, db.settings).map(
     error => TYPES[type][0] + "：" + error
    )
   );
  }

  const revised = types.filter(
   type => !!effective(e, type)
  );

  if(revised.length && !reasonText){
   errors.push("請填寫修訂原因");
  }

  const unknownAllergy = !!(
   types.includes("rx") &&
   (
    !e.patient.allergyStatus ||
    e.patient.allergyStatus === "unknown"
   )
  );

  if(unknownAllergy && !acknowledged){
   errors.push(
    "請先記錄藥物敏感狀態，" +
    "或明確確認仍要在未確認狀態下出具處方"
   );
  }

  if(errors.length){
   setIssueErrors(errors);
   return;
  }

  setIssueErrors([]);

  const reason = reasonText ||
   "使用獨立出具功能首次出具文件";

  /*
   沿用目前系統的登入檢查。
   此版本 reauth() 並不是第二次身份驗證。
  */
  if(e.signature === "image"){
   if(!await reauth()) return;
  }

  await run(async () => {
   await commit(candidate => {
    assert(
     selected === context.encounterId &&
     !view,
     "目前診症已切換，已停止出具"
    );

    const target = candidate.encounters.find(
     item => item.id === context.encounterId
    );

    assert(
     target &&
     target.patientId === context.patientId &&
     target.status === "draft",
     "診症狀態或病人連結已改變，已停止出具"
    );

    const stillPending = pendingTypes(
     target,
     candidate.settings
    );

    for(const type of types){
     assert(
      stillPending.includes(type),
      TYPES[type][0] +
      "的版本狀態已改變，請重新核對"
     );

     assert(
      equal(
       fingerprint(
        target,
        type,
        candidate.settings
       ),
       context.fingerprints[type]
      ),
      TYPES[type][0] +
      "的內容或設定已改變，請重新核對"
     );

     const finalErrors = warnings(
      target,
      type,
      candidate.settings
     );

     assert(
      !finalErrors.length,
      TYPES[type][0] + "：" +
      finalErrors.join("；")
     );
    }

    target.updated = now();

    for(const type of types){
     issuedVersion(
      target,
      type,
      candidate.settings,
      reason
     );
    }

    audit(
     target,
     "核對後出具文件",
     types.map(type =>
      TYPES[type][0]
     ).join("、") +
     "；未自動列印、交付、完成診症或標記收款"
    );

    if(unknownAllergy){
     audit(
      target,
      "確認在敏感狀態未確認下出具處方",
      "使用者明確確認；" +
      "敏感狀態及本次覆核狀態未因此更改"
     );
    }
   });

   issueContext = null;

   $("modal").close();
  });

  showErrors([]);

  status(
   "已儲存至 Supabase · 已出具 " +
   types.length + " 份文件"
  );

  message(
   "已出具：" +
   types.map(type =>
    TYPES[type][0]
   ).join("、") +
   "。未選文件維持原狀；" +
   "尚未自動列印、記錄交付、完成診症或標記收款。"
  );
 }

 /*
  修正預覽說明。

  不改寫任何舊文件資料；
  只修正頁面產生時的草稿說明文字。
 */
 const previousPage = page;

 page = function(type, displayed){
  let html = previousPage.apply(this, arguments);

  if(
   type === "note" &&
   displayed.kind === "live" &&
   displayed.data.status === "draft"
  ){
   html = html.replace(
    "草稿預覽 · 正式輸出請使用系統「立即儲存」按鈕",
    "未完成診症草稿 · 儲存草稿不代表完成診症"
   );
  }

  if(
   type !== "note" &&
   displayed.kind !== "document"
  ){
   html = html.replace(
    "草稿預覽 · 正式輸出請使用系統「列印」按鈕",
    "編輯草稿預覽 · " +
    "請使用「出具文件」或「出具並列印／PDF」確認版本"
   );
  }

  return html;
 };

 function syncWorkflowText(){
  if(!validCurrent()) return;

  const e = current();

  if(conflict){
   $("workflow").textContent =
    "版本衝突：本頁已停止寫入。" +
    "請先建立本頁加密備份，再處理衝突。";

   return;
  }

  if(view){
   $("workflow").textContent =
    "目前查看歷史快照／版本，內容唯讀。" +
    "重印不會恢復其有效狀態，也不代表已交付。";

   return;
  }

  if(e.status === "completed"){
   $("workflow").textContent =
    "診症已完成。" +
    "修改前請重新開啟；既有完成快照及文件版本會保留。";

   return;
  }

  if(tab === "note"){
   $("workflow").textContent =
    "草稿會自動儲存至 Supabase。" +
    "「儲存草稿」不出具文件；" +
    "「完成診症」才建立完成快照。";

   return;
  }

  const version = effective(e, tab);

  $("workflow").textContent = !version
   ? "目前為文件草稿。" +
     "可先儲存，再使用「出具文件」；" +
     "或使用「出具並列印／PDF」。"
   : different(e, tab)
    ? "目前草稿與有效版本不同。" +
      "出具修訂版時須填寫原因；" +
      "原有效版本在確認出具前維持不變。"
    : "目前內容與有效版本相同。" +
      "列印會重用有效版本，不建立相同的新版本。";
 }

 /*
  攔截手動儲存及新增的出具動作。
  其他動作仍交回原有處理，
  包括主檔同步、完成、列印及歷史操作。
 */
 const previousAction = action;

 action = async function(node){
  const act = node.dataset.act;

  if(act === "save"){
   if(busy || printing) return;
   return saveDraftOnly();
  }

  if(act === ACTION_OPEN){
   if(busy || printing) return;
   return openIssueDialog();
  }

  if(act === ACTION_CONFIRM){
   if(busy || printing) return;
   return confirmIssue();
  }

  if(act === ACTION_CANCEL){
   if(busy || printing) return;

   issueContext = null;
   closeModal();

   return;
  }

  return previousAction.apply(this, arguments);
 };

 /*
  正常輸入後會呼叫 renderTabs()。
  在同一時機更新待出具數量及列印文字，
  避免要等完整 render() 才更新。
 */
 const previousRenderTabs = renderTabs;

 renderTabs = function(){
  const result = previousRenderTabs.apply(this, arguments);

  syncControls();

  return result;
 };

 const previousPreview = preview;

 preview = function(){
  const result = previousPreview.apply(this, arguments);

  syncWorkflowText();
  syncControls();

  return result;
 };

 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);

  syncWorkflowText();
  syncControls();

  return result;
 };

 const previousUpdateButtons = updateButtons;

 updateButtons = function(){
  const result = previousUpdateButtons.apply(this, arguments);

  syncControls();

  return result;
 };

 /*
  改變勾選文件後，
  即時更新修訂原因要求及敏感提示。
 */
 $("modalBody").addEventListener("change", event => {
  if(
   event.target.matches(
    "[data-cms-s1-document]"
   )
  ){
   refreshIssueSelection();
   setIssueErrors([]);
  }
 });

 $("modal").addEventListener("close", () => {
  issueContext = null;
 });

 /*
  初始化不會呼叫儲存、不會出具文件，
  亦不會更改任何病歷。
 */
 if(db){
  render();
 }else{
  saveButton.textContent = "儲存草稿";
  issueButton.disabled = true;
 }

})();
</script>

<script>
(function installStage2PatientFlow(){

  resume:"cmsS2ResumeEncounter"
 };

 const fieldLabels = {
  cn:"中文姓名",
  surname:"英文姓氏",
  given:"英文名字",
  hkid:"HKID／證件號碼",
  dob:"出生日期",
  sex:"性別",
  phone:"電話",
  email:"電郵",
  address:"地址",
  contact1Name:"聯絡人 1 姓名",
  contact1Phone:"聯絡人 1 電話",
  contact2Name:"聯絡人 2 姓名",
  contact2Phone:"聯絡人 2 電話"
 };

 const registrationFields = [
  ...IDFIELDS,
  ...CONTACTS
 ];

 let registration = null;
 let lookupTimer = null;

 /*
  registration 只係未保存表單狀態。
  開啟表單、搜尋、取消都唔會寫入 db。
 */
 function readRegistration(){
  if(
   !registration ||
   modalMode !== "cmsS2Registration"
  ){
   return null;
  }

  const data = patient();

  $("modalBody").querySelectorAll(
   "[data-cms-s2-field]"
  ).forEach(input => {
   data[input.dataset.cmsS2Field] = T(input.value);
  });

  data.hkid = normID(data.hkid);

  return {
   data,
   startVisit:!!$("cmsS2StartVisit")?.checked
  };
 }

 function registrationChanged(){
  const value = readRegistration();

  return !!(
   value &&
   !equal(value, registration.initial)
  );
 }

 function permitDiscard(){
  if(!registration) return true;

  if(
   registrationChanged() &&
   !confirm(
    "病人登記資料尚未保存。\n\n" +
    "離開會捨棄本次輸入；" +
    "不會建立病人主檔或診症。\n\n" +
    "確定離開？"
   )
  ){
   return false;
  }

  registration = null;
  return true;
 }

 function getPatient(id, d = db){
  const result = d?.patients.find(
   item => item.id === id
  );

  assert(result, "找不到病人主檔");

  return result;
 }

 function countEncounters(id){
  return db.encounters.filter(
   encounter => encounter.patientId === id
  ).length;
 }

 function unfinishedEncounters(id){
  return db.encounters.filter(
   encounter =>
    encounter.patientId === id &&
    encounter.status === "draft"
  ).slice().sort((a,b) =>
   S(b.date).localeCompare(S(a.date)) ||
   S(b.created).localeCompare(S(a.created))
  );
 }

 function patientMeta(p){
  return [
   "病歷編號：" + p.mrn,
   "出生日期：" +
    (dateOK(p.data.dob) ? fmt(p.data.dob) : "未填寫"),
   "性別：" + (T(p.data.sex) || "未填寫"),
   "證件：" + mask(p.data.hkid),
   "電話：" + (T(p.data.phone) || "未填寫")
  ].join("\n");
 }

 function showFormErrors(errors){
  const box = $("cmsS2RegistrationErrors");

  if(!box) return;

  box.hidden = errors.length === 0;

  box.textContent = errors.length
   ? "請先處理：\n• " + errors.join("\n• ")
   : "";

  if(errors.length){
   box.scrollIntoView({
    block:"nearest"
   });
  }
 }

 /*
  搜尋只重新產生結果區，
  唔重建正在輸入的搜尋欄。
 */
 function drawSearchResults(){
  const results = $("cmsS2PatientResults");
  const input = $("cmsS2PatientSearch");

  if(
   !db ||
   !results ||
   !input ||
   modalMode !== "cmsS2PatientChooser"
  ){
   return;
  }

  const query = T(input.value).toLowerCase();

  const compactQuery = query.replace(
   /[\s()（）-]/g,
   ""
  );

  const all = db.patients.filter(p => {
   if(!query) return true;

   const normal = [
    p.mrn,
    pname(p.data),
    p.data.phone,
    p.data.email,
    p.data.hkid
   ].join(" ").toLowerCase();

   const compact = normal.replace(
    /[\s()（）-]/g,
    ""
   );

   return normal.includes(query) ||
    compact.includes(compactQuery);
  }).slice().sort((a,b) =>
   a.mrn.localeCompare(b.mrn)
  );

  const visible = all.slice(0,50);

  results.innerHTML = `
   <p class="small">
    找到 ${all.length} 位病人。
    ${all.length > 50
     ? "目前顯示首 50 位，請縮窄搜尋。"
     : ""}
   </p>

   ${visible.map(p => {
    const unfinished = unfinishedEncounters(p.id);

    return `
     <section class="cms-s2-patient">
      <h3 class="cms-s2-patient-name">
       ${E(pname(p.data) || "未填姓名")}
      </h3>

      <p class="cms-s2-patient-meta">${E(
       patientMeta(p)
      )}</p>

      <p class="small" style="margin:7px 0 0">
       ${countEncounters(p.id)} 次診症
       ${unfinished.length
        ? " · " + unfinished.length + " 次未完成"
        : ""}
      </p>

      <div class="cms-s2-patient-actions">
       <button
        type="button"
        class="primary"
        data-act="${ACT.select}"
        data-patient="${E(p.id)}"
       >選擇此病人</button>

       <button
        type="button"
        data-act="pfOpen"
        data-patient="${E(p.id)}"
       >查看病人資料</button>
      </div>
     </section>
    `;
   }).join("") || `
    <div class="cms-s2-empty">
     沒有符合的病人。<br>
     請先核對搜尋條件；如確實係新病人，
     再按「登記新病人」。
    </div>
   `}
  `;
 }

 function openPatientChooser(){
  assert(db, "請先登入");

  showModal(
   "開始診症 · 先選擇病人",
   `
    <p class="cms-s2-help">
     先搜尋已登記病人。
     選擇病人後會再核對身份，唔會立即建立診症。
    </p>

    <label for="cmsS2PatientSearch">
     搜尋姓名、病歷編號、證件、電話或電郵
    </label>

    <div class="cms-s2-search">
     <input
      id="cmsS2PatientSearch"
      type="search"
      autocomplete="off"
      placeholder="輸入姓名、P-編號、證件或電話"
     >

     <button
      type="button"
      data-act="${ACT.search}"
     >搜尋</button>

     <button
      type="button"
      data-act="${ACT.register}"
      data-start="true"
     >＋ 登記新病人</button>
    </div>

    <div id="cmsS2PatientResults"></div>
   `,
   "cmsS2PatientChooser"
  );

  drawSearchResults();

  setTimeout(() => {
   $("cmsS2PatientSearch")?.focus();
  },0);
 }

 function registrationInput(key){
  const type = key === "dob"
   ? "date"
   : key === "email"
    ? "email"
    : [
       "phone",
       "contact1Phone",
       "contact2Phone"
      ].includes(key)
     ? "tel"
     : "text";

  return `
   <div
    class="field"
    ${key === "address"
     ? 'style="grid-column:1/-1"'
     : ""}
   >
    <label for="cmsS2Field-${E(key)}">
     ${E(fieldLabels[key])}
    </label>

    <input
     id="cmsS2Field-${E(key)}"
     data-cms-s2-field="${E(key)}"
     type="${type}"
     ${key === "dob"
      ? `max="${E(today())}"`
      : ""}
     autocomplete="off"
    >
   </div>
  `;
 }

 function openRegistration(startVisit = false){
  assert(db, "請先登入");
  assert(!conflict, "有版本衝突，暫時不能登記病人");

  const blank = patient();

  registration = {
   initial:{
    data:C(blank),
    startVisit:!!startVisit
   }
  };

  showModal(
   "登記新病人",
   `
    <p class="cms-s2-help">
     保存前唔會建立任何主檔或診症。
     至少填寫中文姓名，或英文姓氏／名字其中一項。
     請先核實病人身份，避免重複登記。
    </p>

    <section class="cms-s2-section">
     <h3>身份資料</h3>

     <div class="grid">
      ${[
       "cn",
       "surname",
       "given",
       "hkid",
       "dob",
       "sex"
      ].map(registrationInput).join("")}
     </div>
    </section>

    <section class="cms-s2-section">
     <h3>聯絡資料</h3>

     <div class="grid">
      ${[
       "phone",
       "email",
       "address"
      ].map(registrationInput).join("")}
     </div>
    </section>

    <details class="cms-s2-section">
     <summary>其他聯絡人（選填）</summary>

     <div class="grid">
      ${[
       "contact1Name",
       "contact1Phone",
       "contact2Name",
       "contact2Phone"
      ].map(registrationInput).join("")}
     </div>
    </details>

    <section class="cms-s2-section">
     <label class="check" style="margin:0">
      <input
       id="cmsS2StartVisit"
       type="checkbox"
       ${startVisit ? "checked" : ""}
      >

      <span>
       <strong>保存後立即開始今日診症</strong><br>
       <small>
        不勾選只登記主檔；
        勾選則同時建立一次未完成診症。
        藥物敏感初始為未確認，須於診症內另行核對。
       </small>
      </span>
     </label>
    </section>

    <div
     id="cmsS2RegistrationErrors"
     class="notice error cms-s2-error"
     role="alert"
     hidden
    ></div>

    <div class="cms-s2-footer">
     <button
      type="button"
      data-act="${ACT.back}"
     >返回搜尋</button>

     <button
      id="cmsS2RegistrationSave"
      type="button"
      class="primary"
      data-act="${ACT.save}"
     >${startVisit
      ? "登記並開始診症"
      : "只登記病人"}</button>
    </div>
   `,
   "cmsS2Registration"
  );

  setTimeout(() => {
   $("cmsS2Field-cn")?.focus();
  },0);
 }

 function syncRegistrationSaveLabel(){
  const node = $("cmsS2RegistrationSave");

  if(!node) return;

  node.textContent = $("cmsS2StartVisit")?.checked
   ? "登記並開始診症"
   : "只登記病人";
 }

 /*
  如已有未完成診症，提供繼續入口。
  即使沒有未完成紀錄，亦先核對病人，
  唔會一選中就自動寫入。
 */
 function selectPatient(id){
  const p = getPatient(id);
  const unfinished = unfinishedEncounters(id);

  showModal(
   "核對病人及診症",
   `
    <div class="cms-s2-choice-summary">
     <strong>${E(pname(p.data) || "未填姓名")}</strong>
     <div class="cms-s2-patient-meta">${E(
      patientMeta(p)
     )}</div>
    </div>

    ${unfinished.length ? `
     <h3>此病人已有未完成診症</h3>

     <p class="cms-s2-help">
      如果係繼續同一次求診，請開啟原有診症，
      唔需要再建立一次。
     </p>

     ${unfinished.map(e => `
      <section class="cms-s2-unfinished">
       <strong>${E(e.date || "未填日期")}</strong>

       <p class="small" style="margin:6px 0 10px">
        ${E(T(e.diagnosis) || "未填診斷")}<br>
        建立時間：${E(stamp(e.created))}
       </p>

       <button
        type="button"
        class="primary"
        data-act="${ACT.resume}"
        data-id="${E(e.id)}"
       >繼續此診症</button>
      </section>
     `).join("")}
    ` : `
     <p class="cms-s2-help">
      未發現此病人的未完成診症。
      確認身份後，可開始今日診症。
     </p>
    `}

    <div class="cms-s2-footer">
     <button
      type="button"
      data-act="${ACT.choose}"
     >重新選擇病人</button>

     <button
      type="button"
      ${unfinished.length ? "" : 'class="primary"'}
      data-act="${ACT.create}"
      data-patient="${E(id)}"
     >${unfinished.length
      ? "另開一次今日診症"
      : "確認並開始今日診症"}</button>
    </div>
   `,
   "cmsS2PatientConfirmation"
  );
 }

 /*
  明確選好既有病人後才建立。

  使用 addEncounter(d, patientId)，
  沿用相同 patientId 及主檔快照，
  不會另建病人主檔。
 */
 async function createEncounterForPatient(id){
  assert(db, "請先登入");
  assert(!conflict, "有版本衝突，不能建立診症");

  const p = getPatient(id);

  assert(
   pname(p.data),
   "此主檔仍未填姓名，請先編輯病人主檔"
  );

  const unfinished = unfinishedEncounters(id);

  if(unfinished.length){
   if(!confirm(
    pname(p.data) + "已有 " +
    unfinished.length + " 次未完成診症。\n\n" +
    "你已決定另開一次今日診症，" +
    "而唔係繼續原有診症？"
   )){
    return;
   }
  }

  let encounterId = "";

  await run(async () => {
   await commit(candidate => {
    const patientMaster = getPatient(id, candidate);

    assert(
     pname(patientMaster.data),
     "主檔姓名未完整，已停止建立"
    );

    encounterId = addEncounter(
     candidate,
     id
    ).id;

    const e = candidate.encounters.find(
     item => item.id === encounterId
    );

    audit(
     e,
     "經選擇病人流程開始診症",
     "使用既有主檔；未建立另一個病人主檔"
    );
   });

   selected = encounterId;
   db.currentId = encounterId;
   tab = "note";
   view = null;

   /*
    原 commit() 會保存進入操作前的 selected。
    另外保存目前選取診症，確保重新登入後位置一致。
   */
   dirty++;

   $("modal").close();
   showErrors([]);

   await save();
  });

  message(
   "已為 " + pname(current().patient) +
   " 開始今日診症。" +
   "本次藥物敏感覆核尚未完成，請另行核對。"
  );
 }

 /*
  新病人主檔及首個診症，
  在同一個 commit 候選資料內建立。

  按取消、返回搜尋或關閉表單，
  都不會走到這段寫入流程。
 */
 async function saveRegistration(){
  assert(db, "請先登入");
  assert(!conflict, "有版本衝突，不能保存登記");
  assert(
   registration &&
   modalMode === "cmsS2Registration",
   "沒有正在編輯的新病人登記"
  );

  const entered = readRegistration();

  assert(entered, "無法讀取登記資料");

  const data = entered.data;
  const startVisit = entered.startVisit;
  const errors = [];

  if(!pname(data)){
   errors.push(
    "請至少填寫中文姓名，或英文姓氏／名字其中一項"
   );
  }

  if(
   data.dob &&
   (
    !dateOK(data.dob) ||
    data.dob > today()
   )
  ){
   errors.push("出生日期無效或遲於今日");
  }

  const emailInput = $("cmsS2Field-email");

  if(
   T(data.email) &&
   emailInput &&
   !emailInput.validity.valid
  ){
   errors.push("電郵格式無效");
  }

  showFormErrors(errors);

  if(errors.length) return;

  const duplicates = duplicatePatients(data, "");

  if(duplicates.length){
   if(!confirm(
    "發現可能重複病人：\n\n" +
    duplicates.map(p =>
     p.mrn + " · " + pname(p.data) +
     "\n出生日期：" +
     (dateOK(p.data.dob) ? fmt(p.data.dob) : "未填寫") +
     "\n證件：" + mask(p.data.hkid)
    ).join("\n\n") +
    "\n\n建議取消並返回搜尋核對。" +
    "\n系統不會自動合併。" +
    "\n\n你已核實係另一位病人，仍要新增？"
   )){
    return;
   }
  }

  let patientId = "";
  let encounterId = "";

  await run(async () => {
   await commit(candidate => {
    patientId = uid();

    const p = addMaster(
     candidate,
     patientId,
     data
    );

    candidate.meta.security.push({
     at:now(),
     actor,
     sessionId,
     action:"登記新病人",
     patientId,
     mrn:p.mrn,
     startedEncounter:startVisit
    });

    if(startVisit){
     encounterId = addEncounter(
      candidate,
      patientId
     ).id;
    }
   });

   /*
    commit 已成功，先清除未保存表單狀態。
    如後續畫面選取儲存失敗，
    不應誤導使用者重複登記同一病人。
   */
   registration = null;

   if(startVisit){
    selected = encounterId;
    db.currentId = encounterId;
    tab = "note";
    view = null;

    dirty++;

    $("modal").close();
    showErrors([]);

    await save();
   }
  });

  const savedPatient = getPatient(patientId);

  if(startVisit){
   message(
    "已登記 " + savedPatient.mrn + " · " +
    pname(savedPatient.data) +
    "，並開始今日診症。" +
    "藥物敏感仍為未確認，請於本次診症核對。"
   );
  }else{
   masterHistory(patientId);

   message(
    "已登記 " + savedPatient.mrn + " · " +
    pname(savedPatient.data) +
    "。沒有建立診症或收據。"
   );
  }
 }

 /*
  修正主檔聯絡資料來源。

  不修改資料；
  只將目前主檔頁的聯絡區，
  固定顯示 p.data 內的聯絡資料。
 */
 const previousMasterHistory = masterHistory;

 masterHistory = function(id){
  const result = previousMasterHistory.apply(
   this,
   arguments
  );

  if(!db) return result;

  const p = db.patients.find(
   item => item.id === id
  );

  const profile = $("modalBody").querySelector(
   ".patient-profile"
  );

  if(!p || !profile) return result;

  const contactSection = [
   ...profile.querySelectorAll(".profile-section")
  ].find(section => {
   const title = T(
    section.querySelector(
     ".profile-section-head h3"
    )?.textContent
   );

   return [
    "最新聯絡資料",
    "主檔聯絡資料"
   ].includes(title);
  });

  if(!contactSection) return result;

  const title = contactSection.querySelector(
   ".profile-section-head h3"
  );

  if(title){
   title.textContent = "主檔聯絡資料";
  }

  const pill = contactSection.querySelector(
   ".profile-section-head .pill"
  );

  if(pill){
   pill.textContent = "目前主檔";
  }

  const source = contactSection.querySelector(
   ".profile-source"
  );

  if(source){
   source.textContent =
    "資料來源：目前病人主檔\n" +
    "主檔最後更新：" + stamp(p.updated) +
    "\n修改診症病歷不會改變此區的資料來源。";
  }

  const labelToKey = Object.fromEntries(
   CONTACTS.map(key => [
    fieldLabels[key],
    key
   ])
  );

  contactSection.querySelectorAll(
   ".profile-field"
  ).forEach(field => {
   const label = T(
    field.querySelector(".profile-label")?.textContent
   );

   const key = labelToKey[label];

   if(!key) return;

   const value = field.querySelector(
    ".profile-value"
   );

   if(!value) return;

   const text = T(p.data[key]);

   value.textContent = text || "未填寫";

   value.classList.toggle(
    "profile-empty",
    !text
   );
  });

  return result;
 };

 function syncNavigationLabels(){
  const startButton = app.querySelector(
   'button[data-act="new"]'
  );

  if(startButton){
   startButton.textContent = "＋ 開始診症";
   startButton.title =
    "先搜尋病人，再選擇繼續原有診症或建立新診症。";
  }

  app.querySelectorAll(
   '.cms-main-nav > button[data-act="pfRegistry"]'
  ).forEach(button => {
   button.textContent = "病人名單";
  });

  const currentPatientButton = $(
   "cmsPatientHeaderActions"
  )?.querySelector(
   'button[data-act="pfOpen"]'
  );

  if(currentPatientButton){
   currentPatientButton.textContent = "本病人資料";

   currentPatientButton.title =
    "查看目前病人的主檔及家人關係。";
  }

  const registerButton = app.querySelector(
   ".cms-main-nav > .pf-register"
  );

  if(registerButton){
   registerButton.textContent = "＋ 登記病人";

   registerButton.title =
    "只登記主檔；亦可選擇保存後開始今日診症。";
  }
 }

 /*
  保留上一階段及主檔同步 action。
  只取代病人新增／開始診症入口。
 */
 const previousAction = action;

 action = async function(node){
  const act = node.dataset.act;

  if(busy || printing){
   return previousAction.apply(this, arguments);
  }

  const handled = new Set([
   "new",
   "pfNew",
   "newForPatient",
   ...Object.values(ACT)
  ]);

  const savingRegistration =
   act === ACT.save;

  /*
   在登記表單輸入後，
   任何其他 data-act 導航都先確認捨棄。
   保存本身不觸發捨棄提示。
   */
  if(
   registration &&
   !savingRegistration &&
   !permitDiscard()
  ){
   return;
  }

  if(!handled.has(act)){
   return previousAction.apply(this, arguments);
  }

  assert(db, "請先登入");

  switch(act){
   case "new":
   case ACT.choose:
   case ACT.back:
    openPatientChooser();
    break;

   case "pfNew":
    openRegistration(false);
    break;

   case ACT.register:
    openRegistration(
     node.dataset.start === "true"
    );
    break;

   case "newForPatient":
   case ACT.select:
    selectPatient(node.dataset.patient);
    break;

   case ACT.create:
    await createEncounterForPatient(
     node.dataset.patient
    );
    break;

   case ACT.resume:
    await openEncounter(node.dataset.id);
    break;

   case ACT.search:
    drawSearchResults();
    break;

   case ACT.save:
    await saveRegistration();
    break;
  }
 };

 /*
  關閉按鈕透過 closeModal()；
  Escape 則由 dialog cancel 事件處理。
 */
 const previousCloseModal = closeModal;

 closeModal = function(){
  if(busy || printing) return;

  if(!permitDiscard()) return;

  return previousCloseModal.apply(this, arguments);
 };

 $("modal").addEventListener("cancel", event => {
  if(busy || printing) return;

  if(
   registration &&
   !permitDiscard()
  ){
   event.preventDefault();
  }
 });

 $("modal").addEventListener("close", () => {
  clearTimeout(lookupTimer);
  registration = null;
 });

 $("modalBody").addEventListener("input", event => {
  if(
   event.target.id !== "cmsS2PatientSearch" ||
   busy ||
   printing
  ){
   return;
  }

  clearTimeout(lookupTimer);

  lookupTimer = setTimeout(() => {
   if(!busy && !printing){
    drawSearchResults();
   }
  },180);
 });

 $("modalBody").addEventListener("keydown", event => {
  if(
   event.target.id === "cmsS2PatientSearch" &&
   event.key === "Enter"
  ){
   event.preventDefault();

   clearTimeout(lookupTimer);
   drawSearchResults();
  }
 });

 $("modalBody").addEventListener("change", event => {
  if(event.target.id === "cmsS2StartVisit"){
   syncRegistrationSaveLabel();
  }
 });

 /*
  原有 beforeunload 只處理 db 草稿。
  補上仍未保存的新病人表單。
 */
 window.addEventListener("beforeunload", event => {
  if(
   registration &&
   registrationChanged()
  ){
   event.preventDefault();
   event.returnValue = "";
  }
 });

 const previousRender = render;

 render = function(){
  const result = previousRender.apply(this, arguments);

  syncNavigationLabels();

  return result;
 };

 /*
  初始化只改按鈕名稱，沒有讀寫網絡或建立病人。
 */
 syncNavigationLabels();

})();
</script>
