<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dr Ray's CMS</title>
<style>
:root{
 --bg:#edf2f4;--panel:#fff;--ink:#172a30;--muted:#5b6e76;
 --line:#d5e0e4;--accent:#235f54;--soft:#eaf4ef;
 --warn:#775516;--warnbg:#fff7df;--bad:#a32e35;--badbg:#fff0f1;
 font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.4}
button:hover:not(:disabled){background:var(--soft)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px;border:1px solid #bfced5;border-radius:7px;background:#fff;color:var(--ink)}
textarea{min-height:86px;resize:vertical;line-height:1.6}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[readonly],textarea[readonly]{background:#f1f5f6}
label{display:block;font-size:12px;line-height:1.6;margin:0 0 5px;color:#425d67}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #a5cbbd;outline-offset:2px}
fieldset{margin:0;padding:0;border:0;min-width:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
h1,h2,h3,h4,p{margin-top:0}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
small,.small{font-size:12px;color:var(--muted);line-height:1.7}
.hidden{display:none!important}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:13px;min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13px;margin:10px 0}
.check input{margin-top:4px;flex:0 0 auto}
.card{padding:16px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:13px}
.notice{padding:12px 15px;border:1px solid #dfd0a4;background:var(--warnbg);color:var(--warn);border-radius:8px;line-height:1.7;white-space:pre-wrap}
.notice.error{background:var(--badbg);border-color:#e2b3b8;color:var(--bad)}
.pill{padding:3px 8px;background:var(--soft);border-radius:15px;font-size:11px}
header.appbar{background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:17px;font-weight:bold}
.brand small{display:block;font-weight:normal}
#appNotice{border-radius:0}
.layout{height:calc(100dvh - 136px);min-height:420px;display:grid;grid-template-columns:420px minmax(0,1fr)}
.editor{overflow:auto;padding:15px;border-right:1px solid var(--line);background:#f8fafb}
.preview{overflow:auto;padding:0 20px 35px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.tabs button{padding:9px 3px;font-size:12px}
.tabs button.active{background:var(--ink);color:#fff}
.tabs small{display:block;font-size:10px;color:inherit;margin-top:3px}
.toolbar{position:sticky;top:0;z-index:4;padding:12px 0;background:var(--bg)}
#saveState{display:block;font-size:12px;margin-top:5px}
#paperViewport{overflow:auto;padding:2px 0 20px}
#paperScale{position:relative;margin:auto}
#paper{transform-origin:top left}
#patientBanner{white-space:pre-wrap;line-height:1.7}
.item{border:1px solid var(--line);border-radius:8px;background:#fbfdfd;padding:12px;margin:11px 0}
.linked{background:var(--soft)}
summary{cursor:pointer;font-weight:bold;line-height:1.6}
details[open]>summary{margin-bottom:12px}
dialog{width:min(1000px,95vw);max-height:90dvh;padding:21px;border:1px solid var(--line);border-radius:13px;color:var(--ink)}
dialog::backdrop{background:#122b3688}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.dialoghead h2{margin:0}
#secretDialog{width:min(460px,95vw)}
#gate{max-width:680px;margin:8vh auto;padding:20px}
#gate .card{padding:25px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-family:inherit}
table.ui{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.ui th,table.ui td{padding:9px;border:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
.scrolltable{overflow:auto}
.signatureThumb{max-height:70px;max-width:180px;object-fit:contain}
#fatal{max-width:800px;margin:20px auto}
#printRoot{display:none}
#modalBody{line-height:1.6}
#modalBody textarea.large{min-height:180px}
.diffOld{background:#fff0f1}.diffNew{background:#eaf5ec}
.badge{display:inline-block;border:1px solid currentColor;padding:2px 6px;border-radius:5px;font-size:11px}
.paper{
 width:210mm;min-height:297mm;padding:17mm 18mm 18mm;background:#fff;color:#000;
 box-shadow:0 7px 28px #16333e18;overflow-wrap:anywhere;
 font-family:Arial,"DFKai-SB","BiauKai","標楷體",serif;font-size:11pt;line-height:1.45
}
.paper *{color:#000;border-color:#000}
.paper .letterhead{display:grid;grid-template-columns:1fr 1.15fr 1.25fr;gap:3mm}
.paper .doctor{font-size:14pt;font-weight:bold;line-height:1.25}
.paper .qual{font-size:9.8pt;white-space:pre-line;line-height:1.25}
.paper .contact{margin-top:5mm;padding-bottom:3mm;border-bottom:1px solid;font-size:10pt;white-space:pre-line}
.paper .title{text-align:center;font-size:14pt;font-weight:bold;margin:4mm 0;break-after:avoid}
.paper .state{border:2px solid;padding:3mm;white-space:pre-wrap;margin:3mm 0;break-inside:avoid}
.paper .patient{border-top:1px solid;border-bottom:1px solid;padding:3mm 0;margin-bottom:5mm;break-inside:avoid;break-after:avoid}
.paper .patientgrid{display:grid;grid-template-columns:30mm 1fr 21mm 1fr;gap:2mm}
.paper .full{grid-column:2/-1}
.paper .section{margin:5mm 0}
.paper h2,.paper h3{font-size:11pt;margin:0 0 2mm;break-after:avoid}
.paper .txt{white-space:pre-wrap;orphans:3;widows:3}
.paper p{margin:0 0 4mm;orphans:3;widows:3}
.paper .sub{margin:4mm 0;border-top:1px solid;padding-top:3mm}
.paper .recipient{white-space:pre-wrap;margin-bottom:5mm}
.paper .leave{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;border-top:1px solid;border-bottom:1px solid;padding:4mm 0;margin:5mm 0;break-inside:avoid}
.paper .leave strong,.paper .leave span{display:block}
.paper .allergy{border:2px solid;padding:3mm;white-space:pre-wrap;break-inside:avoid;margin-bottom:5mm}
.paper table{width:100%;table-layout:fixed;border-collapse:collapse;font:inherit;margin:4mm 0}
.paper th,.paper td{padding:3mm 2mm;border-bottom:1px solid;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.paper th{border-top:1px solid}
.paper th:first-child,.paper td:first-child{padding-left:0}
.paper th:last-child,.paper td:last-child{padding-right:0}
.paper thead{display:table-header-group}
.paper tr{break-inside:avoid;page-break-inside:avoid}
.paper .num{text-align:right}
.paper .total{border-top:1px solid;padding-top:3mm;text-align:right;font-weight:bold;break-inside:avoid}
.paper .signature{width:78mm;margin:12mm 0 0 auto;break-inside:avoid}
.paper .signature .space{height:18mm;display:flex;align-items:flex-end;padding-bottom:2mm}
.paper .signature img{max-width:48mm;max-height:16mm;object-fit:contain}
.paper .signature .line{border-top:1px solid;padding-top:3mm}
.paper .footer{font-size:10pt;border-top:1px solid;padding-top:3mm;margin-top:8mm;break-inside:avoid}
.paper .end{text-align:center;margin-top:8mm;break-inside:avoid}
@media(max-width:1100px){.layout{grid-template-columns:370px minmax(0,1fr)}.preview{padding-left:12px;padding-right:12px}}
@media(max-width:820px){.layout{display:block;height:auto}.editor,.preview{overflow:visible}.toolbar{position:relative}.editor{border-right:0}.grid{grid-template-columns:1fr}}
@page{size:A4;margin:17mm 18mm 18mm}
@media print{
 body>*{display:none!important}
 body>#printRoot{display:block!important}
 #printRoot>.paper{width:auto;min-height:0;padding:0;margin:0;box-shadow:none;transform:none}
 #printRoot>.paper+.paper{break-before:page;page-break-before:always}
}
</style>
</head>
<body>
<div id="gate">
 <section class="card">
  <h1>Dr. Ray's Clinical Management System</h1>
  <p id="gateMessage" class="small" style="margin-top:15px">正在檢查本機儲存…</p>
  <form id="gateForm" autocomplete="off">
   <div class="field">
    <label for="actor">操作人姓名／代號（自行填報）</label>
    <input id="actor" maxlength="100" required autocomplete="off">
   </div>
   <div class="field">
    <label for="vaultPassword">工作區密碼</label>
    <input id="vaultPassword" type="password" required autocomplete="current-password">
   </div>
   <div id="createConfirm" class="field hidden">
    <label for="vaultConfirm">再次輸入密碼（新密碼最少 12 字元）</label>
    <input id="vaultConfirm" type="password" autocomplete="new-password">
   </div>
   <button id="unlockBtn" class="primary">解鎖</button>
   <button id="gateRaw" type="button">匯出本機密文原件</button>
   <button id="gateRecover" type="button">從備份復原</button>
  </form>
  <p class="small" style="margin-top:15px">
請固定使用同一瀏覽器、設定檔及開啟位置。
復原功能不會清除或取代既有工作區；既有工作區無法解鎖時，
請改用另一個受保護的瀏覽器設定檔建立空白工作區，再匯入備份。
  </p>
 </section>
</div>

<div id="app" class="hidden">
 <header class="appbar">
  <div class="brand">梁子恒醫生診所管理系統 Dr Ray's Clinical Management System
   <small id="sessionLabel"></small>
  </div>
  <div class="row">
   <button data-act="new">＋ 新病人診症</button>
   <button data-act="patients">病人主檔／時間線</button>
   <button data-act="history">診症／版本</button>
   <button data-act="followups">檢查跟進</button>
   <button data-act="catalogue">檢查目錄</button>
   <button data-act="templates">範本</button>
   <button data-act="backup">備份／還原</button>
   <button data-act="settings">設定</button>
   <button data-act="quality">健康／驗收</button>
   <button data-act="lock">鎖定</button>
  </div>
 </header>
 <div id="appNotice" class="notice">
本機原型：未經獨立安全或臨床驗證。舊資料及已輸出文件不會自動加密。
 </div>
 <div class="layout">
  <aside class="editor">
   <section class="card">
    <strong id="patientHeading"></strong>
    <div id="patientBanner" class="small"></div>
    <div class="row" style="margin-top:9px">
     <button data-act="identity">編輯本次身份</button>
     <button data-act="publishMaster">更新病人主檔</button>
    </div>
   </section>
   <div id="tabs" class="tabs"></div>
   <div id="validation" class="notice error hidden"></div>
   <fieldset id="editorFields">
    <section class="card">
     <details><summary>本次聯絡資料（不印於對外文件）</summary><div id="contactFields"></div></details>
    </section>
    <section class="card">
     <details><summary>藥物敏感及覆核</summary><div id="allergyFields"></div></details>
    </section>
    <section class="card" id="clinicalFields"></section>
    <section class="card" id="documentFields"></section>
    <section class="card" id="outputFields"></section>
   </fieldset>
  </aside>
  <main class="preview">
   <div class="toolbar">
    <div class="row between">
     <div><strong id="previewTitle"></strong><span id="saveState"></span><small id="backupState"></small></div>
     <div class="row">
      <button data-act="return" id="returnBtn">返回</button>
      <button data-act="complete" id="completeBtn">完成診症</button>
      <button data-act="diff">比較版本</button>
      <button data-act="batch">多份列印</button>
      <button data-act="print" class="primary">列印／PDF</button>
     </div>
    </div>
   </div>
   <div id="workflow" class="notice" style="margin-bottom:12px"></div>
   <div class="row" style="margin-bottom:12px">
    <label for="zoom" style="margin:0">預覽</label>
    <select id="zoom" style="width:auto">
     <option value="fit">適合寬度</option><option value="0.75">75%</option>
     <option value="1">100%</option><option value="1.25">125%</option>
    </select>
    <button data-act="save">立即儲存</button>
    <button data-act="export">加密備份</button>
    <button data-act="printDone" id="printDone" class="hidden">列印視窗已關閉，返回</button>
   </div>
   <div id="paperViewport"><div id="paperScale"><article id="paper" class="paper"></article></div></div>
  </main>
 </div>
</div>

<dialog id="modal">
 <div class="dialoghead"><h2 id="modalTitle"></h2><button id="modalClose" type="button">關閉</button></div>
 <div id="modalBody"></div>
</dialog>
<dialog id="secretDialog">
 <form id="secretForm" autocomplete="off">
  <h2 id="secretTitle"></h2>
  <p id="secretHint" class="small"></p>
  <label for="secret1">密碼</label>
  <input id="secret1" type="password" autocomplete="off" required>
  <div id="secretSecond" class="field" style="margin-top:12px">
   <label for="secret2">再次輸入</label>
   <input id="secret2" type="password" autocomplete="off">
  </div>
  <p id="secretError" class="small"></p>
  <div class="row" style="margin-top:15px">
   <button class="primary">確定</button><button id="secretCancel" type="button">取消</button>
  </div>
 </form>
</dialog>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<div id="fatal" class="notice error hidden"></div>
<div id="printRoot"></div>

<script>
"use strict";

/* 單人本機原型。無外部程式庫、無網絡請求。
   v4 的資料以 JSON 匯入；不自動讀寫舊資料庫。
   工作區只保存密文；解鎖後資料存在記憶體及畫面。
*/
const VERSION="5.0.0", SCHEMA=5;
const DBNAME="ray_leung_clinic_cms_v5_encrypted";
const STORE="vault", KEY="main", ITERATIONS=600000;
const MAXFILE=50*1024*1024;
const $=id=>document.getElementById(id);
const C=x=>JSON.parse(JSON.stringify(x));
const now=()=>new Date().toISOString();
const S=x=>String(x??"");
const T=x=>S(x).trim();
const O=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
const E=x=>S(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPES={
 note:["診症","PROGRESS NOTE","診症紀錄"],
 referral:["轉介","REFERRAL LETTER","轉介信"],
 sick:["病假","SICK LEAVE CERTIFICATE","病假證明書"],
 attendance:["到診","ATTENDANCE CERTIFICATE","到診證明書"],
 receipt:["收據","RECEIPT","收據"],
 rx:["處方","PRESCRIPTION","處方"],
 lab:["化驗","LABORATORY REQUEST FORM","化驗檢查申請表"],
 imaging:["影像","RADIOLOGY IMAGING REQUEST FORM","影像檢查申請表"]
};
const DOCS=Object.keys(TYPES).filter(t=>t!=="note");
const INVS=["lab","imaging"];
const IDFIELDS=["surname","given","cn","hkid","dob","sex"];
const CONTACTS=["phone","email","address","contact1Name","contact1Phone","contact2Name","contact2Phone"];
const ALLERGY={unknown:"未確認／未記錄",none:"無已知藥物敏感",known:"有藥物敏感"};
const VSTATE={issued:"目前有效",superseded:"已取代",void:"已作廢",legacy:"舊版待確認"};
const ISTATE={ordered:"已申請／待完成",completed:"已完成檢查",results:"已收到報告"};
const BILLING={clinic:"診所收費",centre:"檢查中心直接收費"};
const PAYMENT={unknown:"未記錄",unpaid:"未收款",paid:"已收款"};
const DEFAULT={
 nameCn:"梁子恒醫生",nameEn:"Dr. LEUNG Tsz Hang",
 qualCn:"急症科專科醫生\n香港中文大學內外全科醫學士\n香港急症科醫學院院士\n香港醫學專科學院院士(急症科)\n香港中文大學醫學院意外及急救醫學教研部名譽臨床助理教授",
 qualEn:"Specialist in Emergency Medicine\nMBChB (CUHK)\nFHKCEM\nFHKAM (Emergency Medicine)\nClinical Assist Prof (Honorary)\nA&E Academic Unit, CUHK",
 address:"Unit 1603, 16/F, The L. Plaza, 367–375 Queen's Road Central, Sheung Wan, Hong Kong\n香港上環皇后大道中367-375號萬利商業大廈16樓1603室",
 phone:"2632 9288 / 9867 7100",email:"drraytleung@gmail.com",reg:"",signature:"",
 masks:{note:"full",referral:"full",sick:"partial",attendance:"partial",receipt:"partial",rx:"full",lab:"full",imaging:"full"},
 timestamp:false,idleMinutes:10
};
const CHECKS=[
 ["autosave","輸入 SOAP，確認已儲存，再重新載入核對"],
 ["conflict","兩個分頁修改：第二頁停止寫入，未覆蓋第一頁"],
 ["complete","完成、重開及再完成：舊快照不變"],
 ["version","修訂文件：新舊內容及修訂原因可追溯"],
 ["void","作廢文件：沒有自動恢復舊版"],
 ["cancel","取消列印：未自動標記成功列印或交付"],
 ["pagination","長轉介、多頁處方、長檢查名稱：無漏字／重疊"],
 ["restore","外部備份在獨立測試環境復原，逐項核對"],
 ["migration","真實舊版備份移轉：SOAP、版本、快照及收費一致"],
 ["lock","閒置鎖定、密碼錯誤及重開解鎖已測試"],
 ["incident","密碼、電腦遺失及資料外洩應變流程已演練"]
];
let db=null, idb=null, vaultKey=null, salt="", rev=0, actor="", sessionId="";
let selected="", tab="note", view=null, dirty=0, saved=0, saving=null;
let busy=false, conflict=false, printing=false, timer=null, previewTimer=null;
let channel=null, startupEnvelope=null, pending=null, lastActivity=Date.now();
let modalMode="", catDraft=[], templateDraft=null, selfResults=[];
let signatureDraft="", lastPrint=[], newVault=false;
const enc=new TextEncoder(), dec=new TextDecoder();

function assert(ok,msg){if(!ok)throw new Error(msg)}
function uid(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("")}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateOK(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(S(s)))return false;
 const d=new Date(s+"T12:00:00");
 return Number.isFinite(d.getTime())&&d.getFullYear()===+s.slice(0,4)&&d.getMonth()+1===+s.slice(5,7)&&d.getDate()===+s.slice(8,10)
}
function fmt(s){return dateOK(s)?new Date(s+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):"—"}
function cnDate(s){return dateOK(s)?`${+s.slice(0,4)}年${+s.slice(5,7)}月${+s.slice(8,10)}日`:"—"}
function stamp(s){const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleString("en-GB",{hour12:false}):"—"}
function age(d,b){if(!dateOK(d)||!dateOK(b)||d>b)return "";return +b.slice(0,4)-+d.slice(0,4)-(b.slice(5)<d.slice(5)?1:0)}
function pname(p){return [[T(p.surname).toUpperCase(),T(p.given)].filter(Boolean).join(" "),T(p.cn)].filter(Boolean).join(" ")}
function normID(s){s=S(s).replace(/\s/g,"").toUpperCase();const m=s.match(/^([A-Z]{1,2}\d{6})([0-9A])$/);return m?m[1]+"("+m[2]+")":s}
function mask(s,mode="partial"){
 s=normID(s);if(!s)return "—";if(mode==="full")return s;
 const m=s.match(/^([A-Z]{1,2})(\d{6})(?:\([0-9A]\))?$/);
 return m?m[1]+m[2].slice(0,3)+"***":s.length<4?"***":s.slice(0,3)+"*".repeat(Math.min(12,s.length-3))
}
function stable(x){return Array.isArray(x)?x.map(stable):O(x)?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x}
function serial(x){return JSON.stringify(stable(x))}
function equal(a,b){return serial(a)===serial(b)}
function parse(raw){return JSON.parse(raw,(k,v)=>{assert(!["__proto__","constructor","prototype"].includes(k),"資料含不允許欄位");return v})}
function image(s){return typeof s==="string"&&s.length<=1500000&&/^data:image\/(?:png|jpeg);base64,[A-Za-z0-9+/=\r\n]+$/.test(s)?s:""}
function cents(s){
 s=T(s);if(!/^\d+(?:\.\d{1,2})?$/.test(s))return NaN;
 const [a,b=""]=s.split(".");const n=Number(a)*100+Number(b.padEnd(2,"0"));return Number.isSafeInteger(n)?n:NaN
}
function cash(s){return Number.isFinite(Number(s))?Number(s).toLocaleString("en-HK",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}
function items(e){return e.receipt.items.filter(i=>T(i.desc)||T(i.amount))}
function drugs(e){return e.rx.items.filter(i=>["name","dose","frequency","route","duration"].some(k=>T(i[k])))}
function total(e){return items(e).reduce((a,i)=>a+(Number.isFinite(cents(i.amount))?cents(i.amount):0),0)}
function get(x,p){return p.split(".").reduce((v,k)=>v?.[k],x)}
function put(x,p,v){
 const a=p.split(".");assert(a.every(k=>!["__proto__","constructor","prototype"].includes(k)),"無效欄位");
 const k=a.pop(),o=a.reduce((v,k)=>v?.[k],x);assert(o&&Object.hasOwn(o,k),"欄位不存在");o[k]=v
}
function current(){return db?.encounters.find(e=>e.id===selected)}

function effective(e,t){return e.versions.find(v=>v.type===t&&v.state==="issued")}
function editable(){return !!db&&!busy&&!printing&&!conflict&&!view&&current()?.status==="draft"}
function message(s,error=false){$("appNotice").textContent=s;$("appNotice").classList.toggle("error",error)}
function status(s,error=false){$("saveState").textContent=s;$("saveState").style.color=error?"var(--bad)":""}
function fail(error){console.error(error?.name||"Error");const s=error?.message||"操作失敗";if(db)status(s,true);else $("gateMessage").textContent=s;alert(s)}
function download(obj,name){
 const raw=typeof obj==="string"?obj:JSON.stringify(obj,null,2);
 const u=URL.createObjectURL(new Blob([raw],{type:"application/json;charset=utf-8"}));
 const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)
}
function filename(prefix){return prefix+"-"+now().replace(/[:.]/g,"-")+".json"}
function b64(bytes){
 let s="";for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)
}
function unb64(s,max=MAXFILE*2){
 assert(typeof s==="string"&&s.length<=max&&/^[A-Za-z0-9+/]*={0,2}$/.test(s),"密文編碼無效");
 const raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))
}
async function hash(x){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(typeof x==="string"?x:serial(x)))),b=>b.toString(16).padStart(2,"0")).join("")}
async function derive(password,saltValue){
 return crypto.subtle.deriveKey(
  {name:"PBKDF2",salt:unb64(saltValue,100),iterations:ITERATIONS,hash:"SHA-256"},
  await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]),
  {name:"AES-GCM",length:256},false,["encrypt","decrypt"]
 )
}
function header(purpose,s){return {format:"ray-clinic-encrypted",version:1,purpose,kdf:"PBKDF2-SHA256",iterations:ITERATIONS,salt:s,algorithm:"AES-256-GCM"}}
function checkEnvelope(v,purpose=null){
 assert(O(v)&&v.format==="ray-clinic-encrypted"&&v.version===1,"不是支援的加密檔案");
 assert(["vault","backup","drill"].includes(v.purpose)&&(!purpose||v.purpose===purpose),"加密用途不符");
 assert(v.kdf==="PBKDF2-SHA256"&&v.iterations===ITERATIONS&&v.algorithm==="AES-256-GCM","加密參數不支援");
 assert(unb64(v.salt,100).length===16&&unb64(v.iv,100).length===12,"加密 salt／IV 無效");
 assert(typeof v.ciphertext==="string"&&v.ciphertext.length<=MAXFILE*2,"密文過大")
}
async function seal(value,key,s,purpose){
 const h=header(purpose,s),iv=crypto.getRandomValues(new Uint8Array(12));
 const result=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:enc.encode(serial(h)),tagLength:128},key,enc.encode(JSON.stringify(value)));
 return {...h,iv:b64(iv),ciphertext:b64(new Uint8Array(result))}
}
async function unseal(v,key,purpose=null){
 checkEnvelope(v,purpose);
 let raw;
 try{raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.iv,100),additionalData:enc.encode(serial(header(v.purpose,v.salt))),tagLength:128},key,unb64(v.ciphertext))}
 catch{throw new Error("密碼不符或密文已損壞；沒有修改現有資料")}
 return parse(dec.decode(raw))
}
function secret(title,confirmPassword=false,hint=""){
 return new Promise(resolve=>{
  $("secretTitle").textContent=title;$("secretHint").textContent=hint;
  $("secret1").value="";$("secret2").value="";$("secretError").textContent="";
  $("secretSecond").classList.toggle("hidden",!confirmPassword);
  $("secretDialog").showModal();setTimeout(()=>$("secret1").focus(),0);
  const done=v=>{
   $("secret1").value="";$("secret2").value="";
   $("secretForm").onsubmit=null;$("secretCancel").onclick=null;
   $("secretDialog").removeEventListener("cancel",cancel);$("secretDialog").close();resolve(v)
  };
  const cancel=e=>{e.preventDefault();done(null)};
  $("secretDialog").addEventListener("cancel",cancel);
  $("secretCancel").onclick=()=>done(null);
  $("secretForm").onsubmit=e=>{
   e.preventDefault();const p=$("secret1").value;
   if(confirmPassword&&(p.length<12||p!==$("secret2").value)){$("secretError").textContent="最少 12 字元，兩次須相同。";return}
   done(p)
  }
 })
}
async function reauth(){
 const p=await secret("再次輸入工作區密碼",false,"用於圖片簽名或敏感操作；不是另一位使用者的身份驗證。");
 if(p===null)return false;
 const k=await derive(p,salt),test=await seal({check:sessionId},vaultKey,salt,"drill");
 const value=await unseal(test,k,"drill");assert(value.check===sessionId,"密碼不符");return true
}

/* 結構驗證：拒絕危險鍵及錯誤引用，保留舊快照，不重寫病人歷史。 */
function str(v,label){assert(typeof v==="string"&&v.length<=2000000,label+"須為文字")}
function arr(v,label){assert(Array.isArray(v)&&v.length<=100000,label+"須為列表")}
function bool(v,label){assert(typeof v==="boolean",label+"須為布林值")}
function choice(v,list,label){assert(list.includes(v),label+"無效")}
function unique(a,label){const s=new Set();for(const v of a){str(v,label);assert(v&&!s.has(v),label+"空白或重複");s.add(v)}}
function guard(x,depth=0,counter={n:0}){
 assert(depth<60&&++counter.n<3000000,"資料結構過深或過大");
 if(Array.isArray(x)){assert(x.length<=100000,"列表過大");x.forEach(v=>guard(v,depth+1,counter))}
 else if(O(x)){for(const [k,v] of Object.entries(x)){assert(!["__proto__","constructor","prototype"].includes(k),"危險欄位");guard(v,depth+1,counter)}}
 else assert(x===null||typeof x==="string"||typeof x==="boolean"||(typeof x==="number"&&Number.isFinite(x)),"資料值無效")
}
function checkPatient(p){
 assert(O(p),"缺少病人資料");
 for(const k of IDFIELDS)str(p[k],"病人."+k);
 if(p.allergyStatus!==undefined)choice(p.allergyStatus,Object.keys(ALLERGY),"敏感狀態");
 for(const k of [...CONTACTS,"allergyDetails"])if(p[k]!==undefined)str(p[k],"病人."+k)

function checkSettings(s,full=true){

 for(const k of ["nameCn","nameEn","qualCn","qualEn","address","phone","email","reg","signature"])str(s[k],"設定."+k);
 assert(!s.signature||image(s.signature),"簽名格式無效");
 if(full){
  assert(O(s.masks),"缺少證件顯示設定");

  bool(s.timestamp,"時間設定");

 }
}
function checkContent(e,t,publicOnly=false){
 const r=e[t];assert(O(r),"缺少 "+t+" 資料");
 if(INVS.includes(t)){
  for(const k of ["centre","indication","remarks"])str(r[k],t+"."+k);
  arr(r.items,"檢查項目");
  if(!publicOnly){unique(r.items.map(i=>i.id),"檢查 ID");unique(r.items.map(i=>i.catalogueId),"檢查目錄連結")}
  for(const i of r.items){
   str(i.name,"檢查名稱");str(i.details,"檢查詳情");assert(T(i.name),"空白檢查名稱");
   if(publicOnly)continue;
   choice(i.billing,Object.keys(BILLING),"檢查收費");str(i.price,"檢查價錢");
   assert(!T(i.price)||Number.isFinite(cents(i.price)),"檢查價錢無效");
   assert(i.billing!=="clinic"||Number.isFinite(cents(i.price)),"診所收費缺少價錢");
   choice(i.status,Object.keys(ISTATE),"檢查狀態");
   for(const k of ["result","performedDate","resultDate","statusUpdatedAt","reviewedAt"])str(i[k],"檢查."+k);
   bool(i.reviewed,"覆核狀態");
   for(const k of ["performedDate","resultDate","due"])if(i[k])assert(dateOK(i[k]),"檢查日期無效");
   for(const k of ["due","owner","next","contactAt","contactNote","reviewedBy","closedAt","closedBy","closureReason"])if(i[k]!==undefined)str(i[k],"跟進."+k);
   for(const k of ["contacted","closed"])if(i[k]!==undefined)bool(i[k],"跟進."+k);
   if(i.closed)assert(i.reviewed&&i.status==="results"&&T(i.closureReason),"結案須有已覆核報告及原因")
  }
 }else if(t==="rx"){
  bool(r.showDiagnosis,"處方診斷");str(r.remarks,"處方備註");arr(r.items,"藥物");
  for(const i of r.items)for(const k of ["name","dose","frequency","route","duration"])str(i[k],"藥物."+k)
 }else if(t==="receipt"){
  for(const k of ["no","payment","remarks"])str(r[k],"收據."+k);
  bool(r.showDiagnosis,"收據診斷");if(r.paymentStatus!==undefined)choice(r.paymentStatus,Object.keys(PAYMENT),"收款狀態");
  arr(r.items,"收費");
  for(const i of r.items){
   str(i.desc,"收費名稱");str(i.amount,"收費金額");
   if(i.investigationId!==undefined){str(i.investigationId,"收費連結");choice(i.investigationType,INVS,"收費連結類別")}
  }
 }else if(t==="referral"){for(const k of ["target","institution","to","salutation","body"])str(r[k],"轉介."+k)}
 else if(t==="sick"){
  for(const k of ["from","to","days","remarks"])str(r[k],"病假."+k);
  choice(r.fromPeriod,["AM","PM"],"開始時段");choice(r.toPeriod,["AM","PM"],"結束時段");bool(r.showDiagnosis,"病假診斷")
 }else if(t==="attendance"){
  str(r.date,"到診日期");str(r.remarks,"到診備註");choice(r.period,["AM","PM"],"到診時段");bool(r.showDiagnosis,"到診診斷")
 }
}
function checkCore(e,type=null){

function checkDB(d){

 for(const r of d.catalogue){
  choice(r.type,INVS,"檢查類別");str(r.name,"檢查名稱");assert(T(r.name),"檢查名稱不可空白");
  str(r.price,"價錢");assert(!T(r.price)||Number.isFinite(cents(r.price)),"價錢無效");choice(r.billing,Object.keys(BILLING),"收費方式");bool(r.enabled,"啟用")
 }
 for(const t of d.templates){
  str(t.name,"範本名稱");assert(T(t.name),"範本名稱空白");choice(t.type,["note","referral","receipt"],"範本類別");

  if(t.type==="referral")str(t.content.body,"轉介範本");
  if(t.type==="receipt"){arr(t.content.items,"收費範本");for(const i of t.content.items){str(i.desc,"範本項目");str(i.amount,"範本金額");assert(T(i.desc)&&Number.isFinite(cents(i.amount)),"收費範本項目不完整")}}
 }
 for(const e of d.encounters){
  checkCore(e);assert(d.patients.some(p=>p.id===e.patientId),"診症缺少病人主檔");
  arr(e.versions,"文件版本");arr(e.revisions,"完成快照");arr(e.audit,"操作紀錄");arr(e.identityChanges,"身份更正");
  unique(e.versions.map(v=>v.id),"文件版本 ID");unique(e.revisions.map(r=>r.id),"快照 ID");
  for(const v of e.versions){

   str(v.savedAt,"版本時間");checkCore(v.data,v.type);checkSettings(v.settings,false);assert(v.data.id===e.id,"文件診症不符");
   if(v.replacedBy)assert(e.versions.some(x=>x.id===v.replacedBy&&x.type===v.type),"取代版本不存在");
   if(v.deliveries!==undefined)arr(v.deliveries,"交付紀錄")
  }
  for(const t of DOCS)assert(e.versions.filter(v=>v.type===t&&v.state==="issued").length<=1,"同類文件有多個有效版本");
  for(const r of e.revisions){
   checkCore(r.data);checkSettings(r.settings,false);assert(r.data.id===e.id&&r.data.status==="completed","完成快照診症不符");
   str(r.savedAt,"快照時間");arr(r.summary,"完成摘要");
   for(const s of r.summary){
    choice(s.type,DOCS,"摘要類別");
    if(s.issued){str(s.issued.text,"文件摘要");assert(e.versions.some(v=>v.id===s.issued.id&&v.type===s.type),"摘要版本不存在")}
    if(s.draft)str(s.draft.text,"草稿摘要")
   }
  }
 }
 assert(O(d.meta)&&O(d.meta.checks)&&Array.isArray(d.meta.security),"工作區管理資料錯誤");
 return d
}
function migrate(raw){
 guard(raw);
 if(raw.schema===5)return checkDB(C(raw));
 assert(raw.schema===4,"本版直接支援你提供的 v4 JSON 及 v5 備份。v1–v3 請先用原版轉成 v4 並核對。");
 const d=C(raw);d.schema=5;d.appVersion=VERSION;
 d.settings={...C(DEFAULT),...d.settings,masks:{...DEFAULT.masks,...d.settings?.masks}};
 d.settings.idleMinutes=10;d.patients=[];d.patientCounter=0;d.templates=[];
 d.meta={lastExport:"",lastRestore:null,checks:{},security:[],migratedAt:now(),migratedFrom:4};
 arr(d.encounters,"診症");
 for(const e of d.encounters){
  if(!T(e.patientId))e.patientId=e.id;
  e.identityChanges=[];e.allergyReviewedBy=e.allergyReviewedBy||"";
  for(const t of INVS)e[t].items=e[t].items.map(followDefaults);
  for(const v of e.versions)v.deliveries=[];
  /* 舊完成快照及舊文件 data 保持原狀，不補寫當時操作人。 */
 }
 const groups=new Map();
 for(const e of d.encounters){
  const old=groups.get(e.patientId);
  if(!old||S(e.updated)>S(old.updated))groups.set(e.patientId,e)
 }
 for(const [id,e]of groups)addMaster(d,id,e.patient);
 return checkDB(d)
}

/* IndexedDB：加密在交易外完成，revision 比較與寫入同一交易。 */
function openIDB(name=DBNAME){
 return new Promise((resolve,reject)=>{
  const q=indexedDB.open(name,1);
  q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};
  q.onerror=()=>reject(q.error||new Error("資料庫開啟失敗"));
  q.onblocked=()=>reject(new Error("資料庫被另一頁阻擋，請關閉其他頁面"));
  q.onsuccess=()=>resolve(q.result)
 })
}
function readRecord(handle,key=KEY){
 return new Promise((resolve,reject)=>{
  const tx=handle.transaction(STORE,"readonly"),q=tx.objectStore(STORE).get(key);let result=null;
  q.onsuccess=()=>result=q.result??null;tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(tx.error||new Error("讀取中止"));tx.onerror=()=>{}
 })
}
function cas(handle,envelope,expected,key=KEY){
 return new Promise((resolve,reject)=>{
  const tx=handle.transaction(STORE,"readwrite"),store=tx.objectStore(STORE),q=store.get(key);let custom=null;
  q.onsuccess=()=>{
   if((q.result?.revision??0)!==expected){custom=new Error("另一頁已更新資料，停止寫入以免覆蓋。請匯出本頁加密備份後重新載入。");custom.name="ConflictError";tx.abort();return}
   store.put({revision:expected+1,envelope,updatedAt:now()},key)
  };
  tx.oncomplete=()=>resolve(expected+1);tx.onerror=()=>{};tx.onabort=()=>reject(custom||tx.error||new Error("儲存未完成"))
 })
}
function deleteDB(name){
 return new Promise((resolve,reject)=>{
  const q=indexedDB.deleteDatabase(name);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error);q.onblocked=()=>reject(new Error("演練資料庫刪除被阻擋"))
 })
}
async function persistSnapshot(snapshot,expected=rev,key=vaultKey,s=salt){
 const envelope=await seal(snapshot,key,s,"vault");
 const r=await cas(idb,envelope,expected);
 startupEnvelope=envelope;rev=r;
 try{channel?.postMessage({revision:r})}catch{}
 return r
}
function storageFailure(e){
 if(e.name==="ConflictError")conflict=true;
 message("未完成儲存："+e.message+"\n請勿關閉此頁；先匯出本頁加密備份。",true);
 status("未儲存／停止寫入",true);updateButtons()
}
async function save(){
 clearTimeout(timer);if(saving){await saving;if(dirty!==saved)return save();return}
 assert(db&&vaultKey,"工作區未解鎖");assert(!conflict,"目前有分頁衝突，請先備份");
 if(dirty===saved)return;
 const generation=dirty,snapshot=C(db);snapshot.currentId=selected;
 saving=(async()=>{
  try{status("正在加密儲存…");await persistSnapshot(snapshot);saved=generation;status(dirty===saved?"已加密儲存 · "+new Date().toLocaleTimeString():"仍有修改待儲存")}
  catch(e){storageFailure(e);throw e}
 })();
 try{await saving}finally{saving=null}
 if(dirty!==saved)return save()
}
function changed(){
 current().updated=now();dirty++;status("有修改，等待加密儲存");
 clearTimeout(timer);timer=setTimeout(()=>save().catch(()=>{}),700);
 clearTimeout(previewTimer);previewTimer=setTimeout(()=>{preview();banner();renderTabs()},160)
}
async function commit(fn){
 await save();assert(!conflict,"有分頁衝突");
 const candidate=C(db);fn(candidate);candidate.currentId=selected;candidate.appVersion=VERSION;
 checkDB(candidate);
 try{await persistSnapshot(candidate)}catch(e){storageFailure(e);throw e}
 db=candidate;dirty++;saved=dirty;status("已加密儲存 · "+new Date().toLocaleTimeString())
}

/* 驗證及日期 */
function half(d,p){return dateOK(d)&&["AM","PM"].includes(p)?Date.parse(d+"T00:00:00Z")/86400000*2+(p==="PM"?1:0):NaN}
function updateSick(path){
 const s=current().sick;
 if(["sick.from","sick.fromPeriod","sick.days"].includes(path)){
  const start=half(s.from,s.fromPeriod),days=Number(s.days);
  if(Number.isFinite(start)&&days>=.5&&days<=3660&&Number.isInteger(days*2)){
   const end=start+days*2-1;s.to=new Date(Math.floor(end/2)*86400000).toISOString().slice(0,10);s.toPeriod=end%2===0?"AM":"PM"
  }
 }else if(["sick.to","sick.toPeriod"].includes(path)){
  const n=(half(s.to,s.toPeriod)-half(s.from,s.fromPeriod)+1)/2;if(Number.isFinite(n)&&n>=.5)s.days=S(n)
 }
 for(const k of ["days","to","toPeriod"]){const i=$(fid("sick."+k));if(i&&i!==document.activeElement)i.value=s[k]}
}
function warnings(e,t="note",settings=db.settings){
 const errors=[];
 if(!pname(e.patient))errors.push("請填寫病人姓名");
 if(!dateOK(e.date))errors.push("文件／診症日期無效");
 if(e.patient.dob&&(!dateOK(e.patient.dob)||e.patient.dob>e.date))errors.push("出生日期無效或遲於診症日期");
 if(e.patient.allergyStatus==="known"&&!T(e.patient.allergyDetails))errors.push("有藥物敏感但未填寫詳情");
 if(e.patient.allergyStatus&&e.patient.allergyStatus!=="known"&&T(e.patient.allergyDetails))errors.push("敏感狀態與已有詳情不一致");
 if(t==="note")return errors;
 if(e.signature==="image"&&!image(settings.signature))errors.push("缺少有效簽名圖片");
 if(t==="referral"&&(!T(e.referral.body)||!T(e.referral.target+e.referral.institution+e.referral.to)))errors.push("轉介對象／機構／收件人及正文未完整填寫");
 if(t==="sick"){
  const n=(half(e.sick.to,e.sick.toPeriod)-half(e.sick.from,e.sick.fromPeriod)+1)/2;
  if(!Number.isFinite(n)||n<.5||n>3660||n!==Number(e.sick.days))errors.push("病假日期、時段與日數不一致")
 }
 if(t==="attendance"&&!dateOK(e.attendance.date))errors.push("到診日期無效");
 if(t==="receipt"){
  if(!T(e.receipt.no)||!T(e.receipt.payment)||!items(e).length)errors.push("收據編號、付款方式或收費項目未填寫");
  if(items(e).some(i=>!T(i.desc)||!Number.isFinite(cents(i.amount)))||!Number.isSafeInteger(total(e)))errors.push("收費項目名稱／金額無效")
 }
 if(t==="rx"){
  if(!T(settings.reg))errors.push("請先在設定填寫醫生註冊編號");
  if(!drugs(e).length||drugs(e).some(i=>["name","dose","frequency","route","duration"].some(k=>!T(i[k]))))errors.push("處方藥名、劑量、頻次、途徑及療程／數量須完整")
 }
 if(INVS.includes(t)&&!e[t].items.length)errors.push("未選擇檢查");
 return errors
}
function showErrors(errors){
 $("validation").classList.toggle("hidden",!errors.length);
 $("validation").textContent=errors.length?"請先處理：\n• "+errors.join("\n• "):"";
 if(errors.length)$("validation").scrollIntoView({block:"nearest"});
 return errors.length>0
}

}

/* 差異／歷史 */
function flatten(x,p="",out={}){
 if(p.endsWith("signature")&&typeof x==="string"){out[p]=x?"[圖片簽名資料]":"";return out}
 if(Array.isArray(x)){if(!x.length)out[p]="[]";else x.forEach((v,i)=>flatten(v,p+"["+i+"]",out))}
 else if(O(x)){for(const [k,v]of Object.entries(x))flatten(v,p?p+"."+k:k,out)}
 else out[p]=S(x);
 return out
}
function diffTable(a,b){
 const x=flatten(a),y=flatten(b),keys=[...new Set([...Object.keys(x),...Object.keys(y)])].filter(k=>x[k]!==y[k]);
 return keys.length?`<div class="scrolltable"><table class="ui"><thead><tr><th>欄位</th><th>之前</th><th>之後</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${E(k)}</td><td class="diffOld">${E(x[k]??"（不存在）")}</td><td class="diffNew">${E(y[k]??"（不存在）")}</td></tr>`).join("")}</tbody></table></div>`:"<p>沒有文字／結構差異。</p>"
}

  showModal("SOAP／診症與完成快照比較",`<p class="small">之前：${E(stamp(r.savedAt))} 完成快照；之後：目前診症資料。圖片內容不在文字差異中展示。</p>`+diffTable(r.data,core(e)),"diff");return
 }

 if(!v){alert("尚未有可比較版本。");return}
 showModal("文件版本與目前草稿比較",`<p class="small">之前：${E(stamp(v.savedAt))}；之後：目前草稿。圖片簽名只顯示有／無；實際是否改變會另行核對。</p>`+

async function versionAction(eid,vid,action){
 const original=db.encounters.find(e=>e.id===eid),v=original?.versions.find(v=>v.id===vid);assert(v,"找不到版本");
 if(action==="deliver"){
  assert(v.state==="issued","不能將非有效版本記作目前交付");
  const method=prompt("交付方式（例如：親身、郵寄、受保護傳送）：");if(!T(method))return;
  const note=prompt("交付備註（避免不必要身份資料；留空亦可）：");if(note===null)return;
  if(!confirm("這是你自行確認已交付，而非瀏覽器自動判斷。確定記錄？"))return;
  await run(()=>commit(d=>{const e=d.encounters.find(e=>e.id===eid),v=e.versions.find(v=>v.id===vid);assert(v.state==="issued","版本狀態已改變");v.deliveries??=[];v.deliveries.push({at:now(),actor,sessionId,method:T(method),note:T(note)});audit(e,"自行確認文件交付",T(method),vid)}));
 }else{
  assert(original.status==="draft","請先開啟並重新開啟該診症");
  const reason=prompt(action==="void"?"作廢原因（必填；不會恢復上一版）：":"現在確認舊版有效的原因（必填；不代表知道當時交付狀態）：");if(!T(reason))return;
  if(action==="adopt"){assert(v.state==="legacy","不是待確認舊版");const w=warnings(v.data,v.type,v.settings);assert(!w.length,w.join("\n"))}
  await run(()=>commit(d=>{
   const e=d.encounters.find(e=>e.id===eid),v=e.versions.find(v=>v.id===vid);
   if(action==="void"){assert(v.state==="issued","版本已非有效");v.state="void";v.voidReason=T(reason);v.voidAt=now();e.used[v.type]=false}
   else{const old=effective(e,v.type);if(old){old.state="superseded";old.replacedBy=v.id}v.state="issued";v.confirmedAt=now()}
   audit(e,action==="void"?"作廢文件":"確認舊版有效",T(reason),vid)
  }))
 }
 historyModal()
}

/* 檢查與跟進 */
function orders(e){return INVS.flatMap(t=>e[t].items.map(i=>({type:t,item:i})))}
function charges(e){
 return orders(e).filter(x=>x.item.billing==="clinic").map(({type,item:i})=>{
  assert(Number.isFinite(cents(i.price)),"檢查缺少價錢："+i.name);
  return {desc:(type==="lab"?"LAB: ":"Imaging: ")+i.name,amount:(cents(i.price)/100).toFixed(2),investigationId:i.id,investigationType:type}
 })
}
function syncCharges(e){
 const before=e.receipt.items.filter(i=>i.investigationId),after=charges(e);
 assert(equal(before,after)||!financialLocked(e),"收據已出具或已收款，不能修改自動收費；未收款請先作廢有效收據");
 if(!equal(before,after)){e.receipt.items=[...e.receipt.items.filter(i=>!i.investigationId),...after];e.used.receipt=items(e).length>0}
}

async function saveTemplate(){

   const desc=T(line.slice(0,at)),amount=T(line.slice(at+1));

   t.content[i.dataset.templatefield]=i.value

function fileDataURL(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(S(r.result));
  r.onerror=()=>reject(new Error("圖片讀取失敗"));
  r.readAsDataURL(file)

async function loadSignature(file){
 assert(file&&["image/png","image/jpeg"].includes(file.type),"只接受 PNG／JPEG");
 assert(file.size<=3*1024*1024,"圖片不可超過 3 MB");
 const url=await fileDataURL(file);
 const img=await new Promise((resolve,reject)=>{
  const i=new Image();i.onload=()=>resolve(i);
  i.onerror=()=>reject(new Error("圖片不能解碼"));i.src=url
 });
 assert(img.naturalWidth>0&&img.naturalHeight>0,"圖片尺寸無效");
 assert(img.naturalWidth*img.naturalHeight<=12000000,"圖片像素過大");
 const ratio=Math.min(1,1200/img.naturalWidth,500/img.naturalHeight);
 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));
 canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
 const ctx=canvas.getContext("2d");assert(ctx,"無法處理圖片");
 ctx.drawImage(img,0,0,canvas.width,canvas.height);
 const result=canvas.toDataURL("image/png");
 assert(image(result),"處理後圖片過大");
 signatureDraft=result;
 if($("signaturePreview")){
  $("signaturePreview").innerHTML=
   `<img class="signatureThumb" src="${result}" alt="簽名預覽">`
 }
}

async function decodeBackupFile(file){
 assert(file&&file.size>0,"檔案為空");
 assert(file.size<=MAXFILE,"檔案超過 50 MB；本版不接受");
 let raw=parse(await file.text());
 let encrypted=false,kind="明文 JSON",originCreated="";
 if(O(raw)&&O(raw.envelope)&&raw.envelope.format==="ray-clinic-encrypted"){
  raw=raw.envelope
 }
 if(raw?.format==="ray-clinic-encrypted"){
  checkEnvelope(raw);
  assert(["vault","backup"].includes(raw.purpose),"不能匯入演練密文");
  const password=await secret(
   raw.purpose==="vault"?"輸入原工作區密碼":"輸入此備份的密碼",
   false,"解密只用於預覽，不會立即取代工作區。"
  );
  if(password===null)return null;
  const key=await derive(password,raw.salt);
  raw=await unseal(raw,key);
  encrypted=true;kind="已驗證加密檔案"
 }
 let data;
 if(raw?.format==="ray-clinic-backup"){
  assert(raw.version===1&&O(raw.data),"備份格式不支援");
  assert(typeof raw.digest==="string","備份缺少摘要");
  assert(await hash(raw.data)===raw.digest,"備份摘要不符；停止匯入");
  originCreated=S(raw.createdAt);data=raw.data
 }else if(O(raw)&&[4,5].includes(raw.schema)){
  data=raw
 }else{
  throw new Error("不是支援的 v4／v5 資料或加密備份")
 }
 const originalSchema=data.schema;
 const migrated=migrate(data);
 return {
  data:migrated,
  filename:file.name,
  kind,encrypted,originalSchema,
  originCreated,
  digest:await hash(migrated)
 }
}

function issuedVersion(e,t,settings,reason){
 const old=effective(e,t);
 if(old&&!different(e,t,settings))return old;
 const savedAt=now();
 const v={
  id:uid(),type:t,state:"issued",
  savedAt,actor,sessionId,reason,
  data:docData(e,t),settings:doctor(settings,e.signature),
  deliveries:[]
 };
 if(old){old.state="superseded";old.replacedBy=v.id}

 audit(e,"保存文件版本",reason,v.id);

async function refreshStorageHealth(){

 try{
  const estimate=navigator.storage?.estimate?
   await navigator.storage.estimate():null;
  const persisted=navigator.storage?.persisted?
   await navigator.storage.persisted():null;
  if(!target.isConnected)return;
  const mb=n=>Number.isFinite(n)?(n/1024/1024).toFixed(1)+" MB":"無法取得";
  target.textContent=
   "估算使用量："+mb(estimate?.usage)+
   "／估算配額："+mb(estimate?.quota)+
   "\n持久儲存："+(persisted===null?"瀏覽器不支援查詢":persisted?"已獲准":"未獲准")+
   "\n即使獲准，仍須保留外部備份。";
  target.style.whiteSpace="pre-wrap"
 }catch{
  if(target.isConnected)target.textContent="瀏覽器未能提供儲存配額資料。"
 }

async function selfTest(){
 const results=[];
 async function test(name,fn){
  try{await fn();results.push({name,ok:true})}
  catch(e){results.push({name,ok:false,error:e.message||"失敗"})}
 }
 await run(async()=>{
  await save();
  await test("目前工作區結構檢查",()=>checkDB(C(db)));
  await test("金額以整數分計算",()=>{
   assert(cents("0.10")+cents("0.20")===30,"分幣計算不符");
   assert(Number.isNaN(cents("-1"))&&Number.isNaN(cents("1.234")),"無效金額未被拒絕")
  });
  await test("病假半日時段計算",()=>{
   assert((half("2026-01-02","AM")-half("2026-01-01","PM")+1)/2===1,
    "跨日時段計算不符");
   assert(!dateOK("2026-02-30"),"無效日期未被拒絕")
  });
  await test("加密／解密及竄改拒絕（只使用測試文字）",async()=>{
   const probe={test:"dummy-only",id:uid()};
   const v=await seal(probe,vaultKey,salt,"drill");
   assert(equal(await unseal(v,vaultKey,"drill"),probe),"解密不一致");
   const damaged=C(v),bytes=unb64(damaged.ciphertext);
   bytes[0]^=1;damaged.ciphertext=b64(bytes);
   let rejected=false;
   try{await unseal(damaged,vaultKey,"drill")}catch{rejected=true}
   assert(rejected,"竄改密文未被拒絕")
  });
  await test("IndexedDB revision 衝突保護（獨立測試庫）",async()=>{
   const name=DBNAME+"-selftest-"+uid();
   let handle=null;
   try{
    handle=await openIDB(name);
    const envelope=await seal({test:true},vaultKey,salt,"drill");
    const r=await cas(handle,envelope,0);
    assert(r===1,"初次 revision 不符");
    let rejected=false;
    try{await cas(handle,envelope,0)}
    catch(e){rejected=e.name==="ConflictError"}
    assert(rejected,"過期 revision 未被拒絕");
    assert((await readRecord(handle)).revision===1,"衝突後資料被改寫")
   }finally{
    handle?.close();await deleteDB(name)
   }
  });
  await test("公共檢查申請內容不含內部結果及價錢",()=>{
   const e=encounter(db.settings);
   e.lab.items=[{
    name:"TEST ONLY",details:"TEST",
    price:"123",result:"PRIVATE TEST RESULT",owner:"TEST OWNER"
   }];
   const p=publicContent(e,"lab");
   assert(equal(Object.keys(p.items[0]).sort(),["details","name"]),
    "對外資料含額外欄位")
  });
  selfResults=results
 });
 qualityModal()
}

function clearReview(i){
 i.reviewed=false;i.reviewedAt="";i.reviewedBy="";
 i.closed=false;i.closedAt="";i.closedBy="";i.closureReason=""
}
function editorInput(input){
 if(!editable()){render();return}
 const path=input.dataset.path;
 if(!path)return;
 const e=current();
 const previous=get(e,path);
 let value=input.type==="checkbox"?input.checked:input.value;
 if(equal(previous,value))return;
 if(path.startsWith("receipt.")&&financialLocked(e)){
  if(path!=="receipt.paymentStatus"){
   fill($("editorFields"),e);
   throw new Error("收據財務內容已鎖定")
  }
  if(e.receipt.paymentStatus==="paid"&&value!=="paid"){
   fill($("editorFields"),e);
   throw new Error("不能直接把已收款改回未收款；本版未提供退款／沖銷流程")
  }
 }
 if(path==="receipt.paymentStatus"&&value==="paid"){
  assert(items(e).length,"未有收費項目");
  assert(!items(e).some(i=>!T(i.desc)||!Number.isFinite(cents(i.amount))),
   "請先填妥有效收費項目");
  if(!confirm("確認已實際收款？確認後財務內容會鎖定。")){
   fill($("editorFields"),e);return
  }
 }
 const match=path.match(/^(lab|imaging)\.items\.(\d+)\.(.+)$/);
 let refresh=false;
 if(match){
  const [,type,index,key]=match,i=e[type].items[+index];
  assert(i,"檢查項目不存在");
  if(["status","result","performedDate","resultDate"].includes(key)&&
    (i.reviewed||i.closed)){
   if(!confirm("修改報告相關內容會取消原覆核及結案狀態，須重新覆核。繼續？")){
    fill($("editorFields"),e);return
   }
   clearReview(i);refresh=true;
   audit(e,"修改報告內容並重設覆核","檢查 ID："+i.id)
  }
  if(key==="status"){
   choice(value,Object.keys(ISTATE),"檢查狀態");
   i.statusUpdatedAt=now();refresh=true
  }
  if(key==="contacted"){
   i.contactAt=value?now():"";refresh=true;
   audit(e,value?"記錄已聯絡病人":"取消已聯絡標記","檢查 ID："+i.id)
  }
 }
 if(["patient.allergyStatus","patient.allergyDetails"].includes(path)){
  e.allergyReviewed=false;e.allergyReviewedAt="";e.allergyReviewedBy=""
 }
 if(path==="allergyReviewed"){
  e.allergyReviewedAt=value?now():"";
  e.allergyReviewedBy=value?actor:"";
  audit(e,value?"記錄本次敏感覆核":"取消本次敏感覆核")
 }
 put(e,path,value);
 if(path.startsWith("sick."))updateSick(path);
 const doc=DOCS.find(t=>path.startsWith(t+"."));
 if(doc)e.used[doc]=true;
 if(path==="receipt.paymentStatus")refresh=true;
 changed();
 if(refresh)render();
 else if(["patient.allergyStatus","allergyReviewed"].includes(path)){
  render()
 }
}

async function removeItem(list,n){
 assert(editable(),"目前不能編輯");
 choice(list,["rx","receipt"],"項目類別");
 const i=current()[list].items[n];assert(i,"項目不存在");

/* 修正按鈕狀態：不永久改寫彈窗欄位的 disabled 屬性 */
updateButtons=function(){
 if(!db)return;
 $("app").querySelectorAll("button[data-act]").forEach(b=>{
  const a=b.dataset.act;
  b.disabled=busy||printing;
  if(a==="printDone")b.disabled=!printing;

   "new","complete","batch","print","save","catalogue","templates","publishMaster"
  ].includes(a)&&conflict)b.disabled=true;

  if(a==="batch"&&view)b.disabled=true;
  if(a==="tab"&&view)b.disabled=true
 });

};

/* 鎖定：清除應用程式持有的明文引用與畫面。
   JavaScript 無法保證作業系統／瀏覽器記憶體已被安全覆寫。 */
async function lockWorkspace(automatic=false){
 if(!db||busy||printing)return;
 busy=true;updateButtons();
 try{
  if(conflict){
   message("有分頁衝突，尚未鎖定。請先建立本頁加密備份，再重新載入。",true);
   return
  }
  await save();
  clearTimeout(timer);clearTimeout(previewTimer);
  $("modal").close();$("modalBody").replaceChildren();modalMode="";
  $("printRoot").replaceChildren();
  [
   "paper","contactFields","allergyFields","clinicalFields",
   "documentFields","outputFields","tabs"
  ].forEach(id=>$(id).replaceChildren());
  [
   "patientHeading","patientBanner","previewTitle","workflow",
   "saveState","backupState","sessionLabel","validation"
  ].forEach(id=>$(id).textContent="");
  catDraft=[];templateDraft=null;signatureDraft="";pending=null;
  selfResults=[];lastPrint=[];view=null;selected="";tab="note";
  db=null;vaultKey=null;actor="";sessionId="";
  $("actor").value="";
  $("vaultPassword").value="";$("vaultConfirm").value="";
  $("secret1").value="";$("secret2").value="";
  $("app").classList.add("hidden");$("gate").classList.remove("hidden");
  const record=await readRecord(idb);
  startupEnvelope=record?.envelope??null;rev=record?.revision??0;
  newVault=!record;
  $("createConfirm").classList.toggle("hidden",!newVault);
  $("unlockBtn").textContent=newVault?"建立加密工作區":"解鎖";
  $("vaultPassword").autocomplete=newVault?"new-password":"current-password";
  $("gateMessage").textContent=automatic?
   "已因閒置鎖定。請重新輸入操作人及密碼。":"工作區已鎖定。";
  $("vaultPassword").focus()
 }catch(e){
  if(db)message("未能安全完成儲存，因此沒有鎖定："+e.message,true);
  else $("gateMessage").textContent=e.message
 }finally{
  busy=false;
  if(db)updateButtons()
 }
}
function attachChannel(){
 try{
  channel?.close();
  channel=new BroadcastChannel(DBNAME+"-revision");
  channel.onmessage=event=>{
   const r=event.data?.revision;
   if(!db||!Number.isSafeInteger(r)||r<=rev)return;
   conflict=true;
   clearTimeout(timer);
   message(
    "另一頁已更新此工作區，這頁已停止寫入。\n"+
    "請先建立本頁加密備份，再重新載入。不要直接關閉未儲存的頁面。",
    true
   );
   updateButtons();preview()
  }
 }catch{channel=null}
}
function activateWorkspace(){
 $("gate").classList.add("hidden");$("app").classList.remove("hidden");
 $("vaultPassword").value="";$("vaultConfirm").value="";
 newVault=false;conflict=false;dirty=0;saved=0;
 selected=db.encounters.some(e=>e.id===db.currentId)?
  db.currentId:db.encounters[0]?.id;
 assert(selected,"工作區沒有可開啟的診症");
 tab="note";view=null;lastActivity=Date.now();
 attachChannel();
 message(
  "本機原型：未經獨立安全或臨床驗證。"+
  "操作人為自行填報；舊資料及已輸出文件不會自動加密。"
 );
 render();status("已解鎖 · 目前資料已加密儲存")
}
async function unlockWorkspace(event){
 event.preventDefault();if(busy)return;
 busy=true;$("unlockBtn").disabled=true;
 let password=$("vaultPassword").value;
 try{
  const operator=T($("actor").value);
  assert(operator,"請填寫操作人姓名／代號");
  assert(password,"請輸入密碼");
  const record=await readRecord(idb);
  let candidate,key,nextSalt;
  actor=operator;sessionId=uid();
  if(record){
   assert(!pending,"本機已有工作區，不能從鎖定畫面取代");
   assert(Number.isSafeInteger(record.revision)&&record.revision>=1,
    "本機 revision 無效；請先匯出密文原件");
   checkEnvelope(record.envelope,"vault");
   nextSalt=record.envelope.salt;
   $("gateMessage").textContent="正在解密及驗證…";
   key=await derive(password,nextSalt);
   candidate=checkDB(await unseal(record.envelope,key,"vault"));
   assert(candidate.encounters.length,"工作區沒有診症；請保留原件後檢查");
   rev=record.revision;startupEnvelope=record.envelope
  }else{
   assert(password.length>=12,"新密碼最少 12 字元");
   assert(password===$("vaultConfirm").value,"兩次密碼不相同");
   nextSalt=b64(crypto.getRandomValues(new Uint8Array(16)));
   $("gateMessage").textContent="正在建立加密工作區…";
   key=await derive(password,nextSalt);
   candidate=pending?C(pending.data):database();
   if(pending){
    candidate.meta.lastRestore={
     at:now(),actor,sessionId,filename:pending.filename,
     digest:pending.digest,sourceSchema:pending.originalSchema,
     contentVerified:false
    };
    candidate.meta.checks={}
   }
   if(!candidate.encounters.length)addEncounter(candidate);
   candidate.currentId=candidate.encounters.some(e=>e.id===candidate.currentId)?
    candidate.currentId:candidate.encounters[0].id;
   checkDB(candidate);
   vaultKey=key;salt=nextSalt;rev=0;
   await persistSnapshot(candidate,0,key,nextSalt);
   pending=null
  }
  vaultKey=key;salt=nextSalt;db=candidate;
  activateWorkspace()
 }catch(error){
  if(!db){vaultKey=null;actor="";sessionId=""}
  $("gateMessage").textContent=error.message||"未能解鎖";
  $("vaultPassword").value="";$("vaultConfirm").value="";
  console.error(error?.name||"UnlockError")
 }finally{
  password="";busy=false;$("unlockBtn").disabled=false;
  if(db)updateButtons()
 }
}

  pending=null;$("modal").close();return
 }

  if(view)return;
  tab=button.dataset.type;
  choice(tab,Object.keys(TYPES),"頁籤");
  showErrors([]);render();return
 }
 switch(a){
  case "new":await newEncounter();break;
  case "patients":patientsModal();break;
  case "history":historyModal();break;
  case "followups":followupModal();break;
  case "catalogue":catalogueModal();break;
  case "templates":templatesModal();break;
  case "settings":settingsModal();break;
  case "backup":backupModal();break;
  case "quality":qualityModal();break;
  case "lock":await lockWorkspace();break;
  case "identity":identityModal();break;
  case "saveIdentity":await saveIdentity();break;
  case "publishMaster":await publishMaster();break;

   const selectedTypes=[...$("modalBody").querySelectorAll("[data-batch]:checked")]
    .map(i=>i.dataset.batch);
   await printDocuments(selectedTypes);break
  }
  case "print":await printDocuments([tab]);break;
  case "newForPatient":await newEncounter(button.dataset.patient);break;
  case "masterHistory":masterHistory(button.dataset.patient);break;
  case "open":await openEncounter(button.dataset.id);break;
  case "openOrder":await openEncounter(button.dataset.id,null,button.dataset.type);break;

   await openEncounter(button.dataset.id,{

  case "void":

  case "addInvestigation":await addInvestigation();break;
  case "removeInvestigation":await removeInvestigation(+button.dataset.index);break;
  case "reviewOrder":await reviewOrder(+button.dataset.index);break;
  case "closeOrder":await closeOrder(+button.dataset.index);break;
  case "addItem":await addItem(button.dataset.list);break;
  case "removeItem":await removeItem(button.dataset.list,+button.dataset.index);break;
  case "catAdd":{
   const type=button.dataset.type;choice(type,INVS,"檢查類別");
   catDraft.push({id:uid(),type,name:"",price:"",billing:"centre",enabled:true});
   drawCatalogue();break
  }
  case "catSave":await saveCatalogue();break;
  case "templateNew":templateEditor(null,button.dataset.type);break;
  case "templateEdit":templateEditor(button.dataset.template);break;
  case "templateSave":await saveTemplate();break;
  case "templateApply":await applyTemplate(button.dataset.template);break;
  case "templateDelete":await deleteTemplate(button.dataset.template);break;
  case "signatureClear":
   signatureDraft="";
   if($("signaturePreview"))$("signaturePreview").textContent="未設定圖片簽名。";
   if($("signatureFile"))$("signatureFile").value="";
   break;
  case "settingsSave":await saveSettings();break;
  case "persistent":await requestPersistence();break;
  case "selfTest":await selfTest();break;
  case "restoreVerified":await restoreVerified();break;
  default:throw new Error("未支援的操作："+a)
 }
}

/* 閒置保護：
   長時間離開後的首次按鍵／點擊先觸發鎖定，不繼續執行該次操作。 */
function idleExpired(){
 return !!db&&Date.now()-lastActivity>=db.settings.idleMinutes*60000
}
function activity(event){
 if(!db)return;
 if(idleExpired()&&!busy&&!printing){
  event.preventDefault();event.stopImmediatePropagation();
  lockWorkspace(true).catch(fail);return
 }
 lastActivity=Date.now()
}
document.addEventListener("pointerdown",activity,true);

/* 啟動 */
async function boot(){
 try{
  assert(window.indexedDB,"此瀏覽器不支援 IndexedDB");
  assert(window.crypto?.subtle,
   "此開啟方式不能使用 Web Crypto。請使用支援的瀏覽器及受信任的本機開啟環境。");
  assert(typeof $("modal").showModal==="function","此瀏覽器不支援所需的對話框功能");
  idb=await openIDB();
  idb.onversionchange=()=>{
   idb.close();
   if(db){
    conflict=true;message("資料庫版本已改變。請先建立本頁備份，再重新載入。",true);
    updateButtons()
   }
  };
  const record=await readRecord(idb);
  newVault=!record;
  if(record){
   assert(Number.isSafeInteger(record.revision)&&record.revision>=1,
    "本機 revision 無效；請先匯出密文原件，勿覆寫");
   startupEnvelope=record.envelope;rev=record.revision;
   checkEnvelope(startupEnvelope,"vault")
  }
  $("createConfirm").classList.toggle("hidden",!newVault);
  $("vaultPassword").autocomplete=newVault?"new-password":"current-password";
  $("unlockBtn").textContent=newVault?"建立加密工作區":"解鎖";
  $("gateMessage").textContent=newVault?
   "此位置未有 v5 工作區。請填寫操作人並設定至少 12 字元的密碼；也可先從備份復原。":
   "已找到加密工作區。請填寫操作人並輸入工作區密碼。";
  $("actor").focus()
 }catch(error){
  $("unlockBtn").disabled=true;
  $("gateMessage").textContent="啟動失敗："+error.message;
  $("fatal").classList.remove("hidden");
  $("fatal").textContent=
   "未開啟工作區，也沒有清除既有資料。\n"+
   error.message+
   "\n請保留原 HTML、原瀏覽器設定檔及已有備份，不要清除網站資料。";
  console.error(error?.name||"BootError")
 }
}
/* Supabase 雲端接駁。
   取代最後的 boot();，不要另加 <script>。

const CLOUD_CLINIC = "6833ef5f-35aa-4818-a365-95dfbcb90e66";

};

const cloudHandle = {
  close() {},

};

async function cloudHTTP(path, {
  method = "GET",
  body,
  authorized = true
} = {}) {
  if (authorized) await cloudEnsureSession();

  const headers = {
    apikey: cloud.key,
    "Content-Type": "application/json"
  };

  if (authorized) {
    headers.Authorization = "Bearer " + cloud.session.access_token;
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);

  let response;
  try {
    response = await fetch(cloud.url + path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: controller.signal,
      cache: "no-store",
      credentials: "omit"
    });
  } catch (error) {
    throw new Error(
      error.name === "AbortError"
        ? "雲端請求逾時；未確認儲存，請勿關閉本頁。"
        : "無法連接 Supabase；未確認儲存，請勿關閉本頁。"
    );
  } finally {
    clearTimeout(timeout);
  }

  const text = await response.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); }
    catch { throw new Error("Supabase 回應格式不正確"); }
  }

  if (!response.ok) {
    const error = new Error(
      data?.message ||
      data?.error_description ||
      data?.msg ||
      "Supabase 請求失敗：" + response.status
    );
    error.code = data?.code;
    throw error;
  }

  return data;
}

function cloudRememberSession(value) {
  assert(value?.access_token && value?.refresh_token,
    "登入回應缺少有效 session");

  cloud.session = {
    ...value,
    user: value.user || cloud.session?.user
  };

  cloud.expiresAt =
    Date.now() + Number(value.expires_in || 3600) * 1000;
}

async function cloudEnsureSession() {
  assert(cloud.session, "請重新登入 Supabase");

  if (Date.now() < cloud.expiresAt - 60000) return;

  if (!cloud.refreshing) {
    cloud.refreshing = (async () => {
      const value = await cloudHTTP(
        "/auth/v1/token?grant_type=refresh_token",
        {
          method: "POST",
          authorized: false,
          body: { refresh_token: cloud.session.refresh_token }
        }
      );
      cloudRememberSession(value);
    })();
  }

  try {
    await cloud.refreshing;
  } finally {
    cloud.refreshing = null;
  }
}

/* 用雲端儲存介面取代本機介面。
   其他名稱（包括原本的本機自動測試庫）不允許使用。
*/
openIDB = async function(name = DBNAME) {
  assert(name === DBNAME,
    "雲端模式不執行原本的 IndexedDB 測試");
  assert(cloud.session, "請先登入 Supabase");
  return cloudHandle;
};

readRecord = async function(handle, key = KEY) {
  assert(handle === cloudHandle && key === KEY,
    "不支援的雲端工作區");

  const query =
    "/rest/v1/cms_cloud_vaults" +
    "?select=revision,envelope,updated_at" +
    "&clinic_id=eq." + CLOUD_CLINIC +
    "&owner_id=eq." + CLOUD_DOCTOR;

  const rows = await cloudHTTP(query);
  assert(Array.isArray(rows), "雲端工作區回應無效");
  assert(rows.length <= 1, "雲端工作區數量異常");

  if (!rows.length) return null;

  checkEnvelope(rows[0].envelope, "vault");

  const revision = Number(rows[0].revision);
  assert(Number.isSafeInteger(revision) && revision >= 1,
    "雲端版本號無效");

  return {
    revision,
    envelope: rows[0].envelope,
    updatedAt: rows[0].updated_at
  };
};

cas = async function(
  handle, envelope, expected, key = KEY
) {
  assert(handle === cloudHandle && key === KEY,
    "不支援的雲端工作區");

  checkEnvelope(envelope, "vault");

  try {
    const value = await cloudHTTP(
      "/rest/v1/rpc/cms_cloud_vault_save",
      {
        method: "POST",
        body: {
          p_expected_revision: expected,
          p_envelope: envelope
        }
      }
    );

    const revision = Number(value);
    assert(
      Number.isSafeInteger(revision) &&
      revision === expected + 1,
      "雲端儲存回應版本不符"
    );

    return revision;
  } catch (error) {
    if (error.code === "40001") error.name = "ConflictError";
    throw error;
  }
};

/* 只通知同一專案／同一帳戶的雲端分頁。
   跨裝置衝突由伺服器版本比較阻擋。
*/
attachChannel = function() {
  try {
    channel?.close();
    channel = new BroadcastChannel(
      DBNAME + "-cloud-" + cloud.url + "-" + CLOUD_DOCTOR
    );

    channel.onmessage = event => {
      const incoming = event.data?.revision;
      if (!db ||
          !Number.isSafeInteger(incoming) ||
          incoming <= rev) return;

      conflict = true;
      clearTimeout(timer);

      message(
        "另一頁已更新雲端工作區，這頁已停止寫入。" +
        "請先建立本頁加密備份，再重新載入。",
        true
      );

      updateButtons();
      preview();
    };
  } catch {
    channel = null;
  }
};

/* 雲端寫入：伺服器比較 revision，防止直接覆蓋新版。 */
persistSnapshot = async function(snapshot, expected = rev) {
  checkDB(snapshot);

  const envelope = {
    format: "ray-clinic-auth-workspace",
    version: 1,
    data: snapshot
  };

  let result;
  try {
    result = await cloudHTTP(
      "/rest/v1/rpc/cms_cloud_vault_save",
      {
        method: "POST",
        body: {
          p_expected_revision: expected,
          p_envelope: envelope
        }
      }
    );
  } catch (error) {
    if (error.code === "40001") {
      error.name = "ConflictError";
    }
    throw error;
  }

  const next = Number(result);

  assert(
    Number.isSafeInteger(next) && next === expected + 1,
    "雲端儲存回應版本不符"
  );

  rev = next;
  startupEnvelope = envelope;

  try {
    channel?.postMessage({ revision: next });
  } catch {}

  return next;
};

/* 不再依賴工作區加密匙。 */
save = async function() {
  clearTimeout(timer);

  if (saving) {
    await saving;
    if (dirty !== saved) return save();
    return;
  }

  assert(db && cloud.session, "請先登入");
  assert(!conflict, "目前有版本衝突，請先備份");
  if (dirty === saved) return;

  const generation = dirty;
  const snapshot = C(db);
  snapshot.currentId = selected;

  saving = (async () => {
    try {
      status("正在儲存至 Supabase…");
      await persistSnapshot(snapshot);
      saved = generation;

      status(
        dirty === saved
          ? "已儲存至 Supabase · " +
            new Date().toLocaleTimeString()
          : "仍有修改待儲存"
      );
    } catch (error) {
      storageFailure(error);
      throw error;
    }
  })();

  try {
    await saving;
  } finally {
    saving = null;
  }

  if (dirty !== saved) return save();
};

/* 工作區啟動：直接讀取或建立，不開第二個登入畫面。 */
async function startSingleLoginWorkspace() {
  idb = cloudHandle;

  const record = await readRecord(idb);
  let candidate;

  if (record) {
    assert(
      record.envelope?.format === "ray-clinic-auth-workspace",
      "雲端仍是舊密碼加密資料，未有覆寫。" +
      "請保留舊版，先解鎖匯出備份後再處理移轉。"
    );

    candidate = checkDB(C(record.envelope.data));
    assert(candidate.encounters.length,
      "工作區沒有診症，已停止載入");
    rev = record.revision;
    startupEnvelope = record.envelope;
  } else {
    rev = 0;
    candidate = database();
    addEncounter(candidate);
    checkDB(candidate);
    await persistSnapshot(candidate, 0);
  }

  db = candidate;
  vaultKey = null;
  salt = "";
  actor = cloud.session.user.email || CLOUD_DOCTOR;
  sessionId = uid();

  activateWorkspace();

  $("gate").classList.add("hidden");
  document.title = "梁子恒醫生 CMS — Supabase";

  message(
    "已登入 Supabase。病歷儲存於雲端，由帳戶權限及 RLS 保護。" 
  );
  status("已連接 Supabase · 雲端版本 " + rev);
}

/* 登出：必須先完成儲存；有衝突就保留畫面讓你備份。 */
lockWorkspace = async function(automatic = false) {
  if (!db || busy || printing) return;

  busy = true;
  updateButtons();

  try {
    assert(!conflict,
      "有版本衝突，尚未登出。請先建立本頁加密備份。");

    await save();

    await cloudHTTP("/auth/v1/logout", {
      method: "POST"
    });

    clearTimeout(timer);
    clearTimeout(previewTimer);
    channel?.close();

    db = null;
    cloud.session = null;
    actor = "";
    sessionId = "";

    location.reload();
  } catch (error) {
    message(
      "未完成登出：" + error.message +
      "。本頁資料仍保留，請勿直接關閉。",
      true
    );
  } finally {
    busy = false;
    if (db) updateButtons();
  }
};

if (logoutButton) logoutButton.textContent = "登出";

/* 唯一一次登入。 */
singleLoginForm.addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("cloudLoginButton");
  if (button.disabled) return;
  button.disabled = true;

  try {
    cloud.url = FIXED_SUPABASE_URL;
    cloud.key = FIXED_SUPABASE_KEY;

    $("cloudLoginMessage").textContent = "正在登入…";

    const login = await cloudHTTP(
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        authorized: false,
        body: {
          email: T($("cloudEmail").value),
          password: $("cloudPassword").value
        }
      }
    );

    cloudRememberSession(login);

    assert(
      cloud.session.user?.id === CLOUD_DOCTOR,
      "請使用已建立的梁子恒醫生帳戶登入"
    );

    const membership = await cloudHTTP(
      "/rest/v1/clinic_memberships" +
      "?select=user_id,role,is_active" +
      "&clinic_id=eq." + CLOUD_CLINIC +
      "&user_id=eq." + CLOUD_DOCTOR
    );

    assert(
      Array.isArray(membership) &&
      membership.some(m =>
        m.role === "doctor" && m.is_active === true
      ),
      "醫生成員資格無效或已停用"
    );

    $("cloudLoginMessage").textContent = "正在載入工作區…";

    await startSingleLoginWorkspace();
    cloudPanel.classList.add("hidden");

  } catch (error) {
    /* 如果已登入但載入失敗，清除本頁 session；
       不刪除或取代任何既有雲端資料。 */
    if (!db) cloud.session = null;

    $("cloudLoginMessage").textContent =
      error.message || "登入失敗";
  } finally {
    $("cloudPassword").value = "";
    button.disabled = false;
  }
});
</script>

<script>
(function organiseCMSInterface(){
 "use strict";

 const app = document.getElementById("app");
 if(!app || app.dataset.organisedUI === "1") return;

 const header = app.querySelector("header.appbar");
 const toolbar = app.querySelector(".preview > .toolbar");
 const zoom = document.getElementById("zoom");

 if(!header || !toolbar || !zoom) return;

 /*
  只搬移既有元素：
  保留 id、data-act、狀態及原本事件處理。
  不呼叫儲存、登入、還原或任何網絡功能。
 */
 const findButton = action =>
  app.querySelector('button[data-act="' + action + '"]');

 const actions = [
  "new", "patients", "history", "followups",
  "catalogue", "templates", "backup", "settings",
  "quality", "lock", "save", "export",
  "return", "complete", "diff", "batch",
  "print", "printDone"
 ];

 const buttons = Object.fromEntries(
  actions.map(action => [action, findButton(action)])
 );

 const make = (tag, className, text) => {
  const node = document.createElement(tag);
  if(className) node.className = className;
  if(text) node.textContent = text;
  return node;
 };

 const appendButtons = (parent, names) => {
  names.forEach(name => {
   if(buttons[name]) parent.append(buttons[name]);
  });
 };

 /* 1. 頂部日常導航 */
 const oldHeaderRow = buttons.new?.parentElement;
 const nav = make("nav", "cms-main-nav");
 nav.setAttribute("aria-label", "主要功能");

 if(buttons.new) buttons.new.textContent = "＋ 新診症";
 if(buttons.patients) buttons.patients.textContent = "病人主檔";
 if(buttons.history) buttons.history.textContent = "診症紀錄";
 if(buttons.followups) buttons.followups.textContent = "檢查跟進";

 appendButtons(nav, [
  "new", "patients", "history", "followups"
 ]);

 /* 2. 將非日常操作收進同一個選單 */
 const menu = make("details", "cms-admin-menu");
 const summary = make("summary", "", "管理及設定");
 const menuPanel = make("div", "cms-admin-panel");

 menu.append(summary, menuPanel);

 function menuSection(title, names){
  const section = make("div", "cms-menu-section");
  section.append(make("div", "cms-menu-label", title));
  appendButtons(section, names);
  menuPanel.append(section);
 }

 if(buttons.backup) buttons.backup.textContent = "備份及還原";
 if(buttons.export) buttons.export.textContent = "下載加密備份";
 if(buttons.quality) buttons.quality.textContent = "工作區狀態";
 if(buttons.lock) buttons.lock.textContent = "登出";

 menuSection("內容管理", ["catalogue", "templates"]);
 menuSection("備份", ["export", "backup"]);
 menuSection("系統", ["settings", "quality", "lock"]);

 nav.append(menu);
 header.append(nav);

 if(oldHeaderRow &&
    oldHeaderRow !== header &&
    oldHeaderRow.children.length === 0){
  oldHeaderRow.remove();
 }

 /* 選中項目後收起；沿用原本 document click handler */
 menuPanel.addEventListener("click", event => {
  const button = event.target.closest("button[data-act]");
  if(button && !button.disabled) menu.open = false;
 });

 document.addEventListener("click", event => {
  if(menu.open && !menu.contains(event.target)){
   menu.open = false;
  }
 });

 document.addEventListener("keydown", event => {
  if(event.key === "Escape" && menu.open){
   menu.open = false;
   summary.focus();
  }
 });

 /* 3. 合併預覽、儲存、完成及列印工具列 */
 const title = document.getElementById("previewTitle");
 const saveState = document.getElementById("saveState");
 const backupState = document.getElementById("backupState");

 const oldPreviewRow = zoom.closest(".row");
 const zoomLabel = app.querySelector('label[for="zoom"]');

 const heading = make("div", "cms-workbar-heading");
 const titleBox = make("div", "cms-workbar-title");

 [title, saveState, backupState].forEach(node => {
  if(node) titleBox.append(node);
 });

 heading.append(titleBox);

 if(buttons.return){
  buttons.return.textContent = "← 返回目前診症";
  heading.append(buttons.return);
 }

 const actionBar = make("div", "cms-workbar-actions");

 function actionGroup(label, names){
  const group = make("div", "cms-action-group");
  const row = make("div", "cms-action-buttons");

  group.append(make("div", "cms-action-label", label));
  appendButtons(row, names);
  group.append(row);
  actionBar.append(group);

  return {group, row};
 }

 if(buttons.save) buttons.save.textContent = "立即儲存";

 actionGroup("診症操作", [
  "save", "diff", "complete"
 ]);

 actionGroup("文件輸出", [
  "batch", "print"
 ]);

 const previewGroup = actionGroup("預覽顯示", []);
 previewGroup.group.classList.add("cms-preview-group");

 if(zoomLabel) previewGroup.row.append(zoomLabel);
 previewGroup.row.append(zoom);

 toolbar.classList.add("cms-workbar");
 toolbar.replaceChildren(heading, actionBar);

 if(buttons.printDone){
  buttons.printDone.classList.add("cms-print-return");
  toolbar.append(buttons.printDone);
 }

 /* 原本散落在紙張上方的一行已搬空 */
 if(oldPreviewRow && oldPreviewRow !== toolbar){
  oldPreviewRow.remove();
 }

 /* 4. 病人卡片內兩個按鈕對齊 */
 const identity = findButton("identity");
 const publishMaster = findButton("publishMaster");

 if(identity && publishMaster &&
    identity.parentElement === publishMaster.parentElement){
  identity.parentElement.classList.add("cms-patient-actions");
  identity.textContent = "編輯本次身份";
  publishMaster.textContent = "更新病人主檔";
 }

 app.dataset.organisedUI = "1";

 /* 只重新計算預覽縮放，不重繪或儲存病歷 */
 requestAnimationFrame(() => {
  window.dispatchEvent(new Event("resize"));
 });
})();
</script>

<script>
/*
  取代原本顯示 JSON 的主檔彈窗。
  只讀取現有資料及更正紀錄，不修改或儲存病歷。
*/
masterHistory = function(id){
 const p = db.patients.find(item => item.id === id);
 assert(p, "主檔不存在");

 const data = p.data;

 const labels = {
  surname: "英文姓氏",
  given: "英文名字",
  cn: "中文姓名",
  hkid: "HKID／證件號碼",
  dob: "出生日期",
  sex: "性別",
  phone: "電話",
  email: "電郵",
  address: "地址",
  contact1Name: "聯絡人 1 姓名",
  contact1Phone: "聯絡人 1 電話",
  contact2Name: "聯絡人 2 姓名",
  contact2Phone: "聯絡人 2 電話",
  allergyStatus: "藥物敏感狀態",
  allergyDetails: "敏感藥物及反應"
 };

 const timeValue = value => {
  const number = Date.parse(value || "");
  return Number.isFinite(number) ? number : 0;
 };

 function displayValue(key, value){
  if(value === null || value === undefined || value === ""){
   return "未填寫";
  }

  if(key === "allergyStatus"){
   return ALLERGY[value] || S(value);
  }

  if(key === "dob"){
   return dateOK(value) ? fmt(value) : S(value);
  }

  if(typeof value === "object"){
   return JSON.stringify(value, null, 2);
  }

  return S(value);
 }

 function fieldHTML(label, value, full = false){
  const empty = !T(value);

  return `
   <div class="profile-field ${full ? "full" : ""}">
    <div class="profile-label">${E(label)}</div>
    <div class="profile-value ${empty ? "profile-empty" : ""}">${
     E(empty ? "未填寫" : value)
    }</div>
   </div>`;
 }

 /*
  選用最後更新時間較新的完整聯絡資料快照。
  不逐欄拼湊，避免把已清空的舊資料重新補回。
  時間相同時優先保留主檔。
 */
 let contactSource = {
  kind: "master",
  data,
  updated: p.updated,
  encounterDate: ""
 };

 for(const encounter of db.encounters){
  if(encounter.patientId !== p.id) continue;

  if(timeValue(encounter.updated) >
     timeValue(contactSource.updated)){
   contactSource = {
    kind: "encounter",
    data: encounter.patient,
    updated: encounter.updated,
    encounterDate: encounter.date
   };
  }
 }

 const contact = contactSource.data;

 const contactDiffers = CONTACTS.some(key =>
  S(contact[key]) !== S(data[key])
 );

 const sourceText = contactSource.kind === "master"
  ? "資料來源：目前病人主檔"
  : "資料來源：" + contactSource.encounterDate +
    " 診症的病人資料快照";

 const sourceNote = contactSource.kind === "encounter" &&
                    contactDiffers
  ? "此聯絡資料與目前主檔不同，尚未自動更新至主檔。"
  : "此聯絡資料與目前主檔一致。";

 const changes = (p.changes || [])
  .slice()
  .sort((a, b) => timeValue(b.at) - timeValue(a.at));

 function changedFields(change){
  const before = change.before || {};
  const after = change.after || {};

  const keys = [
   ...new Set([
    ...Object.keys(before),
    ...Object.keys(after)
   ])
  ];

  return keys
   .filter(key => !equal(before[key], after[key]))
   .map(key => ({
    key,
    label: labels[key] || key,
    before: displayValue(key, before[key]),
    after: displayValue(key, after[key])
   }));
 }

 function historyHTML(change, index){
  const fields = changedFields(change);

  return `
   <details class="history-entry" ${index === 0 ? "open" : ""}>
    <summary>
     <span>
      <strong class="history-time">${E(stamp(change.at))}</strong>
      <span class="history-person">
       修改人：${E(change.actor || "未記錄")}
      </span>
     </span>
     <span class="history-count">
      ${fields.length} 項更改
     </span>
    </summary>

    <div class="history-body">
     <div class="history-reason"><strong>更改原因</strong><br>${
      E(T(change.reason) || "未記錄")
     }</div>

     <div class="profile-diff">
      ${fields.map(item => `
       <div class="profile-diff-item">
        <div class="profile-diff-label">${E(item.label)}</div>

        <div class="profile-diff-values">
         <div class="profile-diff-before"><span class="diff-caption">修改前</span>${E(item.before)}</div>
         <div class="profile-diff-after"><span class="diff-caption">修改後</span>${E(item.after)}</div>
        </div>
       </div>
      `).join("") || `
       <p class="profile-footnote">
        此筆紀錄沒有可顯示的欄位差異。
       </p>
      `}
     </div>
    </div>
   </details>`;
 }

 const titleName = pname(data) || "未填姓名";
 const avatar = T(data.cn)
  ? Array.from(T(data.cn))[0]
  : Array.from(T(data.surname) || T(data.given) || "P")[0]
    .toUpperCase();

 const html = `
  <div class="patient-profile">

   <section class="profile-hero">
    <div class="profile-avatar" aria-hidden="true">${E(avatar)}</div>

    <div>
     <h3 class="profile-name">${E(titleName)}</h3>
     <div class="profile-meta">
      <span>病歷編號：${E(p.mrn)}</span>
      <span>主檔更新：${E(stamp(p.updated))}</span>
     </div>
    </div>
   </section>

   <section class="profile-section">
    <div class="profile-section-head">
     <h3>目前主檔</h3>
     <span class="pill">目前保存資料</span>
    </div>

    <div class="profile-section-body">
     <div class="profile-grid">
      ${fieldHTML("中文姓名", data.cn)}
      ${fieldHTML(
       "英文姓名",
       [T(data.surname).toUpperCase(), T(data.given)]
        .filter(Boolean).join(" ")
      )}
      ${fieldHTML("HKID／證件號碼", data.hkid)}
      ${fieldHTML(
       "出生日期",
       data.dob ? displayValue("dob", data.dob) : ""
      )}
      ${fieldHTML("性別", data.sex)}
      ${fieldHTML("病歷編號", p.mrn)}
     </div>

     <div class="profile-allergy ${
      data.allergyStatus === "known" ? "is-known" : ""
     }">
      <div class="profile-label">主檔藥物敏感紀錄</div>
      <div class="profile-value">${E(allergy(data))}</div>
     </div>
    </div>
   </section>

   <section class="profile-section">
    <div class="profile-section-head">
     <h3>最新聯絡資料</h3>
     <span class="pill">按資料更新時間選取</span>
    </div>

    <div class="profile-section-body">
     <div class="profile-source">
      ${E(sourceText)}<br>
      該份資料最後更新：${E(stamp(contactSource.updated))}<br>
      ${E(sourceNote)}
     </div>

     <div class="profile-grid">
      ${fieldHTML("電話", contact.phone)}
      ${fieldHTML("電郵", contact.email)}
      ${fieldHTML("地址", contact.address, true)}
     </div>

     <div class="contact-cards">
      <section class="contact-card">
       <h4>聯絡人 1</h4>
       ${fieldHTML("姓名", contact.contact1Name)}
       ${fieldHTML("電話", contact.contact1Phone)}
      </section>

      <section class="contact-card">
       <h4>聯絡人 2</h4>
       ${fieldHTML("姓名", contact.contact2Name)}
       ${fieldHTML("電話", contact.contact2Phone)}
      </section>
     </div>
    </div>
   </section>

   <section class="profile-section">
    <div class="profile-section-head">
     <h3>主檔更正紀錄</h3>
     <span class="pill">${changes.length} 次修改</span>
    </div>

    <div class="profile-section-body">
     <p class="profile-footnote" style="margin-bottom:14px">
      最新修改排最上。以下只列出已保存的主檔更正，
      不包含尚未更新至主檔的診症內修改；
      此紀錄並非防竄改審計。
     </p>

     <div class="history-list">
      ${changes.length
       ? changes.map(historyHTML).join("")
       : `<div class="profile-no-history">
           暫時未有主檔更正紀錄
          </div>`
      }
     </div>
    </div>
   </section>

  </div>
 `;

 showModal(
  p.mrn + " · 病人主檔及更正紀錄",
  html,
  "masterHistory"
 );
};
</script>
