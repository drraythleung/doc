          <p class="hint tidy-footer-note">
            條件不適用時，補充資料會收起並停止輸出，
            但原始輸入仍然保留；重新選回適用答案即可恢復。
            <br>
            資料只保留於目前頁面，重新整理或關閉頁面會清空。
          </p>
        `;

        $("#tidy-editor-mode").value = tidyEditorMode;

        $("#tidy-editor-mode").addEventListener("change", event => {
          tidyEditorMode =
            event.target.value === "current" ? "current" : "all";

          tidyUpdateEditor(tidyEffectiveState());

          setStatus(
            tidyEditorMode === "all"
              ? "左側已顯示全部共用問題；所有答案保持不變。"
              : `左側只顯示 ${companyName()} 適用問題；` +
                "其他公司的資料仍保留，輸出不受篩選影響。"
          );
        });
      };

      /* =====================================================
         57. 公司篩選及條件顯示
         篩選不參與資料遮罩。
         ===================================================== */

      function tidyItemIsVisible(item, effective) {
        const companies = (
          item.dataset.tidyCompanies || ""
        ).split(/\s+/);

        if (
          tidyEditorMode === "current" &&
          !companies.includes(activeCompany)
        ) {
          return false;
        }

        /*
         * 只檢查條件容器，不讀取 details.open、
         * 舊的 hidden 狀態或畫面尺寸。
         *
         * 避免章節收合後，被誤判為沒有內容。
         */
        let parent = item.parentElement;

        while (parent && parent.id !== "sidebar") {
          if (parent.dataset.tidyRule) {
            const rule = tidyRuleMap.get(parent.dataset.tidyRule);

            if (rule && !rule.when(effective)) {
              return false;
            }
          }

          parent = parent.parentElement;
        }

        return true;
      }

      function tidyUpdateEditor(effective) {
        const sidebar = $("#sidebar");
        if (!sidebar) return;

        sidebar.querySelectorAll("[data-tidy-rule]").forEach(box => {
          const rule = tidyRuleMap.get(box.dataset.tidyRule);
          const visible = Boolean(rule?.when(effective));

          box.hidden = !visible;
          box.setAttribute("aria-hidden", String(!visible));
        });

        sidebar.querySelectorAll(".tidy-item").forEach(item => {
          const companies = (
            item.dataset.tidyCompanies || ""
          ).split(/\s+/);

          item.hidden =
            tidyEditorMode === "current" &&
            !companies.includes(activeCompany);
        });

        /*
         * 只禁用「條件不適用」的欄位。
         * 公司篩選隱藏的欄位不會改動資料。
         */
        const disabledKeys = new Set();

        tidyRules.forEach(rule => {
          if (!rule.when(effective)) {
            rule.keys.forEach(key => disabledKeys.add(key));
          }
        });

        sidebar.querySelectorAll("[data-key]").forEach(control => {
          control.disabled = disabledKeys.has(control.dataset.key);
        });

        /*
         * 小標題及章節若沒有任何可見問題，就一起收起。
         * 不更改使用者原本的 details.open 狀態。
         */
        sidebar.querySelectorAll(".tidy-group").forEach(group => {
          group.hidden = ![
            ...group.querySelectorAll(".tidy-item")
          ].some(item => tidyItemIsVisible(item, effective));
        });

        sidebar.querySelectorAll(".editor-section").forEach(group => {
          group.hidden = ![
            ...group.querySelectorAll(".tidy-item")
          ].some(item => tidyItemIsVisible(item, effective));
        });

        const modeSelect = $("#tidy-editor-mode");

        if (modeSelect) {
          modeSelect.value = tidyEditorMode;

          const currentOption =
            modeSelect.querySelector('option[value="current"]');

          if (currentOption) {
            currentOption.textContent =
              `只顯示目前公司適用問題（${companyName()}）`;
          }
        }

        const help = $("#tidy-mode-help");

        if (help) {
          help.textContent = tidyEditorMode === "all"
            ? "目前顯示全部共用問題；切換右側公司不會改變左側問題清單。"
            : `目前只顯示 ${companyName()} 適用問題。` +
              "";
        }
      }

      /* =====================================================
         58. 輸出：先遮罩所有不適用資料，再執行原有配對
         保留已確認的共用病史及併發症配對。
         ===================================================== */

      getData = function getTidyData() {
        return tidyWithEffectiveState(
          () => tidyLegacyGetData()
        );
      };

      refresh = function refreshTidyEditor() {
        const effective = tidyEffectiveState();
        const data = getData();

        renderValues(data);

        /*
         * 原 renderValues 的日期 filled 狀態讀取 raw state。
         * 這裡改用已遮罩資料，避免隱藏日期仍顯示為已填。
         */
        $$("[data-date]").forEach(element => {
          element.classList.toggle(
            "filled",
            Boolean(String(data[element.dataset.date] ?? "").trim())
          );
        });

        tidyUpdateEditor(effective);

        const factorPreview = $("#tidy-other-preview");

        if (factorPreview) {
          factorPreview.textContent =
            String(data.factorOtherDetails ?? "").trim() ||
            "（未填寫）";
        }

        mlAlignRuledAnswers();
      };

      /* =====================================================
         59. 統一資料檢查
         只檢查目前公司會使用的有效資料。
         已收起的舊答案不再造成矛盾警告。
         ===================================================== */

      validateData = function validateTidyData() {
        const value = tidyEffectiveState();
        const problems = [];

        const read = key => String(value[key] ?? "").trim();

        function checkOrder(startKey, endKey, caption) {
          const start = read(startKey);
          const end = read(endKey);

          if (start && end && end < start) {
            problems.push(`${caption}：結束日期早於開始日期。`);
          }
        }

        checkOrder(
          "admissionFrom",
          "admissionTo",
          "入院／治療日期"
        );

        if (["axa", "manulife"].includes(activeCompany)) {
          const symptom = utcDayNumber(read("symptomDate"));
          const first = utcDayNumber(read("firstConsultation"));

          if (
            symptom !== null &&
            first !== null &&
            first < symptom
          ) {
            problems.push(
              "首次求診日期早於病徵出現／意外發生日期，" +
              "不能計算病徵持續時間。"
            );
          }
        }

        if (activeCompany === "manulife") {
          checkOrder(
            "manulifeICUFrom",
            "manulifeICUTo",
            "ICU 日期"
          );

          const admission = read("admissionFrom");
          const discharge = read("admissionTo");

          [
            ["manulifeICUFrom", "ICU 入住日期"],
            ["manulifeICUTo", "ICU 離開日期"]
          ].forEach(([key, caption]) => {
            const date = read(key);
            if (!date) return;

            if (admission && date < admission) {
              problems.push(`${caption}早於入院日期。`);
            }

            if (discharge && date > discharge) {
              problems.push(`${caption}晚於出院日期。`);
            }
          });

          if (
            value.manulifeFactorsNA === true &&
            value.factorAnswer === "Y"
          ) {
            problems.push(
              "第06節：N/A 不適用與主問題「是」同時選取，請核對。"
            );
          }
        }

        return [...new Set(problems)];
      };

      /*
       * 保留各公司原本的配對提醒，
       * 但讀取有效資料，不因已隱藏的舊答案而誤報。
       */
      function tidyCompanyNotes() {
        return tidyWithEffectiveState(() => {
          let notes = [];

          if (activeCompany === "axa") {
            notes = getAxaNotes();
          } else if (activeCompany === "aia") {
            notes = getAiaNotes();
          } else if (activeCompany === "manulife") {
            notes = getManulifeNotes();
          } else if (
            activeCompany === "bowtie" &&
            text("wardType") === "isolation"
          ) {
            notes.push(
              "Bowtie 原表沒有隔離病房方格；" +
              "病房選項未自動配對，請按需要補註。"
            );
          }

          return [...new Set(notes)];
        });
      }

      /* =====================================================
         60. 公司切換
         預設全部問卷，右側切換不影響左側內容及答案。
         ===================================================== */

      companyName = function tidyCompanyName() {
        return tidyCompanyLabels[activeCompany] || "";
      };

      companyPageCount = function tidyCompanyPageCount() {
        return activeCompany === "bowtie" ? 4 : 1;
      };

      updateCompanyControls = function updateTidyCompanyControls() {
        $$(".company-button").forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.company === activeCompany)
          );
        });

        $("#printButton").textContent = {
          bowtie: "列印 Bowtie 全部 4 頁",
          axa: "列印 AXA 乙部 1 頁",
          aia: "列印 AIA 乙部 1 頁",
          manulife: "列印 Manulife 第二部份 1 頁"
        }[activeCompany];

        $("#checkButton").textContent =
          `檢查 ${companyName()} 版面及資料`;

        const help = $("#companyHelp");

        if (help) {
          help.textContent = {
            bowtie:
              "Bowtie：四頁表格。",
            axa:
              "AXA：乙部一頁；保留原表「4 of 4」頁碼。",
            aia:
              "AIA：乙部一頁；保留原表「Page 4 of 4」頁碼。",
            manulife:
              "Manulife：第二部份一頁；保留原表「4 of 4」頁碼。"
          }[activeCompany];
        }

        document.title =
          `${companyName()} — Medical Claim Form`;
      };

      switchCompany = function switchTidyCompany(
        company,
        announce = true
      ) {
        if (!tidyCompanies.includes(company)) return;

        const target = document.getElementById(
          `company-${company}`
        );

        if (!target) return;

        activeCompany = company;

        $$(".company-document").forEach(element => {
          element.hidden =
            element.id !== `company-${company}`;
        });

        clearHighlights();
        refresh();
        updateCompanyControls();

        if (announce) {
          setStatus(
            `已切換至 ${companyName()}，所有答案保持不變。` +
            `列印只會輸出目前公司的 ${companyPageCount()} 頁。`
          );
        }
      };

      /* =====================================================
         61. 檢查及列印
         沿用第01–52節的各公司 checkOverflow。
         ===================================================== */

      runChecks = async function runTidyChecks() {
        refresh();
        await waitForLayout();

        mlAlignRuledAnswers();

        const problems = [
          ...new Set([
            ...validateData(),
            ...checkOverflow()
          ])
        ];

        const notes = tidyCompanyNotes();

        if (problems.length) {
          setStatus(
            `${companyName()} 需要核對：\n` +
            problems.join("\n") +
            (
              notes.length
                ? "\n\n其他提醒：\n" + notes.join("\n")
                : ""
            ),
            true
          );
        } else {
          setStatus(
            `${companyName()}：未偵測到欄位溢出或上述資料矛盾。` +
            "此檢查不代表所有問題已填妥，" +
            "亦不核實醫療內容、簽署或索償資格。" +
            (
              notes.length
                ? "\n\n提醒：\n" + notes.join("\n")
                : ""
            )
          );
        }

        return problems;
      };

      printAll = async function printTidyCompany() {
        if (preparingPrint) return;

        preparingPrint = true;

        const controls = [
          $("#printButton"),
          $("#checkButton"),
          ...$$(".company-button")
        ];

        controls.forEach(control => {
          control.disabled = true;
        });

        try {
          const problems = await runChecks();

          if (problems.length) {
            alert(
              `未列印 ${companyName()}，請先核對：\n\n` +
              problems.join("\n") +
              "\n\n程式不會自動縮字或截走內容。" +
              "\n如內容太長，請另備補充文件，並在表格註明。"
            );
            return;
          }

          const notes = tidyCompanyNotes();

          if (
            notes.length &&
            !confirm(
              `${companyName()} 列印前請留意：\n\n` +
              notes.join("\n\n") +
              "\n\n是否繼續列印目前公司的表格？"
            )
          ) {
            return;
          }

          setStatus(
            `準備列印 ${companyName()}，共 ${companyPageCount()} 頁。` +
            "請選 A4、100% 比例、無邊界，" +
            "關閉瀏覽器頁首／頁尾。" +
            "如需保留標題底色，請啟用背景圖形。" +
            "請於列印預覽再次確認頁數及文字沒有被裁切。"
          );

          window.print();
        } catch (error) {
          console.error(error);

          setStatus(
            "準備列印失敗，請查看 Console 錯誤訊息。",
            true
          );
        } finally {
          preparingPrint = false;

          controls.forEach(control => {
            control.disabled = false;
          });
        }
      };

      /* =====================================================
         62. 直接初始化四間公司
         不呼叫原本多層 init 包裝鏈。
         所有欄位先登記，再清空／同步一次。
         ===================================================== */

      init = function initTidyForms() {
        activeCompany = "manulife";
        tidyEditorMode = "all";

        buildSidebar();

        $(".brand").innerHTML = `
          Insurance Claim Forms
        `;

        const buttonLabels = {
          bowtie: "Bowtie · 醫療索償",
          axa: "AXA · 住院及手術",
          aia: "AIA · 團體醫療",
          manulife: "Manulife · 住院及手術"
        };

        $(".preview-tools").innerHTML = `
          <div
            class="company-picker"
            role="group"
            aria-label="選擇預覽及列印公司"
          >
            ${tidyCompanies.map(company => `
              <button
                type="button"
                class="company-button"
                data-company="${company}"
                aria-pressed="false"
                aria-controls="company-${company}"
              >
                ${escapeHTML(buttonLabels[company])}
              </button>
            `).join("")}

            <span id="companyHelp" class="company-help"></span>
          </div>
        `;

        $("#preview").innerHTML = `
          <div
            id="company-bowtie"
            class="company-document"
            aria-label="Bowtie 四頁表格"
            hidden
          >
            ${buildPage1()}
            ${buildPage2()}
            ${buildPage3()}
            ${buildPage4()}
          </div>

          <div
            id="company-axa"
            class="company-document"
            aria-label="AXA 乙部表格"
            hidden
          >
            ${buildAxaPage()}
          </div>

          <div
            id="company-aia"
            class="company-document"
            aria-label="AIA 乙部表格"
            hidden
          >
            ${buildAiaPage()}
          </div>

          <div
            id="company-manulife"
            class="company-document"
            aria-label="Manulife 第二部份表格"
            hidden
          >
            ${buildManulifePage()}
          </div>
        `;

        resetState();
        syncInputs();

        /*
         * 原 bindEvents 現在會綁定本段新的：
         * refresh、runChecks、printAll。
         *
         * 原有清空、輸入同步、工具列高度及列印事件保留。
         */
        bindEvents();

        $$(".company-button").forEach(button => {
          button.addEventListener("click", () => {
            if (preparingPrint) return;
            switchCompany(button.dataset.company);
          });
        });

        switchCompany(activeCompany, false);

        setStatus(
          "左側已整理為九節共用問卷。" +
          "先回答主問題，有需要才展開詳情。" +
          "切換公司不會清空答案；列印只輸出目前公司。"
        );

        if (document.fonts?.ready) {
          document.fonts.ready.then(() => {
            mlAlignRuledAnswers();
          });
        }
      };

      init();
    })();
  </script>
</body>
</html>
