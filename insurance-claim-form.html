<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dr Ray's Insurance Claim Form</title>

  <style>
    /* =====================================================
       01. 基本設定
       ===================================================== */

    :root {
      --ui-font: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      --paper-font: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;

      --navy: #243145;
      --teal: #087f8c;

      --paper-ink: #303044;
      --paper-muted: #767d95;
      --paper-border: #bbc0ce;
      --paper-pink: #f0dfdf;
      --bowtie-pink: #d52a65;
      --bowtie-navy: #201b59;

      --toolbar-height: 64px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #203849;
      background: #e9eef3;
      font-family: var(--ui-font);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      padding: 9px 13px;
      border: 1px solid #ccd6de;
      border-radius: 8px;
      color: #294452;
      background: white;
      cursor: pointer;
    }

    button.primary {
      color: white;
      background: var(--teal);
      border-color: var(--teal);
    }

    button.danger {
      color: #ad3347;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid #70bdcf;
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    /* =====================================================
       02. 操作介面
       ===================================================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      min-height: var(--toolbar-height);
      padding: 11px 20px;

      color: white;
      background: var(--navy);
      box-shadow: 0 2px 10px #152c4020;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: #d2dce6;
      font-size: 11px;
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 440px minmax(0, 1fr);
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: var(--toolbar-height);

      max-height: calc(100vh - var(--toolbar-height));
      padding: 16px;
      overflow: auto;
      scrollbar-gutter: stable;

      border-right: 1px solid #d5dfe6;
      background: #f3f7fa;
    }

    .notice {
      margin-bottom: 14px;
      padding: 12px;

      border: 1px solid #e7d3a6;
      border-radius: 9px;

      color: #775c28;
      background: #fff9ed;

      font-size: 12px;
      line-height: 1.65;
    }

    .editor-heading {
      margin-bottom: 14px;
      padding: 15px;
      border: 1px solid #e3ced6;
      border-radius: 12px;
      background: #fff4f7;
    }

    .editor-heading strong {
      display: block;
      color: #9e3159;
      font-size: 18px;
    }

    .editor-heading p {
      margin: 7px 0 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .editor-section {
      margin-bottom: 12px;
      overflow: hidden;

      border: 1px solid #d7e2e9;
      border-radius: 11px;
      background: white;
    }

    .editor-section > summary {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 13px;
      list-style: none;
      cursor: pointer;
    }

    .editor-section > summary::-webkit-details-marker {
      display: none;
    }

    .editor-section > summary::after {
      content: "+";
      margin-left: auto;
      color: #6b8392;
      font-size: 20px;
    }

    .editor-section[open] > summary {
      border-bottom: 1px solid #e4ebf0;
      background: #f8fbfc;
    }

    .editor-section[open] > summary::after {
      content: "−";
    }

    .step {
      display: grid;
      flex: 0 0 28px;
      place-items: center;

      width: 28px;
      height: 28px;

      border-radius: 8px;
      color: #8d3757;
      background: #f5e8ed;

      font-size: 12px;
      font-weight: 700;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
    }

    .section-subtitle {
      display: block;
      margin-top: 4px;
      color: #738793;
      font-size: 11px;
      font-weight: 400;
    }

    .section-body {
      padding: 14px;
    }

    .field {
      display: block;
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #2d4b5b;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .field-label small,
    .choice legend small {
      display: block;
      margin-top: 3px;
      color: #768995;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
    }

    .field input,
    .field textarea,
    .field select {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 40px;

      padding: 9px 10px;
      border: 1px solid #cbd8e1;
      border-radius: 8px;

      color: #173344;
      background: #fcfdff;

      font-size: 14px;
      line-height: 1.45;
    }

    .field textarea {
      min-height: 0;
      resize: vertical;
    }

    .two {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .hint {
      margin: 0 0 13px;
      color: #6c818e;
      font-size: 12px;
      line-height: 1.65;
    }

    .subheading {
      margin: 17px 0 12px;
      padding-top: 12px;
      border-top: 1px solid #e4ecf1;
      color: #426172;
      font-size: 12px;
      font-weight: 700;
    }

    .choice {
      min-width: 0;
      margin: 0 0 15px;
      padding: 0;
      border: 0;
    }

    .choice legend {
      width: 100%;
      margin-bottom: 8px;
      padding: 0;

      color: #2d4b5b;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .choice-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .choice-option {
      position: relative;
      cursor: pointer;
    }

    .choice-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      overflow: hidden;
      clip-path: inset(50%);
    }

    .choice-option span {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 39px;
      padding: 7px 4px;

      border: 1px solid #d3dfe7;
      border-radius: 8px;

      color: #627987;
      background: white;

      font-size: 12px;
      text-align: center;
    }

    .choice-option input:checked + span {
      border-color: var(--teal);
      color: #096774;
      background: #e9f6f5;
      font-weight: 700;
    }

    .choice-option input:focus-visible + span {
      outline: 3px solid #70bdcf;
      outline-offset: 2px;
    }

    .check-list {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .check-input {
      display: flex;
      align-items: flex-start;
      gap: 8px;

      padding: 10px;
      border: 1px solid #dbe5ec;
      border-radius: 8px;

      background: #fbfdfe;
      cursor: pointer;

      font-size: 12px;
      line-height: 1.45;
    }

    .check-input input {
      flex: 0 0 auto;
      margin: 3px 0 0;
      accent-color: var(--teal);
    }

    .check-input small {
      display: block;
      margin-top: 3px;
      color: #738793;
      font-size: 11px;
    }

    .followup {
      margin-bottom: 14px;
      padding: 12px;

      border-left: 3px solid #afccd4;
      border-radius: 0 8px 8px 0;
      background: #f4f9fb;
    }

    .followup.conflict {
      border-color: #d99532;
      background: #fff7e8;
    }

    .followup-warning {
      margin: 0 0 12px;
      color: #915c18;
      font-size: 12px;
      line-height: 1.6;
    }

    .preview-area {
      min-width: 0;
    }

    .preview-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 13px 20px;
      border-bottom: 1px solid #d7e1e8;
      background: #f8fafc;
    }

    .page-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preview-caption {
      color: #687d8a;
      font-size: 12px;
    }

    .status {
      min-height: 36px;
      padding: 9px 20px;

      color: #5a7282;
      background: #edf3f7;

      font-size: 12px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .status.error {
      color: #a02b3a;
      background: #fff0f0;
    }

    .preview-scroll {
      padding: 22px;
      overflow: auto;
    }

    /* =====================================================
       03. A4 紙張及共用元件
       所有紙張樣式均限制於 .page 內。
       ===================================================== */

    .page {
      position: relative;

      width: 210mm;
      height: 297mm;

      margin: 0 auto 24px;
      padding: 10mm;

      color: var(--paper-ink);
      background: white;
      box-shadow: 0 4px 22px #20394d25;

      font-family: var(--paper-font);
      font-size: 8.4pt;
      line-height: 1.28;

      scroll-margin-top: 78px;
    }

    .page .paper-content {
      width: 100%;
      display: flow-root;
    }

    .page .paper-footer {
      position: absolute;
      left: 10mm;
      right: 10mm;
      bottom: 9mm;

      display: flex;
      justify-content: space-between;

      color: var(--paper-muted);
      font-size: 8.5pt;
      line-height: 1;
    }

    .page .part-bar {
      display: flex;
      align-items: center;

      height: 12mm;
      padding: 2mm 3mm;

      background: var(--paper-pink);
      font-size: 8.7pt;
      font-weight: 700;
      line-height: 1.35;
    }

    .page .cn,
    .page .en {
      display: block;
    }

    .page .paper-label {
      font-size: 8.5pt;
      font-weight: 700;
      line-height: 1.3;
    }

    .page .paper-label .en {
      margin-top: .25mm;
    }

    .page .v {
      display: block;
      min-width: 0;

      color: var(--paper-ink);
      font-size: 9pt;
      font-weight: 400;
      font-style: normal;
      line-height: 1.3;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: hidden;
    }

    .page .answer {
      display: flex;
      flex-direction: column;
      justify-content: center;

      min-width: 0;
      min-height: 0;
      padding: 2.5mm 3mm;
    }

    .page .answer > .v {
      width: 100%;
      max-height: 100%;
    }

    .page .answer.top {
      justify-content: flex-start;
    }

    .page .tick {
      position: relative;
      display: inline-block;
      flex: 0 0 2.7mm;

      width: 2.7mm;
      height: 2.7mm;

      border: .22mm solid var(--paper-ink);
      border-radius: .15mm;
      vertical-align: -.35mm;
    }

    .page .tick.checked::after {
      content: "✓";
      position: absolute;
      top: -1.05mm;
      left: -.1mm;

      color: var(--paper-ink);
      font-family: Arial, sans-serif;
      font-size: 11pt;
      font-weight: 700;
      line-height: 1;
    }

    .page .paper-option {
      display: flex;
      align-items: center;
      gap: 2mm;

      min-width: 0;
      font-size: 8.4pt;
      line-height: 1.3;
    }

    .page .paper-option > span:last-child {
      min-width: 0;
    }

    .page .paper-option .en {
      margin-top: .3mm;
    }

    .page .yes-option,
    .page .no-option {
      font-weight: 700;
    }

    .page .date-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
      gap: 2mm;

      width: 100%;
      height: 7mm;
      padding-bottom: .7mm;

      border-bottom: .18mm solid var(--paper-border);
    }

    .page .date-box .v {
      color: var(--paper-muted);
      font-size: 8.5pt;
      line-height: 1.15;
      white-space: nowrap;
    }

    .page .date-box.filled .v {
      color: var(--paper-ink);
    }

    .page .date-box .v:nth-child(2) {
      text-align: center;
    }

    .page .date-box .v:last-child {
      text-align: center;
    }

    .page .blank-rule {
      display: block;
      height: 6mm;
      border-bottom: .18mm solid var(--paper-border);
    }

    .page .ruled-value {
      display: flex;
      align-items: flex-end;
      min-width: 0;
      min-height: 7mm;
      padding-bottom: .5mm;
      border-bottom: .18mm solid var(--paper-border);
    }

    .page .ruled-value > .v {
      width: 100%;
      max-height: 100%;
    }

    .page .line-pair {
      display: grid;
      grid-template-columns: 43% minmax(0, 1fr);
      align-items: end;
      gap: 2mm;
      min-width: 0;
    }

    .page .line-pair > .paper-label {
      font-weight: 400;
      font-size: 8.2pt;
    }

    .page .line-pair > .ruled-value {
      height: 100%;
    }

    .page .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;

      min-width: 0;
      border: .18mm solid var(--paper-border);
    }

    .page .split-row > * {
      min-width: 0;
      min-height: 0;
    }

    .page .split-row > :first-child {
      border-right: .18mm solid var(--paper-border);
    }

    .page .question-cell {
      display: flex;
      align-items: flex-start;
      padding: 2.6mm 3mm;
    }

    .page .question-cell .paper-label {
      width: 100%;
    }

    .page .paper-box {
      border: .18mm solid var(--paper-border);
    }

    .page .over-limit {
      outline: 2px solid #d72b49 !important;
      outline-offset: -1px;
      background-color: #fff0f0 !important;
    }

    /* =====================================================
       04. 第 1 頁
       ===================================================== */

    .page .claim-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3mm;
      height: 12mm;
    }

    .page .claim-heading h1 {
      margin: 0;
      color: var(--bowtie-pink);
      font-size: 17pt;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }

    .page .bowtie-logo {
      display: flex;
      align-items: center;
      gap: 1mm;
      flex: 0 0 auto;
    }

    .page .bowtie-logo svg {
      width: 14mm;
      height: 9mm;
      overflow: visible;
    }

    .page .bowtie-word {
      color: var(--bowtie-navy);
      font-family: Arial, sans-serif;
      font-size: 29pt;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1.1pt;
    }

    .page .claim-intro {
      height: 10mm;
      padding-top: 1.5mm;
      font-size: 8.2pt;
      line-height: 1.4;
    }

    .page .policy-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      gap: 8mm;
      height: 16mm;
      margin-bottom: 5mm;
    }

    .page .policy-box {
      display: flex;
      align-items: flex-end;
      gap: 2mm;
      padding: 2mm 3mm;
      border: .18mm solid #edb4c8;
    }

    .page .policy-box .paper-label {
      flex: 0 0 auto;
    }

    .page .policy-box .ruled-value {
      flex: 1;
      height: 8mm;
    }

    .page .qr-area {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3mm;
    }

    .page .qr-caption {
      text-align: right;
      font-size: 8.3pt;
      line-height: 1.4;
    }

    .page .qr-placeholder {
      display: grid;
      flex: 0 0 14mm;
      place-items: center;

      width: 14mm;
      height: 14mm;

      border: .18mm dashed #c6c8d1;
      color: #9296a7;

      font-size: 6pt;
      text-align: center;
      line-height: 1.25;
    }

    .page .authorization {
      height: 57mm;
      padding-top: 3mm;
    }

    .page .authorization p {
      margin: 0 0 2mm;
      font-size: 8.2pt;
      line-height: 1.4;
    }

    .page .authorization .auth-cn {
      font-size: 8.1pt;
      line-height: 1.45;
    }

    .page .authorization .auth-note {
      margin-bottom: 0;
      font-size: 7.8pt;
      line-height: 1.35;
    }

    .page .authorization-sign {
      display: grid;
      grid-template-columns: 1.12fr .86fr .86fr .78fr;
      align-items: end;
      gap: 3mm;

      height: 14mm;
      padding: 2mm 3mm;

      border: .18mm solid var(--paper-border);
    }

    .page .authorization-sign + .authorization-sign {
      margin-top: 1.5mm;
    }

    .page .authorization-sign .paper-label {
      font-size: 7.8pt;
      font-weight: 400;
    }

    .page .authorization-sign .blank-rule {
  border-bottom: none;
    }

    .page .part2-bar {
      margin-top: 3.5mm;
      margin-bottom: 1.5mm;
    }

    .page .patient-name-row {
      height: 14mm;
      margin-bottom: 1.5mm;
    }

    .page .stack-field {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      min-width: 0;
      min-height: 0;
      padding: 1.5mm 3mm;
    }

    .page .stack-field > .v {
      height: 5.5mm;
    }

    .page .clinic-row {
      height: 14mm;
      margin-bottom: 1.5mm;
    }

    .page .admission-row {
      display: grid;
      grid-template-columns: 32% 1fr 8mm 1fr;
      align-items: center;
      gap: 3mm;

      height: 14mm;
      margin-bottom: 1.5mm;
      padding: 1.5mm 3mm;
    }

    .page .admission-row .to {
      text-align: center;
      font-size: 8pt;
      font-weight: 700;
    }

    .page .ward-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2mm;

      height: 14mm;
      margin-bottom: 1.5mm;
      padding: 1.5mm 3mm;
    }

    .page .ward-row .paper-option {
      gap: 1.4mm;
      font-size: 7.9pt;
    }

    .page .ward-other {
      width: 23mm;
    }

    .page .ward-other .ruled-value {
      height: 4mm;
      min-height: 4mm;
      margin-left: 4mm;
    }

    .page .ward-other .v {
      font-size: 7.5pt;
    }

    .page .usual-row {
      height: 26mm;
    }

    .page .usual-row .question-cell {
      align-items: flex-start;
      padding-top: 3mm;
    }

    .page .usual-answer {
      padding: 3mm;
    }

    .page .usual-yes {
      display: grid;
      grid-template-columns: 29mm 1fr;
      align-items: center;
      gap: 3mm;
      margin-bottom: 3mm;
    }

    /* =====================================================
       05. 第 2 頁
       ===================================================== */

    .page .p2-group {
      margin-bottom: 1.5mm;
    }

    .page .p2-group:last-child {
      margin-bottom: 0;
    }

    .page .p2-group .split-row + .split-row {
      border-top: 0;
    }

    .page .h18 { height: 18mm; }
    .page .h14 { height: 14mm; }
    .page .h28 { height: 28mm; }
    .page .h35 { height: 35mm; }
    .page .h32 { height: 32mm; }

    .page .p2-date {
      justify-content: flex-end;
      padding-bottom: 5mm;
    }

    .page .p2-date .date-box {
      width: 88%;
    }

    /* =====================================================
       06. 第 3 頁
       ===================================================== */

    .page .previous-row {
      height: 87mm;
      margin-bottom: 1.8mm;
    }

    .page .previous-row .question-cell {
      align-items: flex-start;
      padding-top: 3mm;
    }

    .page .previous-answer {
      display: flex;
      flex-direction: column;
      padding: 3mm;
    }

    .page .previous-fields {
      display: grid;
      gap: 3mm;
      margin-top: 2.5mm;
      margin-left: 5mm;
    }

    .page .previous-fields .line-pair:nth-child(1) {
      height: 11mm;
    }

    .page .previous-fields .line-pair:nth-child(2) {
      height: 11mm;
    }

    .page .previous-fields .line-pair:nth-child(3) {
      height: 14mm;
    }

    .page .previous-fields .line-pair:nth-child(4) {
      height: 16mm;
    }

    .page .previous-answer > .no-option {
      margin-top: auto;
    }

    .page .factor-box {
      position: relative;
      height: 135mm;
      padding: 3mm;
    }

    .page .factor-box > .paper-label {
      margin-bottom: 3mm;
    }

    .page .factor-box > .yes-option {
      margin-bottom: 3.5mm;
    }

    .page .factor-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 7mm;
      padding-left: 5mm;
    }

    .page .factor-left,
    .page .factor-right {
      min-width: 0;
    }

    .page .factor-left {
      display: grid;
      grid-template-rows: 16mm 12mm 12mm 14mm 17mm 12mm;
      align-items: start;

    /* =====================================================

/* =====================================================

<body>
  <header class="topbar">
    <div class="brand">
      Bowtie — Medical Claim Form
      <small>Part 2 / Part 3 填寫工具 · 四頁 HTML 重排版</small>
    </div>

    <div class="actions">
      <button id="clearButton" type="button" class="danger">
        清空全部資料
      </button>

      <button id="checkButton" type="button">
        檢查版面及資料
      </button>

      <button id="printButton" type="button" class="primary">
        列印全部 4 頁
      </button>
    </div>
  </header>

<div class="layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="preview-area">
      <div class="preview-tools">
        <span class="preview-caption">
          表格預覽 · 左側共用資料即時同步至對應欄位
        </span>
      </div>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        左側輸入會同步至右側。Part 1 及醫生簽署位置保留手寫。
      </div>

      <div id="preview" class="preview-scroll"></div>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      /* =====================================================
         01. 工具及狀態
         ===================================================== */

      const $ = selector => document.querySelector(selector);
      const $$ = selector => [...document.querySelectorAll(selector)];

      // 僅儲存使用者輸入，不儲存衍生日期或格式化文字。
      const state = {};

      // 左側欄位建立時統一登記。
      const fieldDefinitions = new Map();

      let preparingPrint = false;

      function escapeHTML(value) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return String(value ?? "").replace(
          /[&<>"']/g,
          character => entities[character]
        );
      }

      function registerField(key, label, type = "text") {
        if (!fieldDefinitions.has(key)) {
          fieldDefinitions.set(key, { key, label, type });
        }
      }

      function text(key) {
        return String(state[key] ?? "").trim();
      }

      function hasValue(key) {
        return typeof state[key] === "boolean"
          ? state[key]
          : Boolean(text(key));
      }

      function setStatus(message, error = false) {
        $("#status").textContent = message;
        $("#status").classList.toggle("error", error);
      }

      function clearHighlights() {
        $$(".over-limit").forEach(element => {
          element.classList.remove("over-limit");
        });
      }

      /* =====================================================
         02. 左側輸入元件
         ===================================================== */

      function fieldLabel(chinese, english = "") {
        return `
          ${escapeHTML(chinese)}
          ${english ? `<small>${escapeHTML(english)}</small>` : ""}
        `;
      }

      function inputField(key, chinese, english = "", type = "text") {
        registerField(key, chinese, type);

        return `
          <label class="field">
            <span class="field-label">
              ${fieldLabel(chinese, english)}
            </span>

            <input
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
              type="${escapeHTML(type)}"
              autocomplete="off"
              spellcheck="false"
            >
          </label>
        `;
      }

      function textField(key, chinese, english = "", rows = 2) {
        registerField(key, chinese, "textarea");

        return `
          <label class="field">
            <span class="field-label">
              ${fieldLabel(chinese, english)}
            </span>

            <textarea
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
              rows="${rows}"
              autocomplete="off"
              spellcheck="false"
            ></textarea>
          </label>
        `;
      }

      function selectField(key, chinese, english, options) {
        registerField(key, chinese, "select");

        return `
          <label class="field">
            <span class="field-label">
              ${fieldLabel(chinese, english)}
            </span>

            <select
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
            >
              <option value="">未填寫</option>

              ${options.map(([value, label]) => `
                <option value="${escapeHTML(value)}">
                  ${escapeHTML(label)}
                </option>
              `).join("")}
            </select>
          </label>
        `;
      }

      function yesNoField(key, chinese, english = "") {
        registerField(key, chinese, "radio");

        const options = [
          ["", "未回答"],
          ["N", "否 No"],
          ["Y", "是 Yes"]
        ];

        return `
          <fieldset class="choice">
            <legend>${fieldLabel(chinese, english)}</legend>

            <div class="choice-options">
              ${options.map(([value, label]) => `
                <label class="choice-option">
                  <input
                    type="radio"
                    name="${escapeHTML(key)}"
                    data-key="${escapeHTML(key)}"
                    value="${escapeHTML(value)}"
                    ${value === "" ? "checked" : ""}
                  >
                  <span>${escapeHTML(label)}</span>
                </label>
              `).join("")}
            </div>
          </fieldset>
        `;
      }

      function checkField(key, chinese, english = "") {
        registerField(key, chinese, "checkbox");

        return `
          <label class="check-input">
            <input
              type="checkbox"
              id="field-${escapeHTML(key)}"
              data-key="${escapeHTML(key)}"
            >

            <span>
              ${escapeHTML(chinese)}
              ${english ? `<small>${escapeHTML(english)}</small>` : ""}
            </span>
          </label>
        `;
      }

      function section(step, title, subtitle, content, open = true) {
        return `
          <details class="editor-section" ${open ? "open" : ""}>
            <summary>
              <span class="step">${step}</span>

              <span class="section-title">
                ${title}
                <span class="section-subtitle">${subtitle}</span>
              </span>
            </summary>

            <div class="section-body">${content}</div>
          </details>
        `;
      }

      function followup(answerKey, detailKeys, content) {
        return `
          <div
            class="followup"
            data-followup="${escapeHTML(answerKey)}"
            data-detail-keys="${escapeHTML(detailKeys.join(" "))}"
            hidden
          >
            <p class="followup-warning" hidden>
              主問題不是「是」，但仍有補充資料。
              資料會保留並顯示，請核對後再列印。
            </p>

            ${content}
          </div>
        `;
      }

      /* =====================================================
         03. 選項及一致性檢查設定
         ===================================================== */

      const factorOptions = [
        [
          "factorDrugs",
          "依賴或過量服用藥物／酒精／毒品",
          ""
        ],
        [
          "factorPregnancy",
          "懷孕／分娩／墮胎／流產",
          ""
        ],
        [
          "factorBirthControl",
          "節育／恢復生育／絕育／變形／不育／性機能失常",
          ""
        ],
        [
          "factorCosmetic",
          "美容／整容",
          ""
        ],
        [
          "factorVision",
          "矯正視力／屈光不正",
          ""
        ],
        [
          "factorSTD",
          "性病／經由性接觸傳染的疾病",
          ""
        ],
        [
          "factorHIV",
          "人體免疫力缺乏病毒",
          ""
        ],

        [
          "factorSelfInjury",
          "自殺／自殘身體",
          ""
        ],
        [
          "factorCongenital",
          "先天性疾病",
          ""
        ],
        [
          "factorOther",
          "其他",
          ""
        ]
      ];

      const historyOptions = [
        ["historyCardiac", "心臟病", ""],
        ["historyDiabetes", "糖尿病", ""],
        ["historyOperation", "曾接受手術", ""],
        ["historySmoking", "吸煙習慣", ""],
        ["historyHypertension", "高血壓", ""],
        ["historyHepatitis", "乙型肝炎", ""],
        ["historyDrugs", "濫用藥物", ""],
        ["historyDrinking", "飲酒習慣", ""],
        [
          "historyOther",
          "其他嚴重、慢性或先天性疾病",
          ""
        ]
      ];

      const previousDetailKeys = [
        "previousConsultation",
        "previousDisease",
        "previousProvider",
        "previousTreatment"
      ];

      const factorDetailKeys = [
        ...factorOptions.map(([key]) => key),
        "congenitalDisease",
        "congenitalManifestation",
        "congenitalDiagnosis",
        "factorOtherDetails"
      ];

      const historyDetailKeys = [
        ...historyOptions.map(([key]) => key),
        "historyDetails",
        "historyDiagnosis",
        "historyPhysician",
        "historyCondition",
        "habitSince"
      ];

      const consistencyGroups = [
        ["usualDoctor", ["usualSince"], "第 1 題"],
        ["previousTreatmentAnswer", previousDetailKeys, "第 10 題"],
        ["factorAnswer", factorDetailKeys, "第 11 題"],
        ["historyAnswer", historyDetailKeys, "第 12 題"]
      ];

      /* =====================================================
         04. 建立左側
         ===================================================== */

      function buildSidebar() {
        const patient = `

          ${inputField(
            "patientName",
            "病人姓名",
            ""
          )}

          ${inputField(
            "patientId",
            "病人身份證號碼",
            ""
          )}

          ${inputField(
            "hospitalClinic",
            "醫院／診所名稱",
            ""
          )}

          <div class="two">
            ${inputField(
              "admissionFrom",
              "入院／治療開始日期",
              "",
              "date"
            )}

            ${inputField(
              "admissionTo",
              "出院／治療結束日期",
              "",
              "date"
            )}
          </div>

          ${selectField(
            "wardType",
            "病房級別",
            "",
            [
              ["private", "私家房 Private"],
              ["semi", "半私家房 Semi-Private"],
              ["ward", "標準房 Ward"],
              ["icu", "深切治療病房 ICU"],
              ["outpatient", "門診／日間手術"],
              ["other", "其他 Others"]
            ]
          )}

          ${inputField(
            "wardOther",
            "其他病房／服務類別",
            ""
          )}
        `;

        const clinical = `
          ${yesNoField(
            "usualDoctor",
            "你是否病人的慣常醫生？",
            ""
          )}

      function bilingual(chinese, english, className = "paper-label") {
        return `
          <div class="${className}">
            <span class="cn">${escapeHTML(chinese)}</span>
            <span class="en">${escapeHTML(english)}</span>
          </div>
        `;
      }

      function bind(key, className = "") {
        return `
          <span class="v ${className}" data-bind="${escapeHTML(key)}"></span>
        `;
      }

      function mark(key, value = "true") {
        return `
          <span
            class="tick"
            data-mark="${escapeHTML(key)}"
            data-equals="${escapeHTML(value)}"
            aria-hidden="true"
          ></span>
        `;
      }

      function paperOption(key, value, chinese, english, className = "") {
        return `
          <div class="paper-option ${className}">
            ${mark(key, value)}

            <span>
              <span class="cn">${escapeHTML(chinese)}</span>
              <span class="en">${escapeHTML(english)}</span>
            </span>
          </div>
        `;
      }

      function factorOption(key) {
        const [, chinese, english] = factorOptions.find(
          item => item[0] === key
        );

        return paperOption(
          key,
          "true",
          chinese,
          english,
          key === "factorBirthControl" ? "birth-option" : ""
        );
      }

      function historyOption(key) {
        const [, chinese, english] = historyOptions.find(
          item => item[0] === key
        );

        return paperOption(key, "true", chinese, english);
      }

function dateBox(key) {
  return `
    <div class="date-box" data-date="${escapeHTML(key)}">
      ${bind(key + "_dd")}

      <span class="date-separator" aria-hidden="true">/</span>

      ${bind(key + "_mm")}

      <span class="date-separator" aria-hidden="true">/</span>

      ${bind(key + "_yyyy")}
    </div>
  `;
}

function emptyDateBox() {
  return `
    <div class="date-box">
      <span class="v">DD</span>

      <span class="date-separator" aria-hidden="true">/</span>

      <span class="v">MM</span>

      <span class="date-separator" aria-hidden="true">/</span>

      <span class="v">YYYY</span>
    </div>
  `;
}

      function ruledValue(key) {
        return `<div class="ruled-value">${bind(key)}</div>`;
      }

      function linePair(chinese, english, key, isDate = false, className = "") {
        return `
          <div class="line-pair ${className}">
            ${bilingual(chinese, english)}
            ${isDate ? dateBox(key) : ruledValue(key)}
          </div>
        `;
      }

      function questionRow(chinese, english, key, height, isDate = false) {
        return `
          <div class="split-row h${height}">
            <div class="question-cell">
              ${bilingual(chinese, english)}
            </div>

            <div class="answer ${isDate ? "p2-date" : "top"}">
              ${isDate ? dateBox(key) : bind(key)}
            </div>
          </div>
        `;
      }

        return `
          <article
            id="page-${number}"

function getData() {
  const data = { ...state };

  // state 保留完整 ISO 日期：YYYY-MM-DD。
  // 預覽另外產生日、月、四位年份。
  fieldDefinitions.forEach(definition => {
    if (definition.type !== "date") return;

    const key = definition.key;

    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(
      text(key)
    );

    data[key + "_dd"] = match ? match[3] : "DD";
    data[key + "_mm"] = match ? match[2] : "MM";
    data[key + "_yyyy"] = match ? match[1] : "YYYY";
  });

  return data;
}

      function syncInputs() {
        $$("#sidebar [data-key]").forEach(control => {
          const key = control.dataset.key;

          if (control.type === "checkbox") {
            control.checked = Boolean(state[key]);
            return;
          }

          if (control.type === "radio") {
            control.checked = control.value === String(state[key] ?? "");
            return;
          }

          const value = String(state[key] ?? "");

          if (control.value !== value) {
            control.value = value;
          }
        });
      }

      function renderValues(data) {
        $$("[data-bind]").forEach(element => {
          element.textContent = String(data[element.dataset.bind] ?? "");
        });

        $$("[data-mark]").forEach(element => {
          const checked =
            String(data[element.dataset.mark] ?? "") ===
            element.dataset.equals;

          element.classList.toggle("checked", checked);
        });

        $$("[data-date]").forEach(element => {
          element.classList.toggle(
            "filled",
            Boolean(text(element.dataset.date))
          );
        });
      }

      function updateFollowups() {
        $$("[data-followup]").forEach(element => {
          const answer = text(element.dataset.followup);
          const keys = element.dataset.detailKeys.split(/\s+/);
          const hasDetails = keys.some(hasValue);
          const conflict = hasDetails && answer !== "Y";

          element.hidden = answer !== "Y" && !hasDetails;
          element.classList.toggle("conflict", conflict);

          element.querySelector(".followup-warning").hidden = !conflict;
        });
      }

      function refresh() {
        renderValues(getData());
        updateFollowups();
      }

      /* =====================================================
         11. 內容及版面檢查
         不判斷醫療內容，只檢查明顯欄位矛盾及截字風險。
         ===================================================== */

      function validateData() {
        const problems = [];

        consistencyGroups.forEach(([answerKey, detailKeys, caption]) => {
          const hasDetails = detailKeys.some(hasValue);
          const answer = text(answerKey);

          if (hasDetails && answer !== "Y") {
            problems.push(
              `${caption}：已有補充內容或已勾選項目，` +
              (answer === "N"
                ? "但主問題選了「否」。"
                : "但主問題尚未回答。")
            );
          }
        });

        if (text("wardOther") && text("wardType") !== "other") {
          problems.push(
            "病房級別：已填「其他」說明，但未選擇「其他」。"
          );
        }

        const congenitalDetails = [
          "congenitalDisease",
          "congenitalManifestation",
          "congenitalDiagnosis"
        ].some(hasValue);

        if (congenitalDetails && !state.factorCongenital) {
          problems.push(
            "第 11 題：已填先天性疾病資料，但未勾選「先天性疾病」。"
          );
        }

        if (text("factorOtherDetails") && !state.factorOther) {
          problems.push(
            "第 11 題：已填其他因素詳情，但未勾選「其他」。"
          );
        }

        if (
          text("habitSince") &&
          !state.historySmoking &&
          !state.historyDrinking
        ) {
          problems.push(
            "第 12 題：已填習慣開始日期，但未勾選吸煙或飲酒。"
          );
        }

        if (
          text("admissionFrom") &&
          text("admissionTo") &&
          text("admissionTo") < text("admissionFrom")
        ) {
          problems.push(
            "入院／治療日期：結束日期早於開始日期，請核對。"
          );
        }

        return problems;
      }

function getFieldCaption(bindingKey) {
  const key = bindingKey.replace(/_(dd|mm|yyyy|yy)$/, "");

  return fieldDefinitions.get(key)?.label || key;
}

      function checkOverflow() {
        clearHighlights();

        const problems = [];
        const tolerance = 1.5;

        $$(".page").forEach((paper, index) => {
          const pageNumber = index + 1;
          const issueElements = new Set();

          function flag(element, description) {
            if (issueElements.has(element)) return;
            issueElements.add(element);
            element.classList.add("over-limit");
            problems.push(`第 ${pageNumber} 頁：${description}`);
          }

          // 檢查每個使用者輸出欄位。
          paper.querySelectorAll("[data-bind]").forEach(element => {
            if (!element.textContent.trim()) return;

            let overflow =
              element.scrollHeight > element.clientHeight + tolerance ||
              element.scrollWidth > element.clientWidth + tolerance;

            const parent = element.parentElement;

            if (parent) {
              const rect = element.getBoundingClientRect();
              const parentRect = parent.getBoundingClientRect();
              const parentStyle = getComputedStyle(parent);

              const paddingBottom =
                parseFloat(parentStyle.paddingBottom) || 0;

              const paddingRight =
                parseFloat(parentStyle.paddingRight) || 0;

              if (
                rect.bottom > parentRect.bottom - paddingBottom + tolerance ||
                rect.right > parentRect.right - paddingRight + tolerance
              ) {
                overflow = true;
              }
            }

            if (overflow) {
              flag(
                element,
                `${getFieldCaption(element.dataset.bind)}超出欄位空間`
              );
            }
          });

          // 固定文字可能因作業系統字型不同而超出格線。
          const fixedContainers = paper.querySelectorAll(
            ".authorization, .part-bar, .question-cell, " +
            ".stack-field, .ward-row, .usual-answer, " +
            ".previous-answer, .factor-box, .history-box, " +
            ".physician-declaration, .signature-cell"
          );

          fixedContainers.forEach(element => {
            if (
              element.scrollHeight > element.clientHeight + tolerance ||
              element.scrollWidth > element.clientWidth + tolerance
            ) {
              flag(element, "固定版面／文字超出空間，請核對紅框");
            }
          });

          // 固定高度容器內部的內容不可撞到最下方的 No。
          [".factor-box", ".history-box"].forEach(selector => {
            const box = paper.querySelector(selector);
            if (!box) return;

            const noOption = box.querySelector(":scope > .no-option");
            if (!noOption) return;

            const limit = noOption.getBoundingClientRect().top;

            [...box.children].forEach(child => {
              if (child === noOption) return;

              if (child.getBoundingClientRect().bottom > limit - 2) {
                flag(child, "內容與下方「No」選項重疊");
              }
            });
          });

          const content = paper.querySelector(".paper-content");
          const footer = paper.querySelector(".paper-footer");

          const paperRect = paper.getBoundingClientRect();
          const contentRect = content.getBoundingClientRect();
          const footerRect = footer.getBoundingClientRect();

          const pxPerMm = paperRect.height / 297;
          const allowedBottom = footerRect.top - 3 * pxPerMm;

          if (contentRect.bottom > allowedBottom + tolerance) {
            flag(content, "整頁內容侵入頁尾預留區域");
          }
        });

        return [...new Set(problems)];
      }

      async function waitForLayout() {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }

        await new Promise(resolve => {
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          });
        });
      }

      async function runChecks() {
        refresh();
        await waitForLayout();

        const problems = [
          ...validateData(),
          ...checkOverflow()
        ];

        if (problems.length) {
          setStatus(
            "需要核對：\n" + problems.join("\n"),
            true
          );
        } else {
          setStatus(
            "未偵測到欄位溢出或上述資料矛盾。" +
            "此檢查不代表所有題目已填妥，亦不核實醫療內容、簽署或索償資格。"
          );
        }

        return problems;
      }

      async function printAll() {
        if (preparingPrint) return;

        preparingPrint = true;
        $("#printButton").disabled = true;

        try {
          const problems = await runChecks();

          if (problems.length) {
            alert(
              "未列印，請先核對以下問題：\n\n" +
              problems.join("\n") +
              "\n\n程式不會自動縮字或截走內容。" +
              "\n如內容太長，請另備補充文件，並在表格註明。"
            );
            return;
          }

          setStatus(
            "請於列印預覽選擇 A4、100% 比例、無邊界，" +
            "關閉瀏覽器頁首／頁尾，並確認共 4 頁。" +
            "需要淡粉紅標題時請啟用背景圖形。"
          );

          window.print();
        } catch (error) {
          console.error(error);
          setStatus("準備列印失敗，請重新檢查頁面。", true);
        } finally {
          preparingPrint = false;
          $("#printButton").disabled = false;
        }
      }

         12. 清空、事件及初始化
         ===================================================== */

      function resetState() {
        fieldDefinitions.forEach(definition => {
          state[definition.key] =
            definition.type === "checkbox" ? false : "";
        });
      }

      function clearAll() {
        if (!confirm(
          "確定清空所有病人、病歷、選項及醫生資料？"
        )) {
          return;
        }

        resetState();
        syncInputs();
        clearHighlights();
        refresh();

        setStatus("已清空所有輸入及勾選，日期亦已清空。");
      }

      function bindEvents() {
        function handleChange(event) {
          const control = event.target;

          if (!control.matches("[data-key]")) return;

          if (control.type === "radio" && !control.checked) return;

          const key = control.dataset.key;
          const value = control.type === "checkbox"
            ? control.checked
            : control.value;

          if (state[key] === value) return;

          state[key] = value;

          clearHighlights();
          refresh();

          setStatus(
            "已更新預覽。列印前請檢查四頁內容；" +
            "過長文字不會自動縮小，列印按鈕會先檢查溢出。"
          );
        }

        $("#sidebar").addEventListener("input", handleChange);
        $("#sidebar").addEventListener("change", handleChange);

        $("#clearButton").addEventListener("click", clearAll);
        $("#printButton").addEventListener("click", printAll);

        $("#checkButton").addEventListener("click", async () => {
          try {
            await runChecks();
          } catch (error) {
            console.error(error);
            setStatus("檢查失敗，請重新載入頁面後再試。", true);
          }
        });

        window.addEventListener("beforeprint", refresh);

        window.addEventListener("afterprint", () => {
          setStatus(
            "已離開列印視窗。資料仍保留於本頁，" +
            "使用完畢請清空並關閉頁面。"
          );
        });

        // 桌面工具列換行時，調整左側固定位置。
        function updateToolbarHeight() {
          const height = $(".topbar").getBoundingClientRect().height;

          document.documentElement.style.setProperty(
            "--toolbar-height",
            `${Math.ceil(height)}px`
          );
        }

        updateToolbarHeight();

        if ("ResizeObserver" in window) {
          const observer = new ResizeObserver(updateToolbarHeight);
          observer.observe($(".topbar"));
        } else {
          window.addEventListener("resize", updateToolbarHeight);
        }
      }

        buildSidebar();

        $("#preview").innerHTML = [
          buildPage1(),
          buildPage2(),
          buildPage3(),
          buildPage4()
        ].join("");

        resetState();
        syncInputs();
        refresh();
        bindEvents();
      }

      function compactDate(key) {
        const value = text(key);
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);

        return match
          ? `${match[3]} / ${match[2]} / ${match[1]}`
          : "";
      }

      function utcDayNumber(value) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!match) return null;

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        /*
         * 用 UTC 計算純日期差，避免夏令時間造成 23／25 小時日。
         * setUTCFullYear 避免 00–99 年被 Date.UTC 當成 1900 年代。
         */
        const date = new Date(0);
        date.setUTCHours(0, 0, 0, 0);
        date.setUTCFullYear(year, month - 1, day);

        if (
          date.getUTCFullYear() !== year ||
          date.getUTCMonth() !== month - 1 ||
          date.getUTCDate() !== day
        ) {
          return null;
        }

        return date.getTime() / 86400000;
      }

      function getSymptomDuration() {
        const symptom = utcDayNumber(text("symptomDate"));
        const consultation = utcDayNumber(text("firstConsultation"));

        if (symptom === null || consultation === null) {
          return {
            ready: false,
            invalid: false,
            output: ""
          };
        }

        const days = consultation - symptom;

        if (days < 0) {
          return {
            ready: true,
            invalid: true,
            output: ""
          };
        }

        return {
          ready: true,
          invalid: false,
          output: days === 0 ? "同日（0 日）" : `${days} 日`
        };
      }

      function buildAxaPreviousHistory() {
        const answer = text("previousTreatmentAnswer");
        const parts = [];

        if (answer === "Y") parts.push("是");
        if (answer === "N") parts.push("否");

        if (text("previousConsultation")) {
          parts.push(`日期：${compactDate("previousConsultation")}`);
        }

        if (text("previousDisease")) {
          parts.push(`疾病：${text("previousDisease")}`);
        }

        if (text("previousProvider")) {
          parts.push(`醫生／醫院：${text("previousProvider")}`);
        }

        if (text("previousTreatment")) {
          parts.push(`詳情：${text("previousTreatment")}`);
        }

        return parts.join("；");
      }

      getData = function getSharedData() {
        const data = originalGetData();
        const duration = getSymptomDuration();

        /*
         * 共用轉介資料：
         * 左側只有一組，Bowtie 原本的 data-bind 不需要修改。
         */
        data.referringDoctor = [
          text("referrerName"),
          text("referrerAddress")
        ].filter(Boolean).join("\n");

        /*
         * AXA 日期：
         * 使用相同原始日期，不建立重複輸入。
         */
        [
          "admissionFrom",
          "admissionTo",
          "firstConsultation",
          "surgeryDate",
          "physicianDate"
        ].forEach(key => {
          data[key + "_axa"] = compactDate(key) || "     /     /     ";
        });

        data.axaSymptomDuration = duration.output;
        data.axaPreviousHistory = buildAxaPreviousHistory();

        /*
         * 醫生資料合併到 AXA 原有格子。
         */
        data.axaPhysicianNameQualification = [
          text("physicianName"),
          text("qualification")
        ].filter(Boolean).join("  ");

        data.axaPhysicianContact = [
          text("physicianAddress"),
          text("physicianTelephone")
            ? `電話：${text("physicianTelephone")}`
            : ""
        ].filter(Boolean).join("\n");

        /*

        data.axaSTDCombined = Boolean(

      const extraBindingCaptions = {

      function sharedFieldCaption(bindingKey) {
        if (extraBindingCaptions[bindingKey]) {

      checkOverflow = function checkCurrentCompanyOverflow() {
        clearHighlights();

        const problems = [];
        const tolerance = 1.5;

        getActivePages().forEach((paper, index) => {
          const isAxa = paper.classList.contains("axa-page");

          const pageCaption = isAxa
            ? "AXA 乙部"
            : `Bowtie 第 ${index + 1} 頁`;

          const flaggedElements = new Set();

          function flag(element, description) {
            if (flaggedElements.has(element)) return;

            flaggedElements.add(element);
            element.classList.add("over-limit");
            problems.push(`${pageCaption}：${description}`);
          }

          function exceedsOwnBox(element) {
            return (
              element.scrollHeight >
                element.clientHeight + tolerance ||
              element.scrollWidth >
                element.clientWidth + tolerance
            );
          }

          /*
           * 檢查所有輸入答案，包括：
           * 文字被固定容器截斷；
           * 元素本身超出父層可用空間。
           */
          paper.querySelectorAll("[data-bind]").forEach(element => {
            if (!element.textContent.trim()) return;

            let overflow = exceedsOwnBox(element);
            const parent = element.parentElement;

            if (parent) {
              const rect = element.getBoundingClientRect();
              const parentRect = parent.getBoundingClientRect();
              const style = getComputedStyle(parent);

              const paddingBottom =
                parseFloat(style.paddingBottom) || 0;

              const paddingRight =
                parseFloat(style.paddingRight) || 0;

              if (
                rect.bottom >
                  parentRect.bottom - paddingBottom + tolerance ||
                rect.right >
                  parentRect.right - paddingRight + tolerance
              ) {
                overflow = true;
              }
            }

            if (overflow) {
              flag(
                element,
                `${sharedFieldCaption(element.dataset.bind)}超出欄位空間`
              );
            }
          });

          /*
           * 原本 Bowtie 的固定文字檢查，
           * 加入 AXA 的格子／標題／選項容器。
           */
          const fixedSelector = [
            ".authorization",
            ".part-bar",
            ".question-cell",
            ".stack-field",
            ".ward-row",
            ".usual-answer",
            ".previous-answer",
            ".factor-box",
            ".history-box",
            ".physician-declaration",
            ".signature-cell",
            ".axa-heading",
            ".axa-cell",
            ".axa-reasons",
            ".axa-factors",
            ".axa-bar",
            ".axa-declaration"
          ].join(",");

          paper.querySelectorAll(fixedSelector).forEach(element => {
            if (exceedsOwnBox(element)) {
              flag(
                element,
                "固定版面／文字超出空間，請核對紅框"
              );
            }
          });

          /*
           * 保留 Bowtie Yes 詳情不能碰到 No 的檢查。
           */
          if (!isAxa) {
            [".factor-box", ".history-box"].forEach(selector => {
              const box = paper.querySelector(selector);
              if (!box) return;

              const noOption =
                box.querySelector(":scope > .no-option");

              if (!noOption) return;

              const limit =
                noOption.getBoundingClientRect().top;

              [...box.children].forEach(child => {
                if (child === noOption) return;

                if (
                  child.getBoundingClientRect().bottom >
                  limit - 2
                ) {
                  flag(
                    child,
                    "內容與下方「No」選項重疊"
                  );
                }
              });
            });
          }

          /*
           * AXA 格內用 flex 排版；
           * 額外檢查固定選項群組是否超出格底。
           */
          if (isAxa) {
            paper.querySelectorAll(
              ".axa-reasons, .axa-factors"
            ).forEach(element => {
              const rect = element.getBoundingClientRect();
              const parent = element.parentElement;
              const parentRect = parent.getBoundingClientRect();
              const paddingBottom =
                parseFloat(getComputedStyle(parent).paddingBottom) || 0;

              if (
                rect.bottom >
                parentRect.bottom - paddingBottom + tolerance
              ) {
                flag(
                  element,
                  "選項群組超出格線，請核對字型及版面"
                );
              }
            });
          }

          const content =
            paper.querySelector(".paper-content");

          const footer =
            paper.querySelector(".paper-footer");

          const paperRect = paper.getBoundingClientRect();
          const contentRect = content.getBoundingClientRect();
          const footerRect = footer.getBoundingClientRect();

          const pxPerMm = paperRect.height / 297;
          const allowedBottom = footerRect.top - 3 * pxPerMm;

          if (contentRect.bottom > allowedBottom + tolerance) {
            flag(
              content,
              "整頁內容侵入頁尾預留區域"
            );
          }

          if (
            contentRect.right >
            paperRect.right + tolerance
          ) {
            flag(
              content,
              "整頁內容超出紙張右側"
            );
          }
        });

        return [...new Set(problems)];
      };

/* =====================================================

          problems = problems.filter(

      function aiaPrompt(english, chinese, className = "") {
        return `
          <div class="aia-prompt ${className}">
            <span>${escapeHTML(english)}</span>
            <span>${escapeHTML(chinese)}</span>
          </div>
        `;
      }

      function aiaWrite(key, className = "") {
        return `
          <div class="aia-write ${className}">
            ${bind(key)}
          </div>
        `;
      }

      function aiaDateValue(key, className = "") {
        return aiaWrite(
          key + "_aia",
          "aia-date-answer " + className
        );
      }

      function aiaOption(key, value, label) {
        return `
          <div class="aia-option">
            ${mark(key, value)}
            <span>${escapeHTML(label)}</span>
          </div>
        `;
      }

      function aiaYesNo(key, noFirst = false) {
        const yes = aiaOption(key, "Y", "Yes 是");
        const no = aiaOption(key, "N", "No 否");

        return `
          <div class="aia-choices">
            ${noFirst ? no + yes : yes + no}
          </div>
        `;
      }

      function aiaQuestion(number, content, className = "") {
        return `
          <section
            class="aia-question aia-check ${className}"
            data-aia-caption="第${number}題"
          >
            ${content}
          </section>
        `;
      }

      function aiaRisk(key, english, chinese, specify = true) {
        return `
          <div
            class="aia-risk aia-check"
            data-aia-caption="${escapeHTML(chinese)}"
          >
            <div class="aia-risk-title">
              ${escapeHTML(english)}
              ${escapeHTML(chinese)}
              ${specify ? " — Please Specify 請明確說明：" : ""}
            </div>
            ${aiaWrite(key, "aia-small-answer")}
          </div>
        `;
      }

      switchCompany = function switchAmongThreeCompanies(
        company,
        announce = true
      ) {
        if (!["bowtie", "axa", "aia"].includes(company)) return;

        // 初始化期間，AIA 容器稍後才加入。
        if (!document.getElementById(`company-${company}`)) return;

        activeCompany = company;

        $$(".company-document").forEach(documentElement => {
          documentElement.hidden =
            documentElement.id !== `company-${company}`;
        });

        clearHighlights();
        refresh();
        updateCompanyControls();

          setStatus(
            `已切換至 ${companyName()}，所有輸入保持不變。` +
            `列印只會輸出目前公司的 ${companyPageCount()} 頁。` +
            (

                : ""

      function getAiaNotes() {
        const notes = [];

        if (["icu", "other"].includes(text("wardType"))) {
          notes.push(
            "AIA 原表沒有 ICU／其他病房方格，該部分未自動配對。"
          );
        }

        if (state.factorHIV && !state.aiaAIDS) {
          notes.push(
            "共用 HIV 選項沒有自動當作 AIDS；請核對 AIA 第8(b)題。"
          );
        }

        if (
          state.factorBirthControl &&
          !state.aiaInfertilitySterilization
        ) {
          notes.push(
            "共用生育相關選項未自動當作不育／節育；請核對 AIA 第8(c)題。"
          );
        }

        if (
          state.factorCongenital &&
          !state.aiaCongenitalAnomaly
        ) {
          notes.push(
            "共用先天性疾病未自動當作先天性異常；請核對 AIA 第8(f)題。"
          );
        }

        if (
          text("previousTreatmentAnswer") ||
          previousDetailKeys.some(hasValue)
        ) {
          notes.push(
            "共用既往病史未代答 AIA 第7題；請確認醫生曾親自治療及復發／慢性問題。"
          );
        }

        if (
          text("historyAnswer") ||
          historyDetailKeys.some(hasValue)
        ) {
          notes.push(
            "Bowtie 第12題的完整病史沒有在 AIA 另設欄位輸出；如與本次個案有關，請核對是否需要補充。"
          );
        }

        if (state.factorOther || text("factorOtherDetails")) {
          notes.push(
            "共用「其他因素」自由文字未自動加入 AIA 第8題；原表沒有相應文字格。"
          );
        }

        return notes;
      }

      validateData = function validateWithAia() {
        if (activeCompany !== "aia") {
          return beforeAiaValidateData();
        }

        const problems = [];

        function requireAnswerForDetails(
          answerKey,
          detailKeys,
          expectedAnswer,
          caption
        ) {
          if (
            detailKeys.some(hasValue) &&
            text(answerKey) !== expectedAnswer
          ) {
            problems.push(
              `${caption}：已有補充內容，但主問題未選「` +
              (expectedAnswer === "Y" ? "是" : "否") +
              "」。"
            );
          }
        }

        if (
          text("admissionFrom") &&
          text("admissionTo") &&
          text("admissionTo") < text("admissionFrom")
        ) {
          problems.push("AIA：出院日期早於入院日期。");
        }

        if (
          text("aiaContinuousDetails") &&
          !text("aiaContinuousTreatment")
        ) {
          problems.push(
            "AIA 第4(b)題：已有補充，但尚未回答是否持續接受同類治療。"
          );
        }

        [
          ["aiaAdmissionAccident", "aiaAccidentDetails", "意外"],
          ["aiaAdmissionEmergency", "aiaEmergencyDetails", "緊急個案"]
        ].forEach(([checkedKey, detailKey, label]) => {
          if (text(detailKey) && !state[checkedKey]) {
            problems.push(
              `AIA 第5題：已填${label}詳情，但未勾選相應原因。`
            );
          }
        });

        requireAnswerForDetails(
          "aiaReferred",
          ["referrerName", "referrerAddress"],
          "Y",
          "AIA 第6題"
        );

        requireAnswerForDetails(
          "aiaPreviouslyTreated",
          ["aiaPreviousTreatmentDetails"],
          "Y",
          "AIA 第7(a)題"
        );

        requireAnswerForDetails(
          "aiaRecurrent",
          ["aiaRecurrentDetails"],
          "Y",
          "AIA 第7(b)題"
        );

        requireAnswerForDetails(
          "aiaNecessary",
          ["aiaNecessaryNoDetails"],
          "N",
          "AIA 第9(a)題"
        );

        requireAnswerForDetails(
          "aiaComplications",
          ["aiaComplicationDetails"],
          "Y",
          "AIA 第10題"
        );

        requireAnswerForDetails(
          "aiaHomeLeave",
          ["aiaHomeLeaveDetails"],
          "Y",

          "factorSTD",
          "factorCosmetic",
          "axaMental",
          "factorSelfInjury",
          "factorVision"
        ].some(key => Boolean(state[key]));

        if (
          sharedFactorsUsed &&
          text("factorAnswer") !== "Y"
        ) {
          problems.push(

          );

        return problems;

      /* =====================================================
         32. AIA 版面检查
         隱藏公司的紙張不參與檢查。
         ===================================================== */

      checkOverflow = function checkOverflowWithAia() {
        if (activeCompany !== "aia") {
          return beforeAiaCheckOverflow();
        }

        clearHighlights();

        const paper = $("#aia-page-4");
        if (!paper) return ["找不到 AIA 預覽頁面。"];

        const problems = [];
        const flagged = new Set();
        const tolerance = 1.5;

        function flag(element, message) {
          if (flagged.has(element)) return;

          flagged.add(element);
          element.classList.add("over-limit");
          problems.push(`AIA 乙部：${message}`);
        }

        function ownOverflow(element) {
          return (
            element.scrollHeight >
              element.clientHeight + tolerance ||
            element.scrollWidth >
              element.clientWidth + tolerance
          );
        }

        function captionFor(key) {
          if (aiaBindingCaptions[key]) {
            return aiaBindingCaptions[key];
          }

          if (key.endsWith("_aia")) {
            return getFieldCaption(key.slice(0, -4));
          }

          return getFieldCaption(key);
        }

        function outsideParent(element) {
          const parent = element.parentElement;
          if (!parent) return false;

          const rect = element.getBoundingClientRect();
          const parentRect = parent.getBoundingClientRect();
          const style = getComputedStyle(parent);

          const left =
            parentRect.left +
            (parseFloat(style.borderLeftWidth) || 0) +
            (parseFloat(style.paddingLeft) || 0);

          const right =
            parentRect.right -
            (parseFloat(style.borderRightWidth) || 0) -
            (parseFloat(style.paddingRight) || 0);

          const top =
            parentRect.top +
            (parseFloat(style.borderTopWidth) || 0) +
            (parseFloat(style.paddingTop) || 0);

          const bottom =
            parentRect.bottom -
            (parseFloat(style.borderBottomWidth) || 0) -
            (parseFloat(style.paddingBottom) || 0);

          return (
            rect.left < left - tolerance ||
            rect.right > right + tolerance ||
            rect.top < top - tolerance ||
            rect.bottom > bottom + tolerance
          );
        }

        paper.querySelectorAll("[data-bind]").forEach(element => {
          if (!element.textContent.trim()) return;

          if (ownOverflow(element) || outsideParent(element)) {
            flag(
              element,
              `${captionFor(element.dataset.bind)}超出欄位空間`
            );
          }
        });

        paper.querySelectorAll(".aia-check").forEach(element => {
          if (ownOverflow(element) || outsideParent(element)) {
            flag(
              element,
              `${element.dataset.aiaCaption || "固定文字"}超出空間，請核對紅框`
            );
          }
        });

        // 文字標題及選項也要檢查，避免固定文字溢出卻沒被發現。
        paper.querySelectorAll(
          ".aia-prompt, .aia-option, .aia-risk-title"
        ).forEach(element => {
          if (ownOverflow(element) || outsideParent(element)) {
            const area = element.closest("[data-aia-caption]");

            flag(
              element,
              `${area?.dataset.aiaCaption || "固定版面"}文字超出格線`
            );
          }
        });

        const content = paper.querySelector(".paper-content");
        const footer = paper.querySelector(".paper-footer");

        const paperRect = paper.getBoundingClientRect();
        const contentRect = content.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();

        const pxPerMm = paperRect.height / 297;

        if (
          contentRect.bottom >
          footerRect.top - 3 * pxPerMm + tolerance
        ) {
          flag(content, "整頁內容侵入頁尾預留區域");
        }

        return [...new Set(problems)];
      };

      /* ---------- DOM 工具 ---------- */

      function aiaV2ControlMatches(element, key) {
        return Array.from(element.attributes || []).some(attribute => {
          if (
            attribute.name === "value" ||
            attribute.name === "class" ||
            attribute.name === "type"
          ) {
            return false;
          }

          const value = attribute.value;

          return (
            value === key ||
            value === `field-${key}` ||
            value === `input-${key}` ||
            value === `field_${key}` ||
            value === `input_${key}` ||
            value === `state[${key}]`
          );
        });
      }

      function aiaV2FindControl(root, key) {
        return Array.from(
          root.querySelectorAll("input, select, textarea")
        ).find(element => aiaV2ControlMatches(element, key));
      }

      /*
       * 使用現有 helper 的外層結構尋找欄位，
       * 避免依賴未知的 .field / .form-group class 名稱。
       */
      function aiaV2FindField(root, key, sampleHTML) {
        const control = aiaV2FindControl(root, key);
        if (!control) return null;

        const template = document.createElement("template");
        template.innerHTML = sampleHTML.trim();

        const sampleRoot = Array.from(
          template.content.children
        ).find(element => {
          return (
            element.matches("input, select, textarea") ||
            element.querySelector("input, select, textarea")
          );
        });

        if (sampleRoot) {
          let current = control.parentElement;

          while (current && current !== root) {
            const sameTag =
              current.tagName === sampleRoot.tagName;

            const sameClasses = Array.from(
              sampleRoot.classList
            ).every(className => current.classList.contains(className));

            const controls = Array.from(
              current.querySelectorAll("input, select, textarea")
            );

            const containsOnlyThisField =
              controls.length > 0 &&
              controls.every(element =>
                aiaV2ControlMatches(element, key)
              );

            if (
              sameTag &&
              sameClasses &&
              containsOnlyThisField
            ) {
              return current;
            }

            current = current.parentElement;
          }
        }

        // 後備：只提升至仍然只包含同一欄位的容器。
        let candidate = control.parentElement;

        while (
          candidate &&
          candidate.parentElement &&
          candidate.parentElement !== root
        ) {
          const parent = candidate.parentElement;

          if (parent.matches("section, details, aside, form")) {
            break;
          }

          const controls = Array.from(
            parent.querySelectorAll("input, select, textarea")
          );

          if (
            !controls.length ||
            !controls.every(element =>
              aiaV2ControlMatches(element, key)
            )
          ) {
            break;
          }

          candidate = parent;
        }

        return candidate;
      }

      /*
       * 暫時遮罩 state，再還原。
       *
       * 用途：
       * 未回答／No 時，舊版 getData 內所有轉介衍生文字
       * 都會讀到空白，不只清空 AIA 一個輸出欄位。
       *
       * 已輸入姓名及地址仍保留在記憶體，
       * 再選 Yes 可繼續使用。
       */
      function aiaV2WithStatePatch(patch, callback) {
        const originals = Object.keys(patch).map(key => ({
          key,
          exists: Object.prototype.hasOwnProperty.call(state, key),
          value: state[key]
        }));

        Object.assign(state, patch);

        try {
          return callback();
        } finally {
          originals.forEach(item => {
            if (item.exists) {
              state[item.key] = item.value;
            } else {
              delete state[item.key];
            }
          });
        }
      }

      function aiaV2ReferralPatch() {
        return text("aiaReferred") === "Y"
          ? {}
          : {
              referrerName: "",
              referrerAddress: ""
            };
      }

      function aiaV2SharedHistoryDetails() {
        if (text("previousTreatmentAnswer") !== "Y") {
          return "";
        }

        return previousDetailKeys
          .filter(key => hasValue(key))
          .map(key => {
            const rawValue = text(key);

            if (!rawValue) return "";

            const value = /^\d{4}-\d{2}-\d{2}$/.test(rawValue)
              ? compactDate(key)
              : rawValue;

            const caption = getFieldCaption(key) || key;

            return `${caption}：${value}`;
          })
          .filter(Boolean)
          .join("\n");
      }

        /*
         * AIA 第8題：完全按指定欄位配對。

        // 日期拆成真正的 2／2／4 格；未填時保持空白。
        const dateMatch = text("physicianDate").match(
          /^(\d{4})-(\d{2})-(\d{2})$/
        );

        const year = dateMatch ? dateMatch[1] : "";
        const month = dateMatch ? dateMatch[2] : "";
        const day = dateMatch ? dateMatch[3] : "";

        [
          ["aiaSignM", month, 2],
          ["aiaSignD", day, 2],
          ["aiaSignY", year, 4]
        ].forEach(([prefix, value, length]) => {
          for (let index = 0; index < length; index++) {
            data[prefix + (index + 1)] = value[index] || "";
          }
        });

        return data;
      };

      /* =====================================================
         47. Manulife 紙張元件
         ===================================================== */

      function mlWrite(key, classes = "") {
        return `
          <div class="ml-write ${classes}">
            ${bind(key)}
          </div>
        `;
      }

      function mlLine(label, key, classes = "") {
        return `
          <div class="ml-line ml-fixed">
            <span class="ml-label">${escapeHTML(label)}</span>
            ${mlWrite(key, classes)}
          </div>
        `;
      }

      function mlOption(key, value, label, classes = "") {
        return `
          <div class="ml-option ${classes}">
            ${mark(key, value)}
            <span>${escapeHTML(label)}</span>
          </div>
        `;
      }

      function mlTitle(number, title) {
        return `
          <h2 class="ml-title ml-fixed">
            <span class="ml-title-number">${number}.</span>
            <span>${escapeHTML(title)}</span>
          </h2>
        `;
      }

      function mlQuestion(letter, content, bodyClass = "") {
        return `
          <div class="ml-question ml-block">
            <span class="ml-number">${escapeHTML(letter)}</span>
            <div class="ml-question-body ${bodyClass}">
              ${content}
            </div>
          </div>
        `;
      }

      function mlPrompt(content, classes = "") {
        return `
          <div class="ml-prompt ml-fixed ${classes}">
            ${escapeHTML(content)}
          </div>
        `;
      }

      function mlAnswerQuestion(letter, prompt, key, twoLines = false) {
        return mlQuestion(
          letter,
          mlPrompt(prompt) +
          mlWrite(
            key,
            twoLines ? "ml-two-lines" : ""
          )
        );
      }

        if (activeCompany !== "manulife") {

        clearHighlights();

        const paper = $("#manulife-page-4");

        if (!paper) {
          return ["找不到 Manulife 預覽頁面。"];
        }

        const problems = [];
        const flagged = new Set();
        const tolerance = 1.5;

        function flag(element, message) {
          if (flagged.has(element)) return;

          flagged.add(element);
          element.classList.add("over-limit");
          problems.push(`Manulife 第二部份：${message}`);
        }

        function ownOverflow(element) {
          return (
            element.scrollHeight >
              element.clientHeight + tolerance ||
            element.scrollWidth >
              element.clientWidth + tolerance
          );
        }

        function outsideParent(element) {
          const parent = element.parentElement;
          if (!parent) return false;

          const rect = element.getBoundingClientRect();
          const parentRect = parent.getBoundingClientRect();
          const style = getComputedStyle(parent);

          const left =
            parentRect.left +
            (parseFloat(style.borderLeftWidth) || 0) +
            (parseFloat(style.paddingLeft) || 0);

          const right =
            parentRect.right -
            (parseFloat(style.borderRightWidth) || 0) -
            (parseFloat(style.paddingRight) || 0);

          const top =
            parentRect.top +
            (parseFloat(style.borderTopWidth) || 0) +
            (parseFloat(style.paddingTop) || 0);

          const bottom =
            parentRect.bottom -
            (parseFloat(style.borderBottomWidth) || 0) -
            (parseFloat(style.paddingBottom) || 0);

          return (
            rect.left < left - tolerance ||
            rect.right > right + tolerance ||
            rect.top < top - tolerance ||
            rect.bottom > bottom + tolerance
          );
        }

        paper.querySelectorAll("[data-bind]").forEach(element => {
          if (!element.textContent.trim()) return;

          if (ownOverflow(element) || outsideParent(element)) {
            flag(
              element,
              `${mlCaption(element.dataset.bind)}超出欄位空間`
            );
          }
        });

        paper.querySelectorAll(
          ".ml-block, .ml-fixed, .ml-section, " +
          ".ml-question-body, .ml-sign-field"
        ).forEach(element => {
          if (ownOverflow(element) || outsideParent(element)) {
            flag(
              element,
              "固定文字或版面超出空間，請核對紅框"
            );
          }
        });

        paper.querySelectorAll(
          ".ml-option > span:last-child"

          if (ownOverflow(element) || outsideParent(element)) {
            flag(
              element,
              "選項文字超出空間，請核對字型及紅框"
            );
          }
        });

        const content = paper.querySelector(".paper-content");
        const frame = paper.querySelector(".ml-frame");
        const footer = paper.querySelector(".paper-footer");

        const paperRect = paper.getBoundingClientRect();
        const contentRect = content.getBoundingClientRect();
        const frameRect = frame.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();

        if (contentRect.bottom > footerRect.top + tolerance) {
          flag(content, "主表與頁尾重疊");
        }

        if (
          frameRect.right > paperRect.right + tolerance ||
          frameRect.bottom > paperRect.bottom + tolerance ||
          footerRect.bottom > paperRect.bottom + tolerance
        ) {
          flag(frame, "內容超出 A4 紙張範圍");
        }

        return [...new Set(problems)];
      };

      function tidyEffectiveState() {

      /* =====================================================
         55. 新左側元件
         每個欄位登記適用公司，供標籤及顯示篩選使用。
         ===================================================== */

      function tidyTags(companies) {
        const list = companies.split(/\s+/).filter(Boolean);

if (
  list.length === tidyCompanies.length &&
  tidyCompanies.every(company => list.includes(company))
) {
  return "";
}

        return `
          <div class="tidy-tags">
            ${list.map(company => `
              <span class="tidy-tag">
                ${escapeHTML(tidyCompanyLabels[company] || company)}
              </span>
            `).join("")}
          </div>
        `;
      }

      function tidyItem(key, companies, content) {
        if (key && fieldDefinitions.has(key)) {
          fieldDefinitions.get(key).companies =
            companies.split(/\s+/).filter(Boolean);
        }

        return `
          <div
            class="tidy-item"
            data-tidy-companies="${escapeHTML(companies)}"
            ${key ? `data-tidy-key="${escapeHTML(key)}"` : ""}
          >
            ${tidyTags(companies)}
            ${content}
          </div>
        `;
      }

      function tidyGate(id, content, framed = true) {
        return `
          <div
            class="tidy-condition ${framed ? "followup" : ""}"
            data-tidy-rule="${escapeHTML(id)}"
            hidden
            aria-hidden="true"
          >
            ${content}
          </div>
        `;
      }

      function tidyGroup(title, content) {
        return `
          <div class="tidy-group">
            <h3>${escapeHTML(title)}</h3>
            ${content}
          </div>
        `;
      }
