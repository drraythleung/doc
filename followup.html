  </div>

  <p>Printed: ${esc(timeLabel(new Date().toISOString()))}</p>
  <div class="patient-meta">${patientHTML(state)}</div>

  <section class="section">
   <h2>Appointment & follow-up</h2>
   <p>
    ${esc(APPOINTMENTS[state.appointmentStatus]||"Not arranged")}
    ${state.appointmentDate?` · ${esc(dateLabel(state.appointmentDate))}`:""}
    <br>Next contact: ${esc(dateLabel(state.nextFollowupDate))}
   </p>
   ${state.caseNote?`<div class="note">${esc(state.caseNote)}</div>`:""}
  </section>

  <section class="section">
   <h2>Reports</h2>
   ${printReportHTML(state)}
  </section>

  <section class="section">
   <h2>Contacts</h2>
   ${eventsHTML([...contactRecords,...arrangementNotes],true)}
  </section>

  <section class="section">
   <p class="small-text">
    Follow-up summary only. Refer to the actual reports in the clinic system.
    Clinical assessment and urgent escalation are still required.
   </p>
  </section>`;

 await Promise.all(
  [...$("printArea").querySelectorAll("img")].map(image=>
   image.decode?image.decode().catch(()=>{}):Promise.resolve()
  )
 );

 const oldTitle=document.title;
 document.title=`${state.quotationNumber||"Patient"}-Followup`;

 try{
  window.print();
 }finally{
  document.title=oldTitle;
 }
}

/* Events */

function handleActionClick(event){
 const element=event.target;
 if(!(element instanceof Element)||editingLocked()) return;

 const doctor=element.closest("[data-doctor-contact]");

 if(doctor){
  openDoctorContact({
   groupId:doctor.dataset.doctorGroup,
   reportId:doctor.dataset.doctorReport
  });
  return;
 }

 const plan=element.closest("[data-plan]");

 if(plan){
  openPlan(plan.dataset.plan);
  return;
 }

 const step=element.closest("[data-step]");

 if(step){
  openStep({
   groupId:step.dataset.group,
   reportId:step.dataset.report
  },step.dataset.step);
  return;
 }

 const correction=element.closest("[data-correct-report]");

 if(correction){
  openCorrection({
   groupId:correction.dataset.correctGroup,
   reportId:correction.dataset.correctReport
  });
  return;
 }

 const cancel=element.closest("[data-cancel-report]");

 if(cancel){
  openTracking({
   groupId:cancel.dataset.cancelGroup,
   reportId:cancel.dataset.cancelReport
  },false);
  return;
 }

 if(element.closest("[data-correct-arrangement]")){
  openArrangementCorrection();
  return;
 }

 if(event.currentTarget===$("groups")){
  openRowHistory(event);
 }
}

function openRowHistory(event){
 const element=event.target;

 if(!(element instanceof Element)||editingLocked()) return;

 if(element.closest("button,a,input,select,textarea,label,summary")){
  return;
 }

 const row=element.closest("tr[data-investigation-history]");
 if(!row) return;

 if(event.type==="click"){
  const selection=window.getSelection();

  if(
   selection&&!selection.isCollapsed&&
   (
    row.contains(selection.anchorNode)||
    row.contains(selection.focusNode)
   )
  ){
   return;
  }
 }

 event.preventDefault();

 openInvestigationHistory(
  row.dataset.investigationHistory,
  row.dataset.rowReport
 );
}

function handleFieldChange(event){
 actionDirty=true;

 switch(event.target.id){
  case "contactMethod":
   refreshDeliveryOptions();
   break;

  case "recordContact":
  case "changeAppointment":
  case "followupAction":
   refreshContactFields();
   break;

  case "doctorContactMethod":
   refreshDoctorResults();
   break;

  case "doctorFollowupAction":
   refreshDoctorFollowupFields();
   break;
 }

 updateControls();
}

function downloadBackup(){
 const snapshot=pendingWrite||recoverySnapshot;
 if(!snapshot) return;

 const blob=new Blob([JSON.stringify(snapshot,null,2)],{
  type:"application/json"
 });

 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");

 link.href=url;
 link.download=`followup-backup-${snapshot.requestId}.json`;
 link.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function bindEvents(){
 $("actionForm").addEventListener("submit",handleUI(submitAction));

 $("groups").addEventListener("click",handleUI(handleActionClick));
 $("actionFields").addEventListener("click",handleUI(handleActionClick));

 $("groups").addEventListener("keydown",handleUI(event=>{
  if(!["Enter"," "].includes(event.key)) return;

  if(
   !(event.target instanceof Element)||
   !event.target.matches("tr[data-investigation-history]")
  ){
   return;
  }

  openRowHistory(event);
 }));

 $("actionFields").addEventListener("input",()=>{
  actionDirty=true;
  updateControls();
 });

 $("actionFields").addEventListener("change",handleUI(handleFieldChange));
 $("actionCancel").addEventListener("click",()=>closeWorkspace());

 $("patientButton").addEventListener("click",handleUI(openPatientDetails));
 $("contactButton").addEventListener("click",handleUI(()=>openContact()));
 $("manageButton").addEventListener("click",handleUI(openManage));
 $("correctionButton").addEventListener("click",handleUI(openCorrectionChooser));
 $("historyButton").addEventListener("click",handleUI(openHistory));
 $("tracingButton").addEventListener("click",handleUI(openTracingAction));
 $("printButton").addEventListener("click",handleUI(printSaved));

 $("caseBody").addEventListener("click",event=>{
  const button=event.target.closest("[data-open]");
  if(button) void openCase(button.dataset.open);
 });

 $("tabs").addEventListener("click",event=>{
  const button=event.target.closest("[data-tab]");

  if(!button||busy||pendingWrite||integrityHold) return;

  activeTab=button.dataset.tab;
  previousTab=activeTab;
  renderList();
 });

 $("backButton").addEventListener("click",()=>{
  if(busy||pendingWrite||integrityHold||!closeWorkspace()) return;

  activeTab=previousTab;
  renderList();
 });

 $("search").addEventListener("input",renderList);

 $("clearSearchButton").addEventListener("click",()=>{
  $("search").value="";
  renderList();
  $("search").focus();
 });

 $("reloadButton").addEventListener("click",()=>void refresh(false));

 $("syncButton").addEventListener("click",()=>{
  $("headerTools").open=false;

  if(window.confirm("Update from confirmed quotations?")){
   void refresh(true);
  }
 });

 $("quotationButton").addEventListener("click",()=>{
  $("headerTools").open=false;
  window.open("./quotation.html","_blank","noopener");
 });

 $("retryButton").addEventListener("click",()=>void sendPendingWrite());
 $("resolveButton").addEventListener("click",()=>void refresh(false));
 $("exportPendingButton").addEventListener("click",downloadBackup);

 try{
  $("operator").value=
   sessionStorage.getItem("amc-followup-recording-staff")||"";
 }catch(error){
  // Staff entry still works when browser storage is unavailable.
 }

 $("operator").addEventListener("input",()=>{
  try{
   sessionStorage.setItem(
    "amc-followup-recording-staff",
    value("operator")
   );
  }catch(error){}
 });

 window.addEventListener("beforeunload",event=>{
  if(actionDirty||pendingWrite||busy||integrityHold){
   event.preventDefault();
   event.returnValue="";
  }
 });
}

/* Startup */

async function connect(){
 if(!window.supabase?.createClient){
  message("Could not connect. Check your connection and reload.",true);
  return;
 }

 try{
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:false,
    storageKey:"amc-public-demo-auth"
   }
  });

  const session=await client.auth.getSession();
  if(session.error) throw session.error;

  if(!session.data.session){
   const signIn=await client.auth.signInAnonymously();
   if(signIn.error) throw signIn.error;
  }

  ready=true;
  updateControls();

  await refresh(false);
 }catch(error){
  console.error("Connection failed",error);

  ready=false;
  updateControls();

  message("Could not connect. Reload or contact your administrator.",true);
 }
}

bindEvents();
renderList();
updateControls();
void connect();
</script>
</body>
</html>
